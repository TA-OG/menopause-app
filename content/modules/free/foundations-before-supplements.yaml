body_md: |
  It's tempting, when menopause symptoms hit, to reach for a well-marketed bottle and hope it's
  the answer. But supplements are rarely where healing actually begins — and for many women,
  that's exactly why they don't seem to work.

  ## Think of it like a house

  If the foundations of a house are cracked, no amount of new furniture will make it comfortable
  to live in. Your body works the same way: hormonal shifts during menopause place extra demand
  on your gut, digestion, and blood sugar regulation. If those systems aren't working well, even
  a well-chosen supplement may simply pass through you without being properly used.

  ## The four foundations worth checking first

  1. **Gut health.** Declining oestrogen affects the gut microbiome, and a struggling gut affects
     how well your body processes and recycles hormones in return — it's a two-way relationship.
  2. **Digestion.** Stomach acid naturally declines with age, which can make it harder to break
     down protein and absorb key minerals like zinc, iron and B12 — regardless of how good your
     diet is.
  3. **Nutrient absorption.** Increased gut permeability becomes more common as oestrogen falls,
     which can affect how well you actually absorb the nutrients that support your symptoms.
  4. **Blood sugar balance.** Insulin sensitivity often decreases in perimenopause, and unstable
     blood sugar can worsen hot flushes, night sweats, fatigue and anxiety — a knock-on effect
     that's easy to miss.

  ## Signs your foundations might need attention

  A few everyday signals are worth noticing: bloating after meals you'd consider healthy, energy
  dips mid-morning or mid-afternoon, stronger sugar cravings under stress, new skin reactivity,
  fatigue that doesn't lift with rest, waking between 2–4am, or joint aches that have crept in
  since perimenopause began. None of these mean something is wrong with you — they're just
  useful information about where to start.

  ## Gentle ways to start

  - Slow down at mealtimes — eating calmly, rather than on the go, genuinely supports digestion.
  - Chew thoroughly — it reduces the workload on the rest of your digestive system.
  - Build meals around protein, healthy fat and fibre, which helps stabilise blood sugar through
    the day.
  - Include a variety of colourful, fibre-rich and fermented foods to support your gut
    microbiome.
  - Reduce alcohol, ultra-processed food, and where you can, exposure to plastics and synthetic
    fragrances.
  - Protect your sleep — poor sleep affects almost every one of these systems in turn.

  Once these foundations are in reasonably good shape, supplements tend to actually do the job
  you're hoping for — because your body can finally absorb and use them. If you do choose to try
  one, it's still worth checking with your GP or pharmacist first, especially if you take any
  other medication.

