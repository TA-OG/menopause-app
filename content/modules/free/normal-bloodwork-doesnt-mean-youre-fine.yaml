body_md: |
  Being told your bloods are "normal" while you feel anything but fine is one of the most
  common — and most disorienting — experiences in perimenopause. If that's happened to you,
  here's what's actually going on, and why it doesn't mean you're imagining things.

  ## Why a "normal" result can still miss the picture

  Standard blood tests are genuinely useful, but they capture a single moment in time. In
  perimenopause, hormone levels don't move in a steady line — they can swing meaningfully from
  day to day, even hour to hour, as your ovaries wind down unevenly rather than all at once. A
  blood draw taken on a good day can look completely normal, even while the week around it has
  been anything but.

  That's not a flaw in the test being used badly — it's a mismatch between what a single
  snapshot can show and what a fluctuating, multi-week hormonal picture actually looks like.

  ## Being dismissed isn't the end of the road

  Many women leave that appointment more confused than when they arrived — offered
  antidepressants, told it's "just getting older," or simply sent away. If that's been your
  experience, it's worth knowing: it's common, it's not a sign you're overreacting, and there
  are still paths forward.

  Some of the most useful next steps:

  - **Track your symptoms over a full cycle** (or several), not just how you feel on the day of
    an appointment — a written or app-based symptom diary gives your GP something more complete
    than a single conversation can.
  - **Ask specifically about perimenopause** when you go back — it's still under-discussed
    proactively by many services, so naming it yourself often opens the conversation.
  - **Ask what a fuller picture could look like** — beyond a single hormone panel, this might
    include thyroid function, iron, vitamin D, and blood sugar markers, which can produce very
    similar symptoms and are worth ruling in or out.
  - **Consider a second opinion or a specialist referral** if symptoms are significantly
    affecting your life and the first conversation didn't go anywhere.

  ## The bottom line

  A normal test result and a difficult symptom experience can both be true at the same time.
  That's not a contradiction — it's just how fluctuating hormones behave. You deserve to be
  taken seriously either way.

