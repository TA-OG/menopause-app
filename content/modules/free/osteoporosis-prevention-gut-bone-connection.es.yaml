body_md: |
  A veces se llama a la osteoporosis una afección «silenciosa» — es frecuente, está
  infradiagnosticada, y para cuando suele detectarse, la prevención ya se ha convertido en
  tratamiento. La buena noticia es que la salud ósea responde bien a la atención mucho antes de
  llegar a ese punto.

  ## Tu capacidad de formar hueso empieza a disminuir antes de lo que crees

  La capacidad de formación ósea empieza a ralentizarse en la treintena y la cuarentena, y ese
  declive se acelera durante la transición menopáusica a medida que baja el estrógeno — que
  desempeña un papel directo y protector en la densidad ósea. En los primeros cinco a siete años
  tras la menopausia, es posible perder hasta una quinta parte de la masa ósea acumulada a lo
  largo de la vida. La THS puede ayudar, pero no es la única palanca disponible.

  ## Vigila la sarcopenia — la pérdida muscular suele llegar primero

  La sarcopenia, la pérdida gradual de masa y fuerza muscular, a menudo aparece antes de que la
  pérdida ósea sea perceptible, y ambas están estrechamente relacionadas. Vale la pena prestar
  atención a:

  - Sentirte menos estable de pie, o tropezar con más frecuencia
  - Notar los brazos o las piernas más débiles de lo habitual
  - Cansarte antes que antes, o perder resistencia
  - Caminar más despacio que antes

  Ninguna de estas señales es motivo de alarma por sí sola — pero juntas son una señal temprana
  útil, y merece la pena comentarlas con tu médico de cabecera.

  ## La conexión entre el intestino y los huesos

  Es un área de investigación más reciente, pero convincente: tu microbioma intestinal desempeña
  un papel real en la salud ósea. Un intestino sano te ayuda a absorber el calcio, la vitamina D y
  el fósforo que tus huesos necesitan, e influye en las hormonas — incluido el estrógeno —
  implicadas en cómo se forma y se mantiene el hueso. Dicho de otro modo, la salud ósea no es
  simplemente una ecuación de «calcio que entra, hueso que sale»; la salud intestinal forma parte
  del proceso.

  ## Qué suele ayudar

  - **El ejercicio de carga y de resistencia** — caminar, bailar y el entrenamiento de fuerza
    estimulan directamente la formación de hueso nuevo; la natación y el ciclismo son excelentes
    para el corazón, pero no cargan el esqueleto de la misma manera.
  - **El calcio, primero a través de la comida** — lácteos, leches vegetales enriquecidas,
    pescado en lata comido con espinas, verduras de hoja verde y almendras.
  - **La vitamina D** — el pescado azul, los huevos y los champiñones expuestos al sol son fuentes
    alimentarias útiles, aunque muchas mujeres se benefician de un análisis de sangre para
    comprobar su nivel.
  - **Una alimentación variada que favorezca el intestino** — verduras coloridas, fruta y
    alimentos fermentados si los toleras.
  - **Pregunta a tu médico de cabecera sobre una densitometría ósea (DEXA)** para establecer tu
    punto de partida, y sobre marcadores sanguíneos relevantes para la salud general además de la
    ósea (la vitamina D y el calcio son los puntos de partida más accesibles).

  La prevención funciona mejor mucho antes de que una fractura haga urgente la conversación. Si
  algo de esto te resulta familiar, plantearlo de forma proactiva con tu médico de cabecera es un
  paso realmente útil.

