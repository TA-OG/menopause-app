# DRAFT — traduction en attente de relecture par Pamela. Ne pas définir published_at avant validation.

body_md: |
  L'ostéoporose est parfois qualifiée de maladie « silencieuse » — elle est fréquente,
  sous-diagnostiquée, et le moment où elle est habituellement détectée, la prévention est déjà
  devenue un traitement. La bonne nouvelle, c'est que la santé osseuse réagit bien à l'attention
  qu'on lui porte, bien avant ce stade.

  ## Votre capacité à construire de l'os décline plus tôt qu'on ne le pense

  La capacité de construction osseuse commence à ralentir dès la trentaine ou la quarantaine, et
  ce déclin s'accélère pendant la transition ménopausique à mesure que l'œstrogène — qui joue un
  rôle direct et protecteur pour la densité osseuse — diminue. Dans les cinq à sept premières
  années suivant la ménopause, il est possible de perdre jusqu'à un cinquième de la masse osseuse
  accumulée au cours d'une vie. Le THS peut aider, mais ce n'est pas le seul levier disponible.

  ## Surveillez la sarcopénie — la perte musculaire arrive souvent en premier

  La sarcopénie, la perte progressive de masse et de force musculaires, apparaît souvent avant que
  la perte osseuse ne devienne perceptible, et les deux sont étroitement liées. Voici ce qui
  mérite votre attention :

  - Se sentir moins stable sur ses jambes, ou trébucher plus souvent
  - Sentir ses bras ou ses jambes plus faibles qu'avant
  - Se fatiguer plus vite qu'avant, ou perdre en endurance
  - Marcher plus lentement qu'avant

  Aucun de ces signes n'est alarmant en soi — mais ensemble, ils constituent un signal précoce
  utile, qu'il vaut la peine de mentionner à votre médecin généraliste.

  ## Le lien entre intestin et os

  C'est un domaine de recherche plus récent, mais convaincant : votre microbiote intestinal joue
  un rôle réel dans la santé osseuse. Un intestin en bonne santé vous aide à absorber le calcium,
  la vitamine D et le phosphore dont vos os ont besoin, et influence les hormones — dont
  l'œstrogène — impliquées dans la construction et l'entretien osseux. Autrement dit, la santé
  osseuse n'est pas une simple équation « calcium en entrée, os en sortie » ; la santé intestinale
  fait partie du circuit.

  ## Ce qui tend à aider

  - **L'exercice en charge et le renforcement musculaire** — la marche, la danse et la
    musculation stimulent directement la formation de nouvel os ; la natation et le vélo sont
    excellents pour le cœur mais ne sollicitent pas le squelette de la même façon.
  - **Le calcium d'abord par l'alimentation** — produits laitiers, laits végétaux enrichis,
    poissons en conserve consommés avec leurs arêtes, légumes verts à feuilles, et amandes.
  - **La vitamine D** — poissons gras, œufs et champignons exposés à la lumière sont des sources
    alimentaires utiles, même si de nombreuses femmes bénéficient d'une prise de sang pour
    vérifier leur taux.
  - **Une alimentation variée et favorable à l'intestin** — légumes colorés, fruits, et aliments
    fermentés si vous les tolérez.
  - **Demandez à votre médecin généraliste une ostéodensitométrie (DEXA)** pour établir votre
    référence, ainsi que des marqueurs sanguins pertinents pour votre santé globale en plus de la
    santé osseuse (la vitamine D et le calcium sont les points de départ les plus accessibles).

  La prévention fonctionne mieux bien avant qu'une fracture ne rende la conversation urgente. Si
  tout cela vous parle, en parler de façon proactive à votre médecin généraliste est une démarche
  réellement utile.

