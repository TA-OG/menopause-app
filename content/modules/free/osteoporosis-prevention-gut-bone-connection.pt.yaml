body_md: |
  A osteoporose é por vezes chamada uma condição "silenciosa" — é comum, é subdiagnosticada, e
  quando costuma ser detetada, a prevenção já se tornou tratamento. A boa notícia é que a saúde
  óssea responde bem à atenção muito antes de se chegar a esse ponto.

  ## A sua capacidade de formar osso começa a diminuir mais cedo do que pensaria

  A capacidade de formação óssea começa a abrandar já na casa dos 30 e dos 40 anos, e esse declínio
  acelera durante a transição menopáusica à medida que o estrogénio — que desempenha um papel
  direto e protetor na densidade óssea — desce. Nos primeiros cinco a sete anos após a menopausa,
  é possível perder até um quinto da massa óssea acumulada ao longo da vida. A TH pode ajudar, mas
  não é a única alavanca disponível.

  ## Preste atenção à sarcopenia — a perda muscular costuma vir primeiro

  A sarcopenia, a perda gradual de massa e força muscular, aparece muitas vezes antes de a perda
  óssea se tornar percetível, e as duas estão intimamente ligadas. Vale a pena prestar atenção a:

  - Sentir-se menos estável em pé, ou tropeçar com mais frequência
  - Sentir os braços ou as pernas mais fracos do que costumavam ser
  - Cansar-se mais depressa do que antes, ou perder resistência
  - Caminhar mais devagar do que costumava

  Nenhum destes sinais é, por si só, motivo de alarme — mas em conjunto são um sinal precoce útil,
  que vale a pena mencionar ao seu médico de família.

  ## A ligação entre o intestino e os ossos

  É uma área de investigação mais recente, mas convincente: o seu microbioma intestinal
  desempenha um papel real na saúde óssea. Um intestino saudável ajuda-a a absorver o cálcio, a
  vitamina D e o fósforo de que os seus ossos precisam, e influencia as hormonas — incluindo o
  estrogénio — envolvidas na forma como o osso é construído e mantido. Por outras palavras, a
  saúde óssea não é apenas uma equação de "cálcio a entrar, osso a sair"; a saúde intestinal faz
  parte do processo.

  ## O que costuma ajudar

  - **Exercício de carga e de resistência** — caminhar, dançar e o treino de força estimulam
    diretamente a formação de novo osso; a natação e o ciclismo são excelentes para o coração,
    mas não sobrecarregam o esqueleto da mesma forma.
  - **Cálcio primeiro através da alimentação** — laticínios, bebidas vegetais fortificadas,
    peixe enlatado comido com as espinhas, vegetais de folha verde e amêndoas.
  - **Vitamina D** — peixe gordo, ovos e cogumelos expostos ao sol são fontes alimentares úteis,
    embora muitas mulheres beneficiem de um exame de sangue para verificar o seu nível.
  - **Uma alimentação variada e favorável ao intestino** — vegetais coloridos, fruta e alimentos
    fermentados, na medida em que os tolere.
  - **Pergunte ao seu médico de família sobre uma densitometria óssea (DEXA)** para estabelecer a
    sua referência, e sobre marcadores sanguíneos relevantes para a saúde geral além da saúde
    óssea (a vitamina D e o cálcio são os pontos de partida mais acessíveis).

  A prevenção funciona melhor muito antes de uma fratura tornar a conversa urgente. Se algo disto
  lhe faz sentido, levantar isto de forma proativa com o seu médico de família é um passo
  genuinamente útil.

