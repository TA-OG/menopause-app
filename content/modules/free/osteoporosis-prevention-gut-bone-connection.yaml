body_md: |
  Osteoporosis is sometimes called a "silent" condition — it's common, it's under-diagnosed, and
  by the time it's usually caught, prevention has become treatment. The good news is that bone
  health responds well to attention long before that point.

  ## Your bone-building capacity starts declining earlier than you'd think

  Bone-building capacity begins to slow in your 30s and 40s, and that decline accelerates
  through the menopause transition as oestrogen — which plays a direct, protective role in bone
  density — falls. In the first five to seven years after menopause, it's possible to lose up to
  a fifth of lifetime bone mass. HRT can help, but it isn't the only lever available.

  ## Watch for sarcopenia — muscle loss often comes first

  Sarcopenia, the gradual loss of muscle mass and strength, often shows up before bone loss
  becomes noticeable, and the two are closely linked. Worth paying attention to:

  - Feeling less steady on your feet, or more frequent stumbles
  - Arms or legs feeling weaker than they used to
  - Tiring faster than before, or losing stamina
  - Walking more slowly than you used to

  None of these are cause for alarm on their own — but together, they're a useful early signal,
  and worth mentioning to your GP.

  ## The gut-bone connection

  It's a newer area of research, but a compelling one: your gut microbiome plays a real role in
  bone health. A healthy gut helps you absorb the calcium, vitamin D and phosphorus your bones
  need, and influences the hormones — including oestrogen — involved in how bone is built and
  maintained. In other words, bone health isn't just a "calcium in, bones out" equation; gut
  health is part of the pipeline.

  ## What tends to help

  - **Weight-bearing and resistance exercise** — walking, dancing, and strength training
    directly stimulate new bone formation; swimming and cycling are excellent for the heart but
    don't load the skeleton in the same way.
  - **Calcium from food first** — dairy, fortified plant milks, tinned fish eaten with the
    bones, leafy greens, and almonds.
  - **Vitamin D** — oily fish, eggs, and sunlight-exposed mushrooms are useful food sources,
    though many women benefit from a blood test to check their level.
  - **A varied, gut-supportive diet** — colourful vegetables, fruit, and fermented foods where
    you tolerate them.
  - **Ask your GP about a DEXA scan** to establish your baseline, and about blood markers
    relevant to overall health alongside bone health (vitamin D and calcium are the most
    accessible starting points).

  Prevention works best long before a fracture makes the conversation urgent. If any of this
  resonates, raising it proactively with your GP is a genuinely useful step.

