body_md: |
  Si has notado que el peso se te acumula alrededor del abdomen desde la menopausia — incluso sin
  comer más ni moverte menos — no te lo estás imaginando, y no es un fallo de fuerza de voluntad.

  ## Es una historia hormonal, no un problema de disciplina

  El estrógeno tiene una influencia real sobre dónde almacena grasa tu cuerpo. Mientras tus
  ciclos estaban activos, el estrógeno ayudaba a repartir el almacenamiento de grasa de forma más
  uniforme por todo el cuerpo. A medida que el estrógeno baja — de forma marcada en los primeros
  años tras tu última regla — esa influencia se desvanece, y el almacenamiento de grasa tiende a
  desplazarse hacia el abdomen.

  Al mismo tiempo, la sensibilidad a la insulina suele disminuir y el sistema de respuesta al
  estrés del cuerpo puede funcionar un poco más «acelerado» que antes. En conjunto, estos cambios
  hacen que el viejo consejo de simplemente «comer menos, moverse más» a menudo se quede corto en
  esta etapa de la vida — porque actúa sobre la palanca equivocada.

  ## Los primeros cinco años son los que más importan

  El periodo conocido como posmenopausia temprana — aproximadamente los primeros cinco años tras
  tu última regla — es una ventana especialmente activa. Tu cuerpo se recalibra a la vez en
  huesos, corazón, metabolismo, cerebro y piel. Lo que construyas en esta ventana tiende a sentar
  las bases de las décadas siguientes, y por eso vale la pena prestarle atención ahora, en lugar
  de esperar a que las cosas «se asienten».

  ## El sueño hace más de lo que crees

  La hormona del crecimiento — implicada en el mantenimiento muscular, la reparación de tejidos y
  la composición corporal — se libera principalmente durante el sueño profundo, y su descenso
  natural durante la menopausia es parte de por qué la calidad del sueño y la composición
  corporal están tan estrechamente relacionadas. Un mal sueño, una insulina elevada y un aumento
  de la grasa abdominal pueden acabar reforzándose entre sí. Lo alentador es que este ciclo
  responde bien a los cambios en el estilo de vida, especialmente el entrenamiento de fuerza y un
  sueño constante y de buena calidad.

  ## Qué suele ayudar

  - **Proteína en cada comida** — apoya la masa muscular que declina de forma natural con la
    caída del estrógeno, y ayuda a estabilizar el azúcar en sangre.
  - **Entrenamiento de fuerza**, varias veces por semana — uno de los hábitos más fiablemente
    eficaces tanto para la salud metabólica como para la composición corporal en esta etapa.
  - **Cuidar tu sueño** — una hora de despertar constante y una rutina de relajación al final del
    día apoyan los procesos de reparación hormonal que ocurren durante la noche.
  - **Estabilizar el azúcar en sangre** — comidas regulares, y combinar los carbohidratos con
    proteína o fibra, reduce los picos de insulina que favorecen el almacenamiento de grasa
    abdominal.

  Nada de esto trata sobre la restricción. Se trata de entender qué es lo que realmente está
  impulsando el cambio, para que tu esfuerzo se dirija hacia lo correcto.

