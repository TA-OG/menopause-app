body_md: |
  Se reparou que o peso se instala à volta do abdómen desde a menopausa — mesmo sem comer mais ou
  mexer-se menos — não está a imaginar isso, e não é uma falha de força de vontade.

  ## É uma história de hormonas, não um problema de disciplina

  O estrogénio tem uma influência real sobre onde o seu corpo armazena gordura. Enquanto os seus
  ciclos estavam ativos, o estrogénio ajudava a distribuir o armazenamento de gordura de forma
  mais uniforme pelo corpo. À medida que o estrogénio desce — de forma acentuada nos primeiros
  anos após o seu último período — essa influência desvanece-se, e o armazenamento de gordura
  tende a deslocar-se para o abdómen.

  Ao mesmo tempo, a sensibilidade à insulina costuma diminuir, e o sistema de resposta ao stress
  do corpo pode funcionar um pouco mais "acelerado" do que antes. Em conjunto, estas alterações
  significam que o velho conselho de simplesmente "comer menos, mexer-se mais" muitas vezes fica
  aquém nesta fase da vida — está a atuar sobre a alavanca errada.

  ## Os primeiros cinco anos são os que mais contam

  O período conhecido como pós-menopausa precoce — aproximadamente os primeiros cinco anos após o
  seu último período — é uma janela particularmente ativa. O seu corpo está a recalibrar-se ao
  mesmo tempo ao nível dos ossos, coração, metabolismo, cérebro e pele. O que construir nesta
  janela tende a estabelecer as bases para as décadas seguintes, e é exatamente por isso que vale
  a pena prestar atenção agora, em vez de esperar que as coisas "assentem".

  ## O sono faz mais do que pensa

  A hormona do crescimento — envolvida na manutenção muscular, na reparação dos tecidos e na
  composição corporal — é libertada sobretudo durante o sono profundo, e o seu declínio natural
  ao longo da menopausa é parte da razão pela qual a qualidade do sono e a composição corporal
  estão tão estreitamente ligadas. Um sono fraco, insulina elevada e aumento da gordura abdominal
  podem acabar por se reforçar mutuamente. A parte animadora: este ciclo responde bem a mudanças
  de estilo de vida, particularmente ao treino de força e a um sono consistente e de boa
  qualidade.

  ## O que costuma ajudar

  - **Proteína em cada refeição** — apoia a massa muscular que naturalmente declina com a queda do
    estrogénio, e ajuda a estabilizar o açúcar no sangue.
  - **Treino de força**, algumas vezes por semana — um dos hábitos mais consistentemente eficazes
    tanto para a saúde metabólica como para a composição corporal nesta fase.
  - **Proteger o seu sono** — uma hora de acordar consistente e uma rotina de desaceleração
    apoiam os processos de reparação hormonal que ocorrem durante a noite.
  - **Estabilizar o açúcar no sangue** — refeições regulares, e combinar hidratos de carbono com
    proteína ou fibra, reduz os picos de insulina que favorecem o armazenamento de gordura
    abdominal.

  Nada disto é sobre restrição. É sobre compreender o que está realmente a impulsionar a mudança,
  para que o esforço que investe esteja direcionado à coisa certa.

