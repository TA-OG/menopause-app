body_md: |
  If you've noticed weight settling around your middle since menopause — even without eating
  more or moving less — you're not imagining it, and it isn't a failure of willpower.

  ## It's a hormone story, not a discipline problem

  Oestrogen has a real influence on where your body stores fat. While your cycles were active,
  oestrogen helped keep fat storage spread more evenly around the body. As oestrogen falls —
  sharply in the first few years after your last period — that influence fades, and fat storage
  tends to shift toward the abdomen instead.

  At the same time, insulin sensitivity often declines and the body's stress-response system can
  run a little hotter than before. Put together, these shifts mean the old advice to simply "eat
  less, move more" often falls short at this stage of life — it's addressing the wrong lever.

  ## The first five years matter most

  The period known as early postmenopause — roughly the first five years after your final period
  — is a particularly active window. Your body is recalibrating across bone, heart, metabolism,
  brain and skin all at once. What you build in this window tends to set the foundation for the
  decades that follow, which is exactly why it's worth paying attention to now rather than
  waiting for things to "settle."

  ## Sleep is doing more than you think

  Growth hormone — involved in muscle maintenance, tissue repair and body composition — is
  released mainly during deep sleep, and its natural decline through menopause is part of why
  sleep quality and body composition are so closely linked. Poor sleep, high insulin, and
  increased abdominal fat can end up reinforcing each other. The encouraging part: this loop
  responds well to lifestyle changes, particularly resistance training and consistent, good
  sleep.

  ## What tends to help

  - **Protein at every meal** — supports the muscle mass that naturally declines with falling
    oestrogen, and helps steady blood sugar.
  - **Strength training**, a few times a week — one of the most reliably effective habits for
    both metabolic health and body composition at this stage.
  - **Protecting your sleep** — a consistent wake time and a wind-down routine support the
    hormonal repair processes that happen overnight.
  - **Steadying blood sugar** — regular meals, and pairing carbohydrates with protein or fibre,
    reduces the insulin spikes that encourage abdominal fat storage.

  None of this is about restriction. It's about understanding what's actually driving the
  change, so the effort you put in is aimed at the right thing.

