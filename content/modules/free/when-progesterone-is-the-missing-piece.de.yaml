body_md: |
  Wenn du dich aufgedreht, aber erschöpft fühlst, ohne erkennbaren Grund ängstlich bist, gegen 3
  Uhr morgens mit rasenden Gedanken aufwachst, oder bemerkst, dass sich Gewicht um deine
  Körpermitte ansammelt — dann ist es gut zu wissen, dass Progesteron, nicht nur Östrogen, oft
  das erste Hormon ist, das sich in der Perimenopause verändert.

  ## Warum Progesteron zuerst sinkt

  Progesteron wird nach dem Eisprung produziert. Während die Zyklen in der Perimenopause weniger
  vorhersehbar werden, wird auch der Eisprung unregelmäßiger — und ohne ihn sinkt die
  Progesteronproduktion. Das kann Jahre passieren, bevor sich Östrogen in einem Standardtest
  sichtbar verändert, was mit erklärt, warum manchen Frauen gesagt wird, ihre Hormone seien
  „normal", obwohl sie sich alles andere als das fühlen. Was oft mehr zählt als der absolute
  Wert eines der beiden Hormone, ist das *Verhältnis* zwischen ihnen — Östrogen im Verhältnis zu
  Progesteron, manchmal Östrogendominanz genannt.

  ## Die Verbindung zum Stresshormon

  Progesteron und Cortisol (dein wichtigstes Stresshormon) konkurrieren im Körper um einige der
  gleichen Rezeptor-Wege. Das bedeutet: Blutzuckerschwankungen — durch ausgelassene Mahlzeiten,
  stark verarbeitete Lebensmittel oder zu wenig Eiweiß —, die Cortisol erhöhen, können das
  eigene Signal des Progesterons regelrecht verdrängen, selbst wenn die Laborwerte auf dem Papier
  ausreichend erscheinen. Einen stabilen Blutzucker durch regelmäßige, eiweißreiche Mahlzeiten zu
  halten, ist hier ein wirklich nützlicher Hebel — nicht nur ein allgemeiner Ratschlag zu
  „gesunder Ernährung".

  ## Was manche Frauen als hilfreich empfinden

  Wie immer sind das Vorschläge, die für viele Frauen funktioniert haben, keine Anweisungen — und
  es lohnt sich, vor dem Ausprobieren von etwas Neuem mit deiner Hausärztin, deinem Hausarzt oder
  deiner Apotheke zu sprechen, besonders wenn du andere Medikamente nimmst.

  - **Mönchspfeffer (Vitex Agnus Castus)** — ein Kraut, das auf die Hirnanhangdrüse wirkt, um die
    körpereigene Progesteronsignalgebung zu unterstützen. Es ist im Allgemeinen am nützlichsten
    in der Perimenopause, solange noch ein Eisprung stattfindet, und gilt als nicht geeignet, wenn
    du hormonelle Verhütung, eine Fruchtbarkeitsbehandlung nimmst oder dich bereits in der
    Postmenopause befindest. Es wird typischerweise morgens eingenommen und kann ein paar Monate
    brauchen, bis eine Wirkung zeigt.
  - **Zink und Vitamin B6** — beide werden als Bausteine für die Progesteronproduktion benötigt.
    Gute Nahrungsquellen sind Meeresfrüchte, Kürbiskerne und Kichererbsen für Zink sowie
    Geflügel, Fisch und Kartoffeln für B6.
  - **Xenoöstrogene reduzieren** — Kunststoffe mit Lebensmittelkontakt, manche Kosmetikprodukte
    und synthetische Duftstoffe enthalten alle Verbindungen, die das Östrogen-Progesteron-
    Gleichgewicht verschlechtern können. Sie auszutauschen ist wenig aufwendig und risikoarm.
  - **Bioidentische Progesteron-Creme** — manche Frauen finden das, in Zusammenarbeit mit ihrer
    Ärztin oder ihrem Arzt, wirklich hilfreich, typischerweise angewendet in der zweiten
    Zyklushälfte. **Wichtig: In Großbritannien ist bioidentisches Progesteron ein
    verschreibungspflichtiges Arzneimittel.** Es ist nichts, das du ohne die Einbindung deiner
    Ärztin oder deines Arztes beschaffen oder anwenden solltest, und die Dosierung muss individuell
    von ihr oder ihm bestimmt werden.

  ## Auf den Punkt gebracht

  Wenn Östrogen für dich immer das Hormon war, von dem du gehört hast, und dies das erste Mal ist,
  dass du von Progesteron hörst — du bist nicht allein, und es ist ein wirklich nützliches Thema,
  das du bei deiner Hausärztin oder deinem Hausarzt ansprechen kannst, besonders wenn dir das
  Muster „aufgedreht, aber erschöpft" bekannt vorkommt.

