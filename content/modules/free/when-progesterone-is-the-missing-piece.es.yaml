body_md: |
  Si te has sentido acelerada pero agotada, ansiosa sin motivo aparente, si te despiertas hacia
  las 3 de la madrugada con la mente acelerada, o si notas que el peso se te acumula alrededor
  del abdomen — vale la pena saber que la progesterona, no solo el estrógeno, suele ser la primera
  hormona en cambiar en la perimenopausia.

  ## Por qué la progesterona baja primero

  La progesterona se produce después de la ovulación. A medida que los ciclos se vuelven menos
  predecibles durante la perimenopausia, la ovulación también se vuelve menos regular — y sin
  ella, la producción de progesterona cae. Esto puede ocurrir años antes de que el estrógeno
  cambie de forma visible en un análisis estándar, lo que explica en parte por qué a algunas
  mujeres se les dice que sus hormonas son «normales» aunque se sientan lejos de estarlo. Lo que
  a menudo importa más que el nivel absoluto de cualquiera de las dos hormonas es el *equilibrio*
  entre ellas — el estrógeno en relación con la progesterona, a veces llamado dominancia
  estrogénica.

  ## La conexión con la hormona del estrés

  La progesterona y el cortisol (tu principal hormona del estrés) compiten por algunas de las
  mismas vías de receptores en el cuerpo. Eso significa que las fluctuaciones de azúcar en sangre
  — por saltarse comidas, por alimentos ultraprocesados, o por no comer suficiente proteína —
  que elevan el cortisol, pueden en la práctica eclipsar la propia señal de la progesterona,
  incluso cuando los niveles de laboratorio parecen adecuados sobre el papel. Mantener el azúcar
  en sangre estable con comidas regulares y ricas en proteína es una palanca realmente útil aquí,
  no solo un consejo genérico de «alimentación saludable».

  ## Algo que a muchas mujeres les resulta útil

  Como siempre, esto son sugerencias que le han funcionado a muchas mujeres, no instrucciones — y
  vale la pena consultarlo con tu médico de cabecera o farmacéutico antes de probar algo nuevo,
  especialmente si tomas otros medicamentos.

  - **El sauzgatillo (Vitex Agnus Castus)** — una hierba que actúa sobre la glándula pituitaria
    para apoyar la propia señalización de progesterona del cuerpo. Suele ser más útil durante la
    perimenopausia, mientras aún hay ovulación, y no se considera adecuado si tomas
    anticoncepción hormonal, tratamiento de fertilidad, o si ya estás en la posmenopausia.
    Normalmente se toma por la mañana, y puede tardar un par de meses en mostrar efecto.
  - **El zinc y la vitamina B6** — ambos necesarios como componentes básicos para la producción de
    progesterona. Buenas fuentes alimentarias incluyen el marisco, las semillas de calabaza y los
    garbanzos para el zinc, y las aves, el pescado y las patatas para la B6.
  - **Reducir los xenoestrógenos** — los plásticos en contacto con alimentos, algunos productos de
    belleza y las fragancias sintéticas contienen compuestos que pueden empeorar el equilibrio
    entre estrógeno y progesterona. Sustituirlos requiere poco esfuerzo y poco riesgo.
  - **La crema de progesterona bioidéntica** — algunas mujeres, trabajando junto a su médico,
    encuentran esto realmente útil, normalmente utilizada durante la segunda mitad del ciclo.
    **Importante: en el Reino Unido, la progesterona bioidéntica es un medicamento disponible solo
    con receta.** No es algo que debas conseguir o usar sin la implicación de tu médico, y la
    dosis debe ser guiada individualmente por él o ella.

  ## En resumen

  Si el estrógeno siempre ha sido la hormona de la que has oído hablar, y esta es la primera vez
  que oyes mencionar la progesterona — no estás sola, y es un tema realmente útil para plantear a
  tu médico de cabecera, especialmente si el patrón «acelerada pero agotada» te resulta familiar.

