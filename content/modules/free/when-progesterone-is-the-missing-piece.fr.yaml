body_md: |
  Si vous vous sentez survoltée mais épuisée, anxieuse sans raison apparente, si vous vous
  réveillez vers 3h du matin l'esprit en ébullition, ou si vous remarquez que le poids s'installe
  autour de votre ventre — sachez que la progestérone, et pas seulement l'œstrogène, est souvent
  la première hormone à changer en périménopause.

  ## Pourquoi la progestérone baisse en premier

  La progestérone est produite après l'ovulation. À mesure que les cycles deviennent moins
  prévisibles pendant la périménopause, l'ovulation devient elle aussi moins régulière — et sans
  elle, la production de progestérone chute. Cela peut se produire des années avant que
  l'œstrogène ne change visiblement sur un test standard, ce qui explique en partie pourquoi
  certaines femmes s'entendent dire que leurs hormones sont « normales » alors qu'elles se sentent
  loin de l'être. Ce qui compte souvent plus que le niveau absolu de l'une ou l'autre hormone,
  c'est l'*équilibre* entre elles — l'œstrogène par rapport à la progestérone, parfois appelé
  dominance œstrogénique.

  ## Le lien avec l'hormone du stress

  La progestérone et le cortisol (votre principale hormone de stress) se disputent certaines des
  mêmes voies de récepteurs dans le corps. Cela signifie que les variations de glycémie — dues à
  des repas sautés, à des aliments ultra-transformés, ou à un apport insuffisant en protéines —
  qui augmentent le cortisol, peuvent en pratique étouffer le signal propre de la progestérone,
  même quand les niveaux mesurés en laboratoire semblent corrects sur le papier. Maintenir une
  glycémie stable grâce à des repas réguliers et riches en protéines est un levier réellement
  utile ici, pas seulement un conseil général de « bonne alimentation ».

  ## Ce que certaines femmes trouvent utile

  Comme toujours, il s'agit de pistes qui ont fonctionné pour de nombreuses femmes, pas
  d'instructions — et il vaut la peine de vérifier auprès de votre médecin généraliste ou de votre
  pharmacien avant d'essayer quoi que ce soit de nouveau, surtout si vous prenez d'autres
  médicaments.

  - **Le gattilier (Vitex Agnus Castus)** — une plante qui agit sur l'hypophyse pour soutenir la
    propre signalisation de progestérone du corps. Elle est généralement plus utile en
    périménopause, tant que l'ovulation se produit encore, et n'est pas considérée comme adaptée
    si vous prenez une contraception hormonale, un traitement de fertilité, ou si vous êtes déjà
    en post-ménopause. Elle se prend généralement le matin, et peut prendre quelques mois avant de
    montrer un effet.
  - **Le zinc et la vitamine B6** — tous deux nécessaires comme éléments de base pour la
    production de progestérone. Les bonnes sources alimentaires incluent les fruits de mer, les
    graines de courge et les pois chiches pour le zinc, et la volaille, le poisson et les pommes
    de terre pour la B6.
  - **Réduire les xéno-œstrogènes** — les plastiques en contact avec les aliments, certains
    produits de beauté et les parfums synthétiques contiennent tous des composés qui peuvent
    aggraver l'équilibre œstrogène-progestérone. Les remplacer demande peu d'effort et présente
    peu de risque.
  - **La crème de progestérone bio-identique** — certaines femmes, en collaboration avec leur
    médecin, trouvent cela réellement utile, généralement utilisée pendant la seconde moitié du
    cycle. **Important : au Royaume-Uni, la progestérone bio-identique est un médicament
    disponible uniquement sur ordonnance.** Ce n'est pas quelque chose à se procurer ou à utiliser
    sans l'implication de votre médecin, et le dosage doit être déterminé individuellement par lui.

  ## L'essentiel à retenir

  Si l'œstrogène a toujours été l'hormone dont vous entendiez parler, et que c'est la première
  fois que vous entendez mentionner la progestérone — vous n'êtes pas seule, et c'est un sujet
  réellement utile à aborder avec votre médecin généraliste, en particulier si le schéma « survoltée
  mais épuisée » vous parle.

