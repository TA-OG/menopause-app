body_md: |
  Se tem andado a sentir-se acelerada mas exausta, ansiosa sem motivo aparente, se acorda por
  volta das 3h da madrugada com a mente a correr, ou se repara que o peso se instala à volta do
  abdómen — vale a pena saber que a progesterona, não apenas o estrogénio, é muitas vezes a
  primeira hormona a mudar na perimenopausa.

  ## Porque é que a progesterona desce primeiro

  A progesterona é produzida depois da ovulação. À medida que os ciclos se tornam menos
  previsíveis durante a perimenopausa, a ovulação também se torna menos regular — e sem ela, a
  produção de progesterona desce. Isto pode acontecer anos antes de o estrogénio mudar de forma
  visível num exame padrão, o que ajuda a explicar porque é que a algumas mulheres é dito que as
  suas hormonas estão "normais", apesar de se sentirem longe disso. O que muitas vezes importa
  mais do que o nível absoluto de qualquer uma das hormonas é o *equilíbrio* entre elas — o
  estrogénio em relação à progesterona, por vezes chamado dominância estrogénica.

  ## A ligação com a hormona do stress

  A progesterona e o cortisol (a sua principal hormona do stress) competem por algumas das mesmas
  vias de recetores no corpo. Isso significa que as oscilações do açúcar no sangue — por saltar
  refeições, por alimentos ultraprocessados, ou por não comer proteína suficiente — que elevam o
  cortisol, podem, na prática, sobrepor-se ao próprio sinal da progesterona, mesmo quando os
  níveis laboratoriais parecem adequados no papel. Manter o açúcar no sangue estável através de
  refeições regulares e ricas em proteína é uma alavanca genuinamente útil aqui, não apenas um
  conselho genérico de "alimentação saudável".

  ## Algo que muitas mulheres consideram útil

  Como sempre, estas são sugestões que funcionaram para muitas mulheres, não instruções — e vale
  a pena verificar com o seu médico de família ou farmacêutico antes de experimentar algo novo,
  especialmente se tomar outros medicamentos.

  - **Agno-casto (Vitex Agnus Castus)** — uma erva que atua sobre a glândula pituitária para
    apoiar a própria sinalização de progesterona do corpo. É geralmente mais útil na
    perimenopausa, enquanto a ovulação ainda ocorre, e não é considerada adequada se estiver a
    tomar contraceção hormonal, tratamento de fertilidade, ou se já estiver na pós-menopausa. É
    tipicamente tomada de manhã, e pode demorar alguns meses a mostrar efeito.
  - **Zinco e vitamina B6** — ambos necessários como blocos de construção para a produção de
    progesterona. Boas fontes alimentares incluem marisco, sementes de abóbora e grão-de-bico
    para o zinco, e aves, peixe e batatas para a B6.
  - **Reduzir os xenoestrogénios** — plásticos em contacto com alimentos, alguns produtos de
    beleza e fragrâncias sintéticas contêm compostos que podem agravar o equilíbrio entre
    estrogénio e progesterona. Substituí-los exige pouco esforço e pouco risco.
  - **Creme de progesterona bio-idêntica** — algumas mulheres, a trabalhar com o seu médico,
    consideram isto genuinamente útil, normalmente utilizado na segunda metade do ciclo.
    **Importante: no Reino Unido, a progesterona bio-idêntica é um medicamento sujeito a receita
    médica.** Não é algo a obter ou usar sem o envolvimento do seu médico, e a dosagem deve ser
    orientada individualmente por ele ou ela.

  ## Em resumo

  Se o estrogénio sempre foi a hormona de que ouviu falar, e esta é a primeira vez que ouve falar
  em progesterona — não está sozinha, e é um tema genuinamente útil para levantar com o seu
  médico de família, especialmente se o padrão "acelerada mas exausta" lhe soar familiar.

