body_md: |
  If you've been feeling wired but exhausted, anxious for no obvious reason, waking around 3am
  with your mind racing, or noticing weight settling around your middle — it's worth knowing
  that progesterone, not just oestrogen, is often the first hormone to shift in perimenopause.

  ## Why progesterone falls first

  Progesterone is produced after ovulation. As cycles become less predictable through
  perimenopause, ovulation becomes less consistent too — and without it, progesterone
  production drops. This can happen years before oestrogen visibly changes on a standard test,
  which is part of why some women are told their hormones are "normal" despite feeling far from
  it. What often matters more than the absolute level of either hormone is the *balance* between
  them — oestrogen relative to progesterone, sometimes called oestrogen dominance.

  ## The stress-hormone connection

  Progesterone and cortisol (your main stress hormone) compete for some of the same receptor
  pathways in the body. That means blood sugar swings — from skipped meals, ultra-processed
  food, or not eating enough protein — which raise cortisol, can effectively crowd out
  progesterone's own signal, even when lab levels look adequate on paper. Keeping blood sugar
  steady through regular, protein-containing meals is a genuinely useful lever here, not just
  general "healthy eating" advice.

  ## Some things women find helpful

  As always, these are suggestions that have worked for many women, not instructions — and it's
  worth checking with your GP or pharmacist before trying anything new, especially if you take
  other medication.

  - **Vitex (Agnus Castus)** — an herb that works on the pituitary gland to support the body's
    own progesterone signalling. It's generally most useful in perimenopause, while ovulation is
    still occurring, and isn't considered suitable if you're on hormonal contraception, fertility
    medication, or already post-menopause. It's typically taken in the morning, and can take a
    couple of months to show an effect.
  - **Zinc and vitamin B6** — both are needed as building blocks for progesterone production.
    Good food sources include shellfish, pumpkin seeds and chickpeas for zinc, and poultry, fish
    and potatoes for B6.
  - **Reducing xenoestrogens** — plastics in food contact, some beauty products, and synthetic
    fragrances all contain compounds that can worsen the oestrogen-progesterone balance.
    Swapping these out is low-effort and low-risk.
  - **Bioidentical progesterone cream** — some women, working with their doctor, find this
    genuinely helpful, typically used in the second half of the cycle. **Important: in the UK,
    bioidentical progesterone is a prescription-only medicine.** It isn't something to source or
    use without your doctor's involvement, and dosing needs to be individually guided by them.

  ## The bottom line

  If oestrogen has always been the hormone you've heard about, and this is the first time you're
  hearing progesterone mentioned — you're not alone, and it's a genuinely useful thing to raise
  with your GP, particularly if the "wired but tired" pattern sounds familiar.

