# The article body, in Markdown. Headings, lists, bold, links and tables are supported.
body_md: |
  Hot flushes are the most common symptom of the menopausal transition...

  ## Why they happen

  Oestrogen decline affects the brain's temperature regulation...

  ## What can help

  - Keep your bedroom cool
  - Identify and reduce personal triggers (alcohol, caffeine, spicy food)
  - Speak to your GP about HRT and non-hormonal options
