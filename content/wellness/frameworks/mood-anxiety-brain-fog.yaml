id: mood_anxiety_brain_fog
label: Mood, Anxiety & Brain Fog
description: >
  Psychological and cognitive symptom framework — addresses mood instability,
  anxiety, irritability, and brain fog through blood sugar regulation,
  stress management, nervous system support, and targeted supplementation.

trigger_conditions:
  - question: symptoms
    answer:
      - mood_changes
      - anxiety
      - brain_fog
    min_matches: 1

diet_adjustments:
  - id: df_omega3_brain
    category: diet
    title: Omega-3 fatty acids for brain and mood
    body: >
      DHA (a type of omega-3) is essential for brain cell membrane function and
      serotonin signalling. Declining oestrogen reduces the brain's efficiency
      at using omega-3. Eat oily fish (salmon, sardines, mackerel) 2–3 times
      weekly, or supplement with 1000mg EPA+DHA daily if you don't eat fish.
      Ground flaxseed and walnuts provide ALA (a plant-based omega-3 precursor).
    priority: high
    who_for: all

  - id: df_fermented_foods
    category: diet
    title: Gut health and the mood connection
    body: >
      The gut-brain axis is well established, though it is often described
      loosely. Around 90% of the body's serotonin is made in the gut — but by
      your own enterochromaffin cells, not by gut bacteria, and that serotonin
      does not cross into the brain. What gut bacteria do is influence how much
      is produced, and communicate with the brain by other routes. So this is
      worth doing, just not because you are "topping up" brain serotonin.
      Include fermented foods daily: live yoghurt, kefir, kimchi, sauerkraut,
      miso. Aim for variety across the week rather than large amounts of one
      thing.
    priority: medium
    who_for: all

  - id: df_protein_neurotransmitters
    category: diet
    title: Protein at every meal — amino acids build your mood chemicals
    body: >
      Serotonin, dopamine, and GABA are built from amino acids that come from
      dietary protein. Skipping meals or eating low-protein snacks can
      deplete the building blocks your brain needs. Aim for 20–30g of protein
      at breakfast (eggs, Greek yoghurt, smoked salmon) — this sets up your
      neurotransmitter production for the day.
    priority: high
    who_for: all

lifestyle_adjustments:
  - id: lf_exercise_mood
    category: lifestyle
    title: Exercise is the most evidence-backed mood intervention available
    body: >
      30 minutes of moderate cardio (brisk walking, cycling, swimming) 3–5
      times weekly increases BDNF (brain-derived neurotrophic factor) —
      the brain's own growth and repair protein. It also raises endorphins,
      lowers cortisol, and directly counteracts the anxiety and low mood of
      perimenopause. The effect begins within the first session and compounds
      over weeks. If you do nothing else on this list, do this.
    priority: high
    who_for: all

  - id: lf_stress_boundary
    category: lifestyle
    title: Identify one thing you can stop doing
    body: >
      Perimenopause often coincides with peak career pressure and family
      caring responsibilities. Women who describe themselves as "overwhelmed"
      frequently report that their mood and brain fog improve substantially
      when they reduce one regular obligation — not add more recovery tools.
      Review your week and identify one thing you can remove, delegate,
      or reduce in frequency.
    priority: high
    who_for: all

  - id: lf_brain_fog_tactics
    category: lifestyle
    title: Practical tactics for brain fog at work
    body: >
      Brain fog is real — oestrogen regulates the prefrontal cortex.
      Practical adaptions: write things down immediately rather than trying
      to hold them; use calendar reminders for things you'd normally remember;
      block focus time in the morning when cognitive function is typically
      highest; take short movement breaks every 90 minutes to reset
      concentration. These are not failures — they are adaptations.
    priority: medium
    who_for: all

mindset_recommendations:
  - id: mr_physiology_not_personality
    category: mindset
    title: This is physiology, not a personality change
    body: >
      The emotional shifts in menopause aren't a personality change or a
      sign something's wrong with you — they're physiology. Oestrogen has a
      direct relationship with serotonin and dopamine, so when it drops,
      mood, motivation and resilience drop with it. This isn't weakness. It
      isn't "just stress." It's chemistry. But mood is rarely just about
      oestrogen — it's tangled up with several other systems too, and it's
      worth understanding the full picture rather than assuming "it's just
      hormones" or "it's just me."

      Sleep and energy: poor sleep — so common in menopause thanks to night
      sweats, racing thoughts, or a wired-but-tired nervous system — doesn't
      just leave you exhausted, it directly lowers your capacity to
      regulate emotion. A short night's sleep makes the brain's
      threat-detector more reactive, while dulling the part of the brain
      that calms things down. Low energy compounds this — when you're
      running on empty, there's simply less in the tank for patience or
      perspective. Mood, sleep and energy feed each other in a loop, for
      better or worse.

      Hormone imbalance and rage: many women recognise "the rage" from
      perimenopause, when progesterone — which normally has a calming,
      steadying effect — drops faster than oestrogen, leaving oestrogen
      relatively unopposed. It's not a flaw in your character — it's a
      ratio problem, not necessarily "too much" of anything. By menopause,
      oestrogen has usually dropped low overall too, but if rage or
      irritability persists, it's worth looking at the wider picture:
      chronic stress, poor oestrogen clearance, or environmental
      xenoestrogens can keep that imbalance going.
    priority: high
    who_for: all
    targets_symptoms:
      - mood_changes
      - anxiety

  - id: mr_mood_hidden_drivers
    category: mindset
    title: What else could be driving this — beyond hormones
    body: >
      Nutrient status: low B12 and folate can mimic or worsen low mood,
      brain fog, fatigue and irritability — deficiency is common,
      especially with age, certain medications, or low intake of animal
      proteins and leafy greens. This is a simple, correctable thing that's
      too often overlooked.

      Thyroid health: an underactive thyroid in particular can look exactly
      like "menopause brain and mood" — low mood, fatigue, brain fog,
      weight gain, feeling flat. It's frequently missed because the
      standard TSH-only test doesn't tell the full story, and symptoms get
      written off as "just menopause" when thyroid function hasn't
      actually been properly checked.

      Blood sugar: pre-diabetes and diabetes affect mood directly — blood
      sugar swings can cause irritability, anxiety, brain fog and energy
      crashes that feel identical to "hormonal" mood changes, and poor
      regulation also worsens sleep and increases inflammation.

      Histamine's wider reach: histamine's effects go well beyond itching,
      migraines and flushing — it can also contribute to bloating, poor
      sleep, brain fog and fatigue. If you're ticking several boxes across
      mood, sleep, energy and digestion without an obvious single cause,
      histamine is worth considering as a genuine thread running
      underneath.
    priority: high
    who_for: all
    targets_symptoms:
      - mood_changes
      - brain_fog

  - id: mr_mood_complex_history
    category: mindset
    title: If you have a history of endometriosis, adenomyosis, or fibroids
    body: >
      Women with this history have often spent years managing higher
      oestrogen load, so they may feel the emotional swings of
      perimenopause more intensely than other women — the rage, the
      rollercoaster, the sense of not recognising yourself. This isn't
      being "more sensitive" or dramatic; your body has genuinely been more
      attuned to oestrogen fluctuation all along. It's also worth naming
      that many women with this history have been living with chronic
      pain for years, sometimes decades, often dismissed or under-treated
      before diagnosis — and depression is genuinely more common in women
      with this history. If you're noticing low mood alongside the
      perimenopausal shifts, it isn't necessarily "just menopause" layered
      on top — it may be the accumulated weight of pain, and years of not
      being believed or heard, finally being felt.

      If you're living with long Covid, CFS, or fibromyalgia alongside
      menopause, the emotional toll of navigating a chronic illness and
      menopause at the same time is real, and often isolating — it's hard
      to untangle which symptoms belong to which cause. Both can be true at
      once, and both deserve care, not competition for which is "the real
      problem."
    priority: medium
    who_for: all

  - id: mr_mood_reframe
    category: mindset
    title: Who am I now? — it doesn't have to be a crisis question
    body: >
      How you narrate this chapter to yourself genuinely shapes how you
      experience it. "Who am I now?" can be a curious question rather than
      a panicked one — not pretending everything's fine, but recognising
      that this in-between, unfamiliar version of yourself isn't a problem
      to solve, it's a person to get to know. A lot of women arrive here
      feeling like they've lost themselves — that disorientation is real
      and common, and so often there's more going on underneath than "just
      hormones," which is exactly why it deserves proper investigation
      rather than just being pushed through.

      Menopause isn't a problem to fix in isolation — it's a transition
      that touches hormones, sleep, nutrients, thyroid and metabolic health
      all at once. The aim isn't to "get back to normal" but to understand
      what's actually going on underneath the mood, not just manage the
      mood itself. Tracking patterns — sleep quality, energy dips, mood
      cycles, triggers — gives you information, not just symptoms to
      endure.
    priority: medium
    who_for: all

  - id: mr_mood_gp_red_flags
    category: mindset
    title: When to see your GP about mood or anxiety
    body: >
      See your GP if: low mood or anxiety is persistent, worsening, or
      affecting daily functioning; you have any thoughts of self-harm or
      hopelessness — always same-day; rage or irritability feels out of
      proportion or frightening to you or those around you; sleep
      disruption is severe, prolonged, or not responding to lifestyle
      changes; or mood changes come alongside other red-flag symptoms —
      significant weight change, heart palpitations, heavy or irregular
      bleeding, excessive thirst or urination.

      It's worth requesting a full thyroid panel (not just TSH) and
      B12/folate bloods if these haven't been checked, and HbA1c or fasting
      glucose if there's a family history of diabetes, weight changes, or
      blood sugar symptoms alongside mood changes. If you're wondering
      whether HRT, antidepressants, or other support might help — that's a
      conversation worth having, not something to white-knuckle through
      alone.
    priority: high
    who_for: all

supplement_suggestions:
  - id: ss_magnesium_anxiety
    category: supplement
    title: Magnesium glycinate — for nervous system regulation and calm
    body: >
      Commonly 200–400mg/day. The glycinate form is preferred here over
      citrate, since the goal isn't a laxative effect.
    priority: high
    who_for: all
    targets_symptoms:
      - anxiety
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications or have kidney or heart
      conditions.

  - id: ss_l_theanine_anxiety
    category: supplement
    title: L-Theanine — calm and focus without sedation
    body: >
      Commonly 100–200mg. Supports calm and focus without sedation, and can
      be taken during the day for anxiety rather than just at bedtime.
    priority: medium
    who_for: all
    targets_symptoms:
      - anxiety
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications.

  - id: ss_ashwagandha
    category: supplement
    title: Ashwagandha — for the body's stress response
    body: >
      Commonly 300–600mg/day of standardised root extract. Well-researched
      for supporting the body's stress response and cortisol regulation.
    priority: medium
    who_for: all
    targets_symptoms:
      - anxiety
    disclaimer: >
      Caution needed if you have autoimmune conditions (can stimulate
      immune activity), thyroid conditions (can affect thyroid hormone
      levels), or are pregnant — check with your GP first.

  - id: ss_saffron_mood
    category: supplement
    title: Saffron — for mood and anxiety
    body: >
      Commonly 30mg/day of standardised extract. Some evidence for
      supporting mood and anxiety symptoms.
    priority: low
    who_for: all
    targets_symptoms:
      - anxiety
      - mood_changes
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications.

  - id: ss_b_complex_mood
    category: supplement
    title: B-Complex — for nervous system function and stress resilience
    body: >
      Look for methylcobalamin (B12) and methylfolate rather than the
      cheaper synthetic forms (cyanocobalamin, folic acid). B vitamins play
      a role in nervous system function and stress resilience, particularly
      relevant if diet or stress has depleted your levels.
    priority: medium
    who_for: all
    targets_symptoms:
      - anxiety
      - brain_fog
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications or have kidney conditions.

  - id: ss_omega3_mood_brainfog
    category: supplement
    title: Omega-3 (EPA/DHA) — for brain fog, anxiety and mood
    body: >
      For brain fog specifically, commonly 2–3g/day combined EPA/DHA — the
      higher end of the general range, given the specific brain focus.
      Supports cognitive function and has anti-inflammatory benefits for
      the brain, alongside evidence for supporting mood and reducing
      anxiety symptoms.
    priority: high
    who_for: all
    targets_symptoms:
      - brain_fog
      - anxiety
      - mood_changes
    disclaimer: >
      Omega-3 at high doses can thin the blood. If you take anticoagulants
      (warfarin, aspirin, apixaban) or are due for surgery, consult your GP
      or pharmacist before supplementing.

  - id: ss_acetyl_l_carnitine_brainfog
    category: supplement
    title: Acetyl-L-Carnitine — for brain energy metabolism
    body: >
      Commonly 1–3g/day. Supports brain energy metabolism and has some
      evidence for cognitive function and mental clarity.
    priority: medium
    who_for: all
    targets_symptoms:
      - brain_fog
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications.

  - id: ss_ginkgo_brainfog
    category: supplement
    title: Ginkgo Biloba — for circulation and memory
    body: >
      Commonly 120–240mg/day. Supports circulation to the brain and has
      some evidence for memory and mental clarity.
    priority: low
    who_for: all
    targets_symptoms:
      - brain_fog
    disclaimer: >
      Can interact with blood-thinning medications — needs a GP check
      first, especially if you're on anticoagulants or aspirin.

  - id: ss_phosphatidylserine_brainfog
    category: supplement
    title: Phosphatidylserine — for memory and cognitive support
    body: >
      Commonly 150mg/day. Some evidence for memory and cognitive support.
    priority: low
    who_for: all
    targets_symptoms:
      - brain_fog
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications.
