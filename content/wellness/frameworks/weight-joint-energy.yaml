id: weight_joint_energy
label: Weight Changes, Joint Pain & Low Energy
description: >
  Metabolic and physical symptom framework — addresses weight changes,
  joint and muscle aches, and low energy through anti-inflammatory
  nutrition, strength-focused movement, and metabolic support.

trigger_conditions:
  - question: symptoms
    answer:
      - weight_changes
      - joint_pain
      - fatigue
    min_matches: 1

diet_adjustments:
  - id: df_protein_muscle
    category: diet
    title: Prioritise protein — muscle is your metabolic engine
    body: >
      Oestrogen decline accelerates muscle loss (sarcopenia), which slows
      metabolism and makes weight management harder. Aim for 1.2–1.6g of
      protein per kg of body weight daily. Spread this across meals: 25–30g
      per meal is more effective for muscle protein synthesis than eating
      most of it at dinner. Sources: eggs, chicken, fish, Greek yoghurt,
      legumes, cottage cheese, tofu.
    priority: high
    who_for: all

  - id: df_anti_inflammatory
    category: diet
    title: Anti-inflammatory eating for joint pain
    body: >
      Joint pain in perimenopause is partly driven by inflammation as
      oestrogen's anti-inflammatory effect declines. Foods that support
      the anti-inflammatory pathway: olive oil, oily fish, berries,
      turmeric, ginger, dark leafy greens, colourful vegetables.
      Foods that drive inflammation: ultra-processed foods, refined sugar,
      seed oils (sunflower, vegetable), excessive alcohol.
    priority: high
    who_for: all

  - id: df_reduce_refined_carbs
    category: diet
    title: Reduce refined carbohydrates — not all carbs
    body: >
      The hormonal changes of perimenopause increase insulin resistance,
      meaning refined carbs (white bread, pastries, sugary drinks, white rice)
      spike blood sugar more than they used to. This drives fat storage,
      particularly around the abdomen. Focus on complex carbohydrates:
      oats, sweet potato, legumes, whole grain bread. You don't need to
      eliminate carbs — just choose ones that come with fibre.
    priority: high
    who_for: all

  - id: df_collagen_joints
    category: diet
    title: Support joint health with collagen-building foods
    body: >
      Vitamin C is essential for collagen synthesis in cartilage and connective
      tissue. Include citrus fruit, kiwi, red pepper, broccoli, and strawberries
      daily. Bone broth contains collagen precursors. Silica-rich foods
      (oats, leeks, green beans) also support connective tissue repair.
    priority: medium
    who_for: all

lifestyle_adjustments:
  - id: lf_strength_training
    category: lifestyle
    title: Strength training — the most important exercise for menopause
    body: >
      Resistance training (weights, resistance bands, bodyweight exercises)
      is the most evidence-backed intervention for perimenopause weight
      management, bone density, joint stability, and metabolism. It does not
      mean heavy powerlifting — even 2–3 sessions of 30 minutes weekly doing
      squats, lunges, press-ups, and rows produces measurable metabolic benefit.
      Start light and focus on form. If you want somewhere free to begin, the
      NHS publishes a Strength and Flex plan — a five-week series of
      equipment-free exercises — alongside its Fitness Studio workout videos.
    priority: high
    who_for: all

  - id: lf_low_impact_joints
    category: lifestyle
    title: Protect joints with low-impact movement
    body: >
      For joint pain, prioritise movement that loads joints without impact:
      swimming, cycling, yoga, Pilates, walking on even ground. Avoid
      high-impact running or HIIT on hard surfaces until joint pain is managed.
      Warmup and cool-down are more important now than they were in your 30s —
      allow 5–10 minutes at each end of any workout.
    priority: high
    who_for: all

  - id: lf_movement_consistency
    category: lifestyle
    title: Consistency beats intensity for metabolic health
    body: >
      Short bursts of high intensity exercise followed by days of rest
      are less effective for menopausal weight management than consistent
      moderate daily movement. A 30-minute walk every day produces more
      cumulative metabolic benefit than two intense 90-minute sessions per
      week. The goal is to avoid prolonged sitting — break it up every 60–90
      minutes with even a 5-minute walk.
    priority: medium
    who_for: all

mindset_recommendations:
  - id: mr_weight_compassion
    category: mindset
    title: Weight changes in menopause are hormonal — not your fault
    body: >
      The average woman gains 2–5kg during the menopausal transition without
      any change in diet or activity. This is driven by declining oestrogen
      affecting fat distribution, not overeating. The shift from hip/thigh
      fat storage to abdominal storage is a hormonal response. Shame and
      restriction dieting worsen the metabolic picture. The goal is metabolic
      health — strength, energy, blood markers — not the number on the scale.
    priority: high
    who_for: all

  - id: mr_joint_pain_movement_anxiety
    category: mindset
    title: Joint pain creates fear of movement — which makes it worse
    body: >
      Pain causes protective movement avoidance, which leads to muscle
      weakness around joints, which leads to more pain. This is called
      kinesiophobia (fear of movement) and it's extremely common. Gentle,
      consistent, low-pain-level movement — even when joints ache — is
      therapeutic. If movement reliably increases your pain for more than
      a day after, speak to your GP about physiotherapy.
    priority: medium
    who_for: all

supplement_suggestions:
  - id: ss_omega3_joints
    category: supplement
    title: Omega-3 (EPA+DHA) — anti-inflammatory for joints and metabolism
    body: >
      High-dose omega-3 (2000–3000mg EPA+DHA daily from fish oil or algae oil)
      has clinical evidence for reducing joint stiffness and inflammatory
      markers. The metabolic benefits (improved insulin sensitivity, reduced
      triglycerides) are also relevant for menopausal weight management.
      Take with a meal containing fat. Algae-based omega-3 is the
      plant-based equivalent.
    priority: high
    who_for: all
    disclaimer: >
      Omega-3 at high doses (above 3g EPA+DHA) can thin the blood. If you take
      anticoagulants (warfarin, aspirin, apixaban) or are due for surgery,
      consult your GP or pharmacist before supplementing.

  - id: ss_collagen_type2_joints
    category: supplement
    title: Collagen Type II — specifically for joint cartilage
    body: >
      There are two quite different products here, at very different doses
      — worth knowing which is which. Hydrolysed collagen (broken down into
      smaller peptides) is commonly used around 10g/day. Undenatured Type II
      collagen (often sold as UC-II) is a different, more concentrated
      preparation studied at a much lower dose, typically around 40mg/day —
      taking 10g of that would be far more than intended. Either way, Type
      II is the form associated with joint cartilage specifically, distinct
      from the Type I collagen used for hair, skin and nails.
    priority: medium
    who_for: all
    disclaimer: >
      Collagen supplements are generally safe for most adults. If you have a
      fish or shellfish allergy, check the source of the collagen.
      Consult your GP before use if you have any ongoing health conditions.

  - id: ss_curcumin_joints
    category: supplement
    title: Curcumin — for joint pain and stiffness
    body: >
      Some women try curcumin, commonly around 500mg 2–4x/day, often paired
      with piperine (black pepper extract) to improve absorption. It's a
      reasonably well-researched anti-inflammatory, often used specifically
      for joint pain and stiffness.
    priority: medium
    who_for: all
    targets_symptoms:
      - joint_pain
    disclaimer: >
      Enhanced-absorption curcumin products (those combined with piperine)
      have been linked to rare cases of liver injury, and can cause reflux
      at higher doses. Curcumin can also interact with blood-thinning
      medication. Always check with your GP or pharmacist before starting,
      especially if you take any prescribed medications or have liver
      concerns.

  - id: ss_glucosamine_chondroitin
    category: supplement
    title: Glucosamine and Chondroitin
    body: >
      Some women use glucosamine and chondroitin together, commonly around
      1500mg glucosamine plus 1200mg chondroitin per day — a traditional
      joint-support combination, with some evidence for cartilage support
      and reducing joint discomfort, particularly in osteoarthritis.
    priority: medium
    who_for: all
    targets_symptoms:
      - joint_pain
    disclaimer: >
      Can increase bleeding risk alongside warfarin, and may affect blood
      glucose levels — worth flagging if you're diabetic or on blood
      thinners. Caution if you have a shellfish allergy too, as glucosamine
      is often shellfish-derived. Consult your GP before use.

  - id: ss_msm_joints
    category: supplement
    title: MSM (Methylsulfonylmethane)
    body: >
      Commonly 1–3g/day. Some evidence for reducing joint pain and
      inflammation.
    priority: low
    who_for: all
    targets_symptoms:
      - joint_pain
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications.

  - id: ss_wobenzym_joints
    category: supplement
    title: Systemic enzyme blends — for joint pain and recovery
    body: >
      Systemic enzyme blends (proteases including bromelain, trypsin and
      chymotrypsin — Wobenzym is the most studied brand) are commonly taken
      on an empty stomach, between meals rather than with food, following
      the product's own dosing guidance. Evidence for joint pain and
      recovery is limited and mixed, and varies between products and
      studies — this isn't a class with strong, settled evidence behind it,
      so treat it as worth discussing rather than an established option.
      Formulations and enzyme strengths vary a lot between products, so the
      dose depends entirely on which one you choose — follow the specific
      product's label rather than a general rule, and a pharmacist can help
      you compare products.
    priority: low
    who_for: all
    targets_symptoms:
      - joint_pain
    disclaimer: >
      Can interact with blood-thinning medications — needs a GP check
      first, particularly if you're on anticoagulants or aspirin.

  - id: ss_berberine_weight
    category: supplement
    title: Berberine — for blood sugar and metabolic health
    body: >
      Commonly 500mg, 2–3x/day before meals. Supports blood sugar
      regulation and metabolic health.
    priority: medium
    who_for: all
    targets_symptoms:
      - weight_changes
    disclaimer: >
      Not suitable during pregnancy or breastfeeding. Can interact with
      blood sugar and blood pressure medications, and with several other
      medicines via how the liver processes them — this one especially
      needs a GP check first, and mention every medication you take.

  - id: ss_myo_inositol_weight
    category: supplement
    title: Myo-Inositol — for insulin sensitivity and blood sugar balance
    body: >
      Commonly 2–4g/day. Supports insulin sensitivity and blood sugar
      balance. Also well-studied for PCOS, where insulin resistance is
      often a core driver.
    priority: medium
    who_for: all
    targets_symptoms:
      - weight_changes
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications.

  - id: ss_protein_fibre_weight
    category: supplement
    title: Protein powder and fibre supplements
    body: >
      Protein powder (whey, pea, or collagen-based) is not a fat-loss
      supplement in itself, but supports satiety, muscle maintenance and
      blood sugar stability when protein intake from food alone is hard to
      hit. A fibre supplement (e.g. PHGG, psyllium) supports satiety and
      blood sugar stability too, particularly useful if you're not yet
      consistently hitting fibre targets from food.
    priority: medium
    who_for: all
    targets_symptoms:
      - weight_changes
    disclaimer: >
      Always check with your GP or pharmacist before starting, especially
      if you take any prescribed medications or have a diagnosed digestive
      condition.

  - id: ss_green_tea_ala_weight
    category: supplement
    title: Green tea extract and Alpha-Lipoic Acid — for metabolic support
    body: >
      Green tea extract (EGCG), commonly 250–500mg/day, has modest evidence
      for metabolic support. Alpha-Lipoic Acid (ALA), commonly 300–600mg/day,
      supports blood sugar regulation and insulin sensitivity, and acts as
      an antioxidant supporting cellular energy production.
    priority: low
    who_for: all
    targets_symptoms:
      - weight_changes
    disclaimer: >
      Green tea extract needs caution with liver conditions or caffeine
      sensitivity. ALA can interact with blood sugar and thyroid
      medications — this one especially needs a GP check first if you're
      on either.
