# Übersetzung von cultural/afro-caribbean.yaml — maßgeblich ist die englische Fassung.
items:
  ackee-saltfish-sodium:
    body: |-
      Ackee mit Salzfisch (Ackee and Saltfish) ist in vielen karibischen Haushalten ein Grundgericht mit großer kultureller Bedeutung. Die Ackee selbst ist ernährungsphysiologisch hervorragend — reich an Eiweiß und gesunden Fetten. Der gesalzene Kabeljau (Saltfish) kann jedoch sehr viel Natrium enthalten, was Blähungen und Wassereinlagerungen verstärken und zu Blutdruckveränderungen beitragen kann, die in den Wechseljahren ohnehin häufiger sind.

      Nimm weniger Salzfisch und wässere ihn länger, um mehr Salz herauszuziehen. Würze mit frischen Kräutern und Gewürzen statt mit Tafelsalz. So bleiben Gericht und Tradition erhalten — nur schonender für deinen Körper in dieser Zeit.
  rice-peas-blood-sugar:
    body: |-
      Rice and Peas ist ein beliebtes Wohlfühlgericht. Die Kidneybohnen (Straucherbsen, Augenbohnen) darin sind hervorragend — reich an pflanzlichem Eiweiß, Ballaststoffen und Phytoöstrogenen, die bei vasomotorischen Beschwerden helfen können. Beim Reis lohnt sich ein genauerer Blick. Auf Naturreis umzusteigen oder weniger weißen Reis und mehr Bohnen zu nehmen, stabilisiert den Blutzucker, der die Häufigkeit von Hitzewallungen und die Stimmung direkt beeinflusst.
  plantain-glycaemic:
    body: |-
      Reife Kochbananen sind beliebt, haben aber einen höheren glykämischen Index. Wenn Hitzewallungen oder Stimmungsschwankungen stark sind, iss sie lieber mit Eiweiß (Hähnchen, Fisch, Bohnen) statt allein — Eiweiß bremst den Blutzuckeranstieg. Grüne Kochbananen sind für einen ausgeglichenen Blutzucker die bessere Wahl.
  callaloo-magnesium:
    body: |-
      Callaloo ist in den Wechseljahren wirklich hervorragend. Es ist reich an Magnesium (das den Schlaf unterstützt und Hitzewallungen seltener macht), Eisen, Kalzium und Folat. Wenn du es nicht regelmäßig isst, lohnt es sich, es wieder auf den Speiseplan zu holen. Die in der Karibik verwendete Amarant-Sorte ist besonders nährstoffreich.
  sorrel-hibiscus:
    body: |-
      Sorrel (Hibiskus) wird seit Generationen in karibischen und westafrikanischen Traditionen verwendet. Studien stützen seinen Nutzen für den Blutdruck und seine antioxidativen Eigenschaften. Es lohnt sich, ihn ohne viel Zucker zu trinken — das traditionelle Weihnachtsgetränk aus Sorrel lässt sich mit weniger Süße zubereiten und behält mit Nelken, Ingwer und Zimt sein volles Aroma.
  coconut-oil-fats:
    body: |-
      Kokosöl und Kokosmilch werden in der karibischen Küche viel verwendet und können in Maßen Teil einer gesunden Ernährung sein. In den Wechseljahren verändert der Östrogenwandel, wie Fett verarbeitet wird, besonders am Bauch. Gut funktioniert eine Balance aus Kokosfetten und fettem Fisch (Makrele, Sardinen, Hering), der hervorragend für die Gehirngesundheit und gegen Entzündungen ist.
  stress-allostatic-load:
    body: |-
      Studien zeigen, dass Frauen afrikanischer und karibischer Herkunft eine höhere „allostatische Last“ tragen — die kumulative Wirkung von chronischem Stress auf den Körper, auch durch rassistische Diskriminierung und den Umgang mit Systemen, die nicht für dich gemacht sind. Diese chronische Stressreaktion kann Wechseljahresbeschwerden verstärken, besonders Hitzewallungen, Schlafstörungen und Stimmungsschwankungen.

      Das ist kein Grund, einfach „Stress besser zu managen“ — es ist die Anerkennung, dass deine Beschwerden stärker sein können, weil dein Körper mehr getragen hat. Das solltest du in der Praxis ansprechen, und du darfst dabei nachsichtig mit dir sein.
  hair-changes-menopause:
    body: |-
      Dünner werdendes Haar und veränderte Haarstruktur sind in den Wechseljahren sehr häufig und können für Frauen afrikanischer und karibischer Herkunft, bei denen Haar eng mit Identität und kulturellem Ausdruck verbunden ist, besonders belastend sein. Der Östrogenrückgang zusammen mit Hitzestyling und chemischen Behandlungen kann den Effekt verstärken.

      Schützende Frisuren, die das Haar weniger beanspruchen, Pflege der Kopfhaut (regelmäßige Massage, Rizinusöl) und genug Eiweiß und Eisen in der Ernährung sind gut belegte Ansätze, ergänzend zu äußerlichen Behandlungen.
  speaking-up-gp:
    body: |-
      Studien aus der britischen Hausarztversorgung zeigen, dass Frauen aus ethnischen Minderheiten seltener eine HRT angeboten bekommen und ihre Beschwerden seltener ernst genommen werden. Das ist eine belegte gesundheitliche Ungleichheit, keine Einbildung.

      Wenn deine Beschwerden erheblich sind, hast du jedes Recht, klar für dich einzutreten. Führe vor dem Termin ein Symptomtagebuch. Beschreibe konkret, wie sich die Beschwerden auf deinen Alltag auswirken. Wenn deine Ärztin oder dein Arzt abwinkt, hast du das Recht auf eine Zweitmeinung oder eine Überweisung an eine Menopause-Spezialistin oder einen -Spezialisten. Aunty Mel kann dir helfen, dich auf diese Gespräche vorzubereiten.
  community-and-isolation:
    body: |-
      In manchen karibischen Gemeinschaften wird über die Wechseljahre nicht offen gesprochen — sie gelten als Privatsache oder werden auf stigmatisierende Weise mit dem Älterwerden verbunden. Vielleicht hast du das Gefühl, mit den Frauen um dich herum nicht darüber reden zu können.

      Doch das Wissen war immer da. Die Tanten, die das vor dir durchgemacht haben, wussten Bescheid. Deine eigene Version dieser Gemeinschaft zu finden — online, im Freundeskreis oder über diese App —, kann viel daran ändern, wie du diesen Übergang erlebst.
  vitamin-d-caribbean-uk:
    body: |-
      Frauen afrikanischer und karibischer Herkunft im Vereinigten Königreich haben ein deutlich höheres Risiko für Vitamin-D-Mangel — das Melanin in dunklerer Haut braucht länger Sonne, um dieselbe Menge Vitamin D zu bilden, und das britische Sonnenlicht reicht den Großteil des Jahres nicht aus.

      Vitamin-D-Mangel verschlechtert Erschöpfung, Stimmung, Gelenkschmerzen und Schlaf — alles Beschwerden, die in den Wechseljahren ohnehin verstärkt sind. Ein Test ist über deine Hausarztpraxis möglich. Die meisten britischen Empfehlungen aus Dermatologie und Menopause-Medizin nennen 1000–2000 IE täglich für Frauen mit dunklerer Haut im Vereinigten Königreich, aber lass dich zuerst testen, bevor du höhere Dosen nimmst.
      HINWEIS: Sprich immer mit deiner Ärztin oder deinem Arzt, bevor du mit Nahrungsergänzungsmitteln beginnst, besonders bei Dosen über der NHS-Standardempfehlung von 400 IE.
  iron-monitoring:
    body: |-
      Wenn du in der Perimenopause noch deine Periode hast — die stärker und unregelmäßiger sein kann —, ist es wichtig, den Eisenwert im Blick zu behalten. Starke Blutungen in der Perimenopause sind bei Schwarzen Frauen häufiger und können zu Eisenmangelanämie führen, die die Erschöpfung deutlich verstärkt.

      Bitte in deiner Praxis um ein großes Blutbild, wenn Erschöpfung für dich eine wichtige Beschwerde ist.
      HINWEIS: Sprich immer mit deiner Ärztin oder deinem Arzt, bevor du Eisenpräparate nimmst — zu viel Eisen kann schaden.
byTitle:
  Something important to know about your timeline:
    title: Etwas Wichtiges zu deinem Zeitverlauf
    body: |-
      Studien zeigen immer wieder, dass Frauen afrikanischer und karibischer Herkunft die Menopause meist mit etwa 49–50 Jahren erreichen — rund 18 Monate früher als der britische Durchschnitt von 51. Die Perimenopause kann also Anfang bis Mitte 40 beginnen, manchmal sogar Ende 30.

      Wenn dir gesagt wurde, du seist „zu jung“ für die Perimenopause, stimmt das vielleicht nicht. Das ist gut zu wissen, wenn du mit deiner Ärztin oder deinem Arzt sprichst.

      Eine Einschränkung, die du im Kopf behalten solltest: Das sind Durchschnittswerte aus überwiegend amerikanischer Forschung, keine Vorhersage deines eigenen Zeitverlaufs.
