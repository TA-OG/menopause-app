# Übersetzung von cultural/communities/india-gujarati.yaml — maßgeblich ist die englische Fassung.
items:
  dal-dhokli-legume-advantage:
    body: |-
      Dal Dhokli, Handvo und die große Vielfalt an Gujarati-Dals bieten hervorragende Ernährung für die Wechseljahre. Linsen und Hülsenfrüchte sind reich an Phytoöstrogenen, pflanzlichem Eiweiß und Ballaststoffen. Dass Dal in der Gujarati-Küche zu allen drei Mahlzeiten auf den Tisch kommt, ist ein natürlicher Ernährungsvorteil gegenüber Frauen, die westlich mit wenig Hülsenfrüchten essen.

      Die Phytoöstrogene einer regelmäßigen Gujarati-Ernährung mit Dal tragen womöglich schon dazu bei, vasomotorische Beschwerden zu lindern, ohne dass du es merkst.
  thepla-methi-phytoestrogens:
    body: |-
      Thepla mit Methi (Bockshornklee) ist ein Gujarati-Klassiker mit besonderer Bedeutung für die Wechseljahre. Bockshornklee ist reich an Phytoöstrogenen und wurde daraufhin untersucht, ob er Hitzewallungen seltener macht und die Blutzuckerregulation unterstützt. Methi nu Thepla zum Frühstück ist eine sinnvolle Ernährungsentscheidung, nicht nur eine kulturelle.
  undhiyu-seasonal-vegetables:
    body: |-
      Undhiyu — das Gericht aus saisonalem Gemüse und Linsen — gehört zu den nährstoffreichsten Gerichten der Gujarati-Küche. Die Kombination aus verschiedenen Gemüsen, Surti Papdi (flachen Bohnen), Tuvar (Straucherbsen) und grüner Banane liefert eine vielfältige Mischung aus Phytoöstrogenen, Ballaststoffen und Mikronährstoffen. Grüne Banane (Kacchi Keri) liefert resistente Stärke, die nützliche Darmbakterien ernährt.
  dhokla-fermented-gut:
    body: |-
      Dhokla und Handvo sind fermentierte Lebensmittel (fermentierter Kichererbsenteig) mit probiotischen Eigenschaften. Fermentierte Lebensmittel unterstützen das Darmmikrobiom, das laut neuerer Forschung beeinflusst, wie der Körper Östrogen verstoffwechselt und wiederverwertet. Fermentierte Gujarati-Speisen auf dem Speiseplan zu behalten, unterstützt die Darmgesundheit in den Wechseljahren.
  jaggery-sugar-alternatives:
    body: |-
      Gujarati-Essen ist für seine leichte Süße bekannt — Jaggery (Gol) kommt in Dal, Sabzi und Snacks. Jaggery hat einen etwas niedrigeren glykämischen Index als raffinierter Zucker und enthält Spurenelemente. In den Wechseljahren beeinflusst aber die gesamte Zuckermenge — egal aus welcher Quelle — die Blutzuckerstabilität und kann Hitzewallungen verstärken.

      Weniger Jaggery zu verwenden, als traditionelle Rezepte vorsehen, und süße Speisen zusammen mit einer Eiweißquelle zu essen, mildert die Wirkung auf den Blutzucker.
  chaas-buttermilk-calcium:
    body: |-
      Chaas (gewürzte Buttermilch) ist ein Gujarati-Grundgetränk und eine gute Quelle für Kalzium, Eiweiß und Probiotika. Chaas nach dem Essen unterstützt die Verdauung und trägt zur Kalziumzufuhr bei, die in den Wechseljahren die Knochendichte schützt. Kreuzkümmel und Ingwer im Chaas wirken außerdem verdauungsfördernd und entzündungshemmend.
  til-sesame-calcium-phytoestrogens:
    body: |-
      Til (Sesam) wird in der Gujarati-Küche und bei Snacks überall verwendet — Til Ladoo, Tilgul und als Topping. Sesam ist reich an Kalzium (wichtig für die Knochen) und enthält Lignane, eine Form von Phytoöstrogenen. Ein kleiner, aber echter Ernährungsbeitrag eines tief in der Kultur verankerten Lebensmittels.
  jain-dietary-context:
    body: |-
      Für jainistische Gujarati-Frauen bedeuten die Ernährungsregeln (zeitweise kein Wurzelgemüse, kein Fleisch), dass pflanzliche Eiweiß- und Kalziumquellen in den Wechseljahren bewusst eingeplant werden sollten.

      Milchprodukte (Paneer, Dahi, Chaas), Sesam, Mandeln, Kürbiskerne, grünes Blattgemüse und Linsen sind jainistisch verträgliche Kalzium- und Eiweißquellen, die die Ernährung in den Wechseljahren im Rahmen der religiösen Praxis unterstützen.
  cvd-metabolic-gujarati:
    body: |-
      Südasiatische Frauen, auch Gujarati-Frauen, haben während des Übergangs in die Menopause deutlich höhere Raten an metabolischem Syndrom, Insulinresistenz und Herz-Kreislauf-Risiko. Das ist klinisch belegt und heißt, dass es in dieser Zeit wichtig ist, Blutdruck und Blutzucker im Blick zu behalten.
  community-expectations:
    body: |-
      Gujarati-Frauen tragen oft viel Verantwortung in Familie und Gemeinschaft — Familienbetriebe, Großfamilien, Gemeindenetzwerke. Die Erwartung, leistungsfähig und gefasst zu sein, kann es schwer machen, die eigene Erfahrung mit den Wechseljahren zu benennen oder ihr Vorrang zu geben.

      Du kannst die Werte deiner Gemeinschaft leben und deine Beschwerden trotzdem ernst nehmen. Beides ist wahr.
  vitamin-d-gujarati:
    body: |-
      Vitamin-D-Mangel ist bei Gujarati-Frauen im Vereinigten Königreich häufig.
      Lass dich in deiner Hausarztpraxis testen, bevor du mehr als die NHS-Standardmenge einnimmst.
      HINWEIS: Zu viel Vitamin D ist giftig. Erst testen, dann passend ergänzen.
byTitle:
  Your menopause may start earlier — and your diet is already an asset:
    title: Deine Menopause beginnt vielleicht früher — und deine Ernährung ist schon ein Vorteil
    body: |-
      Indische Frauen erreichen die Menopause meist mit etwa 46,7 Jahren — 4 Jahre früher als der britische Durchschnitt. Die Perimenopause kann Ende 30 beginnen.

      Die Gujarati-Küche ist überwiegend pflanzlich und reich an Hülsenfrüchten — ein echter Ernährungsvorteil bei Wechseljahresbeschwerden. Deine traditionelle Ernährung leistet schon Arbeit, die dir vielleicht nicht bewusst war.
