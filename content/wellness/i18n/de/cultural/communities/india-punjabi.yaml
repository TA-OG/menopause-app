# Übersetzung von cultural/communities/india-punjabi.yaml — maßgeblich ist die englische Fassung.
items:
  dal-legumes-phytoestrogens:
    body: |-
      Dal — Masoor, Moong, Chana, Toor, Urad — ist das Rückgrat der Punjabi-Küche und eines der besten Lebensmittel für die Wechseljahre. Linsen und Hülsenfrüchte sind reich an Phytoöstrogenen (pflanzlichen Östrogenen), pflanzlichem Eiweiß, Ballaststoffen und Eisen.

      Frauen, die viele Hülsenfrüchte essen, haben meist seltener und weniger starke Hitzewallungen. Wenn Dal bei dir zu Hause schon täglich auf den Tisch kommt, ist das ein echter Vorteil. Dal Makhani (schwarze Urad-Linsen) liefert Eiweiß und Eisen zusammen. Bleib regelmäßig dabei.
  sarson-da-saag-greens:
    body: |-
      Sarson da Saag (Senfblätter) ist ein Punjabi-Wintergericht mit echter Bedeutung für die Wechseljahre. Senfblätter sind reich an Kalzium (entscheidend, wenn das Östrogen sinkt), Vitamin K (Knochengesundheit), Folat und Antioxidantien. Traditionell isst man es mit Makki di Roti (Maisfladenbrot) — Mais enthält mehr Ballaststoffe als weißes Weizenmehl und lässt den Blutzucker weniger stark ansteigen.

      Dieses traditionelle Wintergericht lohnt sich in den Wechseljahren das ganze Jahr über, nicht nur in der Saison.
  ghee-moderation:
    body: |-
      Ghee ist in der Punjabi-Küche kulturell und ernährungsphysiologisch bedeutsam — besonders Sikh- und Hindu-Haushalte verwenden es großzügig. In Maßen ist Ghee unproblematisch. In den Wechseljahren verändert der Östrogenrückgang jedoch, wie Fett verstoffwechselt und gespeichert wird, besonders am Bauch.

      Studien an südasiatischen Frauen zeigen gerade im Übergang in die Menopause höhere Raten an Bauchfett und metabolischem Syndrom. Das heißt nicht, auf Ghee zu verzichten — sondern es bewusst neben anderen gesunden Fetten (Senföl, Nüsse, Leinsamen) zu verwenden, statt als wichtigstes Kochfett.
  paneer-calcium-protein:
    body: |-
      Paneer ist ein hervorragendes Lebensmittel für die Wechseljahre — reich an Kalzium und Eiweiß und mit etwas weniger Laktose als Milch. Kalzium ist in den Wechseljahren entscheidend, um die Knochendichte zu erhalten. Palak Paneer (mit Spinat) vereint Kalzium, Eisen und Vitamin C in einem Gericht. Mutter Paneer liefert Eiweiß und pflanzliche Kohlenhydrate.

      Wenn du laktoseintolerant bist (bei Menschen südasiatischer Herkunft häufig), verträgst du kleine Mengen Paneer meist besser als flüssige Milchprodukte.
  roti-chapati-refined-carbs:
    body: |-
      Roti und Chapati aus weißem Weizenmehl sind zentral in der Punjabi-Ernährung. In den Wechseljahren wird die Blutzuckerkontrolle für südasiatische Frauen besonders wichtig — Studien belegen bei ihnen im Übergang in die Menopause deutlich höhere Raten an Insulinresistenz und metabolischem Syndrom.

      Praktische Anpassungen: Misch Vollkorn-Atta mit normalem Atta (50/50), um mehr Ballaststoffe zu bekommen. Iss Roti mit reichlich Dal, Sabzi oder Eiweiß — Eiweiß und Ballaststoffe bremsen den Blutzuckeranstieg. Reduziere nicht nur das Roti; iss mehr von dem, was dazugehört.
  chai-caffeine-south-asian:
    body: |-
      Starker Punjabi-Chai — oft mit Vollmilch, Zucker und Kardamom — mehrmals am Tag ist kulturell zentral. Koffein kann in den Wechseljahren Hitzewallungen verstärken und den Schlaf stören, besonders ab dem Nachmittag.

      Am meisten bringt es, den Zucker im Chai zu reduzieren. Den Chai am Nachmittag und Abend durch Kurkumamilch (Haldi Doodh) zu ersetzen, hat kulturellen Bezug und wirkt zusätzlich entzündungshemmend. Der Morgen-Chai darf bleiben, wie er ist.
  turmeric-haldi-inflammation:
    body: |-
      Kurkuma (Haldi), das in der Punjabi-Küche überall verwendet wird, wirkt tatsächlich entzündungshemmend. Curcumin — der Wirkstoff — wird mit schwarzem Pfeffer (Kali Mirch) und Fett viel besser aufgenommen. Die traditionelle Punjabi-Küche kombiniert das bereits (Currybasen verwenden Ghee und Pfeffer zusammen mit Haldi).

      Haldi Doodh (goldene Milch) am Abend wirkt entzündungshemmend und unterstützt durch das Tryptophan in warmer Milch den Schlaf. Eine wirklich nützliche traditionelle Praxis.
  lassi-probiotic:
    body: |-
      Traditioneller salziger Lassi (nicht die süße Mango-Variante) ist ein probiotisches Lebensmittel, das die Darmgesundheit unterstützt. Die Darmgesundheit wird zunehmend damit in Verbindung gebracht, wie der Körper Östrogen verarbeitet und wiederverwertet. Ein Glas salziger Lassi mit Kreuzkümmel ist eine echte Unterstützung. Süße Fertig-Lassis enthalten viel Zucker, was den Nutzen zunichtemacht.
  cvd-risk-south-asian:
    body: |-
      Südasiatische Frauen haben im Übergang in die Menopause deutlich höhere Raten an Herz-Kreislauf-Risikofaktoren — metabolisches Syndrom, Insulinresistenz, Diabetes, Bauchfett und Bluthochdruck sind bei ihnen in dieser Zeit häufiger als bei weißen europäischen Frauen.

      Das ist keine Panikmache — es ist klinisch belegt und heißt, dass es für südasiatische Frauen umso wichtiger ist, die Wechseljahre ernst zu nehmen, Blutdruck und Blutzucker zu kontrollieren und den Lebensstil aktiv anzugehen.
  joint-pain-prominent:
    body: |-
      Gelenk- und Muskelschmerzen sind bei südasiatischen Frauen ein ausgeprägteres Wechseljahressymptom als bei weißen Frauen. Sie werden oft als Arthrose gedeutet oder abgetan. Wenn du neben anderen Wechseljahresbeschwerden Gelenkschmerzen hast, sprich beides in deiner Praxis an.

      Tägliche Bewegung — Yoga (mit kulturellem Bezug), Gehen, Schwimmen — ist die am besten belegte Maßnahme gegen wechseljahresbedingte Gelenkschmerzen.
  cultural-silence-punjabi:
    body: |-
      In vielen Punjabi-Haushalten — ob Sikh, Hindu oder Muslim — wird über die Wechseljahre nicht offen gesprochen. „Chup raho“ (sei still) kann zum kulturellen Drehbuch werden. Von Frauen wird erwartet, dass sie damit klarkommen und weitermachen.

      Dieses Schweigen ist keine Tradition im tieferen Sinn — es ist das Fehlen von Worten und Raum. Aunty Mel ist ein Ort, an dem du benennen kannst, was passiert, es verstehen und ernst nehmen kannst. Das darfst du.
  hrt-access-gap:
    body: |-
      Studien zeigen, dass im Vereinigten Königreich nur 6,2 % der asiatischen Frauen eine HRT erhalten, verglichen mit 23,3 % der weißen Frauen. Diese Lücke spiegelt Hürden beim Zugang und bei der Sprache, kulturelle Zurückhaltung und möglicherweise ärztliche Annahmen darüber wider, was südasiatische Frauen wollen.

      HRT ist eine medizinische Behandlung, keine „westliche“. Wenn deine Beschwerden deine Lebensqualität deutlich beeinträchtigen, hast du das Recht, in deiner Praxis nach allen Möglichkeiten zu fragen — auch nach HRT. Aunty Mel hilft dir, dich auf dieses Gespräch vorzubereiten.
  vitamin-d-south-asian-uk:
    body: |-
      Südasiatische Frauen im Vereinigten Königreich haben mit die höchsten Raten an Vitamin-D-Mangel. Traditionelle südasiatische Ernährung liefert wenig Vitamin D (wenig fetter Fisch, wenig angereicherte Lebensmittel). Durch Kleidung und das britische Klima bekommt die Haut kaum Sonne.

      Vitamin-D-Mangel verschlechtert Gelenkschmerzen, Erschöpfung, Stimmung und Knochengesundheit — alles in den Wechseljahren ohnehin belastet. Lass dich in deiner Praxis testen. Die meisten Empfehlungen nennen 1000–2000 IE für südasiatische Frauen im Vereinigten Königreich, aber lass dich zuerst testen.
      HINWEIS: Sprich immer mit deiner Ärztin oder deinem Arzt. Zu viel Vitamin D ist giftig.
  calcium-bone-health-punjabi:
    body: |-
      Südasiatische Frauen haben im Vereinigten Königreich höhere Osteoporoseraten als weiße Frauen. Eine frühere Menopause verstärkt das — mehr Jahre ohne die knochenschützende Wirkung des Östrogens. Milchprodukte (Paneer, Dahi, Milch), Sesam (Til), Mandeln und dunkelgrünes Blattgemüse sind die Kalziumquellen, die du bevorzugen solltest.
      HINWEIS: Sprich mit deiner Ärztin oder deinem Arzt über eine Ergänzung von Kalzium und Vitamin D.
byTitle:
  Your menopause may start earlier than you expect:
    title: Deine Menopause beginnt vielleicht früher, als du denkst
    body: |-
      Indische und pakistanische Frauen erreichen die Menopause deutlich früher als der britische Durchschnitt. Indische Frauen im Schnitt mit 46,7 Jahren, pakistanische Frauen mit 47,16 Jahren — beide 3–4 Jahre früher als der britische Durchschnitt von 51.

      Die Perimenopause kann also Ende 30 oder Anfang 40 beginnen. In diesem Alter werden Beschwerden oft als Stress, Depression oder Schilddrüsenproblem abgetan.

      Wenn du in deinen 40ern bist und Hitzewallungen, Schlafveränderungen, Stimmungsschwankungen, unregelmäßige Perioden oder Gelenkschmerzen hast — das könnte die Perimenopause sein. Besteh darauf, ernst genommen zu werden.
