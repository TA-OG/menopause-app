# Übersetzung von cultural/communities/nigeria-hausa.yaml — maßgeblich ist die englische Fassung.
items:
  fura-da-nono-probiotic-calcium:
    body: |-
      Fura da Nono — das fermentierte Milchgetränk der Fulani aus Hirsebällchen und fermentierter Kuhmilch — ist für Frauen in den Wechseljahren ernährungsphysiologisch bedeutsam. Es liefert Kalzium (entscheidend für die Knochendichte, wenn das Östrogen sinkt), probiotische Bakterien (die die Darmgesundheit unterstützen und den Stoffwechsel von Phytoöstrogenen verbessern könnten) und Eiweiß.

      Wenn du Zugang dazu hast, ist es eines der passendsten traditionellen Lebensmittel für diese Lebensphase. Wenn du es selbst machst, ist die Fermentation ernährungsphysiologisch der wichtigste Teil.
  tuwo-shinkafa-grain-staple:
    body: |-
      Tuwo Shinkafa (Reisbrei bzw. Reisklöße) ist die Grundbeilage im Norden und wird mit vielen Suppen gegessen. Grundnahrungsmittel auf Reisbasis sind meist leichter verdaulich als schwerere Beilagen. Tuwo mit Miyan Kuka (Baobabblätter-Suppe) oder Miyan Taushe (Kürbissuppe) ergibt eine ausgewogene Mahlzeit.

      In den Wechseljahren zählt ein stabiler Blutzucker. Tuwo mit eiweißreichen Suppen zu kombinieren und weniger Tuwo, dafür mehr Suppe zu essen, mildert den Blutzuckeranstieg.
  miyan-kuka-baobab:
    body: |-
      Miyan Kuka (Baobabblätter-Suppe) ist reich an Kalzium, Eisen, Vitamin C und Antioxidantien. Der Baobab — im ganzen Afrika südlich der Sahara „Baum des Lebens“ genannt — hat einen der höchsten Vitamin-C-Gehalte aller Lebensmittel. Vitamin C unterstützt die Eisenaufnahme und das Immunsystem, beides wichtig in den Wechseljahren.

      Baobabpulver gibt es inzwischen auch in britischen Reformhäusern — ein Teelöffel im Smoothie oder Porridge bringt einen deutlichen Nährstoffschub.
  masa-tsamiya-sorghum:
    body: |-
      Masa (fermentierte Reispfannkuchen) und Tsamiya (Tamarinde) gehören zur Hausa-Snackkultur. Fermentierte Lebensmittel unterstützen die Darmgesundheit. Tamarinde wirkt antioxidativ. Lebensmittel aus Sorghum (Burukutu, Tuwo Dawa) enthalten mehr Ballaststoffe und haben einen niedrigeren glykämischen Index als weißer Reis — in den Wechseljahren die bessere Wahl für den Blutzucker.
  suya-kilishi-protein:
    body: |-
      Suya (gewürztes gegrilltes Rind- oder Hähnchenfleisch) und Kilishi (getrocknetes gewürztes Fleisch) sind eiweißreich — wichtig in den Wechseljahren, wenn der Erhalt der Muskelmasse entscheidender wird. Die Gewürzmischung (Suya-Gewürz/Tankora) enthält Erdnüsse, Ingwer und weitere Gewürze mit entzündungshemmenden Eigenschaften.

      Suya von Straßenständen ist oft sehr salzig. Wenn du es selbst machst, unterstützt weniger Salz bei gleichem Gewürzprofil die Herz-Kreislauf-Gesundheit, die nach der Menopause wichtiger wird, wenn die herzschützende Wirkung des Östrogens nachlässt.
  groundnuts-legumes:
    body: |-
      Erdnüsse (Kulikuli, Erdnusssuppe, Erdnussöl) sind zentral in der nordnigerianischen Küche und liefern Eiweiß, gesunde Fette und etwas Phytoöstrogene. Erdnussöl ist zum Kochen besser als raffinierte Pflanzenöle. Erdnusssuppe mit Getreide liefert lang anhaltende Energie und einen stabilen Blutzucker.
  purdah-vitamin-d:
    body: |-
      Für Hausa-Fulani-Frauen, die Purdah praktizieren oder sich draußen vollständig bedecken, ist Vitamin-D-Mangel ein erhebliches Gesundheitsrisiko. Wenig Sonne in Verbindung mit dunkler Haut bedeutet, dass im Vereinigten Königreich kaum Vitamin D gebildet wird.

      Vitamin-D-Mangel verschlechtert in den Wechseljahren Gelenkschmerzen, Erschöpfung, Knochengesundheit und Stimmung direkt — alles Beschwerden, die ohnehin häufiger sind. Das ist ein medizinisch wichtiges Thema für deine Hausarztpraxis, ganz gleich, wie du dich kleidest.
  community-women-network:
    body: |-
      Die Netzwerke der Hausa-Frauen — informell wie formell — waren schon immer wichtige Orte, an denen Frauen Gesundheitswissen teilen. Das Prinzip „Sadaka“ (Wohltätigkeit und Fürsorge für die Gemeinschaft) umfasst auch das Teilen von Gesundheitswissen.

      Frauen in deiner Gemeinschaft, die die Wechseljahre schon erlebt haben, um Rat zu fragen, ist eine berechtigte und wertvolle Quelle der Unterstützung — ergänzend zu evidenzbasierten Empfehlungen.
  islamic-framing-natural-process:
    body: |-
      In der islamischen Gelehrsamkeit gelten die Wechseljahre als natürlicher Teil des von Allah geschaffenen Lebenszyklus — das Ende einer Aufgabe (Kinder zu gebären) und das Freiwerden von Energie für andere Formen des Beitrags und der Andacht. Diese positive Sicht hat echten Wert für das Wohlbefinden.

      Dein Glaube verlangt nicht, dass du Beschwerden still erträgst. Dich über deinen Körper zu informieren und Linderung zu suchen, entspricht den islamischen Grundsätzen, den Körper als Amanah (anvertrautes Gut) zu pflegen.
  discussing-sexual-health:
    body: |-
      Über sexuelle Gesundheit zu sprechen — etwa über veränderte Lust, Scheidentrockenheit oder Schmerzen bei Intimität — kann in Hausa-Fulani-Kontexten, in denen das Privatsache ist, sehr schwerfallen.

      In der Privatsphäre dieser App kannst du diese Veränderungen festhalten und verstehen, ohne sie jemandem mitzuteilen. Wenn sie erheblich sind und dein Leben beeinträchtigen, hast du das Recht, vertraulich mit einer Ärztin zu sprechen. Diese Veränderungen sind medizinisch, es gibt evidenzbasierte Lösungen, und du hast ein Recht darauf.
  calcium-bone-health-hausa:
    body: |-
      Die traditionelle Hausa-Fulani-Ernährung gehört dank Milchprodukten (Fura da Nono, Milch) zu den kalziumreicheren in Westafrika. Das ist in den Wechseljahren ein echter Vorteil für die Knochen. Behalte diese Ernährungsweise bei und sprich in deiner Praxis über eine Knochendichtemessung (DEXA), wenn deine Menopause früh einsetzt oder Osteoporose in deiner Familie vorkommt.
      HINWEIS: Sprich mit deiner Ärztin oder deinem Arzt über eine Kalziumergänzung.
  vitamin-d-hausa:
    body: |-
      Vitamin-D-Mangel ist bei Hausa-Frauen im Vereinigten Königreich besonders häufig.
      Lass dich in deiner Praxis testen, bevor du höhere Dosen nimmst.
      HINWEIS: Sprich immer mit deiner Ärztin oder deinem Arzt. Zu viel Vitamin D ist giftig.
byTitle:
  Your diet is already doing some of the work:
    title: Deine Ernährung leistet schon einen Teil der Arbeit
    body: |-
      Die traditionelle Hausa-Fulani-Ernährung — reich an Getreide, Hülsenfrüchten und fermentierten Milchprodukten — bietet in den Wechseljahren einige natürliche Vorteile. Besonders Fura da Nono (fermentiertes Milchgetränk) liefert Kalzium, Probiotika und Eiweiß, die die Knochen während des Östrogenrückgangs unterstützen.

      Nigerianische Frauen erreichen die Menopause meist früher als der westliche Durchschnitt von 51. Wenn du in deinen 40ern bist und Veränderungen bemerkst, nimm sie ernst.
