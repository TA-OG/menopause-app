# Übersetzung von cultural/communities/nigeria-igbo.yaml — maßgeblich ist die englische Fassung.
items:
  bitter-leaf-ofe-onugbu:
    body: |-
      Ofe Onugbu (Bitterblatt-Suppe) ist ein typisches Igbo-Gericht, und erste Studien stützen seine entzündungshemmenden und blutzuckerregulierenden Eigenschaften. Bitterblatt (Vernonia amygdalina) wird seit Generationen in der traditionellen Medizin der Igbo und Westafrikas genutzt. In den Wechseljahren, wenn sowohl Entzündungen als auch ein stabiler Blutzucker eine Rolle spielen, lohnt es sich, dieses Gericht zu bevorzugen.

      Die traditionelle Igbo-Kombination aus Bitterblatt-Suppe mit Taro (Cocoyam) oder Eba liefert Ballaststoffe, Pflanzenstoffe und Eiweiß.
  oha-soup-nutrients:
    body: |-
      Oha-Suppe (aus Oha-Blättern, auch „Afrikanisches Rosenholz“) ist reich an Kalzium, Eisen und Vitamin C — alles wichtig im Übergang in die Menopause, wenn sich Knochendichte, Energie und Immunfunktion verändern. Oha-Blätter enthalten außerdem viele Ballaststoffe.

      Wenn du Oha leicht bekommst (in afrikanischen Lebensmittelläden im Vereinigten Königreich), ist das eine ernährungsphysiologisch hervorragende Suppe, die du regelmäßig essen solltest.
  egusi-protein-zinc:
    body: |-
      Egusi (Melonenkerne) — in der Igbo-, Yoruba- und anderen westafrikanischen Küchen verwendet — ist reich an Zink, Eiweiß und gesunden Fetten. Zink ist wichtig für die Testosteronbildung (die bei Frauen in den Wechseljahren Energie und Lust beeinflusst) und für das Immunsystem. Egusi-Suppe mit Blattgemüse ist eine wirklich nahrhafte Mahlzeit für die Wechseljahre.
  yam-fufu-blood-sugar:
    body: |-
      Fufu, Eba und gestampfte Yamswurzel sind die Grundbeilagen der Igbo. Sie sind kulturell bedeutsam und haben Nährwert — Yams enthält Stoffe, die das hormonelle Gleichgewicht unterstützen. Große Portionen raffinierter Kohlenhydrate ohne genug Gemüse oder Eiweiß können aber den Blutzucker in die Höhe treiben, was Hitzewallungen und Stimmungsschwankungen verstärkt.

      Die traditionelle Igbo-Art, suppenbetont zu essen (mehr Suppe, weniger Beilage), mildert das ganz natürlich. Halte dich an die traditionelle Balance, statt sie zu verwestlichen.
  palm-nut-soup-abenkwan-banga:
    body: |-
      Palmnusssuppe (Ofe Akwu) ist nahrhaft und kulturell bedeutsam. Palmnüsse liefern Vitamin E und Betacarotin. In den Wechseljahren geht es um die Gesamtbilanz gesättigter Fette — ergänze palmölreiches Kochen mit fettem Fisch (Sardinen, Makrele, Thunfisch) und dunkelgrünem Blattgemüse für ein ausgewogenes Omega-3-Verhältnis.
  ukazi-afang-leafy-greens:
    body: |-
      Ukazi-Blätter (in Afang-Suppe und als Bindemittel verwendet) sind reich an Eisen und Ballaststoffen. Afang-Suppe — eine Kombination aus Ukazi und Waterleaf — gehört zu den nährstoffreichsten Suppen der ostnigerianischen Küche. Für Frauen mit Erschöpfung in der Perimenopause oder starken Blutungen ist der Eisengehalt wirklich relevant.
  abacha-african-salad:
    body: |-
      Abacha (afrikanischer Salat aus getrocknetem Maniok) ist ein leichteres Igbo-Gericht, oft mit afrikanischer Aubergine (Garden Egg), Zwiebel, getrockneten Flusskrebsen und Palmöl. Er enthält weniger Kohlenhydrate als Mahlzeiten mit Beilage und ist daher eine gute Option, um in den Wechseljahren Blutzucker und Gewichtsveränderungen am Bauch zu steuern. Die afrikanische Aubergine hat zudem belegte antioxidative Eigenschaften.
  vitamin-d-igbo-uk:
    body: |-
      Igbo-Frauen im Vereinigten Königreich haben — wie alle Frauen afrikanischer Herkunft — ein hohes Risiko für Vitamin-D-Mangel, weil Melanin mehr Sonne braucht und es im Vereinigten Königreich außerhalb der Sommermonate kaum UV-Strahlung gibt.

      Erschöpfung, Gelenkschmerzen, gedrückte Stimmung und Knochenprobleme werden durch Vitamin-D-Mangel verschlimmert — und sind in den Wechseljahren ohnehin verstärkt. Testen und Beheben ist eine einfache, wirkungsvolle Maßnahme.
  nkwobi-okonkwo-social:
    body: |-
      Die Esskultur der Igbo ist zutiefst gesellig — Nkwobi, Isi Ewu und Ofe werden oft gemeinsam bei Zusammenkünften gegessen. Diese gemeinschaftliche Seite des Essens hat in den Wechseljahren echten Wert für das Wohlbefinden. Soziale Verbundenheit, emotionale Unterstützung und das gemeinsame Essen sind belegte Schutzfaktoren gegen die Isolation, die mit großen hormonellen Veränderungen einhergehen kann.

      Unterschätze nicht die Medizin, die in deiner Gemeinschaft steckt.
  igbo-women-strength:
    body: |-
      Igbo-Frauen sind bekannt für ihre Widerstandskraft, ihren Unternehmergeist und ihre Führungsrolle in der Gemeinschaft. Diese Stärke kann manchmal bedeuten, Schwierigkeiten still durchzustehen — „onye aghala nwanne ya“ (lass die Deinen nicht im Stich) kann zur Last werden, wenn es heißt, für dich selbst nicht um Hilfe zu bitten.

      Deine Wechseljahresbeschwerden ernst zu nehmen — sie festzuhalten, Unterstützung zu suchen und in der Praxis für dich einzutreten — ist keine Schwäche. Es ist dieselbe Klugheit und Entschlossenheit, die den Frauenaufstand von Aba (Aba Women’s Riot) in die Geschichte eingehen ließ. Du verdienst, dass diese Energie deinem eigenen Körper gilt.
  vitamin-d-testing:
    body: |-
      Vitamin-D-Test und bei Mangel eine Ergänzung. Besonders wichtig für Igbo-Frauen im Vereinigten Königreich, die wegen Hautton und britischem Klima häufig einen Mangel haben.
      HINWEIS: Lass dich testen, bevor du mehr als 400 IE nimmst. Zu viel Vitamin D ist giftig. Sprich mit deiner Ärztin oder deinem Arzt.
byTitle:
  Your timeline and your symptoms may be earlier than expected:
    title: Dein Zeitverlauf und deine Beschwerden beginnen vielleicht früher als erwartet
    body: |-
      Nigerianische Frauen erreichen die Menopause meist früher als der britische Durchschnitt von 51. Die Perimenopause kann Anfang bis Mitte 40 beginnen. Das Igbo-Verständnis von Weiblichkeit als Trägerin von Weisheit, Stärke und Gemeinschaft — „nwanyi oma“ — kann in diesem Übergang ein echter Anker sein.

      Du verlierst deine Stärke nicht. Sie verändert ihre Form.
