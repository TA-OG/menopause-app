# Übersetzung von cultural/communities/nigeria-yoruba.yaml — maßgeblich ist die englische Fassung.
items:
  amala-yam-hormones:
    body: |-
      Amala — die beliebte Yoruba-Beilage aus getrocknetem Yamsmehl — hat echte ernährungsphysiologische Bedeutung für die Wechseljahre. Nigerianische Ernährungsstudien zeigen, dass Yams Stoffe enthält, die helfen könnten, die sich in den Wechseljahren verändernden Hormone auszugleichen, und entzündungshemmend wirkt. Amala mit Ewedu und Gbegiri ist eine ausgewogene, ballaststoffreiche Mahlzeit, die einen stabilen Blutzucker unterstützt.

      Je dunkler das Amala (aus ungeschälter Yamsrinde), desto höher der Ballaststoffgehalt. Ein Gericht, das du mit gutem Gefühl regelmäßig essen kannst.
  ewedu-gbegiri-nutrients:
    body: |-
      Ewedu (Juteblätter) gehört zu den nährstoffreichsten Gemüsen der Yoruba-Küche — reich an Kalzium, Eisen und Vitamin C. Alle sind in den Wechseljahren besonders wichtig, wenn sich die Knochendichte zu verändern beginnt und der Energiebedarf sich verschiebt. Gbegiri (Augenbohnensuppe) liefert zusätzlich pflanzliches Eiweiß und Phytoöstrogene.

      Die Kombination aus Ewedu, Gbegiri und Eintopf mit Amala oder gestampfter Yamswurzel ist — ernährungsphysiologisch betrachtet — eine hervorragende Mahlzeit für die Wechseljahre.
  efo-riro-leafy-greens:
    body: |-
      Efo Riro (Yoruba-Gemüsesuppe) mit Tete (Amarantblättern) oder Spinat ist reich an Magnesium, das die Schlafqualität unterstützt und Hitzewallungen seltener machen könnte. Die Kombination aus Palmöl (Vitamin E, Betacarotin) und dunkelgrünem Blattgemüse liefert fettlösliche Vitamine, die der Körper gut verwertet.

      Koch Efo Riro mit weniger Öl, wenn dich Gewichtsveränderungen am Bauch beschäftigen — der ernährungsphysiologische Star ist das Grün, nicht die Ölmenge.
  pounded-yam-blood-sugar:
    body: |-
      Gestampfte Yamswurzel (Iyan) ist kulturell zentral und nahrhaft, wirkt in großen Portionen aber stärker auf den Blutzucker. In den Wechseljahren beeinflusst ein stabiler Blutzucker direkt die Häufigkeit von Hitzewallungen und die Stimmung.

      Eine praktische Anpassung: kleinere Portionen Iyan mit mehr Suppe. Ewedu, Egusi oder Efo Riro können den größeren Teil ausmachen. So bleiben Mahlzeit und Kultur erhalten, während du auf die veränderten Bedürfnisse deines Körpers eingehst.
  pepper-spice-triggers:
    body: |-
      Yoruba-Essen ist für seine Schärfe bekannt — Ata Rodo (Scotch-Bonnet-Chili), Ata Ijosi und verschiedene getrocknete Chilis geben der Yoruba-Küche ihre typische Hitze. Scharfes Essen kann bei manchen Frauen in den Wechseljahren Hitzewallungen auslösen — nicht bei allen und nicht immer. Achte darauf, ob innerhalb von 30–60 Minuten nach einer besonders scharfen Mahlzeit eine Hitzewallung kommt.

      Wenn es ein Muster gibt, musst du nicht auf Schärfe verzichten — pass die Menge an und beobachte, ob die Hitze des Chilis oder die Hitze der Wechseljahre die Wallung auslöst.
  palm-oil-balance:
    body: |-
      Palmöl ist in der Yoruba-Küche allgegenwärtig und liefert Vitamin E, Betacarotin und gesättigte Fette. Angesichts der Östrogenveränderungen in den Wechseljahren — die beeinflussen, wie Fett verstoffwechselt und gespeichert wird — ist ein maßvoller Palmölgebrauch in Ordnung. Entscheidend ist das Gesamtbild: Ergänze das Kochen mit Palmöl durch fetten Fisch (Makrele, Sardinen, Thunfisch) für ein ausgewogenes Omega-3-Verhältnis, das die Gehirngesundheit und den Umgang mit Entzündungen unterstützt.
  offal-iron:
    body: |-
      Die Yoruba-Küche verwertet Innereien hervorragend — Shaki (Kutteln), Ponmo (Rinderhaut), Kpomo und Organfleisch. Besonders Leber ist sehr eisenreich, was wichtig ist, wenn du in der Perimenopause noch Perioden hast, die stärker oder unregelmäßiger sein können als früher.

      Wenn Erschöpfung eine wichtige Beschwerde ist, bitte in deiner Praxis um ein großes Blutbild, um eine Eisenmangelanämie auszuschließen — sie wird in der Perimenopause oft übersehen.
  allostatic-load-yoruba:
    body: |-
      Die Forschung zur allostatischen Last — dem kumulativen körperlichen Preis von chronischem Stress — ist besonders relevant für Schwarze britische Frauen, die sich gleichzeitig in mehreren Systemen zurechtfinden müssen: Arbeit, Familie, Erwartungen der Gemeinschaft und oft rassistische Diskriminierung.

      In der Yoruba-Kultur kann die Erwartung, dass Frauen Säulen der Gemeinschaft sind — als Iyá —, bedeuten, eine enorme emotionale und praktische Last zu tragen. Das wird geehrt; und es sollte auch ehrlich benannt werden. Die chronische Stressreaktion verstärkt Wechseljahresbeschwerden. Unterstützung zu suchen, zu benennen, was du trägst, und unnötige Last abzubauen, wo es geht, ist keine Schwäche — es ist Weisheit.
  vitamin-d-uk:
    body: |-
      Yoruba-Frauen im Vereinigten Königreich haben — wie alle Frauen afrikanischer Herkunft — ein hohes Risiko für Vitamin-D-Mangel. Nigerianisches gegen britisches Sonnenlicht ist kein kleiner Unterschied; es ist eine körperliche Umstellung über 12 Monate, die Knochengesundheit, Stimmung, Gelenkschmerzen und Erschöpfung beeinflusst. All diese Beschwerden sind in den Wechseljahren ohnehin verstärkt.

      Bitte deine Hausarztpraxis, deinen Vitamin-D-Spiegel zu messen. Bei einem Mangel macht eine richtige Ergänzung einen messbaren Unterschied für dein Befinden.
  menopause-not-taboo-here:
    body: |-
      In vielen nigerianischen und Yoruba-Haushalten wird über die Wechseljahre nicht direkt gesprochen. Es ist „das, was eben passiert“ — bekannt, aber nicht benannt. Dieses Schweigen kann bedeuten, dass Frauen erhebliche Beschwerden ohne Unterstützung, ohne Worte und manchmal sogar ohne zu verstehen, was mit ihrem Körper geschieht, durchstehen.

      Du hast jedes Recht, deine Erfahrung zu benennen. Sie festzuhalten, darüber zu sprechen und Unterstützung zu suchen, genau dafür ist diese App da. Die Weisheit der Yoruba-Frauen vor dir — die diesen Übergang durch Gemeinschaft, Essen und kulturelle Praxis gemeistert haben — ist das Fundament, auf dem Aunty Mel aufbaut.
  gp-advocacy:
    body: |-
      Studien zeigen immer wieder, dass Wechseljahresbeschwerden Schwarzer Frauen in der britischen Hausarztversorgung seltener ernst genommen werden und ihnen seltener eine Behandlung angeboten wird. Das ist belegt, nicht eingebildet.

      Wenn deine Ärztin oder dein Arzt abwinkt, hast du das Recht, eine Zweitmeinung oder eine Überweisung an eine Menopause-Spezialistin oder einen -Spezialisten zu verlangen und deine Beschwerden schriftlich mitzubringen. Ein Symptomtagebuch ist dein stärkstes Werkzeug in diesem Gespräch.
  vitamin-d-yoruba:
    body: |-
      Vitamin-D-Mangel ist bei Yoruba-Frauen im Vereinigten Königreich extrem häufig. Seine Symptome — Erschöpfung, Gelenkschmerzen, gedrückte Stimmung, schlechter Schlaf — überschneiden sich stark mit Wechseljahresbeschwerden und verstärken sie.

      Erst testen (über die Hausarztpraxis), dann ergänzen. Die meisten Empfehlungen nennen 1000–2000 IE täglich für Frauen afrikanischer Herkunft im Vereinigten Königreich, aber die Dosis sollte zu deinem tatsächlichen Wert passen.
      HINWEIS: Sprich immer mit deiner Ärztin oder deinem Arzt, bevor du mehr als die NHS-Standarddosis von 400 IE nimmst. Zu viel Vitamin D ist giftig.
  iron-perimenopausal-bleeding:
    body: |-
      Wenn du noch Perioden hast und sie stärker, häufiger oder unberechenbarer geworden sind — häufig bei Yoruba-Frauen zu Beginn der Perimenopause, die insgesamt eher mehr vasomotorische Beschwerden haben —, ist es wichtig, den Eisenwert im Blick zu behalten.

      Bitte um ein großes Blutbild. Erschöpfung ist das erste Zeichen einer Eisenmangelanämie und wird oft übersehen oder auf das Alter oder viel Stress geschoben.
      HINWEIS: Nimm kein Eisen ein, ohne vorher testen zu lassen. Zu viel Eisen schadet.
byTitle:
  Your body may be ahead of the calendar:
    title: Dein Körper ist dem Kalender vielleicht voraus
    body: |-
      Nigerianische Frauen erreichen die Menopause meist früher als der britische Durchschnitt von 51. Besonders bei Yoruba-Frauen können Perimenopause-Beschwerden Anfang bis Mitte 40 beginnen. Wenn dir gesagt wurde, du seist „zu jung“ für die Wechseljahre, sprich deine Ärztin oder deinen Arzt darauf an — es lohnt sich, das eher früher als später abzuklären.

      Die Yoruba-Sicht auf die ältere Frau als Weisheit und Autorität — als „Iya“ — hat hier echten Wert. Du verlierst nichts; du wächst in etwas hinein.
