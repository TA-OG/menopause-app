# Übersetzung von cultural/hispanic-latina.yaml — maßgeblich ist die englische Fassung.
items:
  beans-legumes-central:
    body: |-
      Schwarze Bohnen, Pintobohnen, Frijoles — Hülsenfrüchte stehen im Mittelpunkt der lateinamerikanischen Küche und gehören zu den besten Lebensmitteln für die Wechseljahre. Sie sind reich an pflanzlichem Eiweiß, Ballaststoffen und Phytoöstrogenen. Wenn Bohnen bei dir schon täglich auf dem Tisch stehen, ist das ein deutlicher Ernährungsvorteil.
  avocado-healthy-fats:
    body: |-
      Avocado ist ein lateinamerikanisches Grundnahrungsmittel und wirklich hervorragend für die Wechseljahre — reich an einfach ungesättigten Fetten, die die Hormonbildung unterstützen, an Vitamin E für die Hautgesundheit (besonders relevant angesichts der Hautveränderungen, die bei Latinas in den Wechseljahren häufig sind) und an Kalium für den Blutdruck. Täglich Avocado ist durch Belege gestützt, nicht nur ein Trend.
  chilli-triggers:
    body: |-
      Chili und scharfes Essen sind in vielen lateinamerikanischen Küchen grundlegend und kulturell tief verankert. Wie bei anderen Traditionen mit scharfem Essen lohnt es sich zu beobachten, ob es einen Zusammenhang zwischen scharfen Mahlzeiten und Hitzewallungen gibt. Wenn sich ein Muster zeigt, denk eher an den Zeitpunkt als ans Weglassen — scharfes Essen früher am Tag kann die Wirkung am Abend verringern.
  corn-tortilla-vs-flour:
    body: |-
      Maistortillas haben einen niedrigeren glykämischen Index als Weizentortillas und sind von Natur aus glutenfrei. In den Wechseljahren, wenn ein stabiler Blutzucker die Häufigkeit von Hitzewallungen und die Stimmung direkt beeinflusst, ist das ein einfacher Tausch, der sich dort lohnt, wo Maistortillas kulturell dazugehören.
  hibiscus-jamaica:
    body: |-
      Agua de Jamaica (Hibiskusblütenwasser) wird in Mexiko und Mittelamerika viel getrunken. Es hat echte Belege für die Unterstützung des Blutdrucks und antioxidative Eigenschaften. Weniger zugesetzter Zucker bei der Zubereitung holt das Beste heraus — eine leichte Süße mit viel Hibiskus und Limette ist genauso erfrischend.
  skin-and-hair-changes:
    body: |-
      Haut- und Haarveränderungen sind bei hispanischen und lateinamerikanischen Frauen in den Wechseljahren stärker ausgeprägt — Veränderungen von Struktur und Pigmentierung, Trockenheit und dünner werdendes Haar sind häufiger dokumentiert. Das ist keine Eitelkeit — diese Veränderungen berühren Identität und Wohlbefinden.

      Ausreichend Flüssigkeit (über Wasser und gesunde Fette in der Ernährung), Vitamin E und eine an trockenere, sich verändernde Haut angepasste Pflege verdienen Vorrang. Eine Dermatologin oder ein Dermatologe mit Erfahrung bei menopausebedingten Hautveränderungen kann bei deutlichen Veränderungen helfen.
  cultural-positivity:
    body: |-
      Studien mit Latinas und Frauen mexikanischer Herkunft zeigen, dass viele eine positivere Einstellung zu den Wechseljahren haben als weiße westliche Frauen — sie sehen sie als natürlichen Übergang statt als Erkrankung. Diese kulturelle Sicht hat echten Wert und geht in Studien mit weniger Leidensdruck durch die Beschwerden einher.

      Du kannst diese positive kulturelle Sicht behalten und deine Beschwerden trotzdem ernst nehmen. Beides stimmt. Der Übergang ist natürlich, und er kann auch schwer sein — und du verdienst Unterstützung bei den schweren Seiten.
  familismo-and-stress:
    body: |-
      Der kulturelle Wert des Familismo — tiefe familiäre Verbundenheit und Verantwortung — bedeutet, dass viele Latinas in den Jahren der Wechseljahre im Mittelpunkt des emotionalen und praktischen Lebens ihrer Großfamilie stehen. Das ist ein Geschenk und zugleich eine erhebliche Stressquelle.

      Auch kleine Zeitfenster nur für dich zu finden — ein Spaziergang, ein ruhiger Moment — ist keine Ablehnung deiner Familie. Es ist das, was dir ermöglicht, weiter für sie da zu sein.
byTitle:
  Mood changes and skin changes are especially common for Latina women:
    title: Stimmungs- und Hautveränderungen sind bei Latinas besonders häufig
    body: |-
      Studien zeigen immer wieder, dass hispanische und lateinamerikanische Frauen in den Wechseljahren häufiger als andere Gruppen von Stimmungsveränderungen und emotionalen Schwankungen berichten — 55 % gegenüber 49 % der weißen Frauen. Auch Haut- und Haarveränderungen sind stärker ausgeprägt.

      Das ist weder eingebildet noch übertrieben — es spiegelt echte hormonelle Muster wider. Wenn du sie im Gespräch mit deiner Ärztin oder deinem Arzt klar benennst, bekommst du eher die Unterstützung, die du brauchst, statt dass deine Stimmungsbeschwerden abgetan oder fälschlich nur als Angst oder Depression diagnostiziert werden.
