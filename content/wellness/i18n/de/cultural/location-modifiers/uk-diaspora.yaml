# Übersetzung von cultural/location-modifiers/uk-diaspora.yaml — maßgeblich ist die englische Fassung.
byTitle:
  Vitamin D in the UK — this is not optional:
    title: Vitamin D im Vereinigten Königreich — keine Option, sondern ein Muss
    body: |-
      Ganz gleich, woher du kommst: Wer im Vereinigten Königreich lebt, hat ein anderes Verhältnis zum Sonnenlicht. Auf britischer Breite gibt es nennenswerte UV-Strahlung (genug, damit die Haut Vitamin D bildet) nur etwa von April bis September, und selbst dann braucht es viel Zeit ungeschützt in der Sonne.

      Bei Frauen mit dunklerer Haut — afrikanischer, südasiatischer, ostasiatischer oder nahöstlicher Herkunft — braucht das Melanin weit mehr UV-Strahlung, um dieselbe Menge Vitamin D zu bilden. Deshalb ist Vitamin-D-Mangel bei Women of Color im Vereinigten Königreich extrem häufig, und er wird in den Wechseljahren klinisch bedeutsamer, wenn seine Rolle für Knochen, Stimmung, Gelenke und Erschöpfung wichtiger wird.

      Der NHS empfiehlt allen Erwachsenen im Vereinigten Königreich täglich 10 Mikrogramm (400 IE) als Ergänzung, besonders im Herbst und Winter. Frauen mit dunklerer Haut brauchen womöglich mehr — der richtige Ausgangspunkt ist aber ein Test.

      Bitte deine Hausarztpraxis um einen Vitamin-D-Bluttest. Viele britische Hausärztinnen und Hausärzte machen ihn, wenn du direkt danach fragst.
  Getting what you need from the NHS:
    title: So bekommst du vom NHS, was du brauchst
    body: |-
      Der NHS bietet Versorgung in den Wechseljahren — doch Studien zeigen immer wieder, dass Frauen aus ethnischen Minderheiten seltener eine Diagnose, Behandlung oder Überweisung bei Wechseljahresbeschwerden angeboten bekommen. Das ist eine belegte Ungleichheit im Gesundheitswesen, kein persönliches Versagen.

      Praktische Schritte:
      - Führe vor dem Termin ein Symptomtagebuch (Häufigkeit, Stärke, Auswirkung auf Arbeit, Schlaf, Beziehungen)
      - Formuliere konkret: „Ich glaube, ich bin in der Perimenopause oder Menopause“
      - Frag direkt: „Welche Möglichkeiten habe ich, diese Beschwerden zu behandeln?“
      - Wenn man dich abwimmelt, kannst du eine Zweitmeinung oder eine Überweisung in eine Menopause-Sprechstunde verlangen
      - Viele Regionen haben NHS-Menopause-Sprechstunden — bitte deine Hausarztpraxis um eine Überweisung

      Du hast Anspruch auf diese Versorgung. Aunty Mel hilft dir, dich auf diese Gespräche vorzubereiten.
  Finding traditional foods in the UK:
    title: Traditionelle Lebensmittel im Vereinigten Königreich finden
    body: |-
      Viele traditionelle Lebensmittel deiner Kultur gibt es im Vereinigten Königreich — oft leichter, als du denkst. Afrikanische Läden, asiatische Lebensmittelgeschäfte, karibische Märkte und Online-Händler machen traditionelle Zutaten in den meisten britischen Städten und zunehmend auch in kleineren Orten zugänglich.

      Einige besonders nützlich für die Wechseljahre:
      - Egusi, Ede (Taro), frisches Ugu (Kürbisblätter), getrocknete Flusskrebse: große britische Städte, online (Buy African Foods, Afro Market usw.)
      - Frische oder tiefgekühlte Kochbananen: die meisten großen Supermärkte sowie karibische und afrikanische Läden
      - Baobabpulver: Holland & Barrett, Reformhäuser, online
      - Getrocknetes Methi, Atta, Dal-Sorten: asiatische Lebensmittelgeschäfte in den meisten britischen Orten
      - Tofu, Miso, Edamame: alle großen britischen Supermärkte
      - Moringapulver: Reformhäuser, online

      Deine traditionellen Lebensmittel zu essen, ist weder umständlich noch rückständig — es ist kulturell klug und in vielen Fällen ernährungsphysiologisch besser als westliches Fertigessen.
  Mental health support in the UK — and why it matters here:
    title: Psychische Unterstützung im Vereinigten Königreich — und warum sie hier wichtig ist
    body: |-
      Stimmungsschwankungen, Angst und Gehirnnebel in den Wechseljahren sind häufig und klinisch belegt. Im Vereinigten Königreich sind sie oft das erste und deutlichste Zeichen der Wechseljahre — und werden häufig als Depression oder Angststörung fehldiagnostiziert, statt als Wechseljahresbeschwerden erkannt zu werden.

      Wenn dir Antidepressiva für Beschwerden verschrieben wurden, die etwa im Perimenopause-Alter begonnen haben, lohnt sich die Frage, ob an die Wechseljahre gedacht wurde. Manche Ärztinnen und Ärzte besprechen bei Stimmungsbeschwerden, die mit den hormonellen Veränderungen begonnen haben, eine Wechseljahresbehandlung zusätzlich zu oder anstelle von Antidepressiva.

      Britische Anlaufstellen für psychische Gesundheit rund um die Wechseljahre:
      - Deine Hausarztpraxis (frag gezielt nach wechseljahresbedingten Stimmungsveränderungen)
      - Die Spezialistensuche der British Menopause Society (bms.thebms.org.uk)
      - Menopause Support UK (menopausesupport.co.uk)
      - Rethink Mental Illness (rethink.org) — kultursensible Unterstützung bei psychischer Gesundheit
