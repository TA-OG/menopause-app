# Übersetzung von cultural/south-asian.yaml — maßgeblich ist die englische Fassung.
items:
  dal-lentils-phytoestrogens:
    body: |-
      Dal — ob Masoor, Moong, Chana oder Toor — gehört zu den besten Lebensmitteln, die du in den Wechseljahren essen kannst. Linsen und Hülsenfrüchte sind reich an Phytoöstrogenen (pflanzlichen Östrogenen) und pflanzlichem Eiweiß. Studien zeigen, dass Frauen, deren Ernährung von Natur aus viele Phytoöstrogene enthält — wie in der süd- und ostasiatischen Küche üblich —, seltener und weniger starke Hitzewallungen haben.

      Wenn Dal bei dir zu Hause schon täglich auf den Tisch kommt, ist das ein deutlicher Ernährungsvorteil. Bleib dabei.
  turmeric-inflammation:
    body: |-
      Kurkuma (Haldi), täglich beim Kochen verwendet, wirkt tatsächlich entzündungshemmend. Curcumin — der Wirkstoff — wurde bei Gelenkschmerzen, für die Gehirngesundheit und die Stimmung untersucht. Die beim Kochen verwendeten Mengen sind nützlich, aber bescheiden. Wenn Gelenkschmerzen eine Hauptbeschwerde sind, lohnt es sich, täglich mit Kurkuma zu kochen und schwarzen Pfeffer dazuzugeben (der die Aufnahme deutlich erhöht).
  ghee-fats-balance:
    body: |-
      Ghee ist ein kulturell bedeutsames Kochfett und in Maßen unproblematisch. In den Wechseljahren ist eher die Gesamtmenge gesättigter Fette das Problem, besonders zusammen mit vielen raffinierten Kohlenhydraten. Der Östrogenrückgang verändert, wie Fett gespeichert wird — vor allem am Bauch.

      Gleiche das Kochen mit Ghee mit fettem Fisch, Nüssen und Samen (Til/Sesam, Leinsamen) aus, um das hormonelle Umfeld zu unterstützen. Leinsamen sind besonders reich an Lignanen — einer Form von Phytoöstrogenen — und können gemahlen in Roti-Teig oder Porridge gegeben werden.
  refined-carbs-blood-sugar:
    body: |-
      Weißer Reis und Lebensmittel aus Maida (weißes Roti, Paratha, Naan) können Blutzuckerspitzen auslösen, die Hitzewallungen, Stimmungsschwankungen und Erschöpfung verstärken. Es geht nicht darum, traditionelle Speisen zu streichen — es geht um Balance.

      Einen Teil des weißen Reises durch Natur- oder roten Reis zu ersetzen, Vollkorn-Atta zu verwenden und Kohlenhydrate immer mit Dal, Gemüse oder Eiweiß zu kombinieren, bremst den Blutzuckeranstieg deutlich. Früher am Abend zu essen, hilft in den Wechseljahren außerdem beim Schlaf und beim Gewicht.
  chai-caffeine:
    body: |-
      Mehrmals am Tag starker Chai gehört für viele südasiatische Frauen zum Leben — und das soziale Ritual drumherum zählt. Koffein kann in den Wechseljahren Hitzewallungen verstärken und den Schlaf stören, besonders Tassen am Nachmittag und Abend.

      Tausch ein oder zwei Chais am Tag gegen Kräutertee — Ingwer-Kardamom-Tee wärmt ähnlich, oder Tulsi-Tee (Heiliges Basilikum) mit adaptogenen Eigenschaften, der die Stressreaktion unterstützt. Der Morgen-Chai darf bleiben.
  fenugreek-methi:
    body: |-
      Methi (Bockshornklee) — als Gewürz und in der Küche verwendet — enthält Phytoöstrogene und wird in der ayurvedischen Praxis seit Jahrhunderten für die Frauengesundheit genutzt. Es gibt erste Belege für eine Rolle bei Hitzewallungen und der Blutzuckerregulation. Methisamen beim Kochen zu verwenden oder Wasser mit eingeweichten Methisamen zu trinken (eine traditionelle Praxis), kann eine sanfte tägliche Ergänzung sein.
  joint-pain-movement:
    body: |-
      Gelenk- und Muskelschmerzen sind bei süd- und ostasiatischen Frauen das am häufigsten genannte Wechseljahressymptom — noch vor Hitzewallungen. Das ist wichtig, weil sie fälschlich als Arthrose gedeutet oder abgetan werden können.

      Sanfte tägliche Bewegung — Yoga, Gehen, Schwimmen — ist die am besten belegte Maßnahme gegen wechseljahresbedingte Gelenkschmerzen. Wenn du mit Yoga als kultureller Praxis aufgewachsen bist, ist das eine wertvolle Brücke zwischen Herkunft und evidenzbasiertem Wohlbefinden.
  vitamin-d-south-asian-uk:
    body: |-
      Südasiatische Frauen im Vereinigten Königreich haben mit die höchsten Raten an Vitamin-D-Mangel — wegen der Ernährung und weil das Melanin in dunklerer Haut mehr Sonne braucht, um dieselbe Menge Vitamin D zu bilden. Britische Winter bieten bei keinem Hautton nennenswerte UV-Strahlung.

      Vitamin-D-Mangel verschlechtert Gelenkschmerzen, Erschöpfung, Gehirnnebel und Stimmung direkt — alles Beschwerden, die in der Perimenopause ohnehin verstärkt sind. Das lässt sich einfach und wirkungsvoll testen und beheben.
  cultural-silence:
    body: |-
      In vielen südasiatischen Gemeinschaften wird über die Wechseljahre nicht gesprochen. Sie werden nur angedeutet, heruntergespielt oder mit Scham über das Älterwerden oder das Ende der Weiblichkeit verbunden. Frauen haben womöglich das Gefühl, dass von ihnen erwartet wird, einfach weiterzumachen.

      Du darfst benennen, was du durchmachst. Du darfst es ernst nehmen. Das Schweigen über die Wechseljahre in deiner Gemeinschaft heißt nicht, dass man diese Erfahrung allein durchstehen muss — es heißt, dass dieses Gespräch nie erlaubt wurde. Das hier ist diese Erlaubnis.
  family-expectation-stress:
    body: |-
      Viele südasiatische Frauen in der Perimenopause kümmern sich gleichzeitig um andere — ältere Eltern, Kinder, die Großfamilie — und tragen zusätzlich die emotionale Arbeit im Haushalt. Dieser sich aufschichtende Stress verstärkt die Wechseljahresbeschwerden direkt.

      Einen Bereich zu finden, in dem du dich entlasten kannst, und offen mit deiner Familie über das zu sprechen, was du erlebst, ist kein Verrat an deiner Kultur — es ist Selbstfürsorge. Aunty Mel kann dir helfen, die Worte für diese Gespräche zu finden.
  calcium-bone-health:
    body: |-
      Südasiatische Frauen haben ein höheres Osteoporoserisiko als weiße britische Frauen, verstärkt durch Vitamin-D-Mangel und eine frühere Menopause. Knochendichte wird in der Jugend aufgebaut und in der Lebensmitte erhalten — der Östrogenrückgang in den Wechseljahren beschleunigt den Knochenabbau.

      Milchprodukte (Dahi, Paneer, Milch) gehören in vielen südasiatischen Haushalten schon zur Ernährung und sind eine hervorragende Kalziumquelle. Wenn du wenig Milchprodukte isst, sind Sesam (Til), Mandeln und angereicherte Pflanzendrinks gute Alternativen. Belastende Bewegung (Gehen, Krafttraining) ist für die Knochen genauso wichtig wie die Ernährung.
      HINWEIS: Sprich mit deiner Ärztin oder deinem Arzt über eine Ergänzung von Kalzium und Vitamin D, besonders wenn du Nierenprobleme hast.
byTitle:
  Your timeline may be earlier than you expect:
    title: Dein Zeitverlauf beginnt vielleicht früher, als du denkst
    body: |-
      Studien zeigen, dass Frauen südasiatischer Herkunft — besonders mit indischem, pakistanischem und bangladeschischem Hintergrund — die Menopause meist mit 46 bis 47 Jahren erreichen, manchmal früher. Das sind 3–4 Jahre vor dem britischen Durchschnitt.

      Die Perimenopause kann Ende 30 bis Anfang 40 beginnen. Wenn du Beschwerden hast und deine Ärztin oder dein Arzt meint, du seist zu jung, lohnt es sich, diese Forschung anzusprechen. Eine frühere Menopause ist kein Versagen — aber sie bedeutet, dass frühes Bewusstsein wichtig ist.
