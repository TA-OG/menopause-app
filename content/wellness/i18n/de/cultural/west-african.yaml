# Übersetzung von cultural/west-african.yaml — maßgeblich ist die englische Fassung.
items:
  egusi-pumpkin-seeds:
    body: |-
      Egusi (Melonenkerne) sind sehr nährstoffreich — reich an gesunden Fetten, Eiweiß und Zink. Zink ist für die Testosteronbildung (die in den Wechseljahren Energie und Libido beeinflusst) und für das Immunsystem unverzichtbar. Egusi-Suppe ist ein wirklich nahrhaftes Gericht, das gern weiter auf dem Speiseplan stehen darf.
  moringa-traditional-remedy:
    body: |-
      Moringa (Moringa oleifera) wird seit Generationen in der traditionellen Medizin Westafrikas und anderer Teile Afrikas verwendet. Sie ist reich an Kalzium, Eisen, Vitamin C und Antioxidantien. Neue Forschung stützt ihren Einsatz für Energie, gegen Entzündungen und zur Blutzuckerregulation. Moringapulver in Smoothies oder Suppen ist eine praktische Art, sie einzubauen.
  hibiscus-zobo-blood-pressure:
    body: |-
      Zobo (Hibiskusgetränk) wird in Westafrika viel getrunken und hat echte Belege dafür, dass es einen gesunden Blutdruck unterstützt und Antioxidantien liefert. Der Blutdruck wird in den Wechseljahren wichtiger, weil die schützende Wirkung des Östrogens auf Herz und Gefäße nachlässt.

      Die traditionelle, sehr süße Zubereitung schmälert einen Teil des Nutzens. Versuch es mit weniger Süße und zusätzlich Ingwer, der ebenfalls entzündungshemmend wirkt.
  palm-oil-fats:
    body: |-
      Rotes Palmöl ist ein kulturelles Grundnahrungsmittel und hat ein anderes Nährstoffprofil als verarbeitete Pflanzenöle — es enthält Beta-Carotin und Vitamin E. In Maßen ist es Teil einer ausgewogenen Ernährung. Entscheidend in den Wechseljahren ist das Gleichgewicht der Fette insgesamt — achte darauf, dass auch fetter Fisch, Avocado und Nüsse regelmäßig auf den Tisch kommen, um Gehirn und Hormonbildung zu unterstützen.
  beans-black-eyed-peas:
    body: |-
      Bohnen — Augenbohnen, braune Bohnen, Kidneybohnen — stehen im Mittelpunkt der westafrikanischen Küche und tun dir in den Wechseljahren wirklich gut. Sie sind reich an pflanzlichem Eiweiß und Ballaststoffen; regelmäßig gegessene Bohnengerichte liefern daher anhaltende Energie und unterstützen einen stabilen Blutzucker — wichtig für Energie, Stimmung und Gewicht.

      Ein ehrlicher Hinweis, weil du vielleicht anderes gelesen hast: Die Belege, dass Phytoöstrogene Hitzewallungen lindern, stammen aus Studien speziell zu Soja, und Soja ist eine weit reichere Isoflavonquelle als andere Bohnen. Bohnen lohnen sich wegen Eiweiß und Ballaststoffen sehr. Wenn es dir aber um Hitzewallungen geht, sind Sojaprodukte gemeint — Edamame, Tofu, Tempeh — und nicht Bohnen allgemein.
  spicy-food-triggers:
    body: |-
      Pepper Soup, Suya und andere scharfe Gerichte sind tief kulturell verwurzelt und köstlich. Scharfes Essen kann bei manchen Frauen in den Wechseljahren Hitzewallungen auslösen — nicht bei allen und nicht immer. Achte darauf, ob dir ein Zusammenhang zwischen scharfem Essen und einer Hitzewallung innerhalb von 30–60 Minuten auffällt.

      Wenn sich ein Muster zeigt, heißt das nicht, ganz auf Schärfe zu verzichten — nur auf Zeitpunkt und Menge zu achten, besonders am Abend.
  stress-and-allostatic-load:
    body: |-
      Studien belegen, dass Frauen afrikanischer Herkunft eine höhere allostatische Last tragen — die angesammelte körperliche Belastung durch chronischen Stress. Das ist kein persönliches Versagen; es spiegelt die strukturelle Realität wider, gleichzeitig mit Rassismus, wirtschaftlichem Druck und Pflegeaufgaben umgehen zu müssen.

      Dieser Hintergrundstress kann beeinflussen, wie Wechseljahresbeschwerden erlebt werden — ob er sie direkt verschlimmert, ist in der Forschung noch eine offene Frage und nicht gesichert. Es anzuerkennen — vor dir selbst und gegenüber deiner Ärztin oder deinem Arzt — lohnt sich trotzdem. Wenn sich deine Beschwerden stärker anfühlen, liegt das nicht daran, dass du schwächer bist.
  community-wisdom:
    body: |-
      In vielen afrikanischen Kulturen waren die Wechseljahre lange eine gemeinschaftliche Erfahrung — ältere Frauen hüteten das Wissen und gaben es an die Nachfolgenden weiter. Auf dieser Weitergabe von Weisheit zwischen den Generationen ist Aunty Mel aufgebaut. Du gehst diesen Weg nicht allein, und das Wissen ist nie verloren gegangen — es braucht nur ein modernes Zuhause.
  taboo-and-speaking-up:
    body: |-
      In manchen westafrikanischen Gemeinschaften und Familien wird über die Wechseljahre nicht gesprochen. Sie können ein Tabu sein, als Privatsache gelten oder auf eine stigmatisierende Weise mit dem Älterwerden verbunden werden. Von Frauen wird womöglich erwartet, still damit umzugehen.

      Du darfst benennen, was du erlebst. Deine Beschwerden festzuhalten, deinen Körper zu verstehen und dir Unterstützung zu holen, ist kein Verrat an deiner Kultur — es ist die modernste Form der Weisheit, die deine Großmütter getragen haben.
  vitamin-d-africa-to-uk:
    body: |-
      Wenn du in Westafrika aufgewachsen und ins Vereinigte Königreich gezogen bist, ist dein Körper von reichlich äquatorialem Sonnenlicht in eines der grauesten Klimas Europas gewechselt. Vitamin-D-Mangel ist bei westafrikanischen Frauen im Vereinigten Königreich sehr verbreitet und verschlechtert Erschöpfung, Knochengesundheit, Stimmung und Gelenkschmerzen direkt.

      Das lässt sich einfach und wirkungsvoll angehen — ein Bluttest über deine Hausarztpraxis zeigt deinen Spiegel. Die meisten Empfehlungen raten Frauen mit dunklerer Haut im Vereinigten Königreich zu 1000–2000 IE täglich.
      HINWEIS: Sprich immer mit deiner Ärztin oder deinem Arzt, bevor du mehr als die NHS-Standarddosis von 400 IE einnimmst. Ein vorheriger Test wird empfohlen.
byTitle:
  Your timeline and your symptoms may differ from what you've read:
    title: Dein Zeitverlauf und deine Beschwerden können sich von dem unterscheiden, was du gelesen hast
    body: |-
      Die meisten Studien zu den Wechseljahren wurden mit weißen, westlichen Frauen aus der Mittelschicht durchgeführt. Die Beschwerden, Zeitverläufe und Erfahrungen, die in gängigen Gesundheitsinformationen beschrieben werden, spiegeln deine womöglich nicht ganz wider.

      Frauen afrikanischer Herkunft kommen früher in die Menopause und haben stärkere und länger anhaltende Beschwerden. Wenn du Anfang bis Mitte 40 Beschwerden hast, nimm sie ernst — du bist nicht zu jung.

      Gut zu wissen, woher das stammt: Die zugrunde liegenden Studien sind größtenteils amerikanisch und beschreiben Durchschnittswerte, nicht deinen persönlichen Verlauf.
