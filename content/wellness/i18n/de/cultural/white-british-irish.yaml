# Übersetzung von cultural/white-british-irish.yaml — maßgeblich ist die englische Fassung.
items:
  fish-chips-acv:
    body: |-
      Fish and Chips mit Essig — ein Klassiker. Der Fisch selbst (Kabeljau, Schellfisch, Scholle) ist eine wirklich gute Quelle für mageres Eiweiß und etwas Omega-3. Schwierig in den Wechseljahren sind Panade und Pommes — Frittiertes und raffinierte Kohlenhydrate können Blähungen, Hitzewallungen und Blutzuckerschwankungen verstärken.

      Ein praktischer Ansatz: Fisch aus dem Ofen oder vom Grill mit einer kleineren Portion Pommes, dafür öfter, statt seltener eine volle Portion. Apfelessig (der Malzessig auf den Pommes oder als tägliches, mit Wasser verdünntes Getränk) hat einige Belege für die Blutzuckerregulation, auch wenn sie bescheiden sind.
  tea-caffeine-timing:
    body: |-
      Die britische Teekultur ist real, und ihr Ritual zählt. Tee enthält weniger Koffein als Kaffee, aber genug, um den Schlaf zu beeinträchtigen und womöglich zu Hitzewallungen beizutragen, wenn man ihn über den ganzen Tag in größeren Mengen trinkt.

      Ein praktischer Ansatz: Genieß Tee am Morgen und frühen Nachmittag ohne Bedenken. Sei ab dem späten Nachmittag achtsam. Tausch ein oder zwei Tassen am Tag gegen Kräutertee — Pfefferminze (auch leicht kühlend), Kamille (unterstützt den Schlaf) oder Rooibos (koffeinfrei, mit demselben Ritual).
  sunday-roast-adapted:
    body: |-
      Der Sonntagsbraten ist ausgewogen — mageres Fleisch oder vegetarische Alternativen, Gemüse und Eiweiß. Was in den Wechseljahren dagegen arbeitet: große Mengen Bratensoße mit raffiniertem Mehl, Füllung aus Weißbrot und zu viel Salz. Das Gemüse, besonders grünes Blattgemüse und Kreuzblütler (Brokkoli, Blumenkohl, Rosenkohl), ist hervorragend.

      Die gemüsereichere Variante des Bratens — mehr Grünes, kleinere Kohlenhydratportionen — ist eine realistische Anpassung, die das traditionelle Essen bewahrt.
  alcohol-culture:
    body: |-
      Alkohol ist tief in der britischen Geselligkeit verankert, und ein Glas Wein oder ein Pint am Abend ist für viele Frauen normal. Alkohol verstärkt Hitzewallungen, stört die Schlafarchitektur (schon in moderaten Mengen) und beeinträchtigt die Stimmung am nächsten Tag — alles Beschwerden, die in den Wechseljahren ohnehin verstärkt sind.

      Das heißt nicht, auf geselliges Trinken zu verzichten. Es heißt, ehrlich mit dir selbst über den Zusammenhang zwischen einem Glas Wein und der Qualität deiner Nacht zu sein. Alkoholfreie Alternativen sind enorm besser geworden — an Abenden, an denen Schlaf wirklich zählt, lohnt sich ein Versuch.
  processed-food-convenience:
    body: |-
      Fertiggerichte, Sandwiches und Convenience-Food gehören realistisch zum vollen Alltag im Vereinigten Königreich. Das Problem in den Wechseljahren: Viele dieser Optionen enthalten viel Salz und raffinierte Kohlenhydrate und wenig Ballaststoffe — alles, was die Beschwerden verstärkt.

      Statt die ganze Ernährung umzukrempeln, konzentrier dich auf ein, zwei wirkungsvolle Änderungen: eine Handvoll Samen oder Nüsse zu dem geben, was du isst, Hummus und Gemüsesticks zum Knabbern bereithalten und, wo möglich, Vollkornvarianten wählen. Kleine, beständige Änderungen bringen mehr als drastische, kurzfristige Umstellungen.
  stoicism-british-culture:
    body: |-
      Der britische Umgang mit Gesundheit ist oft stilles Durchhalten — nicht klagen, kein Aufhebens machen, einfach weitermachen. Viele Frauen berichten, dass sie jahrelang unter starken Wechseljahresbeschwerden gelitten haben, bevor sie Hilfe gesucht haben, oder dass sie in der Hausarztpraxis abgewimmelt wurden.

      Deine Beschwerden verdienen es, ernst genommen zu werden. Ein Tagebuch zu führen und deiner Ärztin oder deinem Arzt genau zu sagen, wie sie deinen Alltag beeinträchtigen — Arbeit, Schlaf, Beziehungen — ist kein Aufhebens. Es ist das Einfordern einer Versorgung, auf die du Anspruch hast.
