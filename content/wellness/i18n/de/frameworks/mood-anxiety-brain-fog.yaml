# Übersetzung von frameworks/mood-anxiety-brain-fog.yaml — maßgeblich ist die englische Fassung.
df_omega3_brain:
  title: Omega-3-Fettsäuren für Gehirn und Stimmung
  body: >-
    DHA (eine Omega-3-Fettsäure) ist für die Funktion der Zellmembranen im Gehirn und die Serotonin-Signalübertragung unverzichtbar. Sinkendes Östrogen verringert, wie effizient das Gehirn Omega-3 nutzt. Iss 2–3-mal pro Woche fetten Fisch (Lachs, Sardinen, Makrele) oder nimm täglich 1000 mg EPA+DHA als Ergänzung, wenn du keinen Fisch isst. Gemahlene Leinsamen und Walnüsse liefern ALA (eine pflanzliche Vorstufe von Omega-3).
df_fermented_foods:
  title: Darmgesundheit und der Zusammenhang mit der Stimmung
  body: >-
    Die Darm-Hirn-Achse ist gut belegt, wird aber oft ungenau beschrieben. Etwa 90 % des Serotonins im Körper entstehen im Darm — allerdings in deinen eigenen enterochromaffinen Zellen, nicht durch Darmbakterien, und dieses Serotonin gelangt nicht ins Gehirn. Darmbakterien beeinflussen vielmehr, wie viel davon gebildet wird, und kommunizieren auf anderen Wegen mit dem Gehirn. Die meisten dieser Erkenntnisse stammen allerdings aus Mechanismus- oder Tierstudien — Studien am Menschen zu fermentierten Lebensmitteln und Stimmung sind noch begrenzt, betrachte den Nutzen für die Stimmung also als wirklich unsicher. Für die allgemeine Darmgesundheit lohnen sich fermentierte Lebensmittel trotzdem: Joghurt mit lebenden Kulturen, Kefir, Kimchi, Sauerkraut, Miso. Setz auf Abwechslung über die Woche statt auf große Mengen von einer Sache.
df_protein_neurotransmitters:
  title: Eiweiß zu jeder Mahlzeit — Aminosäuren bilden deine Stimmungsbotenstoffe
  body: >-
    Serotonin, Dopamin und GABA werden aus Aminosäuren gebildet, die aus Nahrungseiweiß stammen. Mahlzeiten auszulassen oder eiweißarme Snacks zu essen, kann die Bausteine aufbrauchen, die dein Gehirn braucht. Ziel sind 20–30 g Eiweiß zum Frühstück (Eier, griechischer Joghurt, Räucherlachs) — das legt die Grundlage für die Bildung deiner Botenstoffe über den Tag.
lf_exercise_mood:
  title: Bewegung ist die am besten belegte Maßnahme für die Stimmung, die es gibt
  body: >-
    30 Minuten moderates Ausdauertraining (zügiges Gehen, Radfahren, Schwimmen) 3–5-mal pro Woche erhöhen BDNF (den vom Gehirn gebildeten neurotrophen Faktor) — das körpereigene Wachstums- und Reparaturprotein des Gehirns. Bewegung steigert außerdem Endorphine, senkt Cortisol und wirkt Angst und gedrückter Stimmung in der Perimenopause direkt entgegen. Die Wirkung setzt schon in der ersten Einheit ein und verstärkt sich über Wochen. Wenn du nichts anderes von dieser Liste machst — mach das.
lf_stress_boundary:
  title: Finde eine Sache, die du aufhören kannst
  body: >-
    Die Perimenopause fällt oft mit dem größten beruflichen Druck und familiären Pflegeaufgaben zusammen. Frauen, die sich als „überfordert“ beschreiben, berichten häufig, dass sich ihre Stimmung und ihr Gehirnnebel deutlich bessern, wenn sie eine regelmäßige Verpflichtung reduzieren — nicht, wenn sie weitere Erholungsstrategien hinzufügen. Geh deine Woche durch und finde eine Sache, die du streichen, abgeben oder seltener machen kannst.
lf_brain_fog_tactics:
  title: Praktische Strategien gegen Gehirnnebel bei der Arbeit
  body: >-
    Gehirnnebel ist real — Östrogen reguliert den präfrontalen Kortex. Praktische Anpassungen: Schreib Dinge sofort auf, statt sie im Kopf behalten zu wollen; nutze Kalendererinnerungen für Dinge, die du dir sonst merken würdest; blocke Konzentrationszeit am Morgen, wenn die geistige Leistungsfähigkeit meist am höchsten ist; mach alle 90 Minuten kurze Bewegungspausen, um die Konzentration neu zu starten. Das sind keine Niederlagen — das sind Anpassungen.
mr_physiology_not_personality:
  title: Das ist Physiologie, keine Persönlichkeitsveränderung
  body: |-
    Die emotionalen Veränderungen in den Wechseljahren sind keine Persönlichkeitsveränderung und kein Zeichen, dass mit dir etwas nicht stimmt — sie sind Physiologie. Östrogen steht in direkter Beziehung zu Serotonin und Dopamin; wenn es sinkt, sinken Stimmung, Antrieb und Widerstandskraft mit. Das ist keine Schwäche. Es ist nicht „nur Stress“. Es ist Chemie. Aber Stimmung hängt selten nur vom Östrogen ab — sie ist auch mit mehreren anderen Systemen verwoben, und es lohnt sich, das ganze Bild zu verstehen, statt anzunehmen, „es sind halt die Hormone“ oder „es liegt an mir“.
    Schlaf und Energie: Schlechter Schlaf — in den Wechseljahren so häufig wegen Nachtschweiß, rasender Gedanken oder eines Nervensystems, das müde und zugleich aufgedreht ist — macht nicht nur erschöpft, er senkt direkt deine Fähigkeit, Gefühle zu regulieren. Eine kurze Nacht macht den Bedrohungsmelder des Gehirns empfindlicher und dämpft den Teil des Gehirns, der beruhigt. Wenig Energie verstärkt das — wenn der Tank leer ist, bleibt einfach weniger für Geduld oder Abstand. Stimmung, Schlaf und Energie verstärken sich gegenseitig, im Guten wie im Schlechten.
    Hormonelles Ungleichgewicht und Wut: Viele Frauen kennen „die Wut“ aus der Perimenopause. Die unregelmäßigen, oft starken Schwankungen von Östrogen und Progesteron in dieser Phase können dazu beitragen — das ist kein Charakterfehler und auch nicht einfach „Einbildung“. Ehrlicherweise muss man aber sagen: Der genaue Mechanismus ist wissenschaftlich nicht geklärt, und Vorstellungen, die du vielleicht gelesen hast — ein bestimmtes „Verhältnisproblem“ zwischen Progesteron und Östrogen, ein „schlechter Östrogenabbau“ oder Xenoöstrogene aus der Umwelt als Ursache — gelten in gängigen Leitlinien zur Menopause nicht als belegte Ursachen. Betrachte sie als Theorien, nicht als Erklärungen. Wenn Wut oder Reizbarkeit anhalten, lohnt sich ein Blick auf das größere Bild, auch auf Dauerstress, und ein Gespräch mit deiner Hausärztin oder deinem Hausarzt.
mr_mood_hidden_drivers:
  title: Was sonst noch dahinterstecken kann — jenseits der Hormone
  body: |-
    Nährstoffversorgung: Ein Mangel an B12 und Folat kann gedrückte Stimmung, Gehirnnebel, Erschöpfung und Reizbarkeit nachahmen oder verstärken — ein Mangel ist häufig, besonders mit zunehmendem Alter, bei bestimmten Medikamenten oder wenig tierischem Eiweiß und grünem Blattgemüse. Das ist etwas Einfaches, gut Behebbares, das viel zu oft übersehen wird.
    Schilddrüsengesundheit: Gerade eine Schilddrüsenunterfunktion kann genau wie „Wechseljahres-Gehirn und -Stimmung“ aussehen — gedrückte Stimmung, Erschöpfung, Gehirnnebel, Gewichtszunahme, sich leer fühlen. Sie wird oft übersehen, weil der Standardtest nur mit TSH nicht das ganze Bild zeigt und die Beschwerden als „nur die Wechseljahre“ abgetan werden, obwohl die Schilddrüsenfunktion gar nicht richtig geprüft wurde.
    Blutzucker: Prädiabetes und Diabetes wirken sich direkt auf die Stimmung aus — Blutzuckerschwankungen können Reizbarkeit, Angst, Gehirnnebel und Energietiefs verursachen, die sich genauso anfühlen wie „hormonelle“ Stimmungsschwankungen, und eine schlechte Regulation verschlechtert zudem den Schlaf und verstärkt Entzündungen.
    Die weitreichende Wirkung von Histamin: Seine Effekte gehen weit über Juckreiz, Migräne und Hautrötung hinaus — es kann auch zu Blähungen, schlechtem Schlaf, Gehirnnebel und Erschöpfung beitragen. Wenn du in mehreren Bereichen — Stimmung, Schlaf, Energie und Verdauung — Beschwerden ohne offensichtliche einzelne Ursache hast, lohnt es sich, Histamin als echten roten Faden darunter in Betracht zu ziehen.
mr_mood_complex_history:
  title: Wenn du Endometriose, Adenomyose oder Myome in der Vorgeschichte hast
  body: |-
    Endometriose, Adenomyose und Myome sind östrogenempfindliche Erkrankungen, und manche Frauen mit dieser Vorgeschichte erleben die emotionalen Schwankungen der Perimenopause intensiver — die Wut, die Achterbahn, das Gefühl, sich selbst nicht wiederzuerkennen. Das ist nicht als allgemeine Regel für alle Frauen mit dieser Vorgeschichte belegt, und es heißt nicht, dass du „empfindlicher“ oder übertrieben bist, wenn es sich für dich so anfühlt. Es lohnt sich auch auszusprechen, dass viele Frauen mit dieser Vorgeschichte seit Jahren, manchmal Jahrzehnten mit chronischen Schmerzen leben, die vor der Diagnose oft abgetan oder unzureichend behandelt wurden — und Depressionen sind bei ihnen tatsächlich häufiger. Wenn du neben den Veränderungen der Perimenopause eine gedrückte Stimmung bemerkst, ist das nicht unbedingt „nur die Wechseljahre“ obendrauf — es kann das angesammelte Gewicht der Schmerzen sein, und jahrelang nicht geglaubt oder gehört worden zu sein, das jetzt endlich spürbar wird.
    Wenn du neben den Wechseljahren mit Long Covid, chronischem Erschöpfungssyndrom (CFS) oder Fibromyalgie lebst, ist die emotionale Belastung, eine chronische Krankheit und die Wechseljahre gleichzeitig zu bewältigen, real und oft isolierend — es ist schwer auseinanderzuhalten, welche Symptome zu welcher Ursache gehören. Beides kann gleichzeitig wahr sein, und beides verdient Zuwendung, keinen Wettstreit darum, was „das eigentliche Problem“ ist.
mr_mood_reframe:
  title: Wer bin ich jetzt? — das muss keine Krisenfrage sein
  body: |-
    Wie du dir dieses Kapitel selbst erzählst, prägt tatsächlich, wie du es erlebst. „Wer bin ich jetzt?“ kann eine neugierige statt einer panischen Frage sein — ohne so zu tun, als wäre alles in Ordnung, aber mit dem Wissen, dass diese ungewohnte Version von dir dazwischen kein Problem ist, das gelöst werden muss, sondern ein Mensch, den man kennenlernen kann. Viele Frauen kommen hier an mit dem Gefühl, sich selbst verloren zu haben — diese Orientierungslosigkeit ist real und häufig, und oft steckt mehr dahinter als „nur die Hormone“. Genau deshalb verdient es eine gründliche Abklärung, statt es einfach durchzustehen.
    Die Wechseljahre sind kein Problem, das man isoliert löst — sie sind ein Übergang, der Hormone, Schlaf, Nährstoffe, Schilddrüse und Stoffwechselgesundheit gleichzeitig berührt. Ziel ist nicht, „wieder normal zu werden“, sondern zu verstehen, was unter der Stimmung tatsächlich vorgeht, statt nur die Stimmung zu managen. Muster festzuhalten — Schlafqualität, Energietiefs, Stimmungszyklen, Auslöser — gibt dir Informationen, nicht nur Beschwerden zum Aushalten.
mr_mood_gp_red_flags:
  title: Wann du wegen Stimmung oder Angst zur Hausärztin oder zum Hausarzt solltest
  body: |-
    Geh zu deiner Hausärztin oder deinem Hausarzt, wenn: gedrückte Stimmung oder Angst anhalten, schlimmer werden oder deinen Alltag beeinträchtigen; du Gedanken an Selbstverletzung oder Hoffnungslosigkeit hast — immer noch am selben Tag; Wut oder Reizbarkeit dir oder deinem Umfeld unverhältnismäßig oder beängstigend vorkommen; Schlafstörungen stark sind, lange anhalten oder sich durch Veränderungen im Lebensstil nicht bessern; oder Stimmungsveränderungen mit anderen Warnzeichen auftreten — deutliche Gewichtsveränderung, Herzklopfen, starke oder unregelmäßige Blutungen, übermäßiger Durst oder häufiges Wasserlassen.
    Es lohnt sich, einen TSH-Test zu verlangen (die übliche erste Schilddrüsenkontrolle, ergänzt durch weitere Tests, wenn er auffällig ist oder die Beschwerden stark auf die Schilddrüse hindeuten), dazu B12-/Folat-Blutwerte, falls sie noch nicht geprüft wurden, sowie HbA1c oder Nüchternblutzucker, wenn es Diabetes in der Familie, Gewichtsveränderungen oder Blutzuckerbeschwerden neben den Stimmungsveränderungen gibt. Wenn du überlegst, ob HRT, Antidepressiva oder andere Unterstützung helfen könnten — darüber lohnt es sich zu sprechen, statt es allein mit zusammengebissenen Zähnen durchzustehen.
ss_magnesium_anxiety:
  title: Magnesiumglycinat — zur Regulation des Nervensystems und für Ruhe
  body: >-
    Üblich sind 200–400 mg/Tag. Die Glycinat-Form wird hier dem Citrat vorgezogen, da keine abführende Wirkung gewünscht ist.
  disclaimer: >-
    Sprich vor dem Beginn immer mit deiner Hausärztin, deinem Hausarzt oder in der Apotheke, besonders wenn du verschreibungspflichtige Medikamente nimmst oder eine Nieren- oder Herzerkrankung hast.
ss_l_theanine_anxiety:
  title: L-Theanin — Ruhe und Fokus ohne Müdigkeit
  body: >-
    Üblich sind 100–200 mg. Unterstützt Ruhe und Fokus ohne müde zu machen und kann tagsüber gegen Angst eingenommen werden, nicht nur vor dem Schlafengehen.
  disclaimer: >-
    Sprich vor dem Beginn immer mit deiner Hausärztin, deinem Hausarzt oder in der Apotheke, besonders wenn du verschreibungspflichtige Medikamente nimmst.
ss_ashwagandha:
  title: Ashwagandha — für die Stressreaktion des Körpers
  body: >-
    Üblich sind 300–600 mg/Tag eines standardisierten Wurzelextrakts. Gut untersucht zur Unterstützung der Stressreaktion des Körpers und der Cortisolregulation.
  disclaimer: >-
    Vorsicht bei Autoimmunerkrankungen (kann die Immunaktivität anregen), Schilddrüsenerkrankungen (kann die Schilddrüsenhormonwerte beeinflussen) oder in der Schwangerschaft — sprich zuerst mit deiner Hausärztin oder deinem Hausarzt.
ss_saffron_mood:
  title: Safran — für Stimmung und gegen Angst
  body: >-
    Üblich sind 30 mg/Tag eines standardisierten Extrakts. Einige Belege für eine Unterstützung bei Stimmung und Angstsymptomen.
  disclaimer: >-
    Sprich vor dem Beginn immer mit deiner Hausärztin, deinem Hausarzt oder in der Apotheke, besonders wenn du verschreibungspflichtige Medikamente nimmst.
ss_b_complex_mood:
  title: B-Komplex — für Nervensystem und Stressresistenz
  body: >-
    Achte auf Methylcobalamin (B12) und Methylfolat statt der günstigeren synthetischen Formen (Cyanocobalamin, Folsäure). B-Vitamine spielen eine Rolle für die Funktion des Nervensystems und die Stressresistenz — besonders relevant, wenn Ernährung oder Stress deine Speicher geleert haben.
  disclaimer: >-
    Sprich vor dem Beginn immer mit deiner Hausärztin, deinem Hausarzt oder in der Apotheke, besonders wenn du verschreibungspflichtige Medikamente nimmst oder eine Nierenerkrankung hast.
ss_omega3_mood_brainfog:
  title: Omega-3 (EPA/DHA) — bei Gehirnnebel, Angst und für die Stimmung
  body: >-
    Speziell bei Gehirnnebel üblicherweise 2–3 g/Tag EPA/DHA zusammen — das obere Ende des allgemeinen Bereichs, wegen des Fokus auf das Gehirn. Unterstützt die geistige Leistungsfähigkeit und wirkt entzündungshemmend im Gehirn; dazu gibt es Belege für eine Unterstützung der Stimmung und weniger Angstsymptome.
  disclaimer: >-
    Hoch dosiertes Omega-3 kann blutverdünnend wirken. Wenn du Blutverdünner nimmst (Warfarin, Aspirin, Apixaban) oder eine Operation ansteht, sprich vor der Einnahme mit deiner Hausärztin, deinem Hausarzt oder in der Apotheke.
ss_acetyl_l_carnitine_brainfog:
  title: Acetyl-L-Carnitin — für den Energiestoffwechsel des Gehirns
  body: >-
    Üblich sind 1–3 g/Tag. Unterstützt den Energiestoffwechsel des Gehirns und hat einige Belege für geistige Leistungsfähigkeit und Klarheit.
  disclaimer: >-
    Sprich vor dem Beginn immer mit deiner Hausärztin, deinem Hausarzt oder in der Apotheke, besonders wenn du verschreibungspflichtige Medikamente nimmst.
ss_ginkgo_brainfog:
  title: Ginkgo biloba — für Durchblutung und Gedächtnis
  body: >-
    Üblich sind 120–240 mg/Tag. Unterstützt die Durchblutung des Gehirns und hat einige Belege für Gedächtnis und geistige Klarheit.
  disclaimer: >-
    Kann mit blutverdünnenden Medikamenten wechselwirken — vorher ärztlich abklären, besonders wenn du Blutverdünner oder Aspirin nimmst.
ss_phosphatidylserine_brainfog:
  title: Phosphatidylserin — für Gedächtnis und geistige Leistungsfähigkeit
  body: >-
    Üblich sind 150 mg/Tag. Einige Belege für eine Unterstützung von Gedächtnis und geistiger Leistungsfähigkeit.
  disclaimer: >-
    Sprich vor dem Beginn immer mit deiner Hausärztin, deinem Hausarzt oder in der Apotheke, besonders wenn du verschreibungspflichtige Medikamente nimmst.
