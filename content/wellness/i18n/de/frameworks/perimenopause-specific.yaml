# Übersetzung von frameworks/perimenopause-specific.yaml — maßgeblich ist die englische Fassung.
df_peri_blood_sugar:
  title: Ein stabiler Blutzucker ist dein stärkstes Werkzeug in der Perimenopause
  body: >-
    In der Perimenopause schwankt das Östrogen stark — mal sehr hoch, mal sehr niedrig, innerhalb desselben Monats. Diese Schwankungen verschlechtern die Insulinempfindlichkeit und erschweren die Blutzuckerregulation. Vielleicht bemerkst du Stimmungstiefs, Energielöcher am Nachmittag und Heißhunger, den du vorher nicht kanntest. Was hilft: Iss bei jeder Mahlzeit zuerst Eiweiß und Fett, dann Kohlenhydrate, iss Kohlenhydrate nie allein und lass keine Mahlzeiten aus. Ein stabiler Blutzucker sorgt für deutlich stabilere Stimmung und Energie.
df_peri_fibre:
  title: 30 g Ballaststoffe täglich — für den Östrogenstoffwechsel und das Darmmikrobiom
  body: >-
    Überschüssiges Östrogen wird von der Leber abgebaut und über den Darm ausgeschieden. Ein gesundes Darmmikrobiom (das „Estrobolom“) hilft, Östrogen angemessen zu recyceln. Bei ballaststoffarmer Ernährung kann Östrogen aus dem Darm wieder aufgenommen werden, was in der frühen Perimenopause zu Symptomen einer Östrogendominanz beiträgt (starke Periode, Blähungen, empfindliche Brüste). Ziel sind 30 g Ballaststoffe täglich: Vollkorn, Hülsenfrüchte, Gemüse und Obst. Eine vielfältige pflanzenbetonte Ernährung ist der effektivste Weg dorthin.
lf_cycle_tracking:
  title: Verfolge deinen Zyklus — Muster zeigen dein hormonelles Bild
  body: >-
    Die Perimenopause zeichnet sich durch Unregelmäßigkeit aus, aber wenn du deine Zyklen festhältst, zeigen sich Muster in deinen Symptomen, die zufällig wirken, bis du sie vor dir siehst. Apps wie Clue oder Natural Cycles (oder ein Papiertagebuch) ermöglichen es dir, Symptome, Stimmung, Energie und Schlaf parallel zu deinem Zyklus zu notieren. Innerhalb von 3–4 Monaten erkennen die meisten Frauen vorhersehbare Zeitfenster (meist die Woche vor der Periode oder die Tage um den Eisprung), in denen bestimmte Symptome ihren Höhepunkt erreichen. So wird aus „Ich weiß nie, wie es mir gehen wird“ ein „Ich kann mich auf Dienstag einstellen“.
lf_peri_strength_early:
  title: Fang jetzt mit Krafttraining an — bevor sich der Knochenabbau beschleunigt
  body: >-
    Das wichtigste Zeitfenster, um Knochendichte und Muskelmasse langfristig zu schützen, ist die Perimenopause — vor dem beschleunigten Abbau in den 5 Jahren nach der letzten Periode. Wenn du dir jetzt Krafttraining zur Gewohnheit machst (schon 2-mal pro Woche, 30 Minuten), baust du eine Reserve an Knochendichte und Muskeln auf, die den Übergang abfedert. Frauen, die diese Gewohnheit in der Perimenopause etablieren, kommen deutlich besser mit der Postmenopause zurecht.
mr_peri_mourning:
  title: Trauer ist eine berechtigte Reaktion auf die Perimenopause
  body: >-
    Die Perimenopause fällt oft mit großen Lebensereignissen zusammen — Kinder ziehen aus, Eltern werden älter, der Beruf fordert am meisten, und das Verhältnis zur Fruchtbarkeit verändert sich. Das emotionale Gewicht dieser Phase ist real und wird selten anerkannt. Trauer, Wut oder Verlust in dieser Übergangszeit zu empfinden, ist weder Depression noch Schwäche — es ist eine angemessene Reaktion auf Veränderung. Das Gefühl als Trauer zu benennen, statt dagegen anzukämpfen, ist oft der erste Schritt, um hindurchzugehen.
mr_peri_information_power:
  title: Je besser du die Perimenopause verstehst, desto weniger beängstigend ist sie
  body: >-
    Frauen, die die Perimenopause als besonders schwer erleben, hatten oft die wenigsten Informationen, bevor sie begann. Jedes Symptom, das du erlebst, hat einen Mechanismus — einen hormonellen Grund, nichts Eingebildetes. Die Balance-App und Website von Dr. Louise Newson, die britische Menopause Charity und Bücher wie „Perimenopause Power“ von Maisie Hill sind evidenzbasierte Quellen (auf Englisch). Wissen beseitigt keine Symptome, aber es nimmt dir die Angst, dass mit dir ganz allein etwas nicht stimmt.
ss_magnesium_peri:
  title: Magnesium — bei PMS-ähnlichen Beschwerden, für Stimmung und Schlaf
  body: >-
    In der frühen Perimenopause sinkt zuerst das Progesteron — noch vor dem Östrogen — und verursacht PMS-ähnliche Beschwerden: Reizbarkeit, empfindliche Brüste, Schlafstörungen und Blähungen in der Lutealphase. Magnesiumglycinat (300–400 mg am Abend) wirkt direkt auf viele dieser Beschwerden, indem es GABA unterstützt, Cortisol senkt und die glatte Muskulatur entspannt. Es gehört zu den am besten belegten Nahrungsergänzungsmitteln speziell für die Perimenopause.
  disclaimer: >-
    Magnesiumpräparate werden in der Regel gut vertragen. Hohe Dosen können zu weichem Stuhl führen — beginne mit 200 mg und steigere langsam. Sprich vor der Einnahme mit deiner Hausärztin oder deinem Hausarzt, wenn du eine Nierenerkrankung oder Herzerkrankung hast oder verschreibungspflichtige Medikamente nimmst.
