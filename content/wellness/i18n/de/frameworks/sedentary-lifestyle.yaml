# Übersetzung von frameworks/sedentary-lifestyle.yaml — maßgeblich ist die englische Fassung.
df_sedentary_protein_preserve:
  title: Eiweiß ist noch wichtiger, wenn du nicht regelmäßig trainierst
  body: >-
    Bei Frauen, die sich wenig bewegen und zugleich in den Wechseljahren sind, geht Muskelmasse schneller verloren — ein doppelter Schlag. Ohne den Reiz von Krafttraining, der den Muskelaufbau anstößt, wird Eiweiß aus der Nahrung zum wichtigsten Hebel, um den Muskelabbau zu bremsen. Ziel sind täglich 1,2–1,6 g Eiweiß pro kg Körpergewicht. Verteil es auf die Mahlzeiten — 25–30 g pro Mahlzeit statt des Großteils am Abend. Es geht nicht um Muskelaufbau — es geht darum, das zu schützen, was du hast.
df_sedentary_anti_inflammatory:
  title: Essen als entzündungshemmende Medizin — wenn Bewegung eingeschränkt ist
  body: >-
    Wenn die Beweglichkeit eingeschränkt ist, übernimmt die Ernährung mehr von der Schutzarbeit. Eine entzündungshemmende Ernährung (Olivenöl, fetter Fisch, Beeren, Kurkuma, Ingwer, dunkles Blattgemüse, buntes Gemüse) hilft gegen die allgemeine Entzündung, die sowohl mit den Wechseljahren als auch mit Bewegungsmangel zunimmt. Das lindert Gelenkschmerzen und Erschöpfung und unterstützt die Stoffwechselgesundheit. Diese Veränderungen sind unabhängig von deiner körperlichen Verfassung möglich.
lf_sedentary_start_walking:
  title: Fang mit 10 Minuten an — nicht mit 30
  body: >-
    Die Empfehlung von 150 Minuten Bewegung pro Woche stimmt, baut aber für Frauen, die derzeit nicht aktiv sind, eine psychologische Hürde auf. Der am besten belegte Weg, eine Bewegungsgewohnheit zu beginnen, sind 10 Minuten täglich — kurz genug, dass man kaum Nein sagen kann, lang genug für eine echte Wirkung. Ein 10-minütiger Spaziergang nach einer Mahlzeit am Tag verbessert Blutzucker, Stimmung und Schlaf. Nach 2 Wochen steigerst du auf 15 Minuten. Die Gewohnheit kommt vor der Dauer.
lf_sedentary_seated_movement:
  title: Übungen im Sitzen zählen — unterschätze sie nicht
  body: >-
    Wenn deine Beweglichkeit eingeschränkt ist, erhalten Kraftübungen im Sitzen (Kniebeugen mit Stuhl, Beinheben im Sitzen, Oberkörperübungen mit Widerstandsband im Sitzen) die Muskelmasse und verbessern die Durchblutung. Stuhl-Yoga oder Yoga für Ältere (kostenlos auf YouTube zu finden) verbessert Beweglichkeit und Gleichgewicht und senkt so direkt das Sturzrisiko. Wassergymnastik (in den meisten öffentlichen Bädern) ist bei Gelenkschmerzen hervorragend, weil das Wasser 90 % der Belastung durch das Körpergewicht abnimmt. Bewegung in jedem Umfang wirkt heilsam.
lf_sedentary_break_sitting:
  title: Unterbrich das Sitzen alle 60–90 Minuten — schon 2 Minuten helfen
  body: >-
    Langes Sitzen (mehr als 8 Stunden täglich) hängt unabhängig von anderen Faktoren mit schlechterer Stoffwechselgesundheit zusammen — sogar bei Menschen, die zusätzlich Sport treiben. Ein Timer, der dich alle 60–90 Minuten für 2–3 Minuten aufstehen und bewegen lässt — ein Gang in die Küche, ein paar Wadenheber, Gehen auf der Stelle — senkt dieses Risiko. Das ersetzt keinen Sport; es ist ein eigenes, zusätzliches Schutzverhalten. Ein einfacher Handywecker reicht als Erinnerung.
mr_sedentary_no_shame:
  title: Hier gibt es kein Versagen — nur einen Ausgangspunkt
  body: >-
    Frauen, die derzeit nicht aktiv sind, tragen oft Jahre an Fitnessstudio-Mitgliedschaften mit sich, die nicht gehalten haben, Fitnessprogramme, die für jemand anderen gemacht schienen, und verinnerlichte Botschaften über Disziplin und Willenskraft. Nichts davon spielt eine Rolle für deinen heutigen Startpunkt. Bewegungsmangel in den Wechseljahren ist sehr häufig — und sehr gut umkehrbar. Ein 10-minütiger Spaziergang heute ist mehr wert als ein perfektes Programm, das nie stattfindet. Fang genau dort an, wo du gerade stehst.
mr_sedentary_pain_barrier:
  title: Wenn Schmerzen deine Bewegung einschränken — gehört das ärztlich abgeklärt
  body: >-
    Wenn Gelenkschmerzen, Rückenschmerzen oder eine andere körperliche Erkrankung der Grund ist, warum du nicht aktiv bist, lohnt es sich, das mit deiner Hausärztin oder deinem Hausarzt anzugehen, statt es zu umgehen. Physiotherapie wird bei Gelenkschmerzen oft übernommen und ist bei den meisten Beschwerden deutlich wirksamer als Schonung. Eine Knochendichtemessung kann zeigen, ob Osteoporose zu den Schmerzen beiträgt. Schmerzen, die die Aktivität einschränken, sind ein medizinisches Problem — keine Lebensstilentscheidung. Geh das Hindernis an, statt es hinzunehmen.
ss_creatine_muscle:
  title: Kreatin-Monohydrat — unterstützt den Muskelerhalt bei wenig Bewegung
  body: >-
    Kreatin-Monohydrat (3–5 g täglich) gehört zu den am besten untersuchten Sport-Nahrungsergänzungen, und es gibt zunehmend Belege für den Muskelerhalt bei älteren Erwachsenen und Frauen nach der Menopause — auch ohne viel Training. Auch für Konzentration und Erschöpfung ist es vielversprechend. In diesem Dosisbereich ist es sicher, günstig und wirksam. Nimm es regelmäßig ein — die Wirkung baut sich über 4–6 Wochen auf, nicht sofort.
  disclaimer: >-
    Kreatin wird in den genannten Dosen sehr gut vertragen. Es kann zu einer kleinen, vorübergehenden Gewichtszunahme durch Wassereinlagerung in den Muskeln führen. Sprich vor der Einnahme mit deiner Hausärztin oder deinem Hausarzt, wenn du eine Nierenerkrankung hast, da Kreatin den Kreatininwert (einen Marker der Nierenfunktion) erhöht — das ist nicht schädlich, kann aber die Auswertung von Blutwerten erschweren.
