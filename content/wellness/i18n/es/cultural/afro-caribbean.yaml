# Traducción de cultural/afro-caribbean.yaml — prevalece la versión en inglés.
items:
  ackee-saltfish-sodium:
    body: |-
      El ackee con bacalao salado (ackee and saltfish) es un plato básico en muchos hogares caribeños y tiene un gran significado cultural. El ackee en sí es excelente desde el punto de vista nutricional: rico en proteína y grasas saludables. Sin embargo, el bacalao salado puede tener mucho sodio, lo que puede empeorar la hinchazón y la retención de líquidos, y contribuir a cambios en la tensión arterial que ya son más frecuentes en la menopausia.

      Prueba a reducir la cantidad de bacalao y a dejarlo en remojo más tiempo para quitarle más sal. Condimenta con hierbas frescas y especias en lugar de añadir sal de mesa. Así mantienes el plato y la tradición, pero con más cuidado para tu cuerpo en este momento.
  rice-peas-blood-sugar:
    body: |-
      El rice and peas es un plato reconfortante básico. Las alubias rojas (guandú, frijoles de ojo negro) del plato son excelentes: ricas en proteína vegetal, fibra y fitoestrógenos que pueden ayudar con los síntomas vasomotores. Lo que hay que vigilar es el arroz. Cambiar a arroz integral o reducir la ración de arroz blanco y aumentar la de legumbres ayuda a estabilizar el azúcar en sangre, que influye directamente en la frecuencia de los sofocos y en la estabilidad del ánimo.
  plantain-glycaemic:
    body: |-
      El plátano macho maduro gusta mucho, pero tiene un índice glucémico más alto. Si los sofocos o los cambios de humor son importantes, prueba a comerlo con proteína (pollo, pescado, alubias) en lugar de solo: la proteína ralentiza la respuesta de la glucosa. El plátano verde es mejor opción para equilibrar el azúcar en sangre.
  callaloo-magnesium:
    body: |-
      El callaloo es realmente excelente para la menopausia. Es rico en magnesio (que ayuda al sueño y reduce la frecuencia de los sofocos), hierro, calcio y folato. Si no lo comes con regularidad, merece la pena recuperarlo. La variedad de amaranto que se usa en el Caribe es especialmente nutritiva.
  sorrel-hibiscus:
    body: |-
      El sorrel (hibisco) se ha usado durante generaciones en las tradiciones caribeñas y de África occidental. La investigación respalda sus beneficios para la tensión arterial y sus propiedades antioxidantes. Merece la pena tomarlo sin mucho azúcar: la bebida tradicional de sorrel de Navidad puede prepararse con menos endulzante y mantener la intensidad del sabor con clavo, jengibre y canela.
  coconut-oil-fats:
    body: |-
      El aceite y la leche de coco se usan mucho en la cocina caribeña y pueden formar parte de una alimentación sana en cantidades moderadas. En la menopausia, el cambio en los estrógenos modifica cómo se procesa la grasa, sobre todo en el abdomen. Funciona bien equilibrar las grasas de coco con pescado azul (caballa, sardinas, arenque), excelente para la salud del cerebro y contra la inflamación.
  stress-allostatic-load:
    body: |-
      La investigación muestra que las mujeres de origen africano y caribeño soportan una «carga alostática» mayor: el efecto acumulado del estrés crónico en el cuerpo, incluido el de la discriminación racial y el de tener que moverse en sistemas que no se diseñaron para ti. Esta respuesta al estrés crónico puede amplificar los síntomas de la menopausia, sobre todo los sofocos, las alteraciones del sueño y los cambios de ánimo.

      No es un motivo para simplemente «gestionar mejor el estrés»: es reconocer que tus síntomas pueden ser más intensos porque tu cuerpo ha cargado con más. Merece la pena decirlo cuando hables con tu médico, y tratarte con compasión por ello.
  hair-changes-menopause:
    body: |-
      La pérdida de densidad del cabello y los cambios de textura en la menopausia son muy frecuentes y pueden afectar especialmente a las mujeres de origen africano y caribeño, para quienes el cabello está profundamente ligado a la identidad y a la expresión cultural. La combinación del descenso de estrógenos con el efecto del calor y de los tratamientos químicos puede agravar el efecto.

      Los peinados protectores que reducen la manipulación, el cuidado del cuero cabelludo (masaje regular, aceite de ricino) y una ingesta suficiente de proteína y hierro son enfoques con respaldo, junto con cualquier tratamiento tópico.
  speaking-up-gp:
    body: |-
      La investigación en atención primaria del Reino Unido muestra que a las mujeres de minorías étnicas se les ofrece menos la THS y se toman menos en serio sus síntomas. Es una desigualdad en salud documentada, no son imaginaciones tuyas.

      Si tus síntomas son importantes, tienes todo el derecho a defenderte con claridad. Lleva un diario de síntomas antes de la cita. Sé concreta sobre el impacto en tu día a día. Si tu médico no te toma en serio, tienes derecho a pedir una segunda opinión o una derivación a un especialista en menopausia. Aunty Mel puede ayudarte a preparar esas conversaciones.
  community-and-isolation:
    body: |-
      En algunas comunidades caribeñas no se habla abiertamente de la menopausia: puede tratarse como algo que se lleva en privado, o asociarse al envejecimiento de forma estigmatizante. Puede que sientas que no puedes hablarlo con las mujeres de tu entorno.

      Pero la sabiduría siempre ha estado ahí. Las tías que pasaron por esto antes que tú lo sabían. Encontrar tu propia versión de esa comunidad — en internet, con amigas o a través de esta app — puede marcar una gran diferencia en cómo vives esta transición.
  vitamin-d-caribbean-uk:
    body: |-
      Las mujeres de origen africano y caribeño que viven en el Reino Unido tienen un riesgo bastante mayor de carencia de vitamina D: la melanina de la piel más oscura necesita más tiempo de exposición al sol para producir la misma vitamina D, y la luz solar del Reino Unido es insuficiente la mayor parte del año.

      La carencia de vitamina D empeora el cansancio, el ánimo, el dolor articular y el sueño, síntomas que ya están aumentados en la menopausia. Tu médico puede pedirte un análisis. La mayoría de las guías británicas de dermatología y menopausia recomiendan 1000–2000 UI al día para las mujeres de piel más oscura en el Reino Unido, pero hazte primero el análisis antes de tomar dosis más altas.
      AVISO: consulta siempre con tu médico antes de empezar suplementos, sobre todo en dosis superiores a la recomendación estándar del NHS de 400 UI.
  iron-monitoring:
    body: |-
      Si todavía tienes la regla durante la perimenopausia — que puede ser más abundante e irregular —, es importante vigilar el hierro. El sangrado abundante en la perimenopausia es más frecuente en las mujeres negras y puede causar anemia por falta de hierro, que empeora mucho el cansancio.

      Pide a tu médico un hemograma completo si el cansancio es un síntoma importante para ti.
      AVISO: consulta siempre con tu médico antes de empezar suplementos de hierro; demasiado hierro puede ser perjudicial.
byTitle:
  Something important to know about your timeline:
    title: Algo importante que debes saber sobre tus tiempos
    body: |-
      La investigación muestra de forma constante que las mujeres de origen africano y caribeño suelen llegar a la menopausia hacia los 49–50 años, unos 18 meses antes que la media del Reino Unido, de 51. Esto significa que la perimenopausia puede empezar entre el principio y la mitad de los 40, a veces incluso a finales de los 30.

      Si te han dicho que eres «demasiado joven» para estar en la perimenopausia, puede que no lo seas. Conviene tenerlo en cuenta al hablar con tu médico.

      Un matiz importante: son medias de investigaciones en gran parte estadounidenses, no una predicción de tus propios tiempos.
