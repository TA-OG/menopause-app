# Traducción de cultural/communities/india-gujarati.yaml — prevalece la versión en inglés.
items:
  dal-dhokli-legume-advantage:
    body: |-
      El dal dhokli, el handvo y la gran variedad de dals guyaratíes ofrecen una nutrición excelente para la menopausia. Las lentejas y las legumbres son ricas en fitoestrógenos, proteína vegetal y fibra. La presencia constante del dal en la cocina guyaratí, en las tres comidas, es una ventaja alimentaria natural frente a las mujeres que siguen dietas occidentales con muy pocas legumbres.

      Puede que los fitoestrógenos de una dieta guyaratí habitual con dal ya te estén ayudando con los síntomas vasomotores sin que lo sepas.
  thepla-methi-phytoestrogens:
    body: |-
      El thepla con methi (fenogreco) es un básico guyaratí con una relevancia concreta en la menopausia. El fenogreco es rico en fitoestrógenos y se ha estudiado por su papel en la reducción de la frecuencia de los sofocos y en el control del azúcar en sangre. Un methi nu thepla en el desayuno es una elección nutricional con sentido, no solo cultural.
  undhiyu-seasonal-vegetables:
    body: |-
      El undhiyu — el plato de verduras de temporada y lentejas — es uno de los platos más completos de la cocina guyaratí a nivel nutricional. La combinación de distintas verduras, surti papdi (judías planas), tuvar (guandú) y plátano verde aporta una mezcla variada de fitoestrógenos, fibra y micronutrientes. El plátano verde (kacchi keri) aporta almidón resistente, que alimenta a las bacterias intestinales beneficiosas.
  dhokla-fermented-gut:
    body: |-
      El dhokla y el handvo son alimentos fermentados (masa de garbanzo fermentada) con propiedades probióticas. Los alimentos fermentados favorecen la salud de la microbiota intestinal, que según investigaciones incipientes influye en cómo el cuerpo metaboliza y recicla los estrógenos. Mantener alimentos guyaratíes fermentados en tu dieta favorece la salud intestinal durante la menopausia.
  jaggery-sugar-alternatives:
    body: |-
      La comida guyaratí es conocida por ser ligeramente dulce: el jaggery (gol) se usa en el dal, la sabzi y los tentempiés. El jaggery tiene un índice glucémico algo más bajo que el azúcar refinado y contiene oligoelementos. Sin embargo, en la menopausia, el total de azúcar — venga de donde venga — afecta a la estabilidad del azúcar en sangre y puede empeorar los sofocos.

      Usar menos jaggery del que indican las recetas tradicionales, y tomar los platos dulces junto con una fuente de proteína, modera el impacto en el azúcar en sangre.
  chaas-buttermilk-calcium:
    body: |-
      El chaas (suero de mantequilla especiado) es una bebida guyaratí básica y una buena fuente de calcio, proteína y probióticos. Tomar chaas después de comer ayuda a la digestión y contribuye al calcio necesario para proteger la densidad ósea en la menopausia. El comino y el jengibre del chaas también tienen propiedades digestivas y antiinflamatorias.
  til-sesame-calcium-phytoestrogens:
    body: |-
      El til (semillas de sésamo) se usa en toda la cocina y los tentempiés guyaratíes: til ladoo, tilgul y como guarnición. Las semillas de sésamo son ricas en calcio (importante para los huesos) y contienen lignanos, una forma de fitoestrógeno. Es una aportación nutricional pequeña pero real de un alimento muy arraigado en la cultura.
  jain-dietary-context:
    body: |-
      Para las mujeres guyaratíes jainistas, las restricciones alimentarias (sin tubérculos ni raíces en ciertos periodos, sin carne) hacen que las fuentes vegetales de proteína y calcio necesiten una atención especial en la menopausia.

      Los lácteos (paneer, dahi, chaas), las semillas de sésamo, las almendras, las pipas de calabaza, las verduras de hoja verde y las lentejas son fuentes de calcio y proteína compatibles con el jainismo que apoyan la nutrición en la menopausia dentro de la práctica religiosa.
  cvd-metabolic-gujarati:
    body: |-
      Las mujeres del sur de Asia, incluidas las guyaratíes, tienen tasas bastante más altas de síndrome metabólico, resistencia a la insulina y riesgo cardiovascular durante la transición a la menopausia. Está documentado clínicamente y significa que vigilar la tensión arterial y el azúcar en sangre es importante en esta etapa.
  community-expectations:
    body: |-
      Las mujeres guyaratíes suelen cargar con mucha responsabilidad familiar y comunitaria: negocios familiares, hogares extensos y redes comunitarias. La expectativa de ser productiva y mantener la compostura puede hacer difícil ponerle nombre a tu propia experiencia de la menopausia o darle prioridad.

      Puedes mantener los valores de tu comunidad y aun así tomarte en serio tus síntomas. Las dos cosas son ciertas.
  vitamin-d-gujarati:
    body: |-
      La carencia de vitamina D es frecuente en las mujeres guyaratíes del Reino Unido.
      Hazte un análisis con tu médico antes de tomar suplementos por encima de los niveles estándar del NHS.
      AVISO: el exceso de vitamina D es tóxico. Hazte el análisis y luego toma el suplemento adecuado.
byTitle:
  Your menopause may start earlier — and your diet is already an asset:
    title: Tu menopausia puede llegar antes, y tu alimentación ya es una ventaja
    body: |-
      Las mujeres indias suelen llegar a la menopausia hacia los 46,7 años, 4 años antes que la media del Reino Unido. La perimenopausia puede empezar a finales de los 30.

      La cocina guyaratí es mayoritariamente vegetal y rica en legumbres: es una ventaja nutricional real para manejar los síntomas de la menopausia. Tu alimentación tradicional ya está haciendo un trabajo del que quizá no eras consciente.
