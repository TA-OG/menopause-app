# Traducción de cultural/communities/india-punjabi.yaml — prevalece la versión en inglés.
items:
  dal-legumes-phytoestrogens:
    body: |-
      El dal — masoor, moong, chana, toor, urad — es la base nutricional de la cocina panyabí y uno de los mejores alimentos para la menopausia. Las lentejas y las legumbres son ricas en fitoestrógenos (estrógenos vegetales), proteína vegetal, fibra y hierro.

      Las mujeres con dietas ricas en legumbres suelen tener sofocos menos frecuentes y menos intensos. Si el dal ya es diario en tu casa, es una ventaja real. El dal makhani (urad negro) aporta proteína y hierro a la vez. Mantenlo en tu rotación habitual.
  sarson-da-saag-greens:
    body: |-
      El sarson da saag (hojas de mostaza) es un básico del invierno panyabí con verdadera relevancia en la menopausia. Las hojas de mostaza son ricas en calcio (clave cuando bajan los estrógenos), vitamina K (salud ósea), folato y antioxidantes. Tradicionalmente se come con makki di roti (pan plano de maíz); el maíz tiene más fibra que la harina de trigo blanca y una respuesta glucémica más baja.

      Este plato tradicional de invierno merece comerse todo el año durante la menopausia, no solo en temporada.
  ghee-moderation:
    body: |-
      El ghee tiene importancia cultural y nutricional en la cocina panyabí; los hogares sijes e hindúes en particular lo usan con generosidad. En cantidades moderadas, el ghee no es un problema. Sin embargo, en la menopausia, el descenso de los estrógenos cambia cómo se metaboliza y almacena la grasa, sobre todo en el abdomen.

      La investigación en mujeres del sur de Asia muestra tasas más altas de obesidad abdominal y síndrome metabólico precisamente durante la transición a la menopausia. Esto no significa eliminar el ghee, sino usarlo con conciencia junto con otras grasas saludables (aceite de mostaza, frutos secos, lino) en lugar de como grasa principal.
  paneer-calcium-protein:
    body: |-
      El paneer es un alimento excelente para la menopausia: rico en calcio y proteína, y con algo menos de lactosa que la leche. El calcio es clave en la menopausia para mantener la densidad ósea. El palak paneer (con espinacas) combina calcio, hierro y vitamina C en un solo plato. El mutter paneer aporta proteína e hidratos de origen vegetal.

      Si tienes intolerancia a la lactosa (frecuente en personas del sur de Asia), las cantidades pequeñas de paneer suelen tolerarse mejor que los lácteos líquidos.
  roti-chapati-refined-carbs:
    body: |-
      El roti y el chapati de trigo blanco son centrales en la alimentación panyabí. En la menopausia, controlar el azúcar en sangre es especialmente importante para las mujeres del sur de Asia: la investigación documenta tasas bastante más altas de resistencia a la insulina y síndrome metabólico en ellas durante la transición a la menopausia.

      Ajustes prácticos: mezcla atta integral con atta normal (50/50) para aumentar la fibra. Come el roti con mucho dal, sabzi o proteína: la proteína y la fibra ralentizan la respuesta de la glucosa. No te limites a reducir el roti; aumenta lo que comes con él.
  chai-caffeine-south-asian:
    body: |-
      Un chai panyabí fuerte — a menudo con leche entera, azúcar y cardamomo — varias veces al día es central en la cultura. La cafeína puede empeorar los sofocos y alterar el sueño en la menopausia, sobre todo a partir de la tarde.

      Reducir el azúcar del chai es lo que más impacto tiene. Cambiar el chai de la tarde y la noche por leche con cúrcuma (haldi doodh) tiene resonancia cultural y además aporta beneficios antiinflamatorios. El chai de la mañana puede quedarse como está.
  turmeric-haldi-inflammation:
    body: |-
      La cúrcuma (haldi), presente en toda la cocina panyabí, es realmente antiinflamatoria. La curcumina — su compuesto activo — se absorbe mucho mejor con pimienta negra (kali mirch) y grasa. La cocina panyabí tradicional ya los combina (las bases de curry usan ghee y pimienta junto con el haldi).

      El haldi doodh (leche dorada) por la noche aporta beneficios antiinflamatorios y ayuda al sueño gracias al triptófano de la leche caliente. Una práctica tradicional realmente útil.
  lassi-probiotic:
    body: |-
      El lassi salado tradicional (no la versión dulce de mango) es un alimento probiótico que favorece la salud intestinal. La salud intestinal se relaciona cada vez más con cómo el cuerpo procesa y recicla los estrógenos. Un vaso de lassi salado con comino es un apoyo real. Los lassis dulces comerciales añaden mucho azúcar, lo que contrarresta el beneficio.
  cvd-risk-south-asian:
    body: |-
      Las mujeres del sur de Asia tienen tasas bastante más altas de factores de riesgo cardiovascular durante la transición a la menopausia: el síndrome metabólico, la resistencia a la insulina, la diabetes, la obesidad abdominal y la hipertensión son más frecuentes en ellas que en las mujeres blancas europeas en esta etapa.

      No es alarmismo: está documentado clínicamente y significa que tomarse en serio la menopausia, vigilar la tensión arterial y el azúcar en sangre y cuidar el estilo de vida importa más, no menos, para las mujeres del sur de Asia.
  joint-pain-prominent:
    body: |-
      El dolor articular y muscular es un síntoma de la menopausia más marcado en las mujeres del sur de Asia que en las mujeres blancas. A menudo se atribuye a la artrosis o se minimiza. Si tienes dolor articular junto con otros síntomas de la menopausia, comenta ambos con tu médico.

      El movimiento diario — yoga (que tiene resonancia cultural), caminar, natación — es la intervención con más evidencia para el dolor articular asociado a la menopausia.
  cultural-silence-punjabi:
    body: |-
      En muchos hogares panyabíes — sijes, hindúes y musulmanes — no se habla abiertamente de la menopausia. «Chup raho» (calla) puede convertirse en el guion cultural. Se espera que las mujeres se las arreglen y sigan adelante.

      Este silencio no es tradición en el sentido más profundo: es la falta de palabras y de espacio. Aunty Mel es un espacio donde puedes ponerle nombre a lo que está pasando, entenderlo y tomártelo en serio. Tienes derecho a hacerlo.
  hrt-access-gap:
    body: |-
      La investigación muestra que solo el 6,2 % de las mujeres asiáticas del Reino Unido recibe THS, frente al 23,3 % de las mujeres blancas. Esta diferencia refleja barreras de acceso y de idioma, reticencias culturales y, posiblemente, suposiciones de los médicos sobre lo que quieren las mujeres del sur de Asia.

      La THS es un tratamiento médico, no un tratamiento «occidental». Si tus síntomas afectan mucho a tu calidad de vida, preguntar a tu médico por todas las opciones disponibles — incluida la THS — es tu derecho. Aunty Mel te ayuda a preparar esa conversación.
  vitamin-d-south-asian-uk:
    body: |-
      Las mujeres del sur de Asia en el Reino Unido tienen algunas de las tasas más altas de carencia de vitamina D. La vitamina D de la dieta es escasa en las dietas tradicionales del sur de Asia (poco pescado azul, pocos alimentos enriquecidos). La exposición al sol, con la ropa y el clima británico, es mínima.

      La carencia de vitamina D empeora el dolor articular, el cansancio, el ánimo y la salud ósea, que ya se resienten en la menopausia. Hazte un análisis con tu médico. La mayoría de las guías sugieren 1000–2000 UI para las mujeres del sur de Asia en el Reino Unido, pero hazte primero el análisis.
      AVISO: consulta siempre con tu médico. El exceso de vitamina D es tóxico.
  calcium-bone-health-punjabi:
    body: |-
      Las mujeres del sur de Asia tienen tasas de osteoporosis más altas que las mujeres blancas del Reino Unido. Una menopausia más temprana lo agrava: más años sin el efecto protector de los estrógenos sobre los huesos. Los lácteos (paneer, dahi, leche), las semillas de sésamo (til), las almendras y las verduras de hoja verde oscura son las fuentes de calcio de la dieta que conviene priorizar.
      AVISO: habla con tu médico sobre los suplementos de calcio y vitamina D.
byTitle:
  Your menopause may start earlier than you expect:
    title: Tu menopausia puede llegar antes de lo que esperas
    body: |-
      Las mujeres indias y pakistaníes llegan a la menopausia bastante antes que la media del Reino Unido. Las mujeres indias, de media a los 46,7 años; las pakistaníes, a los 47,16 años: en ambos casos 3–4 años antes que la media del Reino Unido, de 51.

      Esto significa que la perimenopausia puede empezar a finales de los 30 o a principios de los 40. A esta edad, los síntomas se atribuyen a menudo al estrés, la depresión o problemas de tiroides.

      Si tienes 40 y tantos y tienes sofocos, cambios en el sueño, cambios de ánimo, reglas irregulares o dolor articular, podría ser la perimenopausia. Insiste en que te tomen en serio.
