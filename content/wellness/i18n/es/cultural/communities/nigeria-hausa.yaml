# Traducción de cultural/communities/nigeria-hausa.yaml — prevalece la versión en inglés.
items:
  fura-da-nono-probiotic-calcium:
    body: |-
      El fura da nono — la bebida fulani de leche fermentada hecha con bolitas de mijo y leche de vaca fermentada — tiene un valor nutricional importante para las mujeres en la menopausia. Aporta calcio (clave para la densidad ósea cuando bajan los estrógenos), bacterias probióticas (que favorecen la salud intestinal y podrían mejorar el metabolismo de los fitoestrógenos) y proteína.

      Si tienes acceso a ella, es uno de los alimentos tradicionales más relevantes para esta etapa de la vida. Si la preparas en casa, la fermentación es lo más importante a nivel nutricional.
  tuwo-shinkafa-grain-staple:
    body: |-
      El tuwo shinkafa (masa o bola de arroz) es el acompañamiento básico del norte, que se come con muchas sopas distintas. Los básicos a base de arroz suelen ser más fáciles de digerir que los acompañamientos más pesados. Comer el tuwo con miyan kuka (sopa de hojas de baobab) o miyan taushe (sopa de calabaza) da una comida nutricionalmente equilibrada.

      En la menopausia, la estabilidad del azúcar en sangre importa. Acompañar el tuwo con sopas ricas en proteína, y reducir la ración de tuwo aumentando la de sopa, modera la respuesta de la glucosa.
  miyan-kuka-baobab:
    body: |-
      El miyan kuka (sopa de hojas de baobab) es rico en calcio, hierro, vitamina C y antioxidantes. El baobab — llamado «el árbol de la vida» en toda el África subsahariana — tiene uno de los contenidos de vitamina C más altos de cualquier alimento. La vitamina C ayuda a absorber el hierro y al sistema inmunitario, dos aspectos importantes en la menopausia.

      El polvo de baobab ya se vende también en tiendas de dietética del Reino Unido: una cucharadita en un batido o en las gachas aporta un buen extra de nutrientes.
  masa-tsamiya-sorghum:
    body: |-
      El masa (tortitas de arroz fermentado) y el tsamiya (tamarindo) forman parte de la cultura hausa de los tentempiés. Los alimentos fermentados favorecen la salud intestinal. El tamarindo tiene propiedades antioxidantes. Los alimentos a base de sorgo (burukutu, tuwo dawa) tienen más fibra y un índice glucémico más bajo que el arroz blanco, lo que los convierte en mejor opción en la menopausia para controlar el azúcar en sangre.
  suya-kilishi-protein:
    body: |-
      El suya (ternera o pollo a la parrilla con especias) y el kilishi (carne seca especiada) son ricos en proteína, importante en la menopausia, cuando mantener la masa muscular se vuelve más necesario. La mezcla de especias (especia suya/tankora) lleva cacahuete, jengibre y otras especias con propiedades antiinflamatorias.

      El suya de los puestos callejeros suele tener mucha sal. Si lo preparas en casa, reducir la sal manteniendo las especias favorece la salud cardiovascular, que gana importancia tras la menopausia, cuando disminuye el efecto protector de los estrógenos sobre el corazón.
  groundnuts-legumes:
    body: |-
      Los cacahuetes (kulikuli, sopa de cacahuete, aceite de cacahuete) son centrales en la cocina del norte de Nigeria y aportan proteína, grasas saludables y algunos fitoestrógenos. El aceite de cacahuete es mejor opción para cocinar que los aceites vegetales refinados. La sopa de cacahuete con cereales aporta energía duradera y estabilidad del azúcar en sangre.
  purdah-vitamin-d:
    body: |-
      Para las mujeres hausa-fulani que practican el purdah o que se cubren por completo al salir, la carencia de vitamina D es un riesgo importante para la salud. La combinación de poca exposición al sol y piel oscura hace que la producción de vitamina D sea mínima en el Reino Unido.

      La carencia de vitamina D empeora directamente el dolor articular, el cansancio, la salud ósea y el ánimo en la menopausia, síntomas que ya son más frecuentes. Es un tema médico importante que conviene tratar con tu médico, independientemente de cómo decidas vestirte.
  community-women-network:
    body: |-
      Las redes comunitarias de mujeres hausa — informales y formales — han sido históricamente espacios importantes donde las mujeres comparten conocimientos de salud. El concepto de «sadaka» (caridad y cuidado de la comunidad) se extiende al intercambio de conocimientos sobre salud.

      Buscar información sobre la menopausia en mujeres de tu comunidad que ya la han vivido es una fuente de apoyo válida y valiosa, junto con orientación basada en la evidencia.
  islamic-framing-natural-process:
    body: |-
      En la erudición islámica, la menopausia se entiende como una parte natural del ciclo de la vida que Alá creó: el final de una responsabilidad (tener hijos) y la liberación de energía para otras formas de contribución y de adoración. Esta visión positiva tiene un valor real para el bienestar.

      Tu fe no te exige sufrir los síntomas en silencio. Buscar conocimiento sobre tu cuerpo y buscar alivio para los síntomas es coherente con los principios islámicos de cuidar el cuerpo como una amanah (un depósito confiado).
  discussing-sexual-health:
    body: |-
      Hablar de salud sexual — incluidos los cambios en el deseo, la sequedad vaginal o el dolor en las relaciones — puede resultar muy difícil en contextos culturales hausa-fulani, donde son asuntos privados.

      En la privacidad de esta app, puedes registrar y entender estos cambios sin contárselo a nadie. Si son importantes y afectan a tu vida, hablar en confianza con una médica es tu derecho. Son cambios médicos, tienen soluciones basadas en la evidencia y mereces tener acceso a ellas.
  calcium-bone-health-hausa:
    body: |-
      La dieta tradicional hausa-fulani es una de las más ricas en calcio de África occidental gracias al consumo de lácteos (fura da nono, leche). Es una ventaja real para la salud ósea en la menopausia. Mantén este patrón alimentario y habla con tu médico sobre una densitometría ósea (DEXA) si tienes una menopausia temprana o antecedentes familiares de osteoporosis.
      AVISO: habla con tu médico sobre los suplementos de calcio.
  vitamin-d-hausa:
    body: |-
      La carencia de vitamina D es especialmente alta en las mujeres hausa del Reino Unido.
      Hazte un análisis con tu médico antes de tomar dosis más altas.
      AVISO: consulta siempre con tu médico. El exceso de vitamina D es tóxico.
byTitle:
  Your diet is already doing some of the work:
    title: Tu alimentación ya está haciendo parte del trabajo
    body: |-
      La dieta tradicional hausa-fulani — rica en cereales, legumbres y lácteos fermentados — ofrece algunas ventajas nutricionales naturales en la menopausia. El fura da nono (bebida de leche fermentada) en particular aporta calcio, probióticos y proteína que favorecen la salud ósea durante el descenso de los estrógenos en la menopausia.

      Las mujeres nigerianas suelen llegar a la menopausia antes que la media occidental de 51 años. Si tienes 40 y tantos y notas cambios, tómatelos en serio.
