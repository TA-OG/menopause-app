# Traducción de cultural/communities/nigeria-igbo.yaml — prevalece la versión en inglés.
items:
  bitter-leaf-ofe-onugbu:
    body: |-
      El ofe onugbu (sopa de hoja amarga) es un plato típicamente igbo, y hay investigación incipiente que respalda sus propiedades antiinflamatorias y reguladoras de la glucosa. La hoja amarga (Vernonia amygdalina) se usa desde hace generaciones en la medicina tradicional igbo y, en general, de África occidental. En la menopausia, cuando importan tanto controlar la inflamación como estabilizar el azúcar en sangre, es un plato que merece la pena priorizar.

      La combinación igbo tradicional de sopa de hoja amarga con malanga (cocoyam) o eba aporta fibra, compuestos vegetales y proteína.
  oha-soup-nutrients:
    body: |-
      La sopa de oha (hecha con hojas de oha o «palo de rosa africano») es rica en calcio, hierro y vitamina C, todos importantes en la transición a la menopausia, cuando cambian la densidad ósea, la energía y la función inmunitaria. Las hojas de oha también son ricas en fibra.

      Si encuentras oha con facilidad (en tiendas de alimentación africana del Reino Unido), es una sopa nutricionalmente excelente que merece la pena tomar con regularidad.
  egusi-protein-zinc:
    body: |-
      El egusi (semillas de melón) — usado en la cocina igbo, yoruba y otras de África occidental — es rico en zinc, proteína y grasas saludables. El zinc es esencial para la síntesis de testosterona (que influye en la energía y el deseo de las mujeres en la menopausia) y para el sistema inmunitario. La sopa de egusi con verduras de hoja es una comida realmente nutritiva para la menopausia.
  yam-fufu-blood-sugar:
    body: |-
      El fufu, el eba y el ñame machacado son los acompañamientos básicos igbo. Tienen importancia cultural y valor nutricional: el ñame contiene compuestos que favorecen el equilibrio hormonal. Sin embargo, raciones grandes de hidratos refinados sin suficientes verduras ni proteína pueden disparar el azúcar en sangre, lo que empeora los sofocos y la inestabilidad del ánimo.

      El enfoque igbo tradicional de comidas con mucha sopa (más sopa, menos acompañamiento) lo modera de forma natural. Sigue el equilibrio tradicional en lugar de occidentalizarlo.
  palm-nut-soup-abenkwan-banga:
    body: |-
      La sopa de nuez de palma (ofe akwu) es nutritiva y tiene importancia cultural. Las nueces de palma aportan vitamina E y betacaroteno. En la menopausia, lo que importa es el equilibrio general de grasas saturadas: complementa la cocina con mucho aceite de palma con pescado azul (sardinas, caballa, atún) y verduras de hoja verde oscura para equilibrar los omega-3.
  ukazi-afang-leafy-greens:
    body: |-
      Las hojas de ukazi (que se usan en la sopa afang y como espesante) son ricas en hierro y fibra. La sopa afang — una combinación de ukazi y waterleaf — es una de las sopas más densas en nutrientes de la cocina del este de Nigeria. Para las mujeres con cansancio en la perimenopausia o sangrados abundantes, su contenido en hierro es realmente relevante.
  abacha-african-salad:
    body: |-
      El abacha (ensalada africana de yuca seca) es un plato igbo más ligero, que suele llevar berenjena africana (garden egg), cebolla, cangrejo de río seco y aceite de palma. Tiene menos hidratos que las comidas con acompañamiento, lo que lo convierte en una opción útil para controlar el azúcar en sangre y los cambios de peso en el abdomen durante la menopausia. La berenjena africana también tiene propiedades antioxidantes documentadas.
  vitamin-d-igbo-uk:
    body: |-
      Las mujeres igbo que viven en el Reino Unido — como todas las mujeres de origen africano — tienen un riesgo alto de carencia de vitamina D, porque la melanina necesita más exposición al sol y en el Reino Unido hay poca radiación UV fuera de los meses de verano.

      El cansancio, el dolor articular, el ánimo bajo y los problemas óseos empeoran con la carencia de vitamina D, y todos están ya aumentados en la menopausia. Hacerse el análisis y corregirla es una acción sencilla y de gran impacto.
  nkwobi-okonkwo-social:
    body: |-
      La cultura gastronómica igbo es profundamente social: el nkwobi, el isi ewu y el ofe suelen ser platos compartidos en reuniones. Esta dimensión comunitaria de la comida tiene un valor real para el bienestar en la menopausia. La conexión social, el apoyo emocional y la experiencia compartida de la comida son protecciones documentadas frente al aislamiento que puede acompañar a un gran cambio hormonal.

      No subestimes la medicina que hay en tu comunidad.
  igbo-women-strength:
    body: |-
      Las mujeres igbo son conocidas por su resiliencia, su espíritu emprendedor y su liderazgo en la comunidad. Esa fuerza a veces puede significar aguantar las dificultades en silencio: «onye aghala nwanne ya» (no abandones a los tuyos) puede convertirse en un peso cuando implica no pedir ayuda para ti.

      Tomarte en serio los síntomas de la menopausia — registrarlos, buscar apoyo y defenderte ante tu médico — no es debilidad. Es la misma inteligencia y determinación que llevaron la revuelta de las mujeres de Aba (Aba Women’s Riot) a la historia. Mereces esa misma energía dirigida hacia tu propio cuerpo.
  vitamin-d-testing:
    body: |-
      Análisis de vitamina D y suplementos si hay carencia. Especialmente importante para las mujeres igbo del Reino Unido, que tienen tasas altas de carencia por el tono de piel y el clima británico.
      AVISO: hazte un análisis antes de tomar más de 400 UI. El exceso de vitamina D es tóxico. Habla con tu médico.
byTitle:
  Your timeline and your symptoms may be earlier than expected:
    title: Puede que tus tiempos y tus síntomas lleguen antes de lo esperado
    body: |-
      Las mujeres nigerianas suelen llegar a la menopausia antes que la media del Reino Unido, de 51 años. La perimenopausia puede empezar entre el principio y la mitad de los 40. La visión igbo de la feminidad como portadora de sabiduría, fuerza y comunidad — «nwanyi oma» — puede ser un verdadero ancla en esta transición.

      No estás perdiendo tu fuerza. Está cambiando de forma.
