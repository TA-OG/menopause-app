# Traducción de cultural/communities/nigeria-yoruba.yaml — prevalece la versión en inglés.
items:
  amala-yam-hormones:
    body: |-
      El amala — el querido acompañamiento yoruba hecho con harina de ñame seco — tiene una relevancia nutricional real en la menopausia. La investigación nutricional nigeriana documenta que el ñame contiene compuestos que podrían ayudar a equilibrar las hormonas que cambian en la menopausia, y que tiene propiedades antiinflamatorias. El amala con ewedu y gbegiri es una comida equilibrada y rica en fibra que favorece la estabilidad del azúcar en sangre.

      Cuanto más oscuro es el amala (hecho con la piel del ñame sin pelar), más fibra tiene. Es un plato que puedes mantener en tu rotación habitual con tranquilidad.
  ewedu-gbegiri-nutrients:
    body: |-
      El ewedu (hojas de yute) es una de las verduras más nutritivas de la cocina yoruba: rico en calcio, hierro y vitamina C. Todos son especialmente importantes en la menopausia, cuando la densidad ósea empieza a cambiar y cambian las necesidades de energía. El gbegiri (sopa de frijoles de ojo negro) añade proteína vegetal y fitoestrógenos.

      La combinación de ewedu, gbegiri y guiso con amala o ñame machacado es — desde el punto de vista nutricional — una comida excelente para la menopausia.
  efo-riro-leafy-greens:
    body: |-
      El efo riro (sopa de verduras yoruba) con tete (hojas de amaranto) o espinacas es rico en magnesio, que favorece la calidad del sueño y podría reducir la frecuencia de los sofocos. La combinación de aceite de palma (vitamina E, betacaroteno) y verduras de hoja verde oscura aporta vitaminas liposolubles que el cuerpo aprovecha bien.

      Cocina el efo riro con menos aceite si te preocupan los cambios de peso en el abdomen: las verduras son las protagonistas nutricionales, no la cantidad de aceite.
  pounded-yam-blood-sugar:
    body: |-
      El ñame machacado (iyan) es central en la cultura y nutritivo, pero tiene un mayor impacto glucémico en raciones grandes. En la menopausia, la estabilidad del azúcar en sangre influye directamente en la frecuencia de los sofocos y en el ánimo.

      Un ajuste práctico: raciones más pequeñas de ñame machacado con más sopa. El ewedu, el egusi o el efo riro pueden ser la parte más grande. Así mantienes la comida y la cultura mientras te adaptas a las necesidades cambiantes de tu cuerpo.
  pepper-spice-triggers:
    body: |-
      La comida yoruba es conocida por ser bien picante: el ata rodo (chile scotch bonnet), el ata ijosi y distintos chiles secos dan a la cocina yoruba su picor característico. La comida picante puede desencadenar sofocos en algunas mujeres durante la menopausia, no en todas ni siempre. Fíjate en si notas un sofoco en los 30–60 minutos siguientes a una comida especialmente picante.

      Si hay un patrón, no tienes que renunciar al picante: ajusta la cantidad y fíjate en si lo que provoca el sofoco es el calor del chile o el de la menopausia.
  palm-oil-balance:
    body: |-
      El aceite de palma está presente en toda la cocina yoruba y aporta vitamina E, betacaroteno y grasas saturadas. En el contexto de los cambios de estrógenos de la menopausia — que afectan a cómo se metaboliza y almacena la grasa —, un uso moderado del aceite de palma está bien. Lo importante es el patrón general: complementa la cocina con aceite de palma con pescado azul (caballa, sardinas, atún) para equilibrar los omega-3, que favorecen la salud del cerebro y el control de la inflamación.
  offal-iron:
    body: |-
      La cocina yoruba aprovecha muy bien la casquería: shaki (callos), ponmo (piel de vaca), kpomo y vísceras. El hígado en particular es muy rico en hierro, lo que es importante si todavía tienes reglas de perimenopausia que pueden ser más abundantes o irregulares que antes.

      Si el cansancio es un síntoma importante, pide a tu médico un hemograma completo para descartar anemia por falta de hierro: a menudo pasa desapercibida en la perimenopausia.
  allostatic-load-yoruba:
    body: |-
      La investigación sobre la carga alostática — el coste fisiológico acumulado del estrés crónico — es especialmente relevante para las mujeres negras británicas que se mueven en varios sistemas a la vez: trabajo, familia, expectativas de la comunidad y, a menudo, discriminación racial.

      En la cultura yoruba, la expectativa de que las mujeres sean pilares de la comunidad — como iyá — puede significar cargar con un peso emocional y práctico enorme. Esto se honra; y también hay que nombrarlo con honestidad. La respuesta al estrés crónico amplifica los síntomas de la menopausia. Buscar apoyo, nombrar lo que cargas y reducir la carga innecesaria cuando puedas no es debilidad: es sabiduría.
  vitamin-d-uk:
    body: |-
      Las mujeres yoruba del Reino Unido — como todas las mujeres de origen africano — tienen un riesgo alto de carencia de vitamina D. La diferencia entre el sol de Nigeria y el del Reino Unido no es pequeña: es un cambio fisiológico de 12 meses que afecta a la salud ósea, el ánimo, el dolor articular y el cansancio. Todos estos síntomas ya están aumentados en la menopausia.

      Pide a tu médico que te mida la vitamina D. Si tienes carencia, tomar bien el suplemento marca una diferencia medible en cómo te sientes.
  menopause-not-taboo-here:
    body: |-
      En muchos hogares nigerianos y yoruba no se habla directamente de la menopausia. Es «eso que pasa»: se sabe, pero no se nombra. Este silencio puede hacer que las mujeres pasen por síntomas importantes sin apoyo, sin palabras y, a veces, sin entender siquiera lo que le ocurre a su cuerpo.

      Tienes todo el permiso para ponerle nombre a lo que vives. Registrarlo, hablar de ello y buscar apoyo es justo para lo que sirve esta app. La sabiduría de las mujeres yoruba que te precedieron — que atravesaron esta transición con la comunidad, la comida y la práctica cultural — es la base sobre la que se construye Aunty Mel.
  gp-advocacy:
    body: |-
      La investigación muestra de forma constante que, en la atención primaria del Reino Unido, a las mujeres negras se les toman menos en serio los síntomas de la menopausia y se les ofrece menos tratamiento. Está documentado, no es imaginación.

      Si tu médico no te toma en serio, tienes derecho a pedir una segunda opinión, a solicitar una derivación a un especialista en menopausia y a llevar por escrito tus síntomas. Llevar un diario de síntomas es tu herramienta más poderosa en esa conversación.
  vitamin-d-yoruba:
    body: |-
      La carencia de vitamina D es muy frecuente en las mujeres yoruba que viven en el Reino Unido. Sus síntomas — cansancio, dolor articular, ánimo bajo, mal sueño — se solapan mucho con los de la menopausia y los agravan.

      Primero el análisis (con tu médico), después el suplemento. La mayoría de las guías recomiendan 1000–2000 UI al día para las mujeres de origen africano en el Reino Unido, pero la dosis debe ajustarse a tu nivel real.
      AVISO: consulta siempre con tu médico antes de tomar más de la dosis estándar del NHS de 400 UI. El exceso de vitamina D es tóxico.
  iron-perimenopausal-bleeding:
    body: |-
      Si todavía tienes la regla y se ha vuelto más abundante, más frecuente o menos previsible — algo habitual en las mujeres yoruba que entran en la perimenopausia, que suelen tener más síntomas vasomotores en general —, es importante vigilar el hierro.

      Pide un hemograma completo. El cansancio es el primer signo de anemia por falta de hierro, y a menudo pasa desapercibido o se atribuye a la edad o al ajetreo.
      AVISO: no tomes suplementos de hierro sin hacerte antes un análisis. El exceso de hierro es perjudicial.
byTitle:
  Your body may be ahead of the calendar:
    title: Puede que tu cuerpo vaya por delante del calendario
    body: |-
      Las mujeres nigerianas suelen llegar a la menopausia antes que la media del Reino Unido, de 51 años. En las mujeres yoruba en concreto, los síntomas de la perimenopausia pueden empezar entre el principio y la mitad de los 40. Si te han dicho que eres «demasiado joven» para la menopausia, coméntaselo a tu médico: merece la pena estudiarlo cuanto antes.

      La visión yoruba de la mujer mayor como sabiduría y autoridad — como «iya» — tiene aquí un valor real. No estás perdiendo algo; estás entrando en ello.
