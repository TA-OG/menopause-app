# Traducción de cultural/location-modifiers/uk-diaspora.yaml — prevalece la versión en inglés.
byTitle:
  Vitamin D in the UK — this is not optional:
    title: "La vitamina D en el Reino Unido: no es opcional"
    body: |-
      Vengas de donde vengas, vivir en el Reino Unido cambia tu relación con la luz del sol. A la latitud del Reino Unido, la exposición a los rayos UV que sirve de algo (suficiente para que la piel produzca vitamina D) solo existe aproximadamente de abril a septiembre, e incluso entonces requiere mucho tiempo al sol sin protección.

      En las mujeres de piel más oscura — de origen africano, del sur de Asia, del este de Asia, de Oriente Medio —, la melanina necesita mucha más exposición a los rayos UV para producir la misma vitamina D. Por eso la carencia de vitamina D es muy frecuente entre las mujeres racializadas del Reino Unido, y gana importancia clínica en la menopausia, cuando su papel en la salud ósea, el ánimo, las articulaciones y el cansancio se vuelve más crítico.

      El NHS recomienda a todos los adultos del Reino Unido tomar un suplemento de 10 microgramos (400 UI) al día, sobre todo en otoño e invierno. Las mujeres de piel más oscura pueden necesitar más, pero lo correcto es empezar por un análisis.

      Pide a tu médico un análisis de sangre de vitamina D. Muchos médicos de cabecera del Reino Unido lo hacen si se lo pides directamente.
  Getting what you need from the NHS:
    title: Cómo conseguir lo que necesitas del NHS
    body: |-
      El NHS ofrece atención para la menopausia, pero la investigación muestra de forma constante que a las mujeres de minorías étnicas se les ofrece menos diagnóstico, tratamiento o derivación por síntomas de la menopausia. Es una desigualdad sanitaria documentada, no un fracaso personal.

      Pasos prácticos:
      - Lleva un diario de síntomas antes de la cita (frecuencia, intensidad, impacto en el trabajo, el sueño y las relaciones)
      - Usa palabras concretas: «Creo que puedo estar en la perimenopausia o la menopausia»
      - Pregunta directamente: «¿Qué opciones tengo para manejar estos síntomas?»
      - Si no te toman en serio, puedes pedir una segunda opinión o una derivación a una consulta de menopausia
      - Muchas zonas tienen consultas de menopausia del NHS: pide a tu médico que te derive

      Tienes derecho a esta atención. Aunty Mel te ayuda a preparar esas conversaciones.
  Finding traditional foods in the UK:
    title: Encontrar alimentos tradicionales en el Reino Unido
    body: |-
      Muchos alimentos tradicionales de tu cultura están disponibles en el Reino Unido, a menudo más de lo que crees. Gracias a las tiendas africanas y asiáticas, los mercados caribeños y los proveedores en línea, los ingredientes tradicionales se encuentran en la mayoría de las ciudades del Reino Unido y, cada vez más, en localidades pequeñas.

      Algunos especialmente útiles para la menopausia:
      - Egusi, ede (malanga), ugu fresco (hojas de calabaza), cangrejo de río seco: grandes ciudades del Reino Unido, en línea (Buy African Foods, Afro Market, etc.)
      - Plátano macho fresco o congelado: la mayoría de los grandes supermercados y las tiendas caribeñas y africanas
      - Polvo de baobab: Holland & Barrett, tiendas de dietética, en línea
      - Methi seco, atta, variedades de dal: tiendas de alimentación asiática en la mayoría de las localidades del Reino Unido
      - Tofu, miso, edamame: todos los grandes supermercados del Reino Unido
      - Polvo de moringa: tiendas de dietética, en línea

      Comer tus alimentos tradicionales no es incómodo ni anticuado: es culturalmente inteligente y, en muchos casos, nutricionalmente superior a la comida rápida occidental.
  Mental health support in the UK — and why it matters here:
    title: Apoyo en salud mental en el Reino Unido, y por qué importa aquí
    body: |-
      Los cambios de ánimo, la ansiedad y la niebla mental en la menopausia son frecuentes y están documentados clínicamente. En el Reino Unido, suelen ser la primera y la principal forma en que se manifiesta la menopausia, y a menudo se diagnostican por error como depresión o trastorno de ansiedad en lugar de reconocerse como síntomas de la menopausia.

      Si te han recetado antidepresivos por síntomas que empezaron hacia la edad de la perimenopausia, merece la pena preguntar si se tuvo en cuenta la menopausia. Algunos médicos plantearán un tratamiento para la menopausia junto con los antidepresivos, o en su lugar, para síntomas de ánimo que empezaron con los cambios hormonales.

      Recursos de salud mental del Reino Unido relacionados con la menopausia:
      - Tu médico de cabecera (pregunta específicamente por los cambios de ánimo relacionados con la menopausia)
      - El buscador de especialistas de la British Menopause Society (bms.thebms.org.uk)
      - Menopause Support UK (menopausesupport.co.uk)
      - Rethink Mental Illness (rethink.org): apoyo en salud mental con sensibilidad cultural
