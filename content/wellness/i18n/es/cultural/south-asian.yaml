# Traducción de cultural/south-asian.yaml — prevalece la versión en inglés.
items:
  dal-lentils-phytoestrogens:
    body: |-
      El dal — ya sea masoor, moong, chana o toor — es uno de los mejores alimentos que puedes tomar durante la menopausia. Las lentejas y las legumbres son ricas en fitoestrógenos (estrógenos vegetales) y en proteína vegetal. La investigación muestra que las mujeres con dietas naturalmente ricas en fitoestrógenos — habituales en la cocina del sur y del este de Asia — tienen sofocos menos frecuentes y menos intensos.

      Si el dal ya es algo diario en tu casa, es una ventaja nutricional importante. Mantenlo.
  turmeric-inflammation:
    body: |-
      La cúrcuma (haldi) usada a diario al cocinar tiene propiedades antiinflamatorias reales. La curcumina — su compuesto activo — se ha estudiado para el dolor articular, la salud del cerebro y el ánimo. Las cantidades que se usan al cocinar son beneficiosas pero modestas. Si el dolor articular es un síntoma principal, merece la pena priorizar cocinar a diario con cúrcuma y añadir pimienta negra (que aumenta mucho su absorción).
  ghee-fats-balance:
    body: |-
      El ghee es una grasa de cocina con gran importancia cultural y, en cantidades moderadas, no es un problema. En la menopausia, el problema suele ser la cantidad total de grasas saturadas, sobre todo si se combina con una alimentación rica en hidratos refinados. El descenso de los estrógenos cambia cómo se almacena la grasa, sobre todo en el abdomen.

      Equilibra la cocina con ghee con pescado azul, frutos secos y semillas (til/sésamo, lino) para apoyar el entorno hormonal. Las semillas de lino en particular son ricas en lignanos — una forma de fitoestrógeno — y pueden molerse y añadirse a la masa del roti o a las gachas.
  refined-carbs-blood-sugar:
    body: |-
      El arroz blanco y los alimentos a base de maida (roti blanco, paratha, naan) pueden provocar picos de azúcar que empeoran los sofocos, los cambios de humor y el cansancio. No se trata de eliminar las comidas de tu cultura, sino de equilibrarlas.

      Cambiar parte del arroz blanco por integral o rojo, usar atta de trigo integral y combinar siempre los hidratos con dal, verdura o proteína ralentiza mucho la respuesta de la glucosa. Cenar antes también ayuda al sueño y al control del peso en la menopausia.
  chai-caffeine:
    body: |-
      Un chai fuerte varias veces al día forma parte de la vida de muchas mujeres del sur de Asia, y el ritual social que lo rodea importa. La cafeína puede empeorar los sofocos y alterar el sueño durante la menopausia, sobre todo las tazas de la tarde y la noche.

      Plantéate cambiar uno o dos chais al día por infusiones: el té de jengibre y cardamomo tiene propiedades parecidas que dan calor, y la infusión de tulsi (albahaca sagrada) tiene propiedades adaptógenas que ayudan a la respuesta al estrés. El chai de la mañana puede quedarse.
  fenugreek-methi:
    body: |-
      El methi (fenogreco) — usado al cocinar y como especia — contiene fitoestrógenos y se ha utilizado durante siglos en la práctica ayurvédica para la salud de la mujer. Hay evidencia incipiente de su papel en el control de los sofocos y del azúcar en sangre. Usar semillas de methi al cocinar o beber agua con semillas de methi en remojo (una práctica tradicional) puede ser un añadido diario suave.
  joint-pain-movement:
    body: |-
      El dolor articular y muscular es el síntoma de la menopausia que más refieren las mujeres del sur y el este de Asia, por delante de los sofocos. Esto es importante porque puede atribuirse por error a la artrosis o minimizarse.

      El movimiento suave a diario — yoga, caminar, natación — es la intervención con más evidencia para el dolor articular asociado a la menopausia. Si creciste con el yoga como práctica cultural, es un puente valioso entre tu herencia y un bienestar basado en la evidencia.
  vitamin-d-south-asian-uk:
    body: |-
      Las mujeres del sur de Asia que viven en el Reino Unido tienen algunas de las tasas más altas de carencia de vitamina D, tanto por factores alimentarios como porque la melanina de la piel más oscura necesita más exposición al sol para producir la misma vitamina D. Los inviernos británicos apenas ofrecen exposición a los rayos UV, sea cual sea el tono de piel.

      La falta de vitamina D empeora directamente el dolor articular, el cansancio, la niebla mental y el ánimo, síntomas que ya están acentuados en la perimenopausia. Es algo sencillo y de gran impacto que conviene analizar y corregir.
  cultural-silence:
    body: |-
      En muchas comunidades del sur de Asia no se habla de la menopausia. Se alude a ella de forma indirecta, se minimiza o se asocia a la vergüenza de envejecer o al fin de la feminidad. Las mujeres pueden sentir que se espera de ellas que sigan adelante sin más.

      Puedes ponerle nombre a lo que estás viviendo. Puedes tomártelo en serio. El silencio sobre la menopausia en tu comunidad no significa que esta experiencia deba soportarse en soledad, sino que a esa conversación nunca se le dio permiso para existir. Este es ese permiso.
  family-expectation-stress:
    body: |-
      Muchas mujeres del sur de Asia en la perimenopausia gestionan a la vez responsabilidades de cuidado — padres mayores, hijos, familia extensa — mientras cargan con el trabajo emocional del hogar. Este estrés acumulado amplifica directamente los síntomas de la menopausia.

      Identificar un ámbito en el que puedas reducir tu carga, y hablar directamente con tu familia sobre lo que estás viviendo, no es una traición cultural: es cuidarte. Aunty Mel puede ayudarte a encontrar las palabras para esas conversaciones.
  calcium-bone-health:
    body: |-
      Las mujeres del sur de Asia tienen más riesgo de osteoporosis que las mujeres blancas británicas, agravado por la falta de vitamina D y una menopausia más temprana. La densidad ósea se construye en la juventud y se mantiene en la mediana edad; el descenso de los estrógenos en la menopausia acelera la pérdida ósea.

      Los lácteos (dahi, paneer, leche) ya forman parte de muchas dietas del sur de Asia y son una fuente excelente de calcio. Si tomas pocos lácteos, las semillas de sésamo (til), las almendras y las bebidas vegetales enriquecidas son buenas alternativas. El ejercicio con impacto (caminar, entrenamiento de fuerza) es tan importante como la dieta para la salud de los huesos.
      AVISO: habla con tu médico sobre los suplementos de calcio y vitamina D, sobre todo si tienes problemas de riñón.
byTitle:
  Your timeline may be earlier than you expect:
    title: Puede que tus tiempos sean más tempranos de lo que esperas
    body: |-
      La investigación muestra que las mujeres de origen del sur de Asia — sobre todo de origen indio, pakistaní y bangladesí — suelen llegar a la menopausia entre los 46 y los 47 años, a veces antes. Eso es 3–4 años antes que la media del Reino Unido.

      La perimenopausia puede empezar entre finales de los 30 y principios de los 40. Si tienes síntomas y tu médico te dice que eres demasiado joven, merece la pena compartir esta investigación. Una menopausia más temprana no es un fracaso, pero sí significa que importa tomar conciencia antes.
