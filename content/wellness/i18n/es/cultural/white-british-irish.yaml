# Traducción de cultural/white-british-irish.yaml — prevalece la versión en inglés.
items:
  fish-chips-acv:
    body: |-
      El fish and chips con vinagre: un clásico. El pescado en sí (bacalao, eglefino, solla) es una buena fuente de proteína magra y algo de omega-3. El rebozado y las patatas fritas son lo complicado en la menopausia: los fritos y los hidratos refinados pueden empeorar la hinchazón, los sofocos y la inestabilidad del azúcar en sangre.

      Un enfoque práctico: pescado al horno o a la plancha con una ración más pequeña de patatas, más a menudo, en lugar de una ración grande con menos frecuencia. El vinagre de manzana (el vinagre de malta sobre las patatas, o como bebida diaria diluido en agua) tiene cierta evidencia para el control del azúcar, aunque es modesta.
  tea-caffeine-timing:
    body: |-
      La cultura británica del té es real y su ritual importa. El té tiene menos cafeína que el café, pero suficiente para afectar al sueño y quizá contribuir a los sofocos si se toma en cantidad a lo largo del día.

      Un enfoque práctico: disfruta sin problema del té de la mañana y de primera hora de la tarde. Ten cuidado a partir de media tarde. Cambia uno o dos tés al día por infusiones: menta (también algo refrescante), manzanilla (favorece el sueño) o rooibos (sin cafeína, con el mismo ritual).
  sunday-roast-adapted:
    body: |-
      El asado del domingo es equilibrado: carne magra o alternativas vegetarianas, verduras y proteína. Lo que juega en contra en la menopausia: mucha salsa espesada con harina refinada, el relleno de pan blanco y el exceso de sal. Las verduras, sobre todo las de hoja verde y las crucíferas (brócoli, coliflor, coles de Bruselas), son excelentes.

      Apostar por una versión del asado con más verdura — más verde, raciones de hidratos más pequeñas — es una adaptación realista que mantiene intacta la comida tradicional.
  alcohol-culture:
    body: |-
      El alcohol está muy arraigado en la vida social británica, y una copa de vino o una pinta por la noche es normal para muchas mujeres. El alcohol empeora los sofocos, altera la estructura del sueño (incluso en cantidades moderadas) y afecta al ánimo al día siguiente: síntomas que ya están acentuados en la menopausia.

      Esto no significa dejar de beber en reuniones sociales. Significa ser sincera contigo misma sobre la relación entre una copa de vino y la calidad de tu noche. Las alternativas sin alcohol han mejorado muchísimo: para las noches en las que el sueño importa de verdad, merece la pena probarlas.
  processed-food-convenience:
    body: |-
      Los platos preparados, los sándwiches y la comida rápida forman parte, de forma realista, de una vida ajetreada en el Reino Unido. El problema en la menopausia es que muchas de estas opciones tienen mucha sal, hidratos refinados y poca fibra, y todo eso empeora los síntomas.

      En lugar de cambiar toda tu dieta, céntrate en uno o dos cambios de gran impacto: añadir un puñado de semillas o frutos secos a lo que comas, tener a mano hummus y bastones de verdura para picar, y elegir versiones integrales cuando las haya. Los cambios pequeños y constantes funcionan mejor que los grandes cambios a corto plazo.
  stoicism-british-culture:
    body: |-
      La cultura británica en torno a la salud suele ser de gestión discreta: no quejarse, no armar jaleo, seguir adelante. Muchas mujeres cuentan que sufrieron síntomas importantes de la menopausia durante años antes de pedir ayuda, o que fueron al médico y les dieron largas.

      Tus síntomas merecen tomarse en serio. Llevar un diario y ser concreta con tu médico sobre cómo te afectan en el día a día — trabajo, sueño, relaciones — no es armar jaleo. Es defender una atención a la que tienes derecho.
