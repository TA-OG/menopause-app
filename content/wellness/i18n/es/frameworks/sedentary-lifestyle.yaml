# Traducción de frameworks/sedentary-lifestyle.yaml — prevalece la versión en inglés.
df_sedentary_protein_preserve:
  title: La proteína es aún más importante si no haces ejercicio con regularidad
  body: >-
    La masa muscular se pierde más rápido en las mujeres que son sedentarias y además están en la menopausia: un doble golpe. Sin el estímulo del ejercicio de fuerza para activar la síntesis de proteína muscular, la proteína de la dieta se convierte en la principal palanca para frenar la pérdida de músculo. Intenta tomar 1,2–1,6 g de proteína por kg de peso corporal al día. Repártela entre las comidas — 25–30 g por comida en lugar de casi toda en la cena. No se trata de ganar músculo, sino de proteger el que tienes.
df_sedentary_anti_inflammatory:
  title: La comida como medicina antiinflamatoria — cuando el movimiento es limitado
  body: >-
    Cuando la movilidad está limitada, la alimentación hace más parte del trabajo de protección. Un patrón de alimentación antiinflamatorio (aceite de oliva, pescado azul, frutos del bosque, cúrcuma, jengibre, verduras de hoja verde oscuro, verduras de colores) ayuda a controlar la inflamación general que aumenta tanto con la menopausia como con la inactividad física. Reduce el dolor articular y el cansancio y favorece la salud metabólica. Son cambios accesibles sea cual sea tu capacidad física.
lf_sedentary_start_walking:
  title: Empieza con 10 minutos — no con 30
  body: >-
    La recomendación de 150 minutos de ejercicio a la semana es correcta, pero crea una barrera psicológica para las mujeres que ahora no son activas. El enfoque con más evidencia para empezar el hábito de moverse es comenzar con 10 minutos al día: lo bastante poco para que cueste decir que no, lo bastante para tener un efecto real. Un paseo de 10 minutos después de una comida al día mejora el azúcar en sangre, el ánimo y el sueño. A las 2 semanas, amplíalo a 15 minutos. El hábito va antes que la duración.
lf_sedentary_seated_movement:
  title: El ejercicio sentada cuenta — no lo subestimes
  body: >-
    Si tu movilidad es limitada, los ejercicios de fuerza sentada (sentadillas con silla, elevaciones de piernas sentada, ejercicios de tren superior con banda elástica sentada) mantienen la masa muscular y mejoran la circulación. El yoga en silla o para personas mayores (disponible gratis en YouTube) mejora la flexibilidad y el equilibrio, lo que reduce directamente el riesgo de caídas. El aquaeróbic (en la mayoría de las piscinas municipales) es excelente para el dolor articular, ya que el agua elimina el 90 % del impacto del peso corporal. Moverte, con la capacidad que tengas, es terapéutico.
lf_sedentary_break_sitting:
  title: Interrumpe el tiempo sentada cada 60–90 minutos — incluso 2 minutos ayudan
  body: >-
    Pasar mucho tiempo sentada (más de 8 horas al día) se asocia por sí solo a una peor salud metabólica, incluso en personas que también hacen ejercicio. Poner un temporizador para levantarte y moverte 2–3 minutos cada 60–90 minutos — ir a la cocina, ponerte de puntillas, marchar en el sitio — reduce este riesgo. No sustituye al ejercicio; es un hábito protector distinto y adicional. Una simple alarma del móvil sirve como recordatorio.
mr_sedentary_no_shame:
  title: Aquí no hay ningún fracaso — solo un punto de partida
  body: >-
    Las mujeres que ahora no son activas suelen arrastrar años de cuotas de gimnasio que no cuajaron, programas de ejercicio que parecían pensados para otra persona y mensajes interiorizados sobre disciplina y fuerza de voluntad. Nada de eso importa para el punto del que partes hoy. La inactividad física durante la menopausia es muy frecuente — y muy reversible. Un paseo de 10 minutos hoy vale más que un programa perfecto que nunca llega. Empieza exactamente desde donde estás.
mr_sedentary_pain_barrier:
  title: Si el dolor limita tu movimiento — merece atención médica
  body: >-
    Si el dolor articular, el dolor de espalda u otro problema físico es lo que te impide estar activa, merece la pena tratarlo con tu médico de cabecera en lugar de sortearlo. La fisioterapia suele estar cubierta para el dolor articular y es muchísimo más eficaz que el reposo en la mayoría de los casos. Una densitometría puede mostrar si la osteoporosis contribuye al dolor. El dolor que limita la actividad es un problema médico, no una elección de estilo de vida. Ataca el obstáculo en lugar de aceptarlo.
ss_creatine_muscle:
  title: Creatina monohidrato — ayuda a mantener el músculo con poco ejercicio
  body: >-
    La creatina monohidrato (3–5 g al día) es uno de los suplementos deportivos más estudiados y hay evidencia incipiente de que ayuda a preservar el músculo en personas mayores y mujeres posmenopáusicas, incluso sin hacer mucho ejercicio. También es prometedora para la función cognitiva y el cansancio. Es segura, barata y eficaz en este rango de dosis. Tómala con constancia: los efectos se van notando en 4–6 semanas, no de inmediato.
  disclaimer: >-
    La creatina se tolera muy bien en las dosis indicadas. Puede causar un pequeño aumento temporal de peso por la retención de agua en el músculo. Consulta con tu médico de cabecera antes de usarla si tienes una enfermedad renal, ya que la creatina sube los niveles de creatinina (un marcador de la función renal): no es perjudicial, pero puede dificultar la interpretación de los análisis de sangre.
