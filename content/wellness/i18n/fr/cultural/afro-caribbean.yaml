# Traduction de cultural/afro-caribbean.yaml — la version anglaise fait foi.
items:
  ackee-saltfish-sodium:
    body: |-
      L’ackee à la morue salée (ackee and saltfish) est un plat de base dans beaucoup de foyers caribéens, avec une forte importance culturelle. L’ackee lui-même est excellent sur le plan nutritionnel — riche en protéines et en bonnes graisses. En revanche, la morue salée peut être très riche en sodium, ce qui peut aggraver les ballonnements et la rétention d’eau, et contribuer aux variations de tension artérielle déjà plus fréquentes pendant la ménopause.

      Essayez de réduire la quantité de morue et de la faire dessaler plus longtemps. Assaisonnez avec des herbes fraîches et des épices plutôt qu’avec du sel de table. Vous gardez le plat et la tradition — simplement en ménageant davantage votre corps en ce moment.
  rice-peas-blood-sugar:
    body: |-
      Le rice and peas est un plat réconfortant de base. Les haricots rouges (pois d’Angole, haricots à œil noir) du plat sont excellents — riches en protéines végétales, en fibres et en phyto-œstrogènes, qui peuvent aider à gérer les symptômes vasomoteurs. C’est le riz qu’il faut surveiller. Passer au riz complet, ou réduire la part de riz blanc en augmentant celle des haricots, aide à stabiliser la glycémie, qui influence directement la fréquence des bouffées de chaleur et la stabilité de l’humeur.
  plantain-glycaemic:
    body: |-
      La banane plantain mûre est très appréciée mais a un index glycémique plus élevé. Si les bouffées de chaleur ou les sautes d’humeur sont importantes, essayez de la manger avec des protéines (poulet, poisson, haricots) plutôt que seule — les protéines ralentissent la réponse glycémique. La plantain verte est un meilleur choix pour l’équilibre de la glycémie.
  callaloo-magnesium:
    body: |-
      Le callaloo est vraiment excellent pendant la ménopause. Il est riche en magnésium (qui soutient le sommeil et réduit la fréquence des bouffées de chaleur), en fer, en calcium et en folates. Si vous n’en mangez pas régulièrement, il vaut la peine de le remettre au menu. La variété d’amarante utilisée dans les Caraïbes est particulièrement nutritive.
  sorrel-hibiscus:
    body: |-
      Le sorrel (hibiscus) est utilisé depuis des générations dans les traditions caribéennes et ouest-africaines. Les recherches soutiennent ses bienfaits pour la tension artérielle et ses propriétés antioxydantes. Le boire sans trop de sucre mérite d’être essayé — la boisson de sorrel traditionnelle de Noël peut se préparer avec moins de sucre tout en gardant sa richesse aromatique grâce aux clous de girofle, au gingembre et à la cannelle.
  coconut-oil-fats:
    body: |-
      L’huile et le lait de coco sont très utilisés dans la cuisine caribéenne et peuvent faire partie d’une alimentation saine en quantité modérée. Pendant la ménopause, la baisse des œstrogènes modifie la façon dont la graisse est traitée, en particulier au niveau du ventre. Un équilibre entre graisses de coco et poissons gras (maquereau, sardines, hareng), excellents pour la santé du cerveau et contre l’inflammation, fonctionne bien.
  stress-allostatic-load:
    body: |-
      Les recherches montrent que les femmes d’origine africaine et caribéenne portent une « charge allostatique » plus élevée — l’effet cumulé du stress chronique sur le corps, y compris celui de la discrimination raciale et de systèmes qui n’ont pas été pensés pour vous. Cette réponse au stress chronique peut amplifier les symptômes de la ménopause, en particulier les bouffées de chaleur, les troubles du sommeil et les changements d’humeur.

      Ce n’est pas une raison de simplement « mieux gérer son stress » — c’est la reconnaissance que vos symptômes peuvent être plus intenses parce que votre corps a porté davantage. Cela vaut la peine d’en parler à votre médecin, et de vous traiter avec bienveillance à ce sujet.
  hair-changes-menopause:
    body: |-
      L’affinement des cheveux et les changements de texture pendant la ménopause sont extrêmement fréquents et peuvent être particulièrement difficiles à vivre pour les femmes d’origine africaine et caribéenne, pour qui les cheveux sont profondément liés à l’identité et à l’expression culturelle. La baisse des œstrogènes, combinée aux effets du coiffage à la chaleur et des traitements chimiques, peut accentuer le phénomène.

      Les coiffures protectrices qui limitent les manipulations, le soin du cuir chevelu (massages réguliers, huile de ricin) et un apport suffisant en protéines et en fer sont des approches étayées, en complément de tout traitement local.
  speaking-up-gp:
    body: |-
      Les recherches en soins primaires au Royaume-Uni montrent que les femmes issues de minorités ethniques se voient moins souvent proposer un THM et que leurs symptômes sont moins souvent pris au sérieux. C’est une inégalité de santé documentée, pas une impression.

      Si vos symptômes sont importants, vous avez parfaitement le droit de défendre clairement vos besoins. Tenez un journal de vos symptômes avant le rendez-vous. Soyez précise sur l’impact dans votre vie quotidienne. Si votre médecin balaie vos plaintes, vous avez le droit de demander un deuxième avis ou une orientation vers un spécialiste de la ménopause. Aunty Mel peut vous aider à préparer ces échanges.
  community-and-isolation:
    body: |-
      Dans certaines communautés caribéennes, on ne parle pas ouvertement de la ménopause — elle peut être considérée comme une affaire privée, ou associée au vieillissement d’une manière stigmatisante. Vous pouvez avoir l’impression de ne pas pouvoir en parler avec les femmes qui vous entourent.

      Pourtant, la sagesse a toujours été là. Les tantes qui sont passées par là avant vous savaient. Trouver votre version de cette communauté — en ligne, entre amies ou grâce à cette appli — peut faire une vraie différence dans la façon dont vous vivez cette transition.
  vitamin-d-caribbean-uk:
    body: |-
      Les femmes d’origine africaine et caribéenne vivant au Royaume-Uni ont un risque nettement plus élevé de carence en vitamine D — la mélanine des peaux plus foncées demande une exposition au soleil plus longue pour produire la même quantité de vitamine D, et l’ensoleillement britannique est insuffisant la majeure partie de l’année.

      La carence en vitamine D aggrave la fatigue, l’humeur, les douleurs articulaires et le sommeil — autant de symptômes déjà accentués pendant la ménopause. Un dosage est possible auprès de votre médecin. La plupart des recommandations britanniques en dermatologie et sur la ménopause préconisent 1000–2000 UI par jour pour les femmes à la peau plus foncée au Royaume-Uni, mais faites d’abord un dosage avant de prendre des doses plus élevées.
      MISE EN GARDE : consultez toujours votre médecin avant de commencer des compléments, surtout à des doses supérieures à la recommandation standard du NHS de 400 UI.
  iron-monitoring:
    body: |-
      Si vous avez encore vos règles pendant la périménopause — elles peuvent être plus abondantes et plus irrégulières — surveiller votre fer est important. Les saignements abondants en périménopause sont plus fréquents chez les femmes noires et peuvent entraîner une anémie par carence en fer, qui aggrave nettement la fatigue.

      Demandez à votre médecin une numération formule sanguine si la fatigue est un symptôme important pour vous.
      MISE EN GARDE : consultez toujours votre médecin avant de commencer un complément de fer — trop de fer peut être nocif.
byTitle:
  Something important to know about your timeline:
    title: Une chose importante à savoir sur votre calendrier
    body: |-
      Les recherches montrent de façon constante que les femmes d’origine africaine et caribéenne arrivent généralement à la ménopause vers 49–50 ans — environ 18 mois plus tôt que la moyenne britannique de 51 ans. La périménopause peut donc commencer au début ou au milieu de la quarantaine (40 ans et quelques), parfois même à la fin de la trentaine (30 ans et quelques).

      Si l’on vous a dit que vous étiez « trop jeune » pour être en périménopause, ce n’est peut-être pas le cas. Il est utile de le savoir quand vous parlez à votre médecin.

      Une nuance à garder en tête : ce sont des moyennes issues de recherches en grande partie américaines, pas une prédiction de votre propre calendrier.
