# Traduction de cultural/communities/india-gujarati.yaml — la version anglaise fait foi.
items:
  dal-dhokli-legume-advantage:
    body: |-
      Le dal dhokli, le handvo et la grande variété de dals gujaratis offrent une excellente alimentation pour la ménopause. Les lentilles et les légumineuses sont riches en phyto-œstrogènes, en protéines végétales et en fibres. La présence régulière du dal dans la cuisine gujaratie, aux trois repas, est un avantage alimentaire naturel par rapport aux femmes qui suivent une alimentation occidentale pauvre en légumineuses.

      Les phyto-œstrogènes d’une alimentation gujaratie riche en dal contribuent peut-être déjà à gérer vos symptômes vasomoteurs sans que vous le sachiez.
  thepla-methi-phytoestrogens:
    body: |-
      Le thepla au methi (fenugrec) est un classique gujarati qui a un intérêt particulier pendant la ménopause. Le fenugrec est riche en phyto-œstrogènes et a été étudié pour son rôle dans la réduction de la fréquence des bouffées de chaleur et le soutien de la régulation de la glycémie. Un methi nu thepla au petit-déjeuner est un vrai choix nutritionnel, pas seulement culturel.
  undhiyu-seasonal-vegetables:
    body: |-
      L’undhiyu — le plat de légumes de saison et de lentilles — est l’un des plats les plus complets de la cuisine gujaratie sur le plan nutritionnel. L’association de différents légumes, de surti papdi (haricots plats), de tuvar (pois d’Angole) et de banane verte apporte un ensemble varié de phyto-œstrogènes, de fibres et de micronutriments. La banane verte (kacchi keri) apporte de l’amidon résistant, qui nourrit les bonnes bactéries intestinales.
  dhokla-fermented-gut:
    body: |-
      Le dhokla et le handvo sont des aliments fermentés (pâte de pois chiches fermentée) aux propriétés probiotiques. Les aliments fermentés soutiennent la santé du microbiote intestinal qui, selon des recherches émergentes, joue un rôle dans la façon dont le corps métabolise et recycle les œstrogènes. Garder des aliments gujaratis fermentés dans votre alimentation soutient la santé intestinale pendant la ménopause.
  jaggery-sugar-alternatives:
    body: |-
      La cuisine gujaratie est connue pour être légèrement sucrée — le jaggery (gol) est utilisé dans le dal, la sabzi et les en-cas. Le jaggery a un index glycémique un peu plus bas que le sucre raffiné et contient des oligo-éléments. Mais pendant la ménopause, la quantité totale de sucre — quelle qu’en soit la source — influence la stabilité de la glycémie et peut aggraver les bouffées de chaleur.

      Utiliser moins de jaggery que ne l’indiquent les recettes traditionnelles, et manger les plats sucrés avec une source de protéines, modère l’effet sur la glycémie.
  chaas-buttermilk-calcium:
    body: |-
      Le chaas (babeurre épicé) est une boisson gujaratie de base et une bonne source de calcium, de protéines et de probiotiques. Boire du chaas après les repas aide la digestion et contribue à l’apport en calcium nécessaire pour protéger la densité osseuse pendant la ménopause. Le cumin et le gingembre du chaas ont aussi des propriétés digestives et anti-inflammatoires.
  til-sesame-calcium-phytoestrogens:
    body: |-
      Le til (graines de sésame) est utilisé partout dans la cuisine et les en-cas gujaratis — til ladoo, tilgul, ou en garniture. Les graines de sésame sont riches en calcium (important pour la santé des os) et contiennent des lignanes, une forme de phyto-œstrogènes. C’est un apport nutritionnel modeste mais réel, venu d’un aliment profondément ancré dans la culture.
  jain-dietary-context:
    body: |-
      Pour les femmes gujaraties jaïnes, les restrictions alimentaires (pas de légumes racines à certaines périodes, pas de viande) signifient que les sources végétales de protéines et de calcium demandent une attention particulière pendant la ménopause.

      Les produits laitiers (paneer, dahi, chaas), les graines de sésame, les amandes, les graines de courge, les légumes à feuilles vertes et les lentilles sont des sources de calcium et de protéines compatibles avec le jaïnisme, qui soutiennent l’alimentation pendant la ménopause dans le respect de la pratique religieuse.
  cvd-metabolic-gujarati:
    body: |-
      Les femmes d’Asie du Sud, y compris les femmes gujaraties, ont des taux nettement plus élevés de syndrome métabolique, de résistance à l’insuline et de risque cardiovasculaire pendant la transition ménopausique. C’est cliniquement documenté, et cela veut dire que surveiller la tension artérielle et la glycémie est important pendant cette période.
  community-expectations:
    body: |-
      Les femmes gujaraties portent souvent de grandes responsabilités familiales et communautaires — entreprises familiales, foyers élargis, réseaux communautaires. L’attente de productivité et de maîtrise de soi peut rendre difficile de nommer votre propre vécu de la ménopause ou d’en faire une priorité.

      Vous pouvez rester fidèle aux valeurs de votre communauté et prendre vos symptômes au sérieux. Les deux sont vrais.
  vitamin-d-gujarati:
    body: |-
      La carence en vitamine D est fréquente chez les femmes gujaraties au Royaume-Uni.
      Faites un dosage auprès de votre médecin avant de prendre plus que les niveaux standard du NHS.
      MISE EN GARDE : l’excès de vitamine D est toxique. Faites un dosage, puis supplémentez de façon adaptée.
byTitle:
  Your menopause may start earlier — and your diet is already an asset:
    title: Votre ménopause peut arriver plus tôt — et votre alimentation est déjà un atout
    body: |-
      Les femmes indiennes arrivent généralement à la ménopause vers 46,7 ans — 4 ans plus tôt que la moyenne britannique. La périménopause peut commencer à la fin de la trentaine (30 ans et quelques).

      La cuisine gujaratie est largement végétale et riche en légumineuses — c’est un vrai avantage nutritionnel pour gérer les symptômes de la ménopause. Votre alimentation traditionnelle fait déjà un travail dont vous n’aviez peut-être pas conscience.
