# Traduction de cultural/communities/india-punjabi.yaml — la version anglaise fait foi.
items:
  dal-legumes-phytoestrogens:
    body: |-
      Le dal — masoor, moong, chana, toor, urad — est la base nutritionnelle de la cuisine pendjabie et l’un des meilleurs aliments pour la ménopause. Les lentilles et les légumineuses sont riches en phyto-œstrogènes (œstrogènes végétaux), en protéines végétales, en fibres et en fer.

      Les femmes dont l’alimentation est riche en légumineuses ont tendance à avoir des bouffées de chaleur moins nombreuses et moins intenses. Si le dal fait déjà partie du quotidien chez vous, c’est un vrai avantage. Le dal makhani (urad noir) apporte à la fois des protéines et du fer. Gardez-le au menu régulièrement.
  sarson-da-saag-greens:
    body: |-
      Le sarson da saag (feuilles de moutarde) est un classique de l’hiver pendjabi qui a un vrai intérêt pendant la ménopause. Les feuilles de moutarde sont riches en calcium (essentiel quand les œstrogènes baissent), en vitamine K (santé des os), en folates et en antioxydants. Traditionnellement, on le mange avec du makki di roti (galette de maïs) — le maïs est plus riche en fibres que la farine de blé blanche, avec une réponse glycémique plus faible.

      Ce plat d’hiver traditionnel mérite d’être mangé toute l’année pendant la ménopause, pas seulement en saison.
  ghee-moderation:
    body: |-
      Le ghee a une importance culturelle et nutritionnelle dans la cuisine pendjabie — les foyers sikhs et hindous en particulier l’utilisent généreusement. En quantité modérée, le ghee ne pose pas de problème. Mais pendant la ménopause, la baisse des œstrogènes modifie la façon dont la graisse est métabolisée et stockée, en particulier au niveau du ventre.

      Les recherches sur les femmes d’Asie du Sud montrent des taux plus élevés d’obésité abdominale et de syndrome métabolique précisément pendant la transition ménopausique. Cela ne veut pas dire supprimer le ghee — mais l’utiliser en connaissance de cause, avec d’autres bonnes graisses (huile de moutarde, noix, graines de lin), plutôt que comme matière grasse principale.
  paneer-calcium-protein:
    body: |-
      Le paneer est un excellent aliment pour la ménopause — riche en calcium et en protéines, et un peu plus pauvre en lactose que le lait. Le calcium est essentiel pendant la ménopause pour entretenir la densité osseuse. Le palak paneer (aux épinards) associe calcium, fer et vitamine C dans un même plat. Le mutter paneer apporte des protéines et des glucides végétaux.

      Si vous êtes intolérante au lactose (fréquent chez les personnes d’Asie du Sud), de petites quantités de paneer sont en général mieux tolérées que les produits laitiers liquides.
  roti-chapati-refined-carbs:
    body: |-
      Le roti et le chapati de blé blanc sont au cœur de l’alimentation pendjabie. Pendant la ménopause, la gestion de la glycémie devient particulièrement importante pour les femmes d’Asie du Sud — les recherches documentent des taux nettement plus élevés de résistance à l’insuline et de syndrome métabolique chez elles pendant la transition ménopausique.

      Ajustements pratiques : mélangez de l’atta complet à votre atta habituel (50/50) pour augmenter les fibres. Mangez le roti avec beaucoup de dal, de sabzi ou de protéines — les protéines et les fibres ralentissent la réponse glycémique. Ne réduisez pas seulement le roti ; augmentez ce que vous mangez avec.
  chai-caffeine-south-asian:
    body: |-
      Un chai pendjabi bien fort — souvent préparé avec du lait entier, du sucre et de la cardamome — plusieurs fois par jour occupe une place centrale dans la culture. La caféine peut aggraver les bouffées de chaleur et perturber le sommeil pendant la ménopause, surtout à partir de l’après-midi.

      Réduire le sucre dans le chai a le plus d’impact. Remplacer le chai de l’après-midi et du soir par du lait au curcuma (haldi doodh) a une résonance culturelle et apporte en plus des bienfaits anti-inflammatoires. Le chai du matin peut rester tel quel.
  turmeric-haldi-inflammation:
    body: |-
      Le curcuma (haldi), utilisé partout dans la cuisine pendjabie, est réellement anti-inflammatoire. La curcumine — son composé actif — est bien mieux absorbée avec du poivre noir (kali mirch) et des matières grasses. La cuisine pendjabie traditionnelle les associe déjà (les bases de curry utilisent du ghee et du poivre avec le haldi).

      Le haldi doodh (lait doré) le soir apporte des bienfaits anti-inflammatoires et soutient le sommeil grâce au tryptophane du lait chaud. Une pratique traditionnelle vraiment utile.
  lassi-probiotic:
    body: |-
      Le lassi salé traditionnel (pas la version sucrée à la mangue) est un aliment probiotique qui soutient la santé intestinale. La santé intestinale est de plus en plus liée à la façon dont le corps traite et recycle les œstrogènes. Un verre de lassi salé au cumin est un vrai soutien. Les lassis sucrés du commerce ajoutent beaucoup de sucre, ce qui annule le bénéfice.
  cvd-risk-south-asian:
    body: |-
      Les femmes d’Asie du Sud présentent des taux nettement plus élevés de facteurs de risque cardiovasculaire pendant la transition ménopausique — syndrome métabolique, résistance à l’insuline, diabète, obésité abdominale et hypertension sont tous plus fréquents chez elles que chez les femmes blanches européennes pendant cette période.

      Ce n’est pas alarmiste — c’est cliniquement documenté, et cela veut dire que prendre la ménopause au sérieux, surveiller la tension artérielle et la glycémie et agir sur son mode de vie compte plus, et non moins, pour les femmes d’Asie du Sud.
  joint-pain-prominent:
    body: |-
      Les douleurs articulaires et musculaires sont un symptôme de la ménopause plus marqué chez les femmes d’Asie du Sud que chez les femmes blanches. Elles sont souvent attribuées à l’arthrose ou minimisées. Si vous avez des douleurs articulaires en plus d’autres symptômes de la ménopause, parlez des deux à votre médecin.

      Le mouvement quotidien — yoga (qui a une résonance culturelle), marche, natation — est l’intervention la mieux étayée contre les douleurs articulaires liées à la ménopause.
  cultural-silence-punjabi:
    body: |-
      Dans beaucoup de foyers pendjabis — sikhs, hindous et musulmans — on ne parle pas ouvertement de la ménopause. « Chup raho » (tais-toi) peut devenir le scénario culturel. On attend des femmes qu’elles gèrent et continuent.

      Ce silence n’est pas la tradition au sens profond — c’est l’absence de mots et d’espace. Aunty Mel est un espace où vous pouvez nommer ce qui se passe, le comprendre et le prendre au sérieux. Vous en avez le droit.
  hrt-access-gap:
    body: |-
      Les recherches montrent que seulement 6,2 % des femmes asiatiques au Royaume-Uni reçoivent un THM, contre 23,3 % des femmes blanches. Cet écart reflète des obstacles d’accès et de langue, des hésitations culturelles et peut-être des idées reçues de médecins sur ce que veulent les femmes d’Asie du Sud.

      Le THM est un traitement médical, pas un traitement « occidental ». Si vos symptômes affectent nettement votre qualité de vie, interroger votre médecin sur toutes les options disponibles — y compris le THM — est votre droit. Aunty Mel vous aide à préparer cette conversation.
  vitamin-d-south-asian-uk:
    body: |-
      Les femmes d’Asie du Sud au Royaume-Uni ont parmi les taux de carence en vitamine D les plus élevés. La vitamine D alimentaire est limitée dans les alimentations sud-asiatiques traditionnelles (peu de poissons gras, peu d’aliments enrichis). L’exposition au soleil, à travers les vêtements et sous le climat britannique, est minime.

      La carence en vitamine D aggrave les douleurs articulaires, la fatigue, l’humeur et la santé des os — autant de points déjà fragilisés pendant la ménopause. Faites un dosage auprès de votre médecin. La plupart des recommandations suggèrent 1000–2000 UI pour les femmes d’Asie du Sud au Royaume-Uni, mais faites d’abord un dosage.
      MISE EN GARDE : consultez toujours votre médecin. L’excès de vitamine D est toxique.
  calcium-bone-health-punjabi:
    body: |-
      Les femmes d’Asie du Sud ont des taux d’ostéoporose plus élevés que les femmes blanches au Royaume-Uni. Une ménopause plus précoce aggrave ce risque — davantage d’années sans l’effet protecteur des œstrogènes sur les os. Les produits laitiers (paneer, dahi, lait), les graines de sésame (til), les amandes et les légumes à feuilles vert foncé sont les sources alimentaires de calcium à privilégier.
      MISE EN GARDE : parlez de la supplémentation en calcium et en vitamine D avec votre médecin.
byTitle:
  Your menopause may start earlier than you expect:
    title: Votre ménopause peut arriver plus tôt que vous ne le pensez
    body: |-
      Les femmes indiennes et pakistanaises arrivent à la ménopause nettement plus tôt que la moyenne britannique. En moyenne 46,7 ans pour les femmes indiennes et 47,16 ans pour les femmes pakistanaises — dans les deux cas 3–4 ans avant la moyenne britannique de 51 ans.

      La périménopause peut donc commencer à la fin de la trentaine ou au début de la quarantaine (30 à 40 ans et quelques). À cet âge, les symptômes sont souvent mis sur le compte du stress, de la dépression ou de la thyroïde.

      Si vous avez 40 ans et quelques et que vous avez des bouffées de chaleur, des troubles du sommeil, des changements d’humeur, des règles irrégulières ou des douleurs articulaires — cela pourrait être la périménopause. Insistez pour être prise au sérieux.
