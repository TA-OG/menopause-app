# Traduction de cultural/communities/nigeria-hausa.yaml — la version anglaise fait foi.
items:
  fura-da-nono-probiotic-calcium:
    body: |-
      Le fura da nono — la boisson peule de lait fermenté, faite de boulettes de mil et de lait de vache fermenté — a un vrai intérêt nutritionnel pour les femmes ménopausées. Il apporte du calcium (essentiel pour la densité osseuse quand les œstrogènes baissent), des bactéries probiotiques (qui soutiennent la santé intestinale et pourraient améliorer le métabolisme des phyto-œstrogènes) et des protéines.

      Si vous y avez accès, c’est l’un des aliments traditionnels les plus pertinents pour cette étape de la vie. Si vous le préparez chez vous, c’est la fermentation qui compte le plus sur le plan nutritionnel.
  tuwo-shinkafa-grain-staple:
    body: |-
      Le tuwo shinkafa (pâte ou boule de riz) est l’accompagnement de base du Nord, mangé avec toutes sortes de soupes. Les plats de base à base de riz sont en général plus faciles à digérer que les accompagnements plus lourds. Manger le tuwo avec du miyan kuka (soupe de feuilles de baobab) ou du miyan taushe (soupe de potiron) donne un repas équilibré.

      Pendant la ménopause, la stabilité de la glycémie compte. Associer le tuwo à des soupes riches en protéines, et réduire la portion de tuwo en augmentant celle de soupe, modère la réponse glycémique.
  miyan-kuka-baobab:
    body: |-
      Le miyan kuka (soupe de feuilles de baobab) est riche en calcium, en fer, en vitamine C et en antioxydants. Le baobab — appelé « l’arbre de vie » dans toute l’Afrique subsaharienne — a l’une des teneurs en vitamine C les plus élevées de tous les aliments. La vitamine C favorise l’absorption du fer et le fonctionnement du système immunitaire, deux points importants pendant la ménopause.

      La poudre de baobab est désormais aussi vendue dans les magasins diététiques au Royaume-Uni — une cuillère à café ajoutée à un smoothie ou à un porridge apporte un vrai supplément de nutriments.
  masa-tsamiya-sorghum:
    body: |-
      Le masa (galettes de riz fermenté) et le tsamiya (tamarin) font partie de la culture haoussa des en-cas. Les aliments fermentés soutiennent la santé intestinale. Le tamarin a des propriétés antioxydantes. Les aliments à base de sorgho (burukutu, tuwo dawa) sont plus riches en fibres et ont un index glycémique plus bas que le riz blanc, ce qui en fait un meilleur choix pendant la ménopause pour gérer la glycémie.
  suya-kilishi-protein:
    body: |-
      Le suya (bœuf ou poulet grillé épicé) et le kilishi (viande séchée épicée) sont riches en protéines — importantes pendant la ménopause, quand l’entretien de la masse musculaire devient plus crucial. Le mélange d’épices (épice suya/tankora) contient des arachides, du gingembre et d’autres épices aux propriétés anti-inflammatoires.

      Le suya des vendeurs de rue est souvent très salé. Si vous le faites chez vous, réduire le sel en gardant les épices soutient la santé cardiovasculaire, qui devient plus importante après la ménopause, quand l’effet protecteur des œstrogènes sur le cœur diminue.
  groundnuts-legumes:
    body: |-
      Les arachides (kulikuli, soupe d’arachide, huile d’arachide) sont au cœur de la cuisine du nord du Nigeria et apportent des protéines, de bonnes graisses et quelques phyto-œstrogènes. L’huile d’arachide est un meilleur choix de cuisson que les huiles végétales raffinées. La soupe d’arachide avec des céréales apporte une énergie durable et une glycémie stable.
  purdah-vitamin-d:
    body: |-
      Pour les femmes haoussa-peules qui pratiquent le purdah ou qui se couvrent entièrement à l’extérieur, la carence en vitamine D est un risque de santé important. Une exposition au soleil limitée, associée à une peau foncée, signifie que la production de vitamine D est minime au Royaume-Uni.

      La carence en vitamine D aggrave directement les douleurs articulaires, la fatigue, la santé des os et l’humeur pendant la ménopause — autant de symptômes déjà plus fréquents. C’est une question médicale importante à aborder avec votre médecin, quelle que soit votre façon de vous habiller.
  community-women-network:
    body: |-
      Les réseaux communautaires des femmes haoussa — informels et formels — ont toujours été des espaces importants où les femmes partagent leurs savoirs sur la santé. La notion de « sadaka » (charité et soin de la communauté) s’étend au partage des connaissances sur la santé.

      Chercher des informations sur la ménopause auprès des femmes de votre communauté qui l’ont déjà vécue est une source de soutien légitime et précieuse, en complément de conseils fondés sur les données.
  islamic-framing-natural-process:
    body: |-
      Dans la tradition savante islamique, la ménopause est comprise comme une étape naturelle du cycle de vie créé par Allah — la fin d’une responsabilité (porter des enfants) et la libération d’énergie pour d’autres formes de contribution et d’adoration. Ce regard positif a une vraie valeur pour le bien-être.

      Votre foi ne vous demande pas de subir vos symptômes en silence. Chercher à connaître votre corps et chercher à soulager vos symptômes est conforme aux principes islamiques qui considèrent le corps comme une amanah (un dépôt confié).
  discussing-sexual-health:
    body: |-
      Parler de santé sexuelle — y compris des changements de libido, de la sécheresse vaginale ou des douleurs pendant les rapports — peut être très difficile dans les contextes culturels haoussa-peuls, où ces sujets relèvent de l’intime.

      Dans la confidentialité de cette appli, vous pouvez suivre et comprendre ces changements sans rien divulguer. S’ils sont importants et affectent votre vie, parler en toute confidentialité à une femme médecin est votre droit. Ces changements sont médicaux, il existe des solutions fondées sur les données, et vous méritez d’y avoir accès.
  calcium-bone-health-hausa:
    body: |-
      L’alimentation haoussa-peule traditionnelle est l’une des plus riches en calcium d’Afrique de l’Ouest grâce aux produits laitiers (fura da nono, lait). C’est un vrai avantage pour la santé des os pendant la ménopause. Gardez ces habitudes alimentaires et parlez à votre médecin d’une ostéodensitométrie (DEXA) si votre ménopause est précoce ou si vous avez des antécédents familiaux d’ostéoporose.
      MISE EN GARDE : parlez de la supplémentation en calcium avec votre médecin.
  vitamin-d-hausa:
    body: |-
      La carence en vitamine D est particulièrement fréquente chez les femmes haoussa au Royaume-Uni.
      Faites un dosage auprès de votre médecin avant de prendre des doses plus élevées.
      MISE EN GARDE : consultez toujours votre médecin. L’excès de vitamine D est toxique.
byTitle:
  Your diet is already doing some of the work:
    title: Votre alimentation fait déjà une partie du travail
    body: |-
      L’alimentation haoussa-peule traditionnelle — riche en céréales, en légumineuses et en produits laitiers fermentés — offre des avantages nutritionnels naturels pendant la ménopause. Le fura da nono (boisson de lait fermenté) en particulier apporte du calcium, des probiotiques et des protéines qui soutiennent la santé des os pendant la baisse des œstrogènes à la ménopause.

      Les femmes nigérianes ont tendance à arriver à la ménopause plus tôt que la moyenne occidentale de 51 ans. Si vous avez 40 ans et quelques et que vous remarquez des changements, prenez-les au sérieux.
