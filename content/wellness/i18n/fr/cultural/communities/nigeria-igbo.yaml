# Traduction de cultural/communities/nigeria-igbo.yaml — la version anglaise fait foi.
items:
  bitter-leaf-ofe-onugbu:
    body: |-
      L’ofe onugbu (soupe de feuilles amères) est un plat typiquement igbo, et des recherches émergentes soutiennent ses propriétés anti-inflammatoires et régulatrices de la glycémie. La feuille amère (Vernonia amygdalina) est utilisée depuis des générations dans la médecine traditionnelle igbo et, plus largement, ouest-africaine. Pendant la ménopause, quand gérer l’inflammation et stabiliser la glycémie comptent tous les deux, c’est un plat à privilégier.

      L’association igbo traditionnelle de la soupe de feuilles amères avec du taro (cocoyam) ou de l’eba apporte des fibres, des composés végétaux et des protéines.
  oha-soup-nutrients:
    body: |-
      La soupe d’oha (préparée avec des feuilles d’oha, ou « bois de rose africain ») est riche en calcium, en fer et en vitamine C — tous importants pendant la transition ménopausique, quand la densité osseuse, l’énergie et l’immunité évoluent. Les feuilles d’oha sont aussi riches en fibres.

      Si vous trouvez facilement de l’oha (dans les épiceries africaines au Royaume-Uni), c’est une soupe excellente sur le plan nutritionnel, à manger régulièrement.
  egusi-protein-zinc:
    body: |-
      L’egusi (graines de melon) — utilisé dans les cuisines igbo, yoruba et d’autres cuisines d’Afrique de l’Ouest — est riche en zinc, en protéines et en bonnes graisses. Le zinc est essentiel à la synthèse de la testostérone (qui influence l’énergie et la libido des femmes pendant la ménopause) et au système immunitaire. La soupe d’egusi aux légumes verts est un repas vraiment nutritif pour la ménopause.
  yam-fufu-blood-sugar:
    body: |-
      Le fufu, l’eba et l’igname pilée sont les accompagnements de base igbo. Ils ont une importance culturelle et une vraie valeur nutritionnelle — l’igname contient des composés qui soutiennent l’équilibre hormonal. Mais de grosses portions de glucides raffinés, sans assez de légumes ou de protéines, peuvent faire grimper la glycémie, ce qui aggrave les bouffées de chaleur et l’instabilité de l’humeur.

      L’approche igbo traditionnelle des repas riches en soupe (plus de soupe, moins d’accompagnement) modère cela naturellement. Suivez l’équilibre traditionnel plutôt que de l’occidentaliser.
  palm-nut-soup-abenkwan-banga:
    body: |-
      La soupe de noix de palme (ofe akwu) est nutritive et importante culturellement. Les noix de palme apportent de la vitamine E et du bêta-carotène. Pendant la ménopause, la question est l’équilibre global des graisses saturées — complétez la cuisine riche en huile de palme avec des poissons gras (sardines, maquereau, thon) et des légumes à feuilles vert foncé pour l’équilibre en oméga-3.
  ukazi-afang-leafy-greens:
    body: |-
      Les feuilles d’ukazi (utilisées dans la soupe afang et comme épaississant) sont riches en fer et en fibres. La soupe afang — un mélange d’ukazi et de waterleaf — est l’une des soupes les plus denses en nutriments de la cuisine de l’est du Nigeria. Pour les femmes qui font face à la fatigue de la périménopause ou à des saignements abondants, sa teneur en fer est vraiment utile.
  abacha-african-salad:
    body: |-
      L’abacha (salade africaine à base de manioc séché) est un plat igbo plus léger, souvent préparé avec de l’aubergine africaine (garden egg), de l’oignon, des écrevisses séchées et de l’huile de palme. Il contient moins de glucides que les repas à base d’accompagnements, ce qui en fait une option utile pour gérer la glycémie et les changements de poids au niveau du ventre pendant la ménopause. L’aubergine africaine a aussi des propriétés antioxydantes documentées.
  vitamin-d-igbo-uk:
    body: |-
      Les femmes igbo vivant au Royaume-Uni — comme toutes les femmes d’origine africaine — ont un risque élevé de carence en vitamine D, parce que la mélanine demande plus d’exposition au soleil et que les UV sont rares au Royaume-Uni en dehors des mois d’été.

      La fatigue, les douleurs articulaires, le moral en berne et les problèmes osseux sont tous aggravés par la carence en vitamine D — et tous déjà accentués pendant la ménopause. Faire un dosage et corriger la carence est une action simple et à fort impact.
  nkwobi-okonkwo-social:
    body: |-
      La culture culinaire igbo est profondément sociale — le nkwobi, l’isi ewu et l’ofe sont souvent des plats partagés lors des rassemblements. Cette dimension collective du repas a une vraie valeur pour le bien-être pendant la ménopause. Le lien social, le soutien émotionnel et le partage autour de la nourriture sont des protections documentées contre l’isolement qui peut accompagner un grand changement hormonal.

      Ne sous-estimez pas la médecine que représente votre communauté.
  igbo-women-strength:
    body: |-
      Les femmes igbo sont connues pour leur résilience, leur sens de l’entreprise et leur rôle de leaders dans la communauté. Cette force peut parfois vouloir dire traverser les difficultés en silence — « onye aghala nwanne ya » (n’abandonne pas les tiens) peut devenir un poids quand cela signifie ne pas demander d’aide pour soi.

      Prendre vos symptômes de la ménopause au sérieux — les suivre, chercher du soutien et défendre vos besoins auprès de votre médecin — n’est pas une faiblesse. C’est la même intelligence et la même détermination qui ont fait entrer la révolte des femmes d’Aba (Aba Women’s Riot) dans l’histoire. Vous méritez que cette énergie soit tournée vers votre propre corps.
  vitamin-d-testing:
    body: |-
      Dosage de la vitamine D, et supplémentation en cas de carence. Particulièrement important pour les femmes igbo au Royaume-Uni, qui ont des taux de carence élevés en raison de la couleur de peau et du climat britannique.
      MISE EN GARDE : faites un dosage avant de prendre plus de 400 UI. L’excès de vitamine D est toxique. Parlez-en à votre médecin.
byTitle:
  Your timeline and your symptoms may be earlier than expected:
    title: Votre calendrier et vos symptômes arrivent peut-être plus tôt que prévu
    body: |-
      Les femmes nigérianes arrivent généralement à la ménopause plus tôt que la moyenne britannique de 51 ans. La périménopause peut commencer au début ou au milieu de la quarantaine (40 ans et quelques). La vision igbo de la féminité comme porteuse de sagesse, de force et de communauté — « nwanyi oma » — peut être un vrai point d’ancrage pendant cette transition.

      Vous ne perdez pas votre force. Elle change de forme.
