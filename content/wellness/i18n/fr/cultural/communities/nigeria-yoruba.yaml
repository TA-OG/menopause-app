# Traduction de cultural/communities/nigeria-yoruba.yaml — la version anglaise fait foi.
items:
  amala-yam-hormones:
    body: |-
      L’amala — l’accompagnement yoruba très apprécié, préparé à partir de farine d’igname séchée — a un vrai intérêt nutritionnel pendant la ménopause. Des recherches nutritionnelles nigérianes montrent que l’igname contient des composés qui pourraient aider à équilibrer les hormones qui changent à la ménopause, et qu’elle a des propriétés anti-inflammatoires. L’amala servie avec de l’ewedu et du gbegiri forme un repas équilibré, riche en fibres, qui soutient la stabilité de la glycémie.

      Plus l’amala est foncée (faite avec l’écorce de l’igname non épluchée), plus elle est riche en fibres. C’est un plat que vous pouvez garder au menu sans arrière-pensée.
  ewedu-gbegiri-nutrients:
    body: |-
      L’ewedu (feuilles de jute) est l’un des légumes les plus nutritifs de la cuisine yoruba — riche en calcium, en fer et en vitamine C. Tous sont particulièrement importants pendant la ménopause, quand la densité osseuse commence à changer et que les besoins en énergie évoluent. Le gbegiri (soupe de haricots à œil noir) ajoute des protéines végétales et des phyto-œstrogènes.

      L’association ewedu, gbegiri et sauce, servie avec de l’amala ou de l’igname pilée, est — sur le plan nutritionnel — un excellent repas pour la ménopause.
  efo-riro-leafy-greens:
    body: |-
      L’efo riro (soupe de légumes yoruba) au tete (feuilles d’amarante) ou aux épinards est riche en magnésium, qui soutient la qualité du sommeil et pourrait réduire la fréquence des bouffées de chaleur. L’association de l’huile de palme (vitamine E, bêta-carotène) et des légumes à feuilles vert foncé apporte des vitamines liposolubles que le corps assimile bien.

      Préparez l’efo riro avec moins d’huile si la prise de poids au niveau du ventre vous préoccupe — ce sont les légumes verts qui comptent sur le plan nutritionnel, pas la quantité d’huile.
  pounded-yam-blood-sugar:
    body: |-
      L’igname pilée (iyan) est centrale dans la culture et nutritive, mais elle a un impact glycémique plus élevé en grosses portions. Pendant la ménopause, la stabilité de la glycémie influence directement la fréquence des bouffées de chaleur et l’humeur.

      Un ajustement pratique : des portions d’igname pilée plus petites avec plus de soupe. L’ewedu, l’egusi ou l’efo riro peuvent constituer la plus grande partie. Le repas et la culture restent intacts, tout en tenant compte des besoins changeants de votre corps.
  pepper-spice-triggers:
    body: |-
      La cuisine yoruba est connue pour être bien pimentée — l’ata rodo (piment scotch bonnet), l’ata ijosi et divers piments séchés lui donnent son piquant caractéristique. La nourriture épicée peut déclencher des bouffées de chaleur chez certaines femmes pendant la ménopause — pas toutes, et pas toujours. Observez si vous avez une bouffée de chaleur dans les 30–60 minutes qui suivent un repas particulièrement pimenté.

      S’il y a un lien, vous n’êtes pas obligée de renoncer au piment — ajustez la quantité et observez si c’est la chaleur du piment ou celle de la ménopause qui déclenche la bouffée.
  palm-oil-balance:
    body: |-
      L’huile de palme est présente partout dans la cuisine yoruba et apporte de la vitamine E, du bêta-carotène et des graisses saturées. Dans le contexte des changements d’œstrogènes de la ménopause — qui modifient la façon dont la graisse est métabolisée et stockée — une utilisation modérée de l’huile de palme ne pose pas de problème. L’essentiel est l’ensemble : complétez la cuisine à l’huile de palme avec des poissons gras (maquereau, sardines, thon) pour l’équilibre en oméga-3, qui soutient la santé du cerveau et la gestion de l’inflammation.
  offal-iron:
    body: |-
      La cuisine yoruba fait un excellent usage des abats — shaki (tripes), ponmo (peau de vache), kpomo et organes. Le foie en particulier est très riche en fer, ce qui est important si vous avez encore des règles de périménopause, parfois plus abondantes ou plus irrégulières qu’avant.

      Si la fatigue est un symptôme important, demandez à votre médecin une numération formule sanguine pour vérifier une éventuelle anémie par carence en fer — elle passe souvent inaperçue en périménopause.
  allostatic-load-yoruba:
    body: |-
      Les recherches sur la charge allostatique — le coût physiologique cumulé du stress chronique — sont particulièrement pertinentes pour les femmes noires britanniques qui naviguent entre plusieurs systèmes à la fois : travail, famille, attentes de la communauté et souvent discrimination raciale.

      Dans la culture yoruba, l’attente que les femmes soient des piliers de la communauté — des iyá — peut vouloir dire porter une énorme charge émotionnelle et pratique. C’est honoré ; et c’est aussi quelque chose à nommer honnêtement. La réponse au stress chronique amplifie les symptômes de la ménopause. Trouver du soutien, nommer ce que vous portez et réduire la charge inutile quand c’est possible n’est pas une faiblesse — c’est de la sagesse.
  vitamin-d-uk:
    body: |-
      Les femmes yoruba au Royaume-Uni — comme toutes les femmes d’origine africaine — ont un risque élevé de carence en vitamine D. Entre le soleil nigérian et le soleil britannique, la différence n’est pas mince ; c’est un changement physiologique sur 12 mois qui touche la santé des os, l’humeur, les douleurs articulaires et la fatigue. Tous ces symptômes sont déjà accentués pendant la ménopause.

      Demandez à votre médecin de doser votre vitamine D. En cas de carence, une supplémentation bien menée fait une différence mesurable sur votre état.
  menopause-not-taboo-here:
    body: |-
      Dans beaucoup de foyers nigérians et yoruba, on ne parle pas directement de la ménopause. C’est « la chose qui arrive » — connue, mais jamais nommée. Ce silence peut vouloir dire que des femmes subissent des symptômes importants sans soutien, sans mots, et parfois sans même comprendre ce qui arrive à leur corps.

      Vous avez pleinement le droit de nommer ce que vous vivez. Le suivre, en parler et chercher du soutien, c’est exactement à ça que sert cette appli. La sagesse des femmes yoruba qui vous ont précédée — qui ont traversé cette transition grâce à la communauté, à la nourriture et aux pratiques culturelles — est le socle sur lequel Aunty Mel est construite.
  gp-advocacy:
    body: |-
      Les recherches montrent de façon constante que, dans les soins primaires au Royaume-Uni, les symptômes de la ménopause des femmes noires sont moins souvent pris au sérieux et qu’on leur propose moins souvent un traitement. C’est documenté, pas imaginé.

      Si votre médecin balaie vos plaintes, vous avez le droit de demander un deuxième avis, une orientation vers un spécialiste de la ménopause, et d’apporter une description écrite de vos symptômes. Tenir un journal de vos symptômes est votre outil le plus puissant dans cette conversation.
  vitamin-d-yoruba:
    body: |-
      La carence en vitamine D est extrêmement fréquente chez les femmes yoruba vivant au Royaume-Uni. Ses symptômes — fatigue, douleurs articulaires, moral en berne, mauvais sommeil — recoupent largement ceux de la ménopause et les aggravent.

      Faites d’abord un dosage (auprès de votre médecin), puis supplémentez. La plupart des recommandations préconisent 1000–2000 UI par jour pour les femmes d’origine africaine au Royaume-Uni, mais la dose doit correspondre à votre taux réel.
      MISE EN GARDE : consultez toujours votre médecin avant de prendre plus que la dose standard du NHS de 400 UI. L’excès de vitamine D est toxique.
  iron-perimenopausal-bleeding:
    body: |-
      Si vous avez encore vos règles et qu’elles sont devenues plus abondantes, plus fréquentes ou moins prévisibles — fréquent chez les femmes yoruba qui entrent en périménopause et qui ont tendance à avoir davantage de symptômes vasomoteurs —, surveiller votre fer est important.

      Demandez une numération formule sanguine. La fatigue est le premier signe d’une anémie par carence en fer, et elle est souvent ignorée ou mise sur le compte de l’âge ou d’un emploi du temps chargé.
      MISE EN GARDE : ne prenez pas de complément de fer sans dosage préalable. L’excès de fer est nocif.
byTitle:
  Your body may be ahead of the calendar:
    title: Votre corps est peut-être en avance sur le calendrier
    body: |-
      Les femmes nigérianes ont tendance à arriver à la ménopause plus tôt que la moyenne britannique de 51 ans. Chez les femmes yoruba en particulier, les symptômes de la périménopause peuvent commencer au début ou au milieu de la quarantaine (40 ans et quelques). Si l’on vous a dit que vous étiez « trop jeune » pour la ménopause, signalez-le à votre médecin — cela mérite d’être examiné plutôt tôt que tard.

      La vision yoruba de la femme âgée comme figure de sagesse et d’autorité — « iya » — a ici une vraie valeur. Vous ne perdez rien ; vous entrez dans cette étape.
