# Traduction de cultural/hispanic-latina.yaml — la version anglaise fait foi.
items:
  beans-legumes-central:
    body: |-
      Haricots noirs, haricots pinto, frijoles — les légumineuses sont au cœur de la cuisine latino-américaine et font partie des meilleurs aliments pour la ménopause. Elles sont riches en protéines végétales, en fibres et en phyto-œstrogènes. Si les haricots font déjà partie de votre quotidien, c’est un atout nutritionnel important.
  avocado-healthy-fats:
    body: |-
      L’avocat est un incontournable latino-américain, et il est vraiment excellent pour la ménopause — riche en graisses mono-insaturées qui soutiennent la production d’hormones, en vitamine E pour la santé de la peau (particulièrement utile vu les changements de peau fréquents chez les femmes latinas à la ménopause), et en potassium pour la gestion de la tension. Manger de l’avocat chaque jour est étayé par les données, pas seulement à la mode.
  chilli-triggers:
    body: |-
      Le piment et les plats épicés sont fondamentaux dans beaucoup de cuisines latino-américaines et ont une profonde signification culturelle. Comme pour les autres traditions culinaires épicées, observez s’il y a un lien entre les repas épicés et les bouffées de chaleur. S’il y a un schéma, pensez à jouer sur le moment plutôt qu’à supprimer — manger épicé plus tôt dans la journée peut réduire l’effet le soir.
  corn-tortilla-vs-flour:
    body: |-
      Les tortillas de maïs ont un index glycémique plus bas que les tortillas de blé et sont naturellement sans gluten. Pendant la ménopause, quand la stabilité de la glycémie influe directement sur la fréquence des bouffées de chaleur et l’humeur, c’est un changement simple qui vaut la peine là où les tortillas de maïs ont leur place culturellement.
  hibiscus-jamaica:
    body: |-
      L’agua de jamaica (eau de fleurs d’hibiscus) est très consommée au Mexique et en Amérique centrale. Elle dispose de vraies données pour le soutien de la tension et de propriétés antioxydantes. Réduire le sucre ajouté dans la préparation maximise le bénéfice — une douceur légère avec beaucoup d’hibiscus et de citron vert est tout aussi agréable.
  skin-and-hair-changes:
    body: |-
      Les changements de la peau et des cheveux sont plus marqués chez les femmes hispaniques et latinas pendant la ménopause — des changements de texture, une sécheresse, des modifications de pigmentation et un affinement des cheveux sont documentés plus souvent. Ce n’est pas de la vanité — ces changements touchent l’identité et le bien-être.

      L’hydratation (par l’eau et par les bonnes graisses de l’alimentation), la vitamine E et des soins adaptés à une peau plus sèche et changeante méritent tous d’être prioritaires. Un dermatologue habitué aux changements de peau liés à la ménopause peut être utile si les changements sont importants.
  cultural-positivity:
    body: |-
      Les recherches menées auprès de femmes latinas et d’origine mexicaine montrent que beaucoup ont une vision plus positive de la ménopause que leurs homologues blanches occidentales — elles la voient comme une transition naturelle plutôt que comme une maladie. Ce regard culturel a une vraie valeur et il est associé, dans les études, à une moindre détresse liée aux symptômes.

      Vous pouvez garder ce regard culturel positif tout en prenant vos symptômes au sérieux. Les deux sont vrais. La transition est naturelle et elle peut aussi être difficile — et vous méritez d’être soutenue dans les moments difficiles.
  familismo-and-stress:
    body: |-
      La valeur culturelle du familismo — un lien et une responsabilité familiale très forts — fait que beaucoup de femmes latinas sont au centre de la vie émotionnelle et pratique de leur famille élargie pendant leurs années de ménopause. C’est un cadeau, et aussi une source importante de stress.

      Trouver même de petits moments rien qu’à vous — une marche, un instant de calme — n’est pas rejeter votre famille. C’est ce qui vous permet de continuer à être là pour elle.
byTitle:
  Mood changes and skin changes are especially common for Latina women:
    title: Les changements d’humeur et de peau sont particulièrement fréquents chez les femmes latinas
    body: |-
      Les recherches montrent de façon constante que les femmes hispaniques et latinas rapportent plus souvent que les autres groupes des changements d’humeur et des montagnes russes émotionnelles pendant la ménopause — 55 % contre 49 % des femmes blanches. Les changements de la peau et des cheveux sont aussi plus marqués.

      Ils ne sont ni imaginés ni exagérés — ils reflètent de vrais schémas hormonaux. Les nommer clairement quand vous parlez à votre médecin vous aide à obtenir le soutien dont vous avez besoin, plutôt que de voir vos symptômes d’humeur minimisés ou diagnostiqués à tort comme une simple anxiété ou dépression.
