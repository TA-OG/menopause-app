# Traduction de cultural/south-asian.yaml — la version anglaise fait foi.
items:
  dal-lentils-phytoestrogens:
    body: |-
      Le dal — masoor, moong, chana ou toor — fait partie des meilleurs aliments que vous puissiez manger pendant la ménopause. Les lentilles et les légumineuses sont riches en phyto-œstrogènes (œstrogènes végétaux) et en protéines végétales. Les recherches montrent que les femmes dont l’alimentation est naturellement riche en phyto-œstrogènes — courante dans les cuisines d’Asie du Sud et de l’Est — ont des bouffées de chaleur moins fréquentes et moins intenses.

      Si le dal fait déjà partie du quotidien chez vous, c’est un atout nutritionnel important. Gardez-le.
  turmeric-inflammation:
    body: |-
      Le curcuma (haldi) utilisé chaque jour en cuisine a de vraies propriétés anti-inflammatoires. La curcumine — son composé actif — a été étudiée pour les douleurs articulaires, la santé du cerveau et l’humeur. Les quantités utilisées en cuisine sont bénéfiques mais modestes. Si les douleurs articulaires sont un symptôme principal, cuisiner chaque jour avec du curcuma en ajoutant du poivre noir (qui augmente nettement son absorption) mérite d’être une priorité.
  ghee-fats-balance:
    body: |-
      Le ghee est une matière grasse de cuisson importante culturellement et, en quantité modérée, il ne pose pas de problème. Pendant la ménopause, le souci tient plutôt à la quantité totale de graisses saturées, surtout si elle s’ajoute à une alimentation riche en glucides raffinés. La baisse des œstrogènes modifie la façon dont la graisse est stockée — en particulier au niveau du ventre.

      Équilibrez la cuisine au ghee avec du poisson gras, des noix et des graines (til/sésame, lin) pour soutenir l’environnement hormonal. Les graines de lin en particulier sont riches en lignanes — une forme de phyto-œstrogènes — et peuvent être moulues et ajoutées à la pâte des rotis ou au porridge.
  refined-carbs-blood-sugar:
    body: |-
      Le riz blanc et les aliments à base de maida (roti blanc, paratha, naan) peuvent provoquer des pics de glycémie qui aggravent les bouffées de chaleur, les sautes d’humeur et la fatigue. Il ne s’agit pas de supprimer les aliments culturels — il s’agit d’équilibre.

      Remplacer une partie du riz blanc par du riz complet ou rouge, utiliser de l’atta de blé complet et toujours associer les glucides à du dal, des légumes ou des protéines ralentit nettement la réponse glycémique. Dîner plus tôt aide aussi le sommeil et la gestion du poids pendant la ménopause.
  chai-caffeine:
    body: |-
      Un chai bien fort plusieurs fois par jour fait partie de la vie de beaucoup de femmes d’Asie du Sud — et le rituel social qui l’entoure compte. La caféine peut aggraver les bouffées de chaleur et perturber le sommeil pendant la ménopause, en particulier les tasses de l’après-midi et du soir.

      Pensez à remplacer un ou deux chais par jour par des tisanes — un thé gingembre-cardamome a les mêmes propriétés réchauffantes, ou la tisane de tulsi (basilic sacré), qui a des propriétés adaptogènes soutenant la réponse au stress. Le chai du matin peut rester.
  fenugreek-methi:
    body: |-
      Le methi (fenugrec) — utilisé en cuisine et comme épice — contient des phyto-œstrogènes et est utilisé depuis des siècles dans la pratique ayurvédique pour la santé des femmes. Des données émergentes suggèrent un rôle dans la gestion des bouffées de chaleur et la régulation de la glycémie. Utiliser des graines de methi en cuisine ou boire de l’eau dans laquelle ont trempé des graines de methi (une pratique traditionnelle) peut être un ajout quotidien en douceur.
  joint-pain-movement:
    body: |-
      Les douleurs articulaires et musculaires sont le symptôme de la ménopause le plus rapporté chez les femmes d’Asie du Sud et de l’Est — plus que les bouffées de chaleur. C’est important, car elles peuvent être attribuées à tort à l’arthrose ou minimisées.

      Un mouvement doux chaque jour — yoga, marche, natation — est l’intervention la mieux étayée contre les douleurs articulaires liées à la ménopause. Si vous avez grandi avec le yoga comme pratique culturelle, c’est un pont précieux entre votre héritage et un bien-être fondé sur les données.
  vitamin-d-south-asian-uk:
    body: |-
      Les femmes d’Asie du Sud vivant au Royaume-Uni ont parmi les taux de carence en vitamine D les plus élevés — à cause de facteurs alimentaires, et parce que la mélanine des peaux plus foncées demande plus d’exposition au soleil pour produire la même quantité de vitamine D. Les hivers britanniques n’offrent presque aucune exposition aux UV, quelle que soit la couleur de peau.

      Le manque de vitamine D aggrave directement les douleurs articulaires, la fatigue, le brouillard mental et l’humeur — autant de symptômes déjà accentués en périménopause. C’est une chose simple et à fort impact à faire tester et à corriger.
  cultural-silence:
    body: |-
      Dans beaucoup de communautés d’Asie du Sud, on ne parle pas de la ménopause. On y fait parfois allusion à demi-mot, on la minimise, ou on l’associe à la honte de vieillir ou à la fin de la féminité. Les femmes peuvent avoir l’impression qu’on attend d’elles qu’elles continuent comme si de rien n’était.

      Vous avez le droit de nommer ce que vous traversez. Vous avez le droit de le prendre au sérieux. Le silence autour de la ménopause dans votre communauté ne veut pas dire que cette expérience doit être endurée seule — il veut dire que cette conversation n’a jamais eu la permission d’exister. Voici cette permission.
  family-expectation-stress:
    body: |-
      Beaucoup de femmes d’Asie du Sud en périménopause gèrent en même temps des responsabilités d’aidante — parents vieillissants, enfants, famille élargie — tout en portant la charge émotionnelle du foyer. Ce stress qui s’accumule amplifie directement les symptômes de la ménopause.

      Repérer un domaine où vous pouvez alléger votre charge, et parler directement à vos proches de ce que vous vivez, n’est pas une trahison culturelle — c’est vous préserver. Aunty Mel peut vous aider à trouver les mots pour ces conversations.
  calcium-bone-health:
    body: |-
      Les femmes d’Asie du Sud ont un risque d’ostéoporose plus élevé que les femmes blanches britanniques, aggravé par le manque de vitamine D et une ménopause plus précoce. La densité osseuse se construit dans la jeunesse et s’entretient au milieu de la vie — la baisse des œstrogènes à la ménopause accélère la perte osseuse.

      Les produits laitiers (dahi, paneer, lait) font déjà partie de beaucoup d’alimentations d’Asie du Sud et sont une excellente source de calcium. Si vous en consommez peu, les graines de sésame (til), les amandes et les boissons végétales enrichies sont de bonnes alternatives. Les exercices en charge (marche, renforcement musculaire) comptent autant que l’alimentation pour la santé des os.
      MISE EN GARDE : parlez de la supplémentation en calcium et en vitamine D avec votre médecin, en particulier si vous avez des problèmes rénaux.
byTitle:
  Your timeline may be earlier than you expect:
    title: Votre calendrier est peut-être plus précoce que vous ne le pensez
    body: |-
      Les recherches montrent que les femmes d’origine sud-asiatique — en particulier indienne, pakistanaise et bangladaise — arrivent généralement à la ménopause entre 46 et 47 ans, parfois plus tôt. C’est 3–4 ans avant la moyenne britannique.

      La périménopause peut commencer entre la fin de la trentaine et le début de la quarantaine (30 à 40 ans et quelques). Si vous avez des symptômes et que votre médecin vous dit que vous êtes trop jeune, ces recherches méritent d’être partagées. Une ménopause plus précoce n’est pas un échec — mais cela veut dire qu’il est important d’en prendre conscience plus tôt.
