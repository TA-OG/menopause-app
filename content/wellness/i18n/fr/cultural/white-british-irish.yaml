# Traduction de cultural/white-british-irish.yaml — la version anglaise fait foi.
items:
  fish-chips-acv:
    body: |-
      Le fish and chips au vinaigre — un classique. Le poisson lui-même (cabillaud, églefin, plie) est une vraie bonne source de protéines maigres et d’un peu d’oméga-3. La pâte à frire et les frites posent davantage problème pendant la ménopause — les fritures et les glucides raffinés peuvent aggraver les ballonnements, les bouffées de chaleur et l’instabilité de la glycémie.

      Une approche pratique : du poisson au four ou grillé avec une plus petite portion de frites, plus souvent, plutôt qu’une grosse portion moins souvent. Le vinaigre de cidre (le vinaigre de malt sur les frites, ou en boisson quotidienne diluée dans de l’eau) dispose de quelques données pour la gestion de la glycémie, même si elles restent modestes.
  tea-caffeine-timing:
    body: |-
      La culture britannique du thé est bien réelle et son rituel compte. Le thé contient moins de caféine que le café, mais assez pour perturber le sommeil et contribuer peut-être aux bouffées de chaleur s’il est bu en grande quantité tout au long de la journée.

      Une approche pratique : profitez librement du thé du matin et du début d’après-midi. Soyez attentive à partir de la fin d’après-midi. Remplacez un ou deux thés par jour par des tisanes — menthe poivrée (légèrement rafraîchissante aussi), camomille (favorise le sommeil) ou rooibos (sans caféine, avec le même rituel).
  sunday-roast-adapted:
    body: |-
      Le rôti du dimanche est équilibré sur le plan nutritionnel — viande maigre ou alternative végétarienne, légumes et protéines. Ce qui va à l’encontre de la ménopause : de grandes quantités de sauce à la farine raffinée, la farce au pain blanc et trop de sel. Les légumes, en particulier les légumes verts à feuilles et les crucifères (brocoli, chou-fleur, choux de Bruxelles), sont excellents.

      Privilégier la version du rôti riche en légumes — plus de légumes verts, des portions de glucides plus petites — est une adaptation réaliste qui préserve le repas culturel.
  alcohol-culture:
    body: |-
      L’alcool est profondément ancré dans la vie sociale britannique, et un verre de vin ou une pinte le soir est normal pour beaucoup de femmes. L’alcool aggrave les bouffées de chaleur, perturbe l’architecture du sommeil (même en quantité modérée) et affecte l’humeur le lendemain — autant de symptômes déjà accentués pendant la ménopause.

      Cela ne veut pas dire renoncer à boire en société. Cela veut dire être honnête avec soi-même sur le lien entre un verre de vin et la qualité de sa nuit. Les alternatives sans alcool se sont énormément améliorées — pour les soirées où le sommeil compte vraiment, cela vaut la peine d’essayer.
  processed-food-convenience:
    body: |-
      Plats préparés, sandwichs et aliments pratiques font partie, de façon réaliste, d’une vie britannique chargée. Le problème pendant la ménopause, c’est que beaucoup de ces options sont riches en sel et en glucides raffinés et pauvres en fibres — ce qui aggrave les symptômes.

      Plutôt que de bouleverser toute votre alimentation, concentrez-vous sur un ou deux changements à fort impact : ajouter une poignée de graines ou de noix à ce que vous mangez, garder du houmous et des bâtonnets de légumes sous la main pour grignoter, et choisir les versions complètes quand elles existent. De petits changements réguliers sont plus efficaces que de grands bouleversements à court terme.
  stoicism-british-culture:
    body: |-
      La culture britannique autour de la santé est souvent celle d’une gestion discrète — ne pas se plaindre, ne pas faire d’histoires, faire avec. Beaucoup de femmes racontent avoir souffert de symptômes importants de la ménopause pendant des années avant de demander de l’aide, ou être allées chez leur médecin et avoir été renvoyées sans vraie réponse.

      Vos symptômes méritent d’être pris au sérieux. Tenir un journal et être précise avec votre médecin sur l’impact au quotidien — travail, sommeil, relations — ce n’est pas faire des histoires. C’est défendre des soins auxquels vous avez droit.
