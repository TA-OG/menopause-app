# Traduction de frameworks/hot-flashes-night-sweats.yaml — la version anglaise fait foi.
df_cool_foods:
  title: Privilégiez les aliments « rafraîchissants »
  body: >-
    Les aliments riches en phyto-œstrogènes — graines de lin moulues, edamame, tofu, tempeh — peuvent aider à amortir les fluctuations d’œstrogènes qui déclenchent les bouffées de chaleur. Visez 1–2 cuillerées à soupe de graines de lin moulues par jour, ajoutées au porridge, au yaourt ou aux smoothies.
df_reduce_triggers:
  title: Réduisez les déclencheurs courants des bouffées
  body: >-
    La caféine, l’alcool, les plats épicés et les boissons très chaudes sont les déclencheurs alimentaires des bouffées de chaleur les plus souvent rapportés. Essayez d’en supprimer un à la fois pendant deux semaines et notez si la fréquence ou l’intensité des bouffées diminue. Beaucoup de femmes constatent que le café du matin est le premier responsable.
df_blood_sugar:
  title: Stabilisez votre glycémie, comme base générale
  body: >-
    Certaines femmes remarquent que les pics et chutes de glycémie semblent déclencher ou aggraver une bouffée, même si ce n’est pas un déclencheur établi des symptômes vasomoteurs de la ménopause en général — c’est à observer chez vous plutôt qu’à supposer. Manger des protéines et de bonnes graisses à chaque repas (par ex. œufs, noix, poisson gras, avocat) ralentit de toute façon l’absorption du glucose, et c’est une base raisonnable dans tous les cas. Évitez les glucides raffinés et les en-cas sucrés à jeun.
df_hf_hydration:
  title: Restez hydratée de façon régulière
  body: >-
    La déshydratation augmente la température corporelle, ce qui rend les bouffées plus intenses. Environ 2 litres par jour est le repère habituel, répartis sur la journée, et un peu plus si vous transpirez la nuit — mais c’est un repère, pas un objectif, et vos besoins réels varient selon votre corpulence, la météo et votre niveau d’activité. Si un médecin vous a demandé de limiter les liquides — par exemple en cas d’insuffisance cardiaque ou rénale — suivez sa limite, pas celle-ci. Commencez la journée par un grand verre d’eau fraîche et gardez-en un près de votre lit.
lf_layers_bedding:
  title: Superposez la literie — la solution la plus pratique contre les sueurs nocturnes
  body: >-
    Passez à une literie respirante qui évacue l’humidité (bambou ou percale de coton). Dormez avec des couches que vous pouvez repousser : un drap, une couverture légère, une couette — plutôt qu’une seule couette épaisse. Un petit ventilateur orienté à l’écart de vous (pour qu’il rafraîchisse la pièce sans souffler sur vous) peut réduire l’intensité des sueurs nocturnes en maintenant la température ambiante sous 18 °C.
lf_paced_breathing:
  title: La respiration rythmée pour couper une bouffée
  body: >-
    Les recherches montrent qu’une respiration lente et rythmée (4–5 respirations par minute) peut réduire l’intensité d’une bouffée si on la commence dès les premiers signes. Essayez : inspirez sur 4 temps, retenez 2, expirez sur 6. Pratiquez chaque jour pour que cela devienne automatique. Il faut environ 2 semaines d’entraînement avant que cela fonctionne de façon fiable sur le moment.
lf_exercise_timing:
  title: Le moment de l’exercice compte
  body: >-
    Une activité physique modérée et régulière réduit la fréquence globale des symptômes vasomoteurs — mais faire de l’exercice dans la chaleur ou à haute intensité peut déclencher temporairement des bouffées. Chez les femmes qui ont des sueurs nocturnes importantes, l’exercice le matin, à l’air frais, fonctionne généralement mieux que le soir.
lf_clothing:
  title: Habillez-vous en couches de fibres naturelles
  body: >-
    Les tissus synthétiques retiennent la chaleur. Les fibres naturelles — coton, lin, bambou, mérinos — laissent l’humidité s’évaporer. Au travail, un gilet ou une veste qu’on enlève vite donne plus de contrôle qu’un seul vêtement plus épais. Gardez un petit ventilateur sur votre bureau si vous le pouvez.
mr_flush_not_just_supplements:
  title: Les bouffées de chaleur ne se règlent pas qu’avec des compléments
  body: >-
    La santé intestinale et la stabilité de la glycémie peuvent aussi jouer un rôle. Certaines femmes remarquent que les variations de glycémie déclenchent ou aggravent une bouffée, peut-être via l’adrénaline libérée pour corriger une hypoglycémie — mais ce n’est pas un déclencheur établi des bouffées de la ménopause en général, juste un schéma que certaines femmes rapportent et qu’il vaut la peine d’observer chez vous. Stabiliser sa glycémie sur la journée reste une base raisonnable dans tous les cas. Vous lirez peut-être aussi qu’une mauvaise élimination des œstrogènes (un problème intestinal ou hépatique) provoque les bouffées — c’est une théorie utilisée par certains praticiens, pas une cause reconnue par les recommandations courantes sur la ménopause, donc à prendre avec recul. Dans tous les cas, agir sur les fondamentaux — sommeil, stress, glycémie, mouvement — fait souvent plus pour la fréquence et l’intensité des bouffées que n’importe quel complément isolé.
mr_flush_normalise:
  title: Changez de regard sur la bouffée — l’anxiété les aggrave
  body: >-
    L’anxiété à l’approche d’une bouffée est elle-même un déclencheur : elle active le système nerveux sympathique, ce qui augmente la température corporelle. Les femmes qui apprennent à observer une bouffée sans dramatiser (« ça passera en 90 secondes ») rapportent avec le temps une intensité nettement plus faible. Au Royaume-Uni, le NICE reconnaît la thérapie cognitivo-comportementale (TCC) pour les symptômes de la ménopause comme une option pour les symptômes vasomoteurs, en complément ou à la place du THM. En Angleterre, vous pouvez vous adresser directement aux NHS Talking Therapies si vous y avez droit, mais ce service vise l’anxiété et la dépression et la TCC spécifique à la ménopause n’est pas proposée partout — il vaut donc la peine de demander aussi à votre médecin une TCC spécifique à la ménopause ou une orientation vers une consultation ménopause. Women’s Health Concern (le volet patientes de la British Menopause Society) publie une fiche gratuite (en anglais) sur la TCC pour les symptômes de la ménopause.
mr_sleep_hygiene:
  title: Protégez votre sommeil malgré les sueurs nocturnes
  body: >-
    Les sueurs nocturnes provoquent souvent une anxiété secondaire autour du sommeil (« j’appréhende d’aller me coucher »). Gardez une routine du coucher régulière et calme. Une douche fraîche avant le coucher abaisse la température corporelle pendant 60–90 minutes — la période où cela aide le plus. Évitez les écrans pendant les 30 minutes qui précèdent. Si une sueur vous réveille, ayez votre eau et votre ventilateur à portée de main et évitez de regarder votre téléphone.
mr_track_patterns:
  title: Repérez vos déclencheurs pendant deux semaines
  body: >-
    Utilisez votre suivi quotidien pour noter la fréquence des bouffées, le moment de la journée et ce que vous avez mangé ou bu dans les 2 heures précédentes. La plupart des femmes repèrent 2–3 schémas nets en deux semaines. Connaître vos déclencheurs vous redonne la main — ce qui est en soi associé à un poids des symptômes ressenti comme plus faible.
ss_magnesium_glycinate:
  title: Glycinate de magnésium — soutien du sommeil et contre les bouffées
  body: >-
    Le glycinate de magnésium (200–400 mg avant le coucher) est bien toléré et dispose de premières données en faveur d’une réduction de la fréquence des sueurs nocturnes et d’une meilleure qualité de sommeil en périménopause. Il apaise aussi le système nerveux. La forme glycinate est plus douce pour le système digestif que l’oxyde de magnésium.
  disclaimer: >-
    Les compléments ne sont pas des médicaments réglementés. Demandez toujours l’avis de votre médecin généraliste ou de votre pharmacien avant de commencer, surtout si vous prenez des médicaments sur ordonnance ou avez un problème rénal ou cardiaque.
ss_sage_extract:
  title: Sauge — contre les bouffées de chaleur et les sueurs nocturnes
  body: >-
    L’extrait standardisé de sauge (Salvia officinalis) dispose d’un petit ensemble de preuves cliniques montrant une réduction modeste de la fréquence des bouffées — les études utilisaient généralement 300–600 mg par jour d’un extrait standardisé, ce qui n’a rien à voir avec une tasse de tisane de sauge, qui n’a pas été étudiée à une dose connue et n’a pas les mêmes preuves. La tisane de sauge au coucher est un remède traditionnel contre la transpiration excessive auquel certaines femmes ont encore recours ; il faut simplement savoir qu’elle ne repose pas sur la même base que les recherches sur l’extrait. Les effets de l’extrait standardisé s’installent en 4–8 semaines. Ne remplace pas le THM si les bouffées sont sévères.
  disclaimer: >-
    Les compléments de sauge peuvent interagir avec certains médicaments, notamment les antiépileptiques et les traitements du diabète. Déconseillés pendant la grossesse. Demandez l’avis de votre médecin généraliste avant de les prendre, en particulier si vous avez un problème de santé en cours.
ss_omega3_vasomotor:
  title: Oméga-3 (EPA/DHA) — contre les bouffées de chaleur et les sueurs nocturnes
  body: >-
    Quelques données en faveur d’une réduction de la fréquence et de l’intensité des symptômes vasomoteurs — bouffées de chaleur et sueurs nocturnes — en plus de leurs autres bienfaits généraux pour la santé.
  disclaimer: >-
    À forte dose, les oméga-3 peuvent fluidifier le sang. Si vous prenez des anticoagulants (warfarine, aspirine, apixaban) ou devez être opérée, demandez l’avis de votre médecin généraliste ou de votre pharmacien avant d’en prendre.
ss_vitamin_e_vasomotor:
  title: Vitamine E — contre les symptômes vasomoteurs
  body: >-
    Certaines femmes essaient la vitamine E, couramment autour de 400 UI/jour, pour réduire la fréquence et l’intensité des symptômes vasomoteurs, dont les sueurs nocturnes — les preuves pour cet effet précis sont modestes. 400 UI est une dose de supplémentation élevée, bien au-dessus de ce qu’apporte l’alimentation.
  disclaimer: >-
    La vitamine E à forte dose peut augmenter le risque de saignement, en particulier avec des anticoagulants ou antiagrégants plaquettaires (warfarine, aspirine) ou avant une opération. Demandez toujours l’avis de votre médecin généraliste ou de votre pharmacien avant de commencer, surtout si vous prenez des médicaments sur ordonnance.
ss_maca_hot_flushes:
  title: Maca — pour l’équilibre hormonal, l’énergie, l’humeur et la libido
  body: >-
    La maca (par ex. les formulations du Dr Anna Cabeca, ou de la poudre ou des gélules de racine de maca classiques) soutient l’équilibre hormonal, l’énergie, l’humeur et la libido chez beaucoup de femmes.
  disclaimer: >-
    Prudence si vous avez une maladie auto-immune — la maca peut stimuler le système immunitaire et aggraver les poussées. Si c’est votre cas, mieux vaut demander d’abord l’avis de votre médecin ou d’un spécialiste.
