# Traduction de frameworks/mood-anxiety-brain-fog.yaml — la version anglaise fait foi.
df_omega3_brain:
  title: Les acides gras oméga-3 pour le cerveau et l’humeur
  body: >-
    Le DHA (un type d’oméga-3) est essentiel au fonctionnement des membranes des cellules du cerveau et à la transmission de la sérotonine. La baisse des œstrogènes réduit l’efficacité avec laquelle le cerveau utilise les oméga-3. Mangez du poisson gras (saumon, sardines, maquereau) 2–3 fois par semaine, ou prenez un complément de 1000 mg d’EPA+DHA par jour si vous ne mangez pas de poisson. Les graines de lin moulues et les noix apportent de l’ALA (un précurseur végétal des oméga-3).
df_fermented_foods:
  title: La santé intestinale et le lien avec l’humeur
  body: >-
    L’axe intestin-cerveau est bien établi, même s’il est souvent décrit de façon approximative. Environ 90 % de la sérotonine de l’organisme est fabriquée dans l’intestin — mais par vos propres cellules entérochromaffines, pas par les bactéries intestinales, et cette sérotonine ne passe pas dans le cerveau. Ce que font les bactéries intestinales, c’est influencer la quantité produite et communiquer avec le cerveau par d’autres voies. La plupart de ces travaux sont toutefois mécanistiques ou issus d’études animales — les essais chez l’humain sur les aliments fermentés et l’humeur restent limités, donc considérez le bénéfice sur l’humeur comme réellement incertain. Les aliments fermentés valent quand même la peine pour la santé intestinale en général : yaourt au lait vivant, kéfir, kimchi, choucroute, miso. Visez la variété sur la semaine plutôt que de grandes quantités d’un seul aliment.
df_protein_neurotransmitters:
  title: Des protéines à chaque repas — les acides aminés fabriquent vos molécules de l’humeur
  body: >-
    La sérotonine, la dopamine et le GABA sont fabriqués à partir d’acides aminés provenant des protéines alimentaires. Sauter des repas ou manger des en-cas pauvres en protéines peut épuiser les matériaux dont votre cerveau a besoin. Visez 20–30 g de protéines au petit-déjeuner (œufs, yaourt grec, saumon fumé) — cela prépare la production de vos neurotransmetteurs pour la journée.
lf_exercise_mood:
  title: L’exercice est l’intervention sur l’humeur la mieux étayée qui existe
  body: >-
    30 minutes de cardio modéré (marche rapide, vélo, natation) 3–5 fois par semaine augmentent le BDNF (facteur neurotrophique dérivé du cerveau) — la protéine de croissance et de réparation propre au cerveau. L’exercice augmente aussi les endorphines, réduit le cortisol et contrecarre directement l’anxiété et la déprime de la périménopause. L’effet commence dès la première séance et s’accumule au fil des semaines. Si vous ne faites qu’une chose de cette liste, faites celle-ci.
lf_stress_boundary:
  title: Trouvez une chose que vous pouvez arrêter de faire
  body: >-
    La périménopause coïncide souvent avec une pression professionnelle maximale et des responsabilités familiales d’aidante. Les femmes qui se décrivent comme « débordées » constatent souvent que leur humeur et leur brouillard mental s’améliorent nettement quand elles réduisent une obligation régulière — et non quand elles ajoutent des outils de récupération. Passez votre semaine en revue et trouvez une chose que vous pouvez supprimer, déléguer ou faire moins souvent.
lf_brain_fog_tactics:
  title: Des astuces concrètes contre le brouillard mental au travail
  body: >-
    Le brouillard mental est réel — les œstrogènes régulent le cortex préfrontal. Adaptations pratiques : notez les choses tout de suite au lieu d’essayer de les retenir ; utilisez des rappels d’agenda pour ce que vous retiendriez normalement ; bloquez du temps de concentration le matin, quand les fonctions cognitives sont généralement au plus haut ; faites de courtes pauses en mouvement toutes les 90 minutes pour relancer votre concentration. Ce ne sont pas des échecs — ce sont des adaptations.
mr_physiology_not_personality:
  title: C’est de la physiologie, pas un changement de personnalité
  body: |-
    Les changements émotionnels de la ménopause ne sont ni un changement de personnalité ni le signe que quelque chose ne va pas chez vous — c’est de la physiologie. Les œstrogènes sont directement liés à la sérotonine et à la dopamine : quand ils baissent, l’humeur, la motivation et la résilience baissent avec eux. Ce n’est pas de la faiblesse. Ce n’est pas « juste du stress ». C’est de la chimie. Mais l’humeur dépend rarement des seuls œstrogènes — elle est aussi liée à plusieurs autres systèmes, et il vaut la peine de comprendre l’ensemble du tableau plutôt que de supposer que « ce n’est que les hormones » ou « c’est juste moi ».
    Sommeil et énergie : un mauvais sommeil — si fréquent à la ménopause à cause des sueurs nocturnes, des pensées qui s’emballent ou d’un système nerveux à la fois épuisé et sur le qui-vive — ne fait pas que vous épuiser, il réduit directement votre capacité à réguler vos émotions. Une nuit courte rend le détecteur de menaces du cerveau plus réactif, tout en atténuant la partie du cerveau qui calme les choses. Le manque d’énergie aggrave tout cela — quand vous êtes à plat, il reste tout simplement moins de réserves pour la patience ou le recul. Humeur, sommeil et énergie s’entretiennent mutuellement, en bien comme en mal.
    Déséquilibre hormonal et colère : beaucoup de femmes reconnaissent « la rage » de la périménopause. Les fluctuations irrégulières, souvent importantes, des œstrogènes et de la progestérone pendant cette période peuvent y contribuer — ce n’est pas un défaut de caractère, et ce n’est pas simplement « dans votre tête ». Soyons honnêtes cependant : le mécanisme précis n’est pas scientifiquement établi, et les idées que vous avez peut-être lues sur un « problème de rapport » progestérone/œstrogènes, une « mauvaise élimination des œstrogènes » ou des xéno-œstrogènes environnementaux ne sont pas considérées comme des causes établies par les recommandations courantes sur la ménopause — voyez-les comme des théories plutôt que des explications. Si la colère ou l’irritabilité persistent, il vaut la peine de regarder le tableau plus large, y compris le stress chronique, et d’en parler à votre médecin.
mr_mood_hidden_drivers:
  title: Ce qui pourrait aussi être en cause — au-delà des hormones
  body: |-
    Statut nutritionnel : un manque de B12 et de folates peut imiter ou aggraver la déprime, le brouillard mental, la fatigue et l’irritabilité — ces carences sont fréquentes, surtout avec l’âge, certains médicaments ou une faible consommation de protéines animales et de légumes verts. C’est une chose simple et corrigeable, trop souvent négligée.
    Santé de la thyroïde : une thyroïde qui fonctionne au ralenti, en particulier, peut ressembler trait pour trait au « cerveau et à l’humeur de la ménopause » — déprime, fatigue, brouillard mental, prise de poids, sentiment d’être éteinte. Elle passe souvent inaperçue, car le test standard limité à la TSH ne dit pas tout, et les symptômes sont mis sur le compte de « juste la ménopause » alors que la fonction thyroïdienne n’a pas vraiment été vérifiée.
    Glycémie : le prédiabète et le diabète affectent directement l’humeur — les variations de glycémie peuvent provoquer irritabilité, anxiété, brouillard mental et coups de fatigue qui ressemblent en tout point à des changements d’humeur « hormonaux », et une mauvaise régulation aggrave aussi le sommeil et augmente l’inflammation.
    Les effets plus larges de l’histamine : ils vont bien au-delà des démangeaisons, des migraines et des rougeurs — elle peut aussi contribuer aux ballonnements, au mauvais sommeil, au brouillard mental et à la fatigue. Si vous cochez plusieurs cases entre humeur, sommeil, énergie et digestion sans cause unique évidente, l’histamine mérite d’être envisagée comme un vrai fil conducteur sous-jacent.
mr_mood_complex_history:
  title: Si vous avez des antécédents d’endométriose, d’adénomyose ou de fibromes
  body: |-
    L’endométriose, l’adénomyose et les fibromes sont des affections sensibles aux œstrogènes, et certaines femmes ayant ces antécédents décrivent des montagnes russes émotionnelles plus intenses en périménopause — la rage, les hauts et les bas, le sentiment de ne plus se reconnaître. Ce n’est pas établi comme une règle générale pour toutes les femmes ayant ces antécédents, et ce n’est pas être « trop sensible » ou dramatique si c’est ce que vous ressentez. Il faut aussi dire que beaucoup de femmes ayant ces antécédents vivent avec une douleur chronique depuis des années, parfois des décennies, souvent minimisée ou mal traitée avant le diagnostic — et la dépression est réellement plus fréquente chez elles. Si vous remarquez une déprime en plus des changements de la périménopause, ce n’est pas forcément « juste la ménopause » par-dessus — c’est peut-être le poids accumulé de la douleur, et d’années à ne pas être crue ni entendue, qui se fait enfin sentir.
    Si vous vivez avec un Covid long, un syndrome de fatigue chronique (SFC) ou une fibromyalgie en même temps que la ménopause, le poids émotionnel de gérer une maladie chronique et la ménopause en même temps est réel, et souvent isolant — il est difficile de démêler quels symptômes viennent de quelle cause. Les deux peuvent être vrais à la fois, et les deux méritent des soins, pas une compétition pour savoir lequel est « le vrai problème ».
mr_mood_reframe:
  title: Qui suis-je maintenant ? — ce n’est pas forcément une question de crise
  body: |-
    La façon dont vous vous racontez ce chapitre façonne réellement la manière dont vous le vivez. « Qui suis-je maintenant ? » peut être une question de curiosité plutôt que de panique — sans prétendre que tout va bien, mais en reconnaissant que cette version de vous, entre deux, inconnue, n’est pas un problème à résoudre : c’est une personne à apprendre à connaître. Beaucoup de femmes arrivent ici avec le sentiment de s’être perdues — cette désorientation est réelle et fréquente, et bien souvent il se passe plus de choses en dessous que « juste les hormones », ce qui justifie précisément une vraie recherche plutôt que de serrer les dents.
    La ménopause n’est pas un problème à régler isolément — c’est une transition qui touche à la fois les hormones, le sommeil, les nutriments, la thyroïde et la santé métabolique. Le but n’est pas de « revenir à la normale », mais de comprendre ce qui se passe réellement sous l’humeur, pas seulement de gérer l’humeur elle-même. Suivre les tendances — qualité du sommeil, baisses d’énergie, cycles d’humeur, déclencheurs — vous donne des informations, pas seulement des symptômes à endurer.
mr_mood_gp_red_flags:
  title: Quand consulter votre médecin pour l’humeur ou l’anxiété
  body: |-
    Consultez votre médecin si : la déprime ou l’anxiété persistent, s’aggravent ou affectent votre quotidien ; vous avez des idées d’automutilation ou de désespoir — toujours le jour même ; la colère ou l’irritabilité vous semblent disproportionnées ou effrayantes, à vous ou à votre entourage ; les troubles du sommeil sont sévères, prolongés ou ne s’améliorent pas avec les changements de mode de vie ; ou les changements d’humeur s’accompagnent d’autres signaux d’alerte — variation de poids importante, palpitations, saignements abondants ou irréguliers, soif ou envies d’uriner excessives.
    Il vaut la peine de demander un dosage de la TSH (le premier contrôle standard de la thyroïde, complété par d’autres examens s’il est anormal ou si les symptômes orientent fortement vers la thyroïde) et une prise de sang B12/folates s’ils n’ont pas été vérifiés, ainsi qu’une HbA1c ou une glycémie à jeun en cas d’antécédents familiaux de diabète, de variations de poids ou de symptômes glycémiques associés aux changements d’humeur. Si vous vous demandez si un THM, des antidépresseurs ou un autre soutien pourraient vous aider — c’est une discussion qui vaut la peine, pas quelque chose à traverser seule en serrant les dents.
ss_magnesium_anxiety:
  title: Glycinate de magnésium — pour réguler le système nerveux et retrouver le calme
  body: >-
    Couramment 200–400 mg/jour. La forme glycinate est préférée ici au citrate, car on ne cherche pas un effet laxatif.
  disclaimer: >-
    Demandez toujours l’avis de votre médecin généraliste ou de votre pharmacien avant de commencer, surtout si vous prenez des médicaments sur ordonnance ou avez un problème rénal ou cardiaque.
ss_l_theanine_anxiety:
  title: L-théanine — calme et concentration sans somnolence
  body: >-
    Couramment 100–200 mg. Favorise le calme et la concentration sans somnolence, et peut se prendre dans la journée contre l’anxiété, pas seulement au coucher.
  disclaimer: >-
    Demandez toujours l’avis de votre médecin généraliste ou de votre pharmacien avant de commencer, surtout si vous prenez des médicaments sur ordonnance.
ss_ashwagandha:
  title: Ashwagandha — pour la réponse du corps au stress
  body: >-
    Couramment 300–600 mg/jour d’extrait de racine standardisé. Bien étudiée pour soutenir la réponse du corps au stress et la régulation du cortisol.
  disclaimer: >-
    Prudence si vous avez une maladie auto-immune (elle peut stimuler l’activité immunitaire), un problème de thyroïde (elle peut modifier les taux d’hormones thyroïdiennes) ou si vous êtes enceinte — demandez d’abord l’avis de votre médecin généraliste.
ss_saffron_mood:
  title: Safran — pour l’humeur et l’anxiété
  body: >-
    Couramment 30 mg/jour d’extrait standardisé. Quelques données en faveur d’un effet sur l’humeur et les symptômes d’anxiété.
  disclaimer: >-
    Demandez toujours l’avis de votre médecin généraliste ou de votre pharmacien avant de commencer, surtout si vous prenez des médicaments sur ordonnance.
ss_b_complex_mood:
  title: Complexe B — pour le système nerveux et la résistance au stress
  body: >-
    Choisissez de la méthylcobalamine (B12) et du méthylfolate plutôt que les formes synthétiques moins chères (cyanocobalamine, acide folique). Les vitamines B jouent un rôle dans le fonctionnement du système nerveux et la résistance au stress, ce qui compte particulièrement si votre alimentation ou le stress ont fait baisser vos réserves.
  disclaimer: >-
    Demandez toujours l’avis de votre médecin généraliste ou de votre pharmacien avant de commencer, surtout si vous prenez des médicaments sur ordonnance ou avez un problème rénal.
ss_omega3_mood_brainfog:
  title: Oméga-3 (EPA/DHA) — contre le brouillard mental, l’anxiété et pour l’humeur
  body: >-
    Pour le brouillard mental en particulier, couramment 2–3 g/jour d’EPA/DHA combinés — le haut de la fourchette générale, vu l’objectif ciblé sur le cerveau. Soutient les fonctions cognitives et a des effets anti-inflammatoires pour le cerveau, avec des données en faveur d’un soutien de l’humeur et d’une réduction des symptômes d’anxiété.
  disclaimer: >-
    À forte dose, les oméga-3 peuvent fluidifier le sang. Si vous prenez des anticoagulants (warfarine, aspirine, apixaban) ou devez être opérée, demandez l’avis de votre médecin généraliste ou de votre pharmacien avant d’en prendre.
ss_acetyl_l_carnitine_brainfog:
  title: Acétyl-L-carnitine — pour le métabolisme énergétique du cerveau
  body: >-
    Couramment 1–3 g/jour. Soutient le métabolisme énergétique du cerveau, avec quelques données en faveur des fonctions cognitives et de la clarté mentale.
  disclaimer: >-
    Demandez toujours l’avis de votre médecin généraliste ou de votre pharmacien avant de commencer, surtout si vous prenez des médicaments sur ordonnance.
ss_ginkgo_brainfog:
  title: Ginkgo biloba — pour la circulation et la mémoire
  body: >-
    Couramment 120–240 mg/jour. Soutient la circulation vers le cerveau, avec quelques données en faveur de la mémoire et de la clarté mentale.
  disclaimer: >-
    Peut interagir avec les médicaments qui fluidifient le sang — un avis médical est nécessaire d’abord, surtout si vous prenez des anticoagulants ou de l’aspirine.
ss_phosphatidylserine_brainfog:
  title: Phosphatidylsérine — pour la mémoire et les fonctions cognitives
  body: >-
    Couramment 150 mg/jour. Quelques données en faveur d’un soutien de la mémoire et des fonctions cognitives.
  disclaimer: >-
    Demandez toujours l’avis de votre médecin généraliste ou de votre pharmacien avant de commencer, surtout si vous prenez des médicaments sur ordonnance.
