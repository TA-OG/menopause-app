# Traduction de frameworks/sedentary-lifestyle.yaml — la version anglaise fait foi.
df_sedentary_protein_preserve:
  title: Les protéines comptent encore plus quand vous ne faites pas d’exercice régulièrement
  body: >-
    La masse musculaire diminue plus vite chez les femmes à la fois sédentaires et ménopausées — un double coup. Sans le stimulus des exercices de résistance pour déclencher la synthèse des protéines musculaires, les protéines alimentaires deviennent le principal levier pour freiner la perte de muscle. Visez 1,2–1,6 g de protéines par kg de poids corporel et par jour. Répartissez-les sur les repas — 25–30 g par repas plutôt que l’essentiel au dîner. Il ne s’agit pas de prendre du muscle — il s’agit de protéger celui que vous avez.
df_sedentary_anti_inflammatory:
  title: L’alimentation comme remède anti-inflammatoire — quand le mouvement est limité
  body: >-
    Quand la mobilité est réduite, l’alimentation assure une plus grande part du travail de protection. Une alimentation anti-inflammatoire (huile d’olive, poissons gras, baies, curcuma, gingembre, légumes à feuilles vert foncé, légumes colorés) aide à gérer l’inflammation générale qui augmente avec la ménopause comme avec l’inactivité physique. Elle réduit les douleurs articulaires et la fatigue et soutient la santé métabolique. Ce sont des changements accessibles, quelles que soient vos capacités physiques.
lf_sedentary_start_walking:
  title: Commencez par 10 minutes — pas 30
  body: >-
    Les recommandations de 150 minutes d’exercice par semaine sont justes, mais elles créent une barrière psychologique pour les femmes qui ne sont pas actives aujourd’hui. L’approche la mieux étayée pour prendre l’habitude de bouger est de commencer par 10 minutes par jour — assez court pour qu’il soit difficile de dire non, assez long pour avoir un vrai effet. Une marche de 10 minutes après un repas par jour améliore la glycémie, l’humeur et le sommeil. Au bout de 2 semaines, passez à 15 minutes. L’habitude vient avant la durée.
lf_sedentary_seated_movement:
  title: L’exercice assis compte — ne le sous-estimez pas
  body: >-
    Si votre mobilité est limitée, les exercices de résistance assis (squats sur chaise, élévations de jambes assise, exercices du haut du corps avec élastique, assise) entretiennent la masse musculaire et améliorent la circulation. Le yoga sur chaise ou adapté aux seniors (largement disponible gratuitement sur YouTube) améliore la souplesse et l’équilibre, ce qui réduit directement le risque de chute. L’aquagym (proposée dans la plupart des piscines municipales) est excellente pour les douleurs articulaires, car l’eau supprime 90 % de l’impact du poids du corps. Bouger, quelle que soit votre capacité, est thérapeutique.
lf_sedentary_break_sitting:
  title: Interrompez la position assise toutes les 60–90 minutes — même 2 minutes aident
  body: >-
    Rester assise longtemps (plus de 8 heures par jour) est associé, indépendamment du reste, à une moins bonne santé métabolique, même chez les personnes qui font aussi de l’exercice. Programmer un minuteur pour vous lever et bouger 2–3 minutes toutes les 60–90 minutes — aller jusqu’à la cuisine, monter sur la pointe des pieds, marcher sur place — réduit ce risque. Cela ne remplace pas l’exercice ; c’est un comportement protecteur distinct, qui s’ajoute. Une simple alarme de téléphone suffit comme rappel.
mr_sedentary_no_shame:
  title: Il n’y a pas d’échec ici — juste un point de départ
  body: >-
    Les femmes qui ne sont pas actives aujourd’hui traînent souvent des années d’abonnements à la salle abandonnés, de programmes de remise en forme qui semblaient faits pour quelqu’un d’autre, et de messages intériorisés sur la discipline et la volonté. Rien de tout cela ne compte pour votre point de départ d’aujourd’hui. L’inactivité physique pendant la ménopause est extrêmement fréquente — et tout à fait réversible. Une marche de 10 minutes aujourd’hui vaut plus qu’un programme parfait qui n’a jamais lieu. Partez exactement de là où vous êtes.
mr_sedentary_pain_barrier:
  title: Si la douleur limite vos mouvements — cela mérite une prise en charge médicale
  body: >-
    Si des douleurs articulaires, des douleurs de dos ou un autre problème physique vous empêchent d’être active, cela vaut la peine d’en parler à votre médecin plutôt que de faire avec. La kinésithérapie est souvent prise en charge pour les douleurs articulaires et elle est bien plus efficace que le repos pour la plupart des affections. Une ostéodensitométrie peut montrer si l’ostéoporose contribue à la douleur. Une douleur qui limite l’activité est un problème médical — pas un choix de mode de vie. Traitez l’obstacle au lieu de l’accepter.
ss_creatine_muscle:
  title: Créatine monohydrate — aide à préserver le muscle avec peu d’exercice
  body: >-
    La créatine monohydrate (3–5 g par jour) est l’un des compléments sportifs les plus étudiés, et des données émergentes montrent qu’elle aide à préserver la masse musculaire chez les adultes plus âgés et les femmes ménopausées — même sans exercice important. Elle semble aussi prometteuse pour les fonctions cognitives et la fatigue. Elle est sûre, peu coûteuse et efficace dans cette fourchette de dose. Prenez-la régulièrement — les effets s’installent sur 4–6 semaines, pas immédiatement.
  disclaimer: >-
    La créatine est très bien tolérée aux doses indiquées. Elle peut entraîner une légère prise de poids temporaire due à la rétention d’eau dans les muscles. Demandez l’avis de votre médecin généraliste avant de la prendre si vous avez une maladie rénale, car la créatine augmente le taux de créatinine (un marqueur de la fonction rénale) — ce n’est pas dangereux, mais cela peut compliquer l’interprétation des analyses de sang.
