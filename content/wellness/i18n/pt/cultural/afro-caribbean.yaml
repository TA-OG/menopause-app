# Tradução de cultural/afro-caribbean.yaml — prevalece a versão em inglês.
items:
  ackee-saltfish-sodium:
    body: |-
      O ackee com bacalhau salgado (ackee and saltfish) é um prato básico em muitas casas caribenhas, com grande significado cultural. O ackee em si é excelente do ponto de vista nutricional — rico em proteína e gorduras saudáveis. No entanto, o bacalhau salgado pode ter muito sódio, o que pode agravar o inchaço e a retenção de líquidos e contribuir para alterações da tensão arterial, já mais comuns durante a menopausa.

      Experimente reduzir a quantidade de bacalhau e demolhá-lo durante mais tempo para tirar mais sal. Tempere com ervas frescas e especiarias em vez de juntar sal de mesa. Assim mantém o prato e a tradição — apenas com mais cuidado para o seu corpo neste momento.
  rice-peas-blood-sugar:
    body: |-
      O rice and peas é um prato reconfortante básico. O feijão-vermelho (ervilha-de-angola, feijão-frade) do prato é excelente — rico em proteína vegetal, fibra e fitoestrogénios que podem ajudar com os sintomas vasomotores. O arroz é a parte a vigiar. Passar para arroz integral, ou reduzir a porção de arroz branco e aumentar a de feijão, ajuda a estabilizar o açúcar no sangue, que afeta diretamente a frequência dos afrontamentos e a estabilidade do humor.
  plantain-glycaemic:
    body: |-
      A banana-pão madura é muito apreciada, mas tem um índice glicémico mais elevado. Se os afrontamentos ou as alterações de humor forem significativos, experimente comê-la com proteína (frango, peixe, feijão) em vez de sozinha — a proteína abranda a resposta da glicose. A banana-pão verde é melhor escolha para o equilíbrio do açúcar no sangue.
  callaloo-magnesium:
    body: |-
      O callaloo é mesmo excelente na menopausa. É rico em magnésio (que apoia o sono e reduz a frequência dos afrontamentos), ferro, cálcio e folato. Se não o come com regularidade, vale a pena trazê-lo de volta. A variedade de amaranto usada nas Caraíbas é particularmente nutritiva.
  sorrel-hibiscus:
    body: |-
      O sorrel (hibisco) é usado há gerações nas tradições das Caraíbas e da África Ocidental. A investigação apoia os seus benefícios para a tensão arterial e as suas propriedades antioxidantes. Vale a pena bebê-lo sem muito açúcar — a bebida tradicional de sorrel do Natal pode ser feita com menos adoçante, mantendo a profundidade do sabor com cravinho, gengibre e canela.
  coconut-oil-fats:
    body: |-
      O óleo e o leite de coco são muito usados na cozinha caribenha e podem fazer parte de uma alimentação saudável em quantidades moderadas. Na menopausa, a alteração dos estrogénios muda a forma como a gordura é processada, sobretudo na barriga. Funciona bem equilibrar as gorduras de coco com peixe gordo (cavala, sardinha, arenque), excelente para a saúde do cérebro e contra a inflamação.
  stress-allostatic-load:
    body: |-
      A investigação mostra que as mulheres de origem africana e caribenha carregam uma «carga alostática» mais elevada — o efeito acumulado do stress crónico no corpo, incluindo o da discriminação racial e o de lidar com sistemas que não foram pensados para si. Esta resposta ao stress crónico pode amplificar os sintomas da menopausa, sobretudo os afrontamentos, as perturbações do sono e as alterações de humor.

      Isto não é um motivo para simplesmente «gerir melhor o stress» — é reconhecer que os seus sintomas podem ser mais intensos porque o seu corpo tem carregado mais. Vale a pena dizê-lo quando falar com o seu médico, e ser compassiva consigo mesma.
  hair-changes-menopause:
    body: |-
      O enfraquecimento do cabelo e as alterações de textura na menopausa são extremamente comuns e podem ser particularmente difíceis para as mulheres de origem africana e caribenha, para quem o cabelo está profundamente ligado à identidade e à expressão cultural. A combinação da descida dos estrogénios com o efeito do calor e dos tratamentos químicos pode agravar o efeito.

      Os penteados protetores que reduzem a manipulação, o cuidado do couro cabeludo (massagem regular, óleo de rícino) e uma ingestão suficiente de proteína e ferro são abordagens com evidência, a par de qualquer tratamento tópico.
  speaking-up-gp:
    body: |-
      A investigação nos cuidados de saúde primários do Reino Unido mostra que às mulheres de minorias étnicas se propõe menos a THS e que os seus sintomas são levados menos a sério. É uma desigualdade em saúde documentada, não é imaginação sua.

      Se os seus sintomas forem significativos, tem todo o direito de defender os seus interesses com clareza. Faça um diário de sintomas antes da consulta. Seja concreta sobre o impacto no seu dia a dia. Se o seu médico desvalorizar, tem o direito de pedir uma segunda opinião ou um encaminhamento para um especialista em menopausa. A Aunty Mel pode ajudá-la a preparar essas conversas.
  community-and-isolation:
    body: |-
      Em algumas comunidades caribenhas, não se fala abertamente da menopausa — pode ser tratada como algo a gerir em privado, ou associada ao envelhecimento de forma estigmatizante. Pode sentir que não consegue falar disso com as mulheres à sua volta.

      Mas a sabedoria sempre esteve lá. As tias que passaram por isto antes de si sabiam. Encontrar a sua versão dessa comunidade — online, entre amigas ou através desta app — pode fazer uma diferença significativa na forma como vive esta transição.
  vitamin-d-caribbean-uk:
    body: |-
      As mulheres de origem africana e caribenha que vivem no Reino Unido têm um risco bastante mais elevado de carência de vitamina D — a melanina da pele mais escura precisa de mais tempo de exposição solar para produzir a mesma vitamina D, e a luz solar do Reino Unido é insuficiente durante a maior parte do ano.

      A carência de vitamina D agrava o cansaço, o humor, as dores articulares e o sono — todos sintomas já aumentados na menopausa. Pode fazer a análise através do seu médico. A maioria das orientações britânicas de dermatologia e menopausa recomenda 1000–2000 UI por dia a mulheres de pele mais escura no Reino Unido, mas faça primeiro a análise antes de tomar doses mais elevadas.
      AVISO: confirme sempre com o seu médico antes de começar suplementos, sobretudo em doses acima da recomendação padrão do NHS de 400 UI.
  iron-monitoring:
    body: |-
      Se ainda tem menstruação durante a perimenopausa — que pode ser mais abundante e irregular —, é importante vigiar o ferro. As hemorragias abundantes na perimenopausa são mais comuns nas mulheres negras e podem levar a anemia por falta de ferro, o que agrava muito o cansaço.

      Peça ao seu médico um hemograma completo se o cansaço for um sintoma importante para si.
      AVISO: confirme sempre com o seu médico antes de começar suplementos de ferro — ferro a mais pode ser prejudicial.
byTitle:
  Something important to know about your timeline:
    title: Algo importante a saber sobre o seu calendário
    body: |-
      A investigação mostra de forma consistente que as mulheres de origem africana e caribenha chegam normalmente à menopausa por volta dos 49–50 anos — cerca de 18 meses antes da média do Reino Unido, de 51. Isto significa que a perimenopausa pode começar entre o início e meados dos 40, por vezes até no fim dos 30.

      Se lhe disseram que é «demasiado nova» para estar na perimenopausa, pode não ser o caso. Vale a pena ter isto presente quando falar com o seu médico.

      Uma ressalva a não esquecer: são médias de investigação sobretudo norte-americana, não uma previsão do seu próprio calendário.
