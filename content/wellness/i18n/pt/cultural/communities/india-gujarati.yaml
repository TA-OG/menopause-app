# Tradução de cultural/communities/india-gujarati.yaml — prevalece a versão em inglês.
items:
  dal-dhokli-legume-advantage:
    body: |-
      O dal dhokli, o handvo e a grande variedade de dals guzerates oferecem uma nutrição excelente para a menopausa. As lentilhas e as leguminosas são ricas em fitoestrogénios, proteína vegetal e fibra. A presença constante do dal na cozinha guzerate, nas três refeições, é uma vantagem alimentar natural em relação às mulheres que seguem alimentações ocidentais com poucas leguminosas.

      Os fitoestrogénios de uma alimentação guzerate habitual com dal podem já estar a ajudar nos sintomas vasomotores sem que dê por isso.
  thepla-methi-phytoestrogens:
    body: |-
      O thepla com methi (feno-grego) é um clássico guzerate com relevância concreta na menopausa. O feno-grego é rico em fitoestrogénios e tem sido estudado pelo seu papel na redução da frequência dos afrontamentos e no apoio à regulação do açúcar no sangue. Um methi nu thepla ao pequeno-almoço é uma escolha nutricional com significado, não apenas cultural.
  undhiyu-seasonal-vegetables:
    body: |-
      O undhiyu — o prato de legumes da época e lentilhas — é um dos pratos mais completos da cozinha guzerate do ponto de vista nutricional. A combinação de vários legumes, surti papdi (feijão-chato), tuvar (ervilha-de-angola) e banana verde fornece um conjunto variado de fitoestrogénios, fibra e micronutrientes. A banana verde (kacchi keri) fornece amido resistente, que alimenta as bactérias intestinais benéficas.
  dhokla-fermented-gut:
    body: |-
      O dhokla e o handvo são alimentos fermentados (massa de grão-de-bico fermentada) com propriedades probióticas. Os alimentos fermentados apoiam a saúde da microbiota intestinal que, segundo investigação emergente, influencia a forma como o corpo metaboliza e recicla os estrogénios. Manter alimentos guzerates fermentados na alimentação apoia a saúde intestinal durante a menopausa.
  jaggery-sugar-alternatives:
    body: |-
      A comida guzerate é conhecida por ser ligeiramente doce — o jaggery (gol) é usado no dal, na sabzi e nos petiscos. O jaggery tem um índice glicémico um pouco mais baixo do que o açúcar refinado e contém oligoelementos. No entanto, na menopausa, a quantidade total de açúcar — de qualquer origem — afeta a estabilidade do açúcar no sangue e pode agravar os afrontamentos.

      Usar menos jaggery do que as receitas tradicionais indicam, e comer os pratos doces com uma fonte de proteína, modera o impacto no açúcar no sangue.
  chaas-buttermilk-calcium:
    body: |-
      O chaas (leitelho condimentado) é uma bebida guzerate básica e uma boa fonte de cálcio, proteína e probióticos. Beber chaas depois das refeições ajuda a digestão e contribui para o cálcio necessário para proteger a densidade óssea na menopausa. Os cominhos e o gengibre do chaas também têm propriedades digestivas e anti-inflamatórias.
  til-sesame-calcium-phytoestrogens:
    body: |-
      O til (sementes de sésamo) é usado em toda a cozinha e nos petiscos guzerates — til ladoo, tilgul e como guarnição. As sementes de sésamo são ricas em cálcio (importante para os ossos) e contêm lenhanas, uma forma de fitoestrogénio. É um contributo nutricional pequeno mas real de um alimento muito enraizado na cultura.
  jain-dietary-context:
    body: |-
      Para as mulheres guzerates jainistas, as restrições alimentares (sem tubérculos e raízes em certos períodos, sem carne) fazem com que as fontes vegetais de proteína e cálcio precisem de atenção especial na menopausa.

      Os lacticínios (paneer, dahi, chaas), as sementes de sésamo, as amêndoas, as sementes de abóbora, os legumes de folha verde e as lentilhas são fontes de cálcio e proteína compatíveis com o jainismo, que apoiam a nutrição na menopausa dentro da prática religiosa.
  cvd-metabolic-gujarati:
    body: |-
      As mulheres do Sul da Ásia, incluindo as guzerates, têm taxas bastante mais elevadas de síndrome metabólica, resistência à insulina e risco cardiovascular durante a transição para a menopausa. Isto está documentado clinicamente e significa que vigiar a tensão arterial e o açúcar no sangue é importante neste período.
  community-expectations:
    body: |-
      As mulheres guzerates carregam muitas vezes grandes responsabilidades familiares e comunitárias — negócios de família, agregados alargados e redes comunitárias. A expectativa de ser produtiva e manter a compostura pode dificultar dar nome à sua própria experiência da menopausa ou dar-lhe prioridade.

      Pode manter os valores da sua comunidade e, ainda assim, levar os seus sintomas a sério. As duas coisas são verdade.
  vitamin-d-gujarati:
    body: |-
      A carência de vitamina D é frequente nas mulheres guzerates no Reino Unido.
      Faça uma análise através do seu médico antes de tomar suplementos acima dos níveis padrão do NHS.
      AVISO: o excesso de vitamina D é tóxico. Faça a análise e depois suplemente de forma adequada.
byTitle:
  Your menopause may start earlier — and your diet is already an asset:
    title: A sua menopausa pode começar mais cedo — e a sua alimentação já é uma vantagem
    body: |-
      As mulheres indianas chegam normalmente à menopausa por volta dos 46,7 anos — 4 anos antes da média do Reino Unido. A perimenopausa pode começar no fim dos 30.

      A cozinha guzerate é sobretudo vegetal e rica em leguminosas — uma vantagem nutricional real para gerir os sintomas da menopausa. A sua alimentação tradicional já está a fazer um trabalho de que talvez não se tivesse apercebido.
