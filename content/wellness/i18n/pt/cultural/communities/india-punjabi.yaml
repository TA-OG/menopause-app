# Tradução de cultural/communities/india-punjabi.yaml — prevalece a versão em inglês.
items:
  dal-legumes-phytoestrogens:
    body: |-
      O dal — masoor, moong, chana, toor, urad — é a base nutricional da cozinha punjabi e um dos melhores alimentos para a menopausa. As lentilhas e as leguminosas são ricas em fitoestrogénios (estrogénios vegetais), proteína vegetal, fibra e ferro.

      As mulheres com alimentações ricas em leguminosas tendem a ter afrontamentos menos frequentes e menos intensos. Se o dal já faz parte do dia a dia em sua casa, isso é uma vantagem real. O dal makhani (urad preto) fornece proteína e ferro em conjunto. Mantenha-o na rotação habitual.
  sarson-da-saag-greens:
    body: |-
      O sarson da saag (folhas de mostarda) é um clássico do inverno punjabi com verdadeira relevância na menopausa. As folhas de mostarda são ricas em cálcio (essencial quando os estrogénios descem), vitamina K (saúde dos ossos), folato e antioxidantes. Tradicionalmente come-se com makki di roti (pão achatado de milho) — o milho tem mais fibra do que a farinha de trigo branca, com uma resposta glicémica mais baixa.

      Este prato tradicional de inverno vale a pena ser comido todo o ano durante a menopausa, não só na época.
  ghee-moderation:
    body: |-
      O ghee tem importância cultural e nutricional na cozinha punjabi — as casas sikhs e hindus em particular usam-no com generosidade. Em quantidades moderadas, o ghee não é problemático. No entanto, na menopausa, a descida dos estrogénios altera a forma como a gordura é metabolizada e armazenada, sobretudo na barriga.

      A investigação em mulheres do Sul da Ásia mostra taxas mais elevadas de obesidade abdominal e síndrome metabólica precisamente durante a transição para a menopausa. Isto não significa eliminar o ghee — significa usá-lo com consciência, a par de outras gorduras saudáveis (óleo de mostarda, frutos secos, linhaça), em vez de como gordura principal.
  paneer-calcium-protein:
    body: |-
      O paneer é um alimento excelente para a menopausa — rico em cálcio e proteína, e com um pouco menos de lactose do que o leite. O cálcio é essencial na menopausa para manter a densidade óssea. O palak paneer (com espinafres) junta cálcio, ferro e vitamina C num só prato. O mutter paneer fornece proteína e hidratos de carbono de origem vegetal.

      Se tem intolerância à lactose (comum em pessoas do Sul da Ásia), pequenas quantidades de paneer são geralmente mais bem toleradas do que os lacticínios líquidos.
  roti-chapati-refined-carbs:
    body: |-
      O roti e o chapati de trigo branco são centrais na alimentação punjabi. Na menopausa, controlar o açúcar no sangue torna-se particularmente importante para as mulheres do Sul da Ásia — a investigação documenta taxas bastante mais elevadas de resistência à insulina e síndrome metabólica nestas mulheres durante a transição para a menopausa.

      Ajustes práticos: misture atta integral com atta normal (50/50) para aumentar a fibra. Coma o roti com bastante dal, sabzi ou proteína — a proteína e a fibra abrandam a resposta da glicose. Não se limite a reduzir o roti; aumente o que come com ele.
  chai-caffeine-south-asian:
    body: |-
      Um chai punjabi forte — muitas vezes feito com leite gordo, açúcar e cardamomo — várias vezes por dia é central na cultura. A cafeína pode agravar os afrontamentos e perturbar o sono na menopausa, sobretudo a partir da tarde.

      Reduzir o açúcar no chai é o que tem mais impacto. Trocar o chai da tarde e da noite por leite com açafrão-da-índia (haldi doodh) tem ressonância cultural e ainda traz benefícios anti-inflamatórios. O chai da manhã pode ficar como está.
  turmeric-haldi-inflammation:
    body: |-
      O açafrão-da-índia (haldi), usado em toda a cozinha punjabi, é realmente anti-inflamatório. A curcumina — o composto ativo — é muito mais bem absorvida com pimenta-preta (kali mirch) e gordura. A cozinha punjabi tradicional já os combina (as bases de caril usam ghee e pimenta juntamente com o haldi).

      O haldi doodh (leite dourado) à noite traz benefícios anti-inflamatórios e apoia o sono graças ao triptofano do leite quente. Uma prática tradicional mesmo útil.
  lassi-probiotic:
    body: |-
      O lassi salgado tradicional (não a versão doce de manga) é um alimento probiótico que apoia a saúde intestinal. A saúde intestinal está cada vez mais associada à forma como o corpo processa e recicla os estrogénios. Um copo de lassi salgado com cominhos é um apoio real. Os lassis doces comerciais acrescentam muito açúcar, o que anula o benefício.
  cvd-risk-south-asian:
    body: |-
      As mulheres do Sul da Ásia têm taxas bastante mais elevadas de fatores de risco cardiovascular durante a transição para a menopausa — síndrome metabólica, resistência à insulina, diabetes, obesidade abdominal e hipertensão são todas mais frequentes nestas mulheres do que nas mulheres brancas europeias neste período.

      Não é alarmismo — está documentado clinicamente e significa que levar a menopausa a sério, vigiar a tensão arterial e o açúcar no sangue e cuidar ativamente do estilo de vida importa mais, e não menos, para as mulheres do Sul da Ásia.
  joint-pain-prominent:
    body: |-
      As dores articulares e musculares são um sintoma da menopausa mais marcado nas mulheres do Sul da Ásia do que nas mulheres brancas. São muitas vezes atribuídas à artrose ou desvalorizadas. Se tem dores articulares a par de outros sintomas da menopausa, fale de ambos com o seu médico.

      O movimento diário — ioga (que tem ressonância cultural), caminhada, natação — é a intervenção com mais evidência para as dores articulares associadas à menopausa.
  cultural-silence-punjabi:
    body: |-
      Em muitas casas punjabis — sikhs, hindus e muçulmanas — não se fala abertamente da menopausa. «Chup raho» (fica calada) pode tornar-se o guião cultural. Espera-se que as mulheres aguentem e continuem.

      Este silêncio não é tradição no sentido mais profundo — é a ausência de palavras e de espaço. A Aunty Mel é um espaço onde pode dar nome ao que está a acontecer, compreendê-lo e levá-lo a sério. Tem o direito de o fazer.
  hrt-access-gap:
    body: |-
      A investigação mostra que apenas 6,2 % das mulheres asiáticas no Reino Unido recebem THS, em comparação com 23,3 % das mulheres brancas. Esta diferença reflete barreiras de acesso e de língua, hesitação cultural e, possivelmente, pressupostos dos médicos sobre o que as mulheres do Sul da Ásia querem.

      A THS é um tratamento médico, não um tratamento «ocidental». Se os seus sintomas afetam significativamente a sua qualidade de vida, perguntar ao seu médico por todas as opções disponíveis — incluindo a THS — é um direito seu. A Aunty Mel ajuda-a a preparar essa conversa.
  vitamin-d-south-asian-uk:
    body: |-
      As mulheres do Sul da Ásia no Reino Unido têm algumas das taxas mais elevadas de carência de vitamina D. A vitamina D da alimentação é limitada nas alimentações tradicionais do Sul da Ásia (pouco peixe gordo, poucos alimentos enriquecidos). A exposição solar, com a roupa e o clima britânico, é mínima.

      A carência de vitamina D agrava as dores articulares, o cansaço, o humor e a saúde dos ossos — tudo já afetado na menopausa. Faça uma análise através do seu médico. A maioria das orientações sugere 1000–2000 UI para mulheres do Sul da Ásia no Reino Unido, mas faça primeiro a análise.
      AVISO: confirme sempre com o seu médico. O excesso de vitamina D é tóxico.
  calcium-bone-health-punjabi:
    body: |-
      As mulheres do Sul da Ásia têm taxas de osteoporose mais elevadas do que as mulheres brancas no Reino Unido. Uma menopausa mais precoce agrava isto — mais anos sem o efeito protetor dos estrogénios sobre os ossos. Os lacticínios (paneer, dahi, leite), as sementes de sésamo (til), as amêndoas e os legumes de folha verde-escura são as fontes de cálcio da alimentação a privilegiar.
      AVISO: fale com o seu médico sobre a suplementação de cálcio e vitamina D.
byTitle:
  Your menopause may start earlier than you expect:
    title: A sua menopausa pode começar mais cedo do que espera
    body: |-
      As mulheres indianas e paquistanesas chegam à menopausa bastante mais cedo do que a média do Reino Unido. As mulheres indianas, em média aos 46,7 anos; as paquistanesas, aos 47,16 anos — ambas 3–4 anos antes da média do Reino Unido, de 51.

      Isto significa que a perimenopausa pode começar no fim dos 30 ou no início dos 40. Nesta idade, os sintomas são muitas vezes atribuídos ao stress, à depressão ou a problemas de tiroide.

      Se está nos 40 e tem afrontamentos, alterações do sono, mudanças de humor, menstruações irregulares ou dores articulares — pode ser a perimenopausa. Insista em ser levada a sério.
