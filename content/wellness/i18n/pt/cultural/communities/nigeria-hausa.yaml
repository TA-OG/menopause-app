# Tradução de cultural/communities/nigeria-hausa.yaml — prevalece a versão em inglês.
items:
  fura-da-nono-probiotic-calcium:
    body: |-
      O fura da nono — a bebida fula de leite fermentado feita com bolinhas de milho-miúdo e leite de vaca fermentado — tem um valor nutricional significativo para as mulheres na menopausa. Fornece cálcio (essencial para a densidade óssea quando os estrogénios descem), bactérias probióticas (que apoiam a saúde intestinal e podem melhorar o metabolismo dos fitoestrogénios) e proteína.

      Se tiver acesso a ela, é um dos alimentos tradicionais mais relevantes para esta fase da vida. Se a fizer em casa, a fermentação é a parte mais importante do ponto de vista nutricional.
  tuwo-shinkafa-grain-staple:
    body: |-
      O tuwo shinkafa (papa ou bola de arroz) é o acompanhamento básico do Norte, comido com várias sopas. Os básicos à base de arroz são geralmente mais fáceis de digerir do que os acompanhamentos mais pesados. Comer o tuwo com miyan kuka (sopa de folhas de embondeiro) ou miyan taushe (sopa de abóbora) dá uma refeição nutricionalmente equilibrada.

      Na menopausa, a estabilidade do açúcar no sangue importa. Juntar o tuwo a sopas ricas em proteína, e reduzir a porção de tuwo aumentando a de sopa, modera a resposta da glicose.
  miyan-kuka-baobab:
    body: |-
      O miyan kuka (sopa de folhas de embondeiro) é rico em cálcio, ferro, vitamina C e antioxidantes. O embondeiro (baobá) — chamado «a árvore da vida» em toda a África subsariana — tem um dos teores de vitamina C mais elevados de qualquer alimento. A vitamina C ajuda a absorver o ferro e apoia o sistema imunitário, ambos importantes na menopausa.

      O pó de baobá já se vende também em lojas de produtos naturais no Reino Unido — uma colher de chá num batido ou nas papas dá um reforço significativo de nutrientes.
  masa-tsamiya-sorghum:
    body: |-
      O masa (panquecas de arroz fermentado) e o tsamiya (tamarindo) fazem parte da cultura haúça de petiscos. Os alimentos fermentados apoiam a saúde intestinal. O tamarindo tem propriedades antioxidantes. Os alimentos à base de sorgo (burukutu, tuwo dawa) têm mais fibra e um índice glicémico mais baixo do que o arroz branco, o que os torna melhor escolha na menopausa para gerir o açúcar no sangue.
  suya-kilishi-protein:
    body: |-
      O suya (carne de vaca ou frango grelhado com especiarias) e o kilishi (carne seca condimentada) são ricos em proteína — importante na menopausa, quando manter a massa muscular se torna mais crucial. A mistura de especiarias (especiaria suya/tankora) contém amendoim, gengibre e outras especiarias com propriedades anti-inflamatórias.

      O suya dos vendedores de rua tende a ter muito sal. Se o fizer em casa, reduzir o sal mantendo as especiarias apoia a saúde cardiovascular, que ganha importância depois da menopausa, quando diminui o efeito protetor dos estrogénios sobre o coração.
  groundnuts-legumes:
    body: |-
      O amendoim (kulikuli, sopa de amendoim, óleo de amendoim) é central na cozinha do Norte da Nigéria e fornece proteína, gorduras saudáveis e alguns fitoestrogénios. O óleo de amendoim é melhor escolha para cozinhar do que os óleos vegetais refinados. A sopa de amendoim com cereais dá energia duradoura e estabilidade do açúcar no sangue.
  purdah-vitamin-d:
    body: |-
      Para as mulheres haúças-fulas que praticam o purdah ou que se cobrem totalmente na rua, a carência de vitamina D é um risco de saúde significativo. A combinação de pouca exposição solar com pele escura faz com que a produção de vitamina D seja mínima no Reino Unido.

      A carência de vitamina D agrava diretamente as dores articulares, o cansaço, a saúde dos ossos e o humor na menopausa — todos sintomas já mais frequentes. É uma questão médica importante a tratar com o seu médico, independentemente da forma como escolhe vestir-se.
  community-women-network:
    body: |-
      As redes comunitárias das mulheres haúças — informais e formais — foram historicamente espaços importantes onde as mulheres partilham conhecimento sobre saúde. O conceito de «sadaka» (caridade e cuidado da comunidade) estende-se à partilha de conhecimento sobre saúde.

      Procurar informação sobre a menopausa junto de mulheres da sua comunidade que já a viveram é uma fonte de apoio válida e valiosa, a par de orientação baseada em evidência.
  islamic-framing-natural-process:
    body: |-
      Na erudição islâmica, a menopausa é entendida como parte natural do ciclo da vida criado por Alá — o fim de uma responsabilidade (ter filhos) e a libertação de energia para outras formas de contributo e de adoração. Esta visão positiva tem um valor real para o bem-estar.

      A sua fé não exige que sofra os sintomas em silêncio. Procurar conhecimento sobre o seu corpo e procurar alívio para os sintomas é coerente com os princípios islâmicos de cuidar do corpo como uma amanah (um depósito confiado).
  discussing-sexual-health:
    body: |-
      Falar de saúde sexual — incluindo alterações da libido, secura vaginal ou dor nas relações íntimas — pode ser muito difícil em contextos culturais haúças-fulas, onde estes são assuntos privados.

      Na privacidade desta app, pode registar e compreender estas alterações sem as revelar a ninguém. Se forem significativas e estiverem a afetar a sua vida, falar em confidencialidade com uma médica é um direito seu. Estas alterações são médicas, têm soluções baseadas em evidência e merece ter acesso a elas.
  calcium-bone-health-hausa:
    body: |-
      A alimentação tradicional haúça-fula é uma das mais ricas em cálcio da África Ocidental graças ao consumo de lacticínios (fura da nono, leite). É uma vantagem real para a saúde dos ossos na menopausa. Mantenha este padrão alimentar e fale com o seu médico sobre uma densitometria óssea (DEXA) se tiver uma menopausa precoce ou antecedentes familiares de osteoporose.
      AVISO: fale com o seu médico sobre a suplementação de cálcio.
  vitamin-d-hausa:
    body: |-
      A carência de vitamina D é particularmente elevada nas mulheres haúças no Reino Unido.
      Faça uma análise através do seu médico antes de tomar doses mais elevadas.
      AVISO: confirme sempre com o seu médico. O excesso de vitamina D é tóxico.
byTitle:
  Your diet is already doing some of the work:
    title: A sua alimentação já está a fazer parte do trabalho
    body: |-
      A alimentação tradicional haúça-fula — rica em cereais, leguminosas e lacticínios fermentados — oferece algumas vantagens nutricionais naturais na menopausa. O fura da nono (bebida de leite fermentado), em particular, fornece cálcio, probióticos e proteína que apoiam a saúde dos ossos durante a descida dos estrogénios na menopausa.

      As mulheres nigerianas tendem a chegar à menopausa mais cedo do que a média ocidental de 51 anos. Se está nos 40 e nota alterações, leve-as a sério.
