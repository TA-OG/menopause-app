# Tradução de cultural/communities/nigeria-igbo.yaml — prevalece a versão em inglês.
items:
  bitter-leaf-ofe-onugbu:
    body: |-
      O ofe onugbu (sopa de folha amarga) é um prato tipicamente igbo, e há investigação emergente que apoia as suas propriedades anti-inflamatórias e reguladoras da glicose. A folha amarga (Vernonia amygdalina) é usada há gerações na medicina tradicional igbo e, de forma mais ampla, da África Ocidental. Na menopausa, quando importam tanto gerir a inflamação como estabilizar o açúcar no sangue, é um prato a privilegiar.

      A combinação igbo tradicional de sopa de folha amarga com inhame-coco (cocoyam) ou eba fornece fibra, compostos vegetais e proteína.
  oha-soup-nutrients:
    body: |-
      A sopa de oha (feita com folhas de oha, ou «pau-rosa africano») é rica em cálcio, ferro e vitamina C — todos importantes na transição para a menopausa, quando a densidade óssea, a energia e a função imunitária se alteram. As folhas de oha também são ricas em fibra.

      Se encontrar oha com facilidade (em lojas de produtos africanos no Reino Unido), é uma sopa nutricionalmente excelente que vale a pena comer com regularidade.
  egusi-protein-zinc:
    body: |-
      O egusi (sementes de melão) — usado nas cozinhas igbo, iorubá e outras da África Ocidental — é rico em zinco, proteína e gorduras saudáveis. O zinco é essencial para a síntese de testosterona (que afeta a energia e a libido das mulheres na menopausa) e para o sistema imunitário. A sopa de egusi com legumes de folha é uma refeição mesmo nutritiva para a menopausa.
  yam-fufu-blood-sugar:
    body: |-
      O fufu, o eba e o inhame pilado são os acompanhamentos básicos igbo. Têm importância cultural e valor nutricional — o inhame contém compostos que apoiam o equilíbrio hormonal. No entanto, porções grandes de hidratos de carbono refinados sem legumes ou proteína suficientes podem fazer subir muito o açúcar no sangue, o que agrava os afrontamentos e a instabilidade do humor.

      A abordagem igbo tradicional de refeições com muita sopa (mais sopa, menos acompanhamento) modera isto de forma natural. Siga o equilíbrio tradicional em vez de o ocidentalizar.
  palm-nut-soup-abenkwan-banga:
    body: |-
      A sopa de noz de palma (ofe akwu) é nutritiva e tem importância cultural. As nozes de palma fornecem vitamina E e betacaroteno. Na menopausa, a questão é o equilíbrio geral das gorduras saturadas — complemente a cozinha com muito óleo de palma com peixe gordo (sardinha, cavala, atum) e legumes de folha verde-escura para equilibrar os ómega-3.
  ukazi-afang-leafy-greens:
    body: |-
      As folhas de ukazi (usadas na sopa afang e como espessante) são ricas em ferro e fibra. A sopa afang — uma combinação de ukazi e waterleaf — é uma das sopas mais densas em nutrientes da cozinha do Leste da Nigéria. Para as mulheres com cansaço na perimenopausa ou hemorragias abundantes, o teor de ferro é mesmo relevante.
  abacha-african-salad:
    body: |-
      O abacha (salada africana de mandioca seca) é um prato igbo mais leve, muitas vezes feito com beringela africana (garden egg), cebola, lagostim seco e óleo de palma. Tem menos hidratos de carbono do que as refeições com acompanhamento, o que o torna uma opção útil para gerir o açúcar no sangue e as alterações de peso na barriga durante a menopausa. A beringela africana também tem propriedades antioxidantes documentadas.
  vitamin-d-igbo-uk:
    body: |-
      As mulheres igbo que vivem no Reino Unido — como todas as mulheres de origem africana — têm um risco elevado de carência de vitamina D, porque a melanina precisa de mais exposição solar e no Reino Unido há pouca radiação UV fora dos meses de verão.

      O cansaço, as dores articulares, o humor em baixo e os problemas ósseos agravam-se com a carência de vitamina D — e estão todos já aumentados na menopausa. Fazer a análise e corrigir a carência é uma ação simples e de grande impacto.
  nkwobi-okonkwo-social:
    body: |-
      A cultura alimentar igbo é profundamente social — o nkwobi, o isi ewu e o ofe são muitas vezes pratos partilhados em encontros. Esta dimensão comunitária da refeição tem um valor real para o bem-estar na menopausa. A ligação social, o apoio emocional e a experiência partilhada da comida são proteções documentadas contra o isolamento que pode acompanhar uma grande mudança hormonal.

      Não subestime o remédio que existe na sua comunidade.
  igbo-women-strength:
    body: |-
      As mulheres igbo são conhecidas pela resiliência, pelo espírito empreendedor e pela liderança na comunidade. Essa força pode às vezes significar aguentar as dificuldades em silêncio — «onye aghala nwanne ya» (não abandones os teus) pode tornar-se um peso quando significa não pedir ajuda para si.

      Levar a sério os sintomas da menopausa — registá-los, procurar apoio e defender os seus interesses junto do seu médico — não é fraqueza. É a mesma inteligência e determinação que levaram a revolta das mulheres de Aba (Aba Women’s Riot) à história. Merece essa mesma energia virada para o seu próprio corpo.
  vitamin-d-testing:
    body: |-
      Análise da vitamina D e suplementação em caso de carência. Particularmente importante para as mulheres igbo no Reino Unido, que têm taxas elevadas de carência devido ao tom de pele e ao clima britânico.
      AVISO: faça uma análise antes de tomar mais de 400 UI. O excesso de vitamina D é tóxico. Fale com o seu médico.
byTitle:
  Your timeline and your symptoms may be earlier than expected:
    title: O seu calendário e os seus sintomas podem chegar mais cedo do que espera
    body: |-
      As mulheres nigerianas chegam normalmente à menopausa mais cedo do que a média do Reino Unido, de 51 anos. A perimenopausa pode começar entre o início e meados dos 40. A visão igbo da feminilidade como portadora de sabedoria, força e comunidade — «nwanyi oma» — pode ser uma verdadeira âncora nesta transição.

      Não está a perder a sua força. Ela está a mudar de forma.
