# Tradução de cultural/communities/nigeria-yoruba.yaml — prevalece a versão em inglês.
items:
  amala-yam-hormones:
    body: |-
      O amala — o querido acompanhamento iorubá feito com farinha de inhame seco — tem uma relevância nutricional real na menopausa. A investigação nutricional nigeriana documenta que o inhame contém compostos que podem ajudar a equilibrar as hormonas que mudam na menopausa, e que tem propriedades anti-inflamatórias. O amala com ewedu e gbegiri é uma refeição equilibrada e rica em fibra que apoia a estabilidade do açúcar no sangue.

      Quanto mais escuro o amala (feito com a casca do inhame por descascar), mais fibra tem. É um prato que pode manter na rotação habitual com tranquilidade.
  ewedu-gbegiri-nutrients:
    body: |-
      O ewedu (folhas de juta) é um dos legumes mais nutritivos da cozinha iorubá — rico em cálcio, ferro e vitamina C. Todos são particularmente importantes na menopausa, quando a densidade óssea começa a mudar e as necessidades de energia se alteram. O gbegiri (sopa de feijão-frade) acrescenta proteína vegetal e fitoestrogénios.

      A combinação de ewedu, gbegiri e guisado com amala ou inhame pilado é — do ponto de vista nutricional — uma refeição excelente para a menopausa.
  efo-riro-leafy-greens:
    body: |-
      O efo riro (sopa de legumes iorubá) com tete (folhas de amaranto) ou espinafres é rico em magnésio, que apoia a qualidade do sono e pode reduzir a frequência dos afrontamentos. A combinação de óleo de palma (vitamina E, betacaroteno) com legumes de folha verde-escura fornece vitaminas lipossolúveis que o corpo aproveita bem.

      Cozinhe o efo riro com menos óleo se as alterações de peso na barriga a preocupam — a estrela nutricional são as folhas, não a quantidade de óleo.
  pounded-yam-blood-sugar:
    body: |-
      O inhame pilado (iyan) é central na cultura e nutritivo, mas tem um impacto glicémico maior em porções grandes. Na menopausa, a estabilidade do açúcar no sangue afeta diretamente a frequência dos afrontamentos e o humor.

      Um ajuste prático: porções mais pequenas de inhame pilado com mais sopa. O ewedu, o egusi ou o efo riro podem ser a porção maior. Assim mantém a refeição e a cultura, ao mesmo tempo que respeita as necessidades em mudança do seu corpo.
  pepper-spice-triggers:
    body: |-
      A comida iorubá é conhecida por ser bem picante — o ata rodo (malagueta scotch bonnet), o ata ijosi e várias malaguetas secas dão à cozinha iorubá o seu picante característico. A comida picante pode provocar afrontamentos em algumas mulheres durante a menopausa — não em todas, e nem sempre. Repare se nota um afrontamento nos 30–60 minutos seguintes a uma refeição particularmente picante.

      Se houver um padrão, não tem de abdicar do picante — ajuste a quantidade e repare se é o calor da malagueta ou o calor da menopausa que provoca o afrontamento.
  palm-oil-balance:
    body: |-
      O óleo de palma está presente em toda a cozinha iorubá e fornece vitamina E, betacaroteno e gordura saturada. No contexto das alterações dos estrogénios na menopausa — que afetam a forma como a gordura é metabolizada e armazenada —, um uso moderado de óleo de palma não é problema. O essencial é o padrão geral: complemente a cozinha com óleo de palma com peixe gordo (cavala, sardinha, atum) para equilibrar os ómega-3, que apoiam a saúde do cérebro e a gestão da inflamação.
  offal-iron:
    body: |-
      A cozinha iorubá aproveita muito bem as miudezas — shaki (dobrada), ponmo (pele de vaca), kpomo e vísceras. O fígado, em particular, é muito rico em ferro, o que é importante se ainda tem menstruações de perimenopausa que podem ser mais abundantes ou irregulares do que antes.

      Se o cansaço for um sintoma importante, peça ao seu médico um hemograma completo para verificar uma eventual anemia por falta de ferro — muitas vezes passa despercebida na perimenopausa.
  allostatic-load-yoruba:
    body: |-
      A investigação sobre a carga alostática — o custo fisiológico acumulado do stress crónico — é particularmente relevante para as mulheres negras britânicas que lidam com vários sistemas ao mesmo tempo: trabalho, família, expectativas da comunidade e, muitas vezes, discriminação racial.

      Na cultura iorubá, a expectativa de que as mulheres sejam pilares da comunidade — como iyá — pode significar carregar um enorme peso emocional e prático. Isto é honrado; e é também algo a nomear com honestidade. A resposta ao stress crónico amplifica os sintomas da menopausa. Procurar apoio, dar nome ao que carrega e reduzir a carga desnecessária sempre que possível não é fraqueza — é sabedoria.
  vitamin-d-uk:
    body: |-
      As mulheres iorubás no Reino Unido — como todas as mulheres de origem africana — têm um risco elevado de carência de vitamina D. A diferença entre o sol da Nigéria e o do Reino Unido não é pequena; é uma mudança fisiológica de 12 meses que afeta a saúde dos ossos, o humor, as dores articulares e o cansaço. Todos estes sintomas já estão aumentados na menopausa.

      Peça ao seu médico para analisar o seu nível de vitamina D. Em caso de carência, uma suplementação bem feita faz uma diferença mensurável na forma como se sente.
  menopause-not-taboo-here:
    body: |-
      Em muitas casas nigerianas e iorubás, não se fala diretamente da menopausa. É «aquilo que acontece» — sabe-se, mas não se nomeia. Este silêncio pode fazer com que as mulheres passem por sintomas significativos sem apoio, sem palavras e, por vezes, sem sequer perceberem o que está a acontecer ao seu corpo.

      Tem toda a permissão para dar nome ao que está a viver. Registá-lo, falar sobre isso e procurar apoio é exatamente para isso que esta app existe. A sabedoria das mulheres iorubás que vieram antes de si — que atravessaram esta transição através da comunidade, da comida e da prática cultural — é a base sobre a qual a Aunty Mel foi construída.
  gp-advocacy:
    body: |-
      A investigação mostra de forma consistente que, nos cuidados de saúde primários do Reino Unido, os sintomas da menopausa das mulheres negras são levados menos a sério e que lhes é proposto tratamento com menos frequência. Está documentado, não é imaginação.

      Se o seu médico desvalorizar, tem o direito de pedir uma segunda opinião, de pedir um encaminhamento para um especialista em menopausa e de levar os seus sintomas por escrito. Manter um diário de sintomas é a sua ferramenta mais poderosa nessa conversa.
  vitamin-d-yoruba:
    body: |-
      A carência de vitamina D é extremamente comum nas mulheres iorubás que vivem no Reino Unido. Os seus sintomas — cansaço, dores articulares, humor em baixo, mau sono — sobrepõem-se muito aos da menopausa e agravam-nos.

      Primeiro a análise (através do seu médico), depois o suplemento. A maioria das orientações recomenda 1000–2000 UI por dia a mulheres de origem africana no Reino Unido, mas a dose deve refletir o seu nível real.
      AVISO: confirme sempre com o seu médico antes de tomar mais do que a dose padrão do NHS de 400 UI. O excesso de vitamina D é tóxico.
  iron-perimenopausal-bleeding:
    body: |-
      Se ainda tem menstruação e esta se tornou mais abundante, mais frequente ou menos previsível — comum nas mulheres iorubás a entrar na perimenopausa, que tendem a ter mais sintomas vasomotores em geral —, vigiar o ferro é importante.

      Peça um hemograma completo. O cansaço é o primeiro sinal de anemia por falta de ferro, e muitas vezes passa despercebido ou é atribuído à idade ou à correria do dia a dia.
      AVISO: não tome suplementos de ferro sem fazer primeiro uma análise. O excesso de ferro é prejudicial.
byTitle:
  Your body may be ahead of the calendar:
    title: O seu corpo pode estar adiantado em relação ao calendário
    body: |-
      As mulheres nigerianas tendem a chegar à menopausa mais cedo do que a média do Reino Unido, de 51 anos. Nas mulheres iorubás em particular, os sintomas da perimenopausa podem começar entre o início e meados dos 40. Se lhe disseram que é «demasiado nova» para a menopausa, chame a atenção do seu médico para isto — vale a pena investigar mais cedo do que tarde.

      A visão iorubá da mulher mais velha como sabedoria e autoridade — como «iya» — tem aqui um valor real. Não está a perder algo; está a entrar nessa fase.
