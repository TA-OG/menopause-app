# Tradução de cultural/white-british-irish.yaml — prevalece a versão em inglês.
items:
  fish-chips-acv:
    body: |-
      Fish and chips com vinagre — um clássico. O peixe em si (bacalhau, arinca, solha) é uma boa fonte de proteína magra e de algum ómega-3. O polme e as batatas fritas são o desafio durante a menopausa — os fritos e os hidratos de carbono refinados podem agravar o inchaço, os afrontamentos e a instabilidade do açúcar no sangue.

      Uma abordagem prática: peixe no forno ou grelhado com uma porção mais pequena de batatas, mais vezes, em vez de uma porção completa menos vezes. O vinagre de sidra (o vinagre de malte sobre as batatas, ou como bebida diária diluída em água) tem alguma evidência no controlo do açúcar no sangue, embora modesta.
  tea-caffeine-timing:
    body: |-
      A cultura britânica do chá é real e o seu ritual importa. O chá tem menos cafeína do que o café, mas o suficiente para afetar o sono e, possivelmente, contribuir para os afrontamentos se for bebido em quantidade ao longo do dia.

      Uma abordagem prática: aproveite à vontade o chá da manhã e do início da tarde. Tenha atenção a partir do fim da tarde. Troque um ou dois chás por dia por infusões — hortelã-pimenta (também ligeiramente refrescante), camomila (apoia o sono) ou rooibos (sem cafeína, com o mesmo ritual).
  sunday-roast-adapted:
    body: |-
      O assado de domingo é equilibrado do ponto de vista nutricional — carne magra ou alternativas vegetarianas, legumes e proteína. O que joga contra na menopausa: grandes quantidades de molho espessado com farinha refinada, recheio de pão branco e sal em excesso. Os legumes, sobretudo os de folha verde e as crucíferas (brócolos, couve-flor, couves-de-bruxelas), são excelentes.

      Apostar na versão do assado com mais legumes — mais verdes, porções de hidratos de carbono mais pequenas — é uma adaptação realista que mantém intacta a refeição tradicional.
  alcohol-culture:
    body: |-
      O álcool está muito enraizado na vida social britânica, e um copo de vinho ou uma cerveja ao fim do dia é normal para muitas mulheres. O álcool agrava os afrontamentos, perturba a arquitetura do sono (mesmo em quantidades moderadas) e afeta o humor no dia seguinte — todos sintomas que já estão acentuados na menopausa.

      Isto não quer dizer deixar de beber em convívio. Quer dizer ser honesta consigo própria sobre a ligação entre um copo de vinho e a qualidade da sua noite. As alternativas sem álcool melhoraram imenso — nas noites em que o sono importa mesmo, vale a pena experimentar.
  processed-food-convenience:
    body: |-
      Refeições pré-feitas, sandes e comida de conveniência fazem parte, de forma realista, de uma vida ocupada no Reino Unido. O problema na menopausa é que muitas destas opções têm muito sal e hidratos de carbono refinados e pouca fibra — e tudo isso agrava os sintomas.

      Em vez de mudar toda a alimentação, concentre-se em uma ou duas trocas de grande impacto: juntar um punhado de sementes ou frutos secos ao que estiver a comer, ter húmus e palitos de legumes à mão para petiscar e escolher versões integrais quando existirem. Mudanças pequenas e regulares resultam melhor do que grandes mudanças de curta duração.
  stoicism-british-culture:
    body: |-
      A cultura britânica em relação à saúde é muitas vezes de gestão silenciosa — não se queixar, não fazer alarido, seguir em frente. Muitas mulheres contam que sofreram durante anos com sintomas significativos da menopausa antes de pedir ajuda, ou que foram ao médico e foram despachadas.

      Os seus sintomas merecem ser levados a sério. Manter um diário e ser específica com o seu médico sobre o impacto no seu dia a dia — trabalho, sono, relações — não é fazer alarido. É defender cuidados a que tem direito.
