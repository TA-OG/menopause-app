# Tradução de frameworks/hot-flashes-night-sweats.yaml — prevalece a versão em inglês.
df_cool_foods:
  title: Dê prioridade a alimentos «refrescantes»
  body: >-
    Os alimentos ricos em fitoestrogénios — sementes de linhaça moídas, edamame, tofu, tempeh — podem ajudar a amortecer as oscilações de estrogénios que provocam os afrontamentos. Procure ingerir 1–2 colheres de sopa de sementes de linhaça moídas por dia, juntas às papas, ao iogurte ou aos batidos.
df_reduce_triggers:
  title: Reduza os desencadeantes comuns dos afrontamentos
  body: >-
    A cafeína, o álcool, a comida picante e as bebidas muito quentes são os desencadeantes alimentares de afrontamentos mais referidos. Experimente eliminar um de cada vez durante duas semanas e registe se a frequência ou a intensidade dos afrontamentos diminui. Muitas mulheres descobrem que o café da manhã é o principal culpado.
df_blood_sugar:
  title: Estabilize o açúcar no sangue como base geral
  body: >-
    Algumas mulheres notam que os picos e quebras de açúcar no sangue parecem provocar ou agravar um afrontamento, embora este não seja um desencadeante estabelecido dos sintomas vasomotores da menopausa em geral — vale a pena observar em si, em vez de presumir. Comer proteína e gorduras saudáveis em todas as refeições (p. ex., ovos, frutos secos, peixe gordo, abacate) abranda de qualquer forma a absorção da glicose e é uma base razoável em qualquer caso. Evite hidratos de carbono refinados e snacks açucarados com o estômago vazio.
df_hf_hydration:
  title: Mantenha-se hidratada de forma regular
  body: >-
    A desidratação aumenta a temperatura corporal e torna os afrontamentos mais intensos. Cerca de 2 litros por dia é a referência habitual, distribuídos ao longo do dia, e um pouco mais se transpirar à noite — mas é uma orientação, não uma meta, e aquilo de que realmente precisa varia com o seu tamanho, o tempo e o quanto se mexe. Se um médico lhe disse para limitar os líquidos — por exemplo, por insuficiência cardíaca ou renal — siga esse limite, não este. Comece o dia com um copo grande de água fresca e tenha um junto à cama.
lf_layers_bedding:
  title: Roupa de cama por camadas — a solução mais prática para os suores noturnos
  body: >-
    Mude para roupa de cama respirável que absorva a humidade (bambu ou percal de algodão). Durma com camadas que possa afastar: um lençol, uma manta leve, um edredão — em vez de um só edredão pesado. Uma pequena ventoinha virada para longe de si (para arrefecer o quarto sem soprar para si) pode reduzir a intensidade dos suores noturnos, mantendo a temperatura ambiente abaixo dos 18 °C.
lf_paced_breathing:
  title: Respiração pausada para travar um afrontamento
  body: >-
    A investigação mostra que a respiração lenta e pausada (4–5 respirações por minuto) pode reduzir a intensidade de um afrontamento se começar ao primeiro sinal. Experimente: inspire contando até 4, sustenha 2, expire contando até 6. Pratique todos os dias para que se torne automático. São precisas cerca de 2 semanas de prática até funcionar de forma fiável no momento.
lf_exercise_timing:
  title: O momento do exercício conta
  body: >-
    O exercício moderado e regular reduz a frequência geral dos sintomas vasomotores — mas fazer exercício com calor ou a alta intensidade pode provocar afrontamentos temporariamente. Nas mulheres com suores noturnos importantes, o exercício de manhã, com o ar fresco, costuma resultar melhor do que ao fim do dia.
lf_clothing:
  title: Vista-se por camadas de fibras naturais
  body: >-
    Os tecidos sintéticos retêm o calor. As fibras naturais — algodão, linho, bambu, merino — deixam a humidade evaporar. No trabalho, um casaco de malha ou um blazer que possa tirar depressa dá-lhe mais controlo do que uma única peça mais grossa. Se puder, tenha uma pequena ventoinha na secretária.
mr_flush_not_just_supplements:
  title: Os afrontamentos não são só uma questão de suplementos
  body: >-
    A saúde intestinal e a estabilidade do açúcar no sangue também podem ter um papel. Algumas mulheres notam que as oscilações de açúcar provocam ou agravam um afrontamento, plausivelmente através da adrenalina libertada para corrigir uma descida — mas este não é um desencadeante estabelecido dos afrontamentos da menopausa em geral, apenas um padrão que algumas mulheres referem e que vale a pena observar em si. Estabilizar o açúcar ao longo do dia é, de qualquer forma, uma base razoável. Pode também ler que uma má eliminação dos estrogénios (um problema intestinal ou hepático) provoca afrontamentos — é uma teoria usada por alguns profissionais, não algo que as orientações habituais sobre a menopausa tratem como causa estabelecida, por isso convém encará-la com reserva. De qualquer forma, trabalhar as bases — sono, stress, açúcar no sangue, movimento — faz muitas vezes mais pela frequência e intensidade dos afrontamentos do que qualquer suplemento isolado.
mr_flush_normalise:
  title: Veja o afrontamento de outra forma — a ansiedade agrava-os
  body: >-
    A ansiedade perante um afrontamento que se aproxima é ela própria um desencadeante: ativa o sistema nervoso simpático, que aumenta a temperatura corporal. As mulheres que aprendem a observar um afrontamento sem dramatizar («isto passa em 90 segundos») referem, com o tempo, uma intensidade bastante menor. No Reino Unido, o NICE reconhece a terapia cognitivo-comportamental (TCC) para os sintomas da menopausa como uma opção para os sintomas vasomotores, a par da THS ou em vez dela. Em Inglaterra pode inscrever-se diretamente nos NHS Talking Therapies se for elegível, embora esse serviço se destine à ansiedade e à depressão e a TCC específica para a menopausa não esteja disponível em todo o lado — por isso vale a pena perguntar também ao seu médico por uma TCC específica para a menopausa ou por um encaminhamento para uma consulta de menopausa. A Women’s Health Concern (a área para pacientes da British Menopause Society) publica uma ficha gratuita (em inglês) sobre a TCC para os sintomas da menopausa.
mr_sleep_hygiene:
  title: Proteja o sono apesar dos suores noturnos
  body: >-
    Os suores noturnos provocam muitas vezes uma ansiedade secundária com o sono («tenho pavor de ir para a cama»). Mantenha a rotina antes de dormir regular e calma. Um duche fresco antes de deitar baixa a temperatura corporal durante 60–90 minutos — o período em que mais ajuda. Evite ecrãs nos 30 minutos anteriores. Se acordar com suores, tenha a água e a ventoinha à mão e evite olhar para o telemóvel.
mr_track_patterns:
  title: Registe os desencadeantes durante duas semanas
  body: >-
    Use o seu registo diário para anotar a frequência dos afrontamentos, a hora do dia e o que comeu ou bebeu nas 2 horas anteriores. A maioria das mulheres identifica 2–3 padrões claros em duas semanas. Conhecer os seus desencadeantes dá-lhe capacidade de agir — o que, por si só, está associado a sentir menos peso dos sintomas.
ss_magnesium_glycinate:
  title: Glicinato de magnésio — apoio ao sono e aos afrontamentos
  body: >-
    O glicinato de magnésio (200–400 mg antes de deitar) é bem tolerado e tem evidência inicial de que reduz a frequência dos suores noturnos e melhora a qualidade do sono na perimenopausa. Também acalma o sistema nervoso. A forma glicinato é mais suave para o sistema digestivo do que o óxido de magnésio.
  disclaimer: >-
    Os suplementos não são medicamentos regulados. Confirme sempre com o seu médico de família ou farmacêutico antes de começar, sobretudo se tomar medicamentos receitados ou tiver problemas renais ou cardíacos.
ss_sage_extract:
  title: Salva — para os afrontamentos e os suores noturnos
  body: >-
    O extrato padronizado de salva (Salvia officinalis) tem um pequeno conjunto de evidência clínica que mostra uma redução modesta da frequência dos afrontamentos — os estudos usaram normalmente 300–600 mg por dia de um extrato padronizado, o que é diferente de uma chávena de chá de salva, que não foi estudado numa dose conhecida e não tem a mesma evidência. O chá de salva antes de deitar é um remédio tradicional para a transpiração excessiva a que algumas mulheres ainda recorrem; só convém saber que tem uma base diferente da investigação sobre o extrato. Os efeitos do extrato padronizado demoram 4–8 semanas a notar-se. Não substitui a THS se os afrontamentos forem fortes.
  disclaimer: >-
    Os suplementos de salva podem interagir com alguns medicamentos, incluindo anticonvulsivantes e medicamentos para a diabetes. Não são adequados na gravidez. Consulte o seu médico de família antes de os usar, sobretudo se tiver algum problema de saúde em curso.
ss_omega3_vasomotor:
  title: Ómega-3 (EPA/DHA) — para os afrontamentos e os suores noturnos
  body: >-
    Há alguma evidência de que reduz a frequência e a intensidade dos sintomas vasomotores — afrontamentos e suores noturnos —, para além dos seus outros benefícios gerais para a saúde.
  disclaimer: >-
    O ómega-3 em doses elevadas pode tornar o sangue mais fluido. Se toma anticoagulantes (varfarina, aspirina, apixabano) ou vai ser operada, consulte o seu médico de família ou farmacêutico antes de o tomar.
ss_vitamin_e_vasomotor:
  title: Vitamina E — para os sintomas vasomotores
  body: >-
    Algumas mulheres experimentam a vitamina E, habitualmente cerca de 400 UI/dia, para reduzir a frequência e a intensidade dos sintomas vasomotores, incluindo os suores noturnos — a evidência para este efeito concreto é modesta. 400 UI é uma dose de suplemento elevada, muito acima do que se obtém da alimentação.
  disclaimer: >-
    A vitamina E em doses elevadas pode aumentar o risco de hemorragia, sobretudo com medicação anticoagulante ou antiagregante (varfarina, aspirina) ou antes de uma cirurgia. Confirme sempre com o seu médico de família ou farmacêutico antes de começar, sobretudo se tomar medicamentos receitados.
ss_maca_hot_flushes:
  title: Maca — para o equilíbrio hormonal, a energia, o humor e a libido
  body: >-
    A maca (p. ex., as formulações da Dra. Anna Cabeca, ou pó ou cápsulas de raiz de maca normais) apoia o equilíbrio hormonal, a energia, o humor e a libido em muitas mulheres.
  disclaimer: >-
    É preciso cuidado se tiver uma doença autoimune — a maca pode estimular o sistema imunitário e agravar surtos. Se for o seu caso, vale a pena falar primeiro com o seu médico ou um especialista.
