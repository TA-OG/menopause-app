# Tradução de frameworks/perimenopause-specific.yaml — prevalece a versão em inglês.
df_peri_blood_sugar:
  title: A estabilidade do açúcar no sangue é a sua ferramenta mais poderosa na perimenopausa
  body: >-
    Na perimenopausa, os estrogénios oscilam muito — por vezes muito altos, por vezes muito baixos, no mesmo mês. Estas oscilações reduzem a sensibilidade à insulina e dificultam a regulação do açúcar no sangue. Pode notar quebras de humor, quebras de energia à tarde e desejos alimentares que antes não tinha. A solução: em cada refeição, coma primeiro proteínas e gorduras antes dos hidratos de carbono, nunca coma hidratos de carbono sozinhos e evite saltar refeições. Um açúcar no sangue estável traz um humor e uma energia muito mais estáveis.
df_peri_fibre:
  title: 30 g de fibra por dia — para o metabolismo dos estrogénios e o microbioma intestinal
  body: >-
    O excesso de estrogénios é eliminado pelo fígado e excretado pelo intestino. Um microbioma intestinal saudável (o «estroboloma») ajuda a reciclar os estrogénios de forma adequada. Uma alimentação pobre em fibra permite que os estrogénios sejam reabsorvidos no intestino, contribuindo para sintomas de dominância estrogénica (menstruações abundantes, inchaço, sensibilidade mamária) no início da perimenopausa. Procure ingerir 30 g de fibra por dia: cereais integrais, leguminosas, legumes e fruta. Uma alimentação variada de base vegetal é a forma mais eficaz de lá chegar.
lf_cycle_tracking:
  title: Acompanhe o seu ciclo — os padrões revelam o seu quadro hormonal
  body: >-
    A perimenopausa define-se pela irregularidade, mas acompanhar os seus ciclos revela padrões nos sintomas que parecem aleatórios até os ver à sua frente. Apps como o Clue ou o Natural Cycles (ou um diário em papel) permitem registar sintomas, humor, energia e sono a par do ciclo. Ao fim de 3–4 meses, a maioria das mulheres identifica janelas previsíveis (normalmente a semana antes da menstruação, ou os dias à volta da ovulação) em que certos sintomas atingem o pico. Assim, «nunca sei como me vou sentir» passa a «consigo preparar-me para terça-feira».
lf_peri_strength_early:
  title: Comece já o treino de força — antes de a perda óssea acelerar
  body: >-
    A janela mais importante para proteger a longo prazo a densidade óssea e a massa muscular é a perimenopausa — antes da perda acelerada que acontece nos 5 anos após a última menstruação. Criar agora o hábito do treino de força (mesmo 2 vezes por semana, 30 minutos) gera uma reserva de densidade óssea e de músculo que amortece a transição. As mulheres que criam este hábito na perimenopausa adaptam-se muito melhor à fase pós-menopausa.
mr_peri_mourning:
  title: O luto é uma resposta legítima à perimenopausa
  body: >-
    A perimenopausa chega muitas vezes ao mesmo tempo que grandes marcos de vida — os filhos que saem de casa, pais a envelhecer, exigências profissionais no máximo e uma relação com a fertilidade que muda. O peso emocional desta fase é real e raramente reconhecido. Sentir luto, raiva ou perda nesta transição não é depressão nem fraqueza — é uma resposta proporcional à mudança. Dar-lhe o nome de luto, em vez de lutar contra ele, é muitas vezes o primeiro passo para o atravessar.
mr_peri_information_power:
  title: Quanto melhor compreender a perimenopausa, menos assustadora ela é
  body: >-
    As mulheres que vivem a perimenopausa com mais dificuldade são muitas vezes as que tinham menos informação antes de ela começar. Cada sintoma que sente tem um mecanismo — uma razão hormonal, não imaginária. A app e o site Balance da Dra. Louise Newson, a organização britânica Menopause Charity e livros como «Perimenopause Power», de Maisie Hill, são recursos baseados em evidência (em inglês). O conhecimento não faz desaparecer os sintomas, mas tira o medo de que haja algo de errado só consigo.
ss_magnesium_peri:
  title: Magnésio — para sintomas semelhantes à SPM, humor e sono
  body: >-
    No início da perimenopausa, a progesterona desce primeiro — antes dos estrogénios — provocando sintomas semelhantes aos da síndrome pré-menstrual: irritabilidade, sensibilidade mamária, perturbações do sono e inchaço na fase lútea. O glicinato de magnésio (300–400 mg à noite) atua diretamente em muitos destes sintomas, ao apoiar o GABA, reduzir o cortisol e relaxar o músculo liso. É um dos suplementos com mais evidência especificamente para a perimenopausa.
  disclaimer: >-
    Os suplementos de magnésio costumam ser bem tolerados. Em doses elevadas podem amolecer as fezes — comece com 200 mg e aumente devagar. Consulte o seu médico de família antes de os tomar se tiver doença renal ou problemas cardíacos, ou se tomar medicamentos receitados.
