# Tradução de frameworks/sedentary-lifestyle.yaml — prevalece a versão em inglês.
df_sedentary_protein_preserve:
  title: A proteína é ainda mais importante quando não faz exercício com regularidade
  body: >-
    A massa muscular perde-se mais depressa nas mulheres que são sedentárias e estão na menopausa — um golpe duplo. Sem o estímulo do exercício de força para ativar a síntese de proteína muscular, a proteína da alimentação torna-se a principal alavanca para travar a perda de músculo. Procure ingerir 1,2–1,6 g de proteína por kg de peso corporal por dia. Distribua-a pelas refeições — 25–30 g por refeição em vez de quase tudo ao jantar. Não se trata de ganhar músculo — trata-se de proteger o que tem.
df_sedentary_anti_inflammatory:
  title: A comida como medicamento anti-inflamatório — quando o movimento é limitado
  body: >-
    Quando a mobilidade está limitada, a alimentação faz mais do trabalho de proteção. Um padrão alimentar anti-inflamatório (azeite, peixe gordo, frutos vermelhos, açafrão-da-índia, gengibre, legumes de folha verde-escura, legumes coloridos) ajuda a gerir a inflamação geral que aumenta tanto com a menopausa como com a inatividade física. Reduz as dores articulares e o cansaço e apoia a saúde metabólica. São mudanças acessíveis, seja qual for a sua capacidade física.
lf_sedentary_start_walking:
  title: Comece com 10 minutos — não com 30
  body: >-
    A recomendação de 150 minutos de exercício por semana está correta, mas cria uma barreira psicológica para as mulheres que neste momento não são ativas. A abordagem com mais evidência para começar o hábito de se mexer é começar com 10 minutos por dia — tão pouco que é difícil dizer que não, o suficiente para ter um efeito real. Uma caminhada de 10 minutos depois de uma refeição por dia melhora o açúcar no sangue, o humor e o sono. Ao fim de 2 semanas, aumente para 15 minutos. O hábito vem antes da duração.
lf_sedentary_seated_movement:
  title: O exercício sentada conta — não o subestime
  body: >-
    Se a sua mobilidade é limitada, os exercícios de força sentada (agachamentos com cadeira, elevações de pernas sentada, exercícios de tronco superior com elástico, sentada) mantêm a massa muscular e melhoram a circulação. O ioga na cadeira ou para seniores (disponível gratuitamente no YouTube) melhora a flexibilidade e o equilíbrio, o que reduz diretamente o risco de quedas. A hidroginástica (disponível na maioria das piscinas municipais) é excelente para as dores articulares, porque a água elimina 90% do impacto do peso corporal. Mexer-se, com a capacidade que tiver, é terapêutico.
lf_sedentary_break_sitting:
  title: Interrompa o tempo sentada a cada 60–90 minutos — até 2 minutos ajudam
  body: >-
    Estar muito tempo sentada (mais de 8 horas por dia) está associado, de forma independente, a pior saúde metabólica, mesmo em pessoas que também fazem exercício. Programar um temporizador para se levantar e mexer 2–3 minutos a cada 60–90 minutos — ir à cozinha, pôr-se em bicos de pés, marchar no lugar — reduz este risco. Não substitui o exercício; é um comportamento protetor diferente e adicional. Um simples alarme no telemóvel serve de lembrete.
mr_sedentary_no_shame:
  title: Aqui não há falhanço — só um ponto de partida
  body: >-
    As mulheres que neste momento não são ativas carregam muitas vezes anos de inscrições em ginásios que não resultaram, programas de exercício que pareciam feitos para outra pessoa e mensagens interiorizadas sobre disciplina e força de vontade. Nada disso importa para o ponto de onde parte hoje. A inatividade física durante a menopausa é muito comum — e muito reversível. Uma caminhada de 10 minutos hoje vale mais do que um programa perfeito que nunca acontece. Comece exatamente de onde está.
mr_sedentary_pain_barrier:
  title: Se a dor limita os seus movimentos — merece atenção médica
  body: >-
    Se as dores articulares, as dores nas costas ou outro problema físico são a razão por que não está ativa, vale a pena tratar disto com o seu médico de família em vez de contornar o problema. A fisioterapia é muitas vezes comparticipada para as dores articulares e é muito mais eficaz do que o repouso na maioria das situações. Uma densitometria óssea pode mostrar se a osteoporose contribui para a dor. A dor que limita a atividade é um problema médico — não uma escolha de estilo de vida. Enfrente o obstáculo em vez de o aceitar.
ss_creatine_muscle:
  title: Creatina mono-hidratada — ajuda a manter o músculo com pouco exercício
  body: >-
    A creatina mono-hidratada (3–5 g por dia) é um dos suplementos desportivos mais estudados e há evidência emergente de que ajuda a preservar o músculo em adultos mais velhos e em mulheres pós-menopáusicas — mesmo sem muito exercício. Também é promissora para a função cognitiva e o cansaço. É segura, barata e eficaz neste intervalo de doses. Tome-a com regularidade — os efeitos vão-se notando ao longo de 4–6 semanas, não de imediato.
  disclaimer: >-
    A creatina é muito bem tolerada nas doses indicadas. Pode causar um pequeno aumento de peso temporário devido à retenção de água no músculo. Consulte o seu médico de família antes de a usar se tiver doença renal, porque a creatina aumenta os níveis de creatinina (um marcador da função renal) — não é prejudicial, mas pode dificultar a interpretação das análises ao sangue.
